    function _cpuCancelTimer() { if (_cpuTimer) { clearTimeout(_cpuTimer); _cpuTimer = null; } }

    const _CPU_CITY_TIERS = {
      kobe: 'S', tokyo: 'S',
      kumamoto: 'A', osaka: 'A',
      kagoshima: 'B', sendai: 'B',
      hiroshima: 'C', niigata: 'C', istanbul: 'C', nagoya: 'C',
      new_orleans: 'D', rotterdam: 'D'
    };
    const _CPU_GACHA_W = {
      easy:   { S: 0.3, A: 0.6, B: 0.8, C: 1.0, D: 1.5 },
      normal: { S: 0.6, A: 0.8, B: 0.9, C: 1.0, D: 1.2 },
      hard:   { S: 1.0, A: 1.0, B: 1.0, C: 1.0, D: 1.0 }
    };

    function _cpuPullGacha() {
      const gc = G.gachaCurrent;
      const rem = CITIES.filter(c => !G.gachaPickedIds.includes(c.id));
      const wt = _CPU_GACHA_W[cpuDifficulty];
      const pool = rem.map(c => ({ c, w: wt[_CPU_CITY_TIERS[c.id] || 'C'] }));
      const total = pool.reduce((s, x) => s + x.w, 0);
      let r = Math.random() * total, chosen = rem[0];
      for (const { c, w } of pool) { r -= w; if (r <= 0) { chosen = c; break; } }
      gc.revealed = chosen; gc.candidates = null;
      pushState(); render();
    }

    function startCpuGame(difficulty) {
      const name = lobbyState.nameInput.trim() || 'プレイヤー';
      isCpuMode = true; cpuDifficulty = difficulty;
      myRole = 'p1'; myPlayerIdx = 0;
      const cpuNames = { easy: 'CPU（EASY）', normal: 'CPU（NORMAL）', hard: 'CPU（HARD）' };
      G = {
        screen: 'gacha', activePlayer: 0, turnsEach: [0, 0],
        players: [
          { name, cities: [], cityHps: [], activeCityIdx: 0, hand: [], budgetUsed: 0, effects: mkEffects() },
          { name: cpuNames[difficulty], cities: [], cityHps: [], activeCityIdx: 0, hand: [], budgetUsed: 0, effects: mkEffects() }
        ],
        deck: [], discard: [], log: [], pendingAttack: null, peekCard: null, peekByPlayerIdx: null,
        winner: null, gachaPickedIds: [], gachaCurrent: { playerIdx: 0, pickNum: 0, revealed: null, candidates: null },
        draftState: null, discardNeeded: null, confirm: null, turnDrawState: null, cityOrderState: null,
        _nextTurnEvents: { 0: [], 1: [] }, _turnSummary: null, _gameHistory: []
      };
      localStorage.setItem('ron_lastName', name);
      _cityEnterAnimPi = -1; _pendingCityEnterAnim = false; _pendingMainHpAnims.length = 0; _hpQ.length = 0; _draftAnimBusy = false; _gachaAnimState = null; _gachaRevealingCity = null; _gachaAllCities = null; _gachaBulkMode = false;
      render();
    }

    function _triggerCpuIfNeeded() {
      if (!isCpuMode) return;
      _cpuCancelTimer();
      const s = G.screen, ap = G.activePlayer;
      const gc = G.gachaCurrent, ts = G.turnDrawState, ds = G.draftState, dn = G.discardNeeded;
      const needAct =
        (s === 'gacha' && gc?.playerIdx === 1) ||
        (s === 'cityOrder' && G.cityOrderState?.playerIdx === 1) ||
        (s === 'draft' && ds?.playerIdx === 1) ||
        (s === 'turnDraw' && (ts?.pi ?? ts?.playerIdx) === 1) ||
        (s === 'turnSummary' && ap === 1 && G._atkSummaryConfirmed) ||
        (s === 'main' && ap === 1 && !G.pendingAttack) ||
        (s === 'main' && G.pendingAttack?.attackerIdx === 1 && !G._pendingAutoHandover) ||
        (s === 'response' && G.pendingAttack?.defenderIdx === 1) ||
        (s === 'discard' && (dn?.pi ?? dn?.playerIdx) === 1) ||
        (s === 'peek' && G.peekByPlayerIdx === 1) ||
        (s === 'pollution' && G.pendingPollution?.attackerIdx === 1);
      if (!needAct) return;
      _cpuTimer = setTimeout(_cpuAct, 700 + (Math.random() * 700 | 0));
    }

    function _cpuAct() {
      _cpuTimer = null;
      if (!isCpuMode) return;
      const s = G.screen, ap = G.activePlayer;
      const gc = G.gachaCurrent, ts = G.turnDrawState, ds = G.draftState, dn = G.discardNeeded;
      if (s === 'gacha' && gc?.playerIdx === 1) {
        if (!gc.revealed && !gc.candidates) _cpuPullGacha(); else acceptGachaCity();
      } else if (s === 'cityOrder' && G.cityOrderState?.playerIdx === 1) {
        _cpuSelectCityOrder();
      } else if (s === 'draft' && ds?.playerIdx === 1) {
        finalizeAllDraftCards();
      } else if (s === 'turnDraw' && (ts?.pi ?? ts?.playerIdx) === 1) {
        if (!ts.revealed) pullTurnCard(); else acceptTurnCard();
      } else if (s === 'turnSummary' && ap === 1 && G._atkSummaryConfirmed) {
        dismissTurnSummary();
      } else if (s === 'main' && ap === 1 && !G.pendingAttack) {
        _cpuDoMainTurn();
      } else if (s === 'main' && G.pendingAttack?.attackerIdx === 1 && !G._pendingAutoHandover) {
        G._pendingAutoHandover = true;
        setTimeout(() => { G._pendingAutoHandover = false; goResponseHandover(); }, 500);
      } else if (s === 'response' && G.pendingAttack?.defenderIdx === 1) {
        _cpuDoResponse();
      } else if (s === 'discard' && (dn?.pi ?? dn?.playerIdx) === 1) {
        _cpuDoDiscard();
      } else if (s === 'peek' && G.peekByPlayerIdx === 1) {
        closePeek();
      } else if (s === 'pollution' && G.pendingPollution?.attackerIdx === 1) {
        _cpuDoPollution();
      }
    }

    // 相手プレイヤー(0)が設置中のシールドを1つでも持つか
    function _cpuHasShield() {
      const e = G.players[0].effects;
      return e.shieldQuakeFire || e.shieldFlood || e.negateSpecial || e.damageReduceHits > 0;
    }
    // 公害で剥がす最適シールド。CPUの最善攻撃を通すものを優先する
    function _cpuShieldToBreak(bestDisasterId) {
      const e = G.players[0].effects;
      if ((bestDisasterId === 'earthquake' || bestDisasterId === 'wildfire') && e.shieldQuakeFire) return 'shieldQuakeFire';
      if ((bestDisasterId === 'flood' || bestDisasterId === 'tsunami') && e.shieldFlood) return 'shieldFlood';
      if (e.damageReduceHits > 0) return 'damageReduceHits'; // 全ダメ−15×残数。汎用的に価値が高い
      if (e.shieldQuakeFire) return 'shieldQuakeFire';
      if (e.shieldFlood) return 'shieldFlood';
      if (e.negateSpecial) return 'negateSpecial';
      return null;
    }

    function _cpuDoPollution() {
      const cpu = G.players[1];
      const ranked = cpu.hand.filter(c => c.type === 'disaster').map(c => ({ c, dmg: _cpuEstimateDmg(c, 0) })).sort((a, b) => b.dmg - a.dmg);
      const bestId = ranked.length ? ranked[0].c.id : null;
      const key = _cpuShieldToBreak(bestId);
      if (key) { destroyPollutionShield(key); return; }
      destroyPollutionShield('none');
    }

    function _cpuSelectCityOrder() {
      const p = G.players[1]; const c0 = p.cities[0], c1 = p.cities[1];
      if (cpuDifficulty === 'easy') { selectCityOrder(1, Math.random() < 0.5 ? 0 : 1); return; }
      const prefer2nd = cpuDifficulty === 'hard'
        ? ['kobe', 'osaka', 'sendai', 'kagoshima', 'new_orleans']
        : ['kobe'];
      if (prefer2nd.includes(c0.id)) selectCityOrder(1, 1);
      else if (prefer2nd.includes(c1.id)) selectCityOrder(1, 0);
      else if (cpuDifficulty === 'hard') selectCityOrder(1, c0.hp <= c1.hp ? 0 : 1);
      else selectCityOrder(1, 0);
    }

    function _cpuEstimateDmg(card, defIdx) {
      if (card.type !== 'disaster') return 0;
      const def = G.players[defIdx]; const city = def.cities[def.activeCityIdx];
      if (!city) return 0;
      let dmg = card.baseDamage;
      if (card.specialType === 'inland_bonus' && !city.isCoastal && !city.isMountain) dmg += 10;
      if (card.specialType === 'coastal_bonus' && city.isCoastal) dmg += 10;
      if (card.specialType === 'mountain_bonus' && city.isMountain) dmg += 10;
      if (city.abilityType === 'resist_quake_fire' && (card.id === 'earthquake' || card.id === 'wildfire')) dmg -= city.abilityValue;
      if (city.abilityType === 'resist_flood' && (card.id === 'flood' || card.id === 'tsunami')) dmg -= city.abilityValue;
      if (city.abilityType === 'resist_landslide' && card.id === 'landslide') dmg -= city.abilityValue;
      if (city.abilityType === 'resist_compound' && card.id === 'compound') dmg -= city.abilityValue;
      if (city.abilityType === 'second_hit_reduce' && def.effects.disastersReceivedThisTurn >= 1) dmg -= city.abilityValue;
      if (city.abilityType === 'vulnerability_draw' && def.hand.length <= 2) dmg += city.abilityValue;
      if (cpuDifficulty !== 'easy') {
        if (def.effects.shieldQuakeFire && (card.id === 'earthquake' || card.id === 'wildfire')) dmg -= 30;
        if (def.effects.shieldFlood && (card.id === 'flood' || card.id === 'tsunami')) dmg -= 25;
        if (def.effects.negateSpecial && card.specialType === 'skip_response') dmg -= 10;
        if (def.effects.damageReduceHits > 0) dmg -= 15;
      }
      return Math.max(0, dmg);
    }

    function _cpuDoMainTurn() {
      if (cpuDifficulty === 'easy') _cpuDoMainEasy();
      else if (cpuDifficulty === 'normal') _cpuDoMainNormal();
      else _cpuDoMainHard();
    }

    function _cpuDoMainEasy() {
      const budget = getBudgetLeft(1);
      if (budget === 0 || Math.random() < 0.18) { endTurn(); return; }
      const affordable = G.players[1].hand.filter(c => c.cost <= budget);
      if (!affordable.length) { endTurn(); return; }
      playCard(affordable[Math.random() * affordable.length | 0].uid);
    }

    function _cpuDoMainNormal() {
      const budget = getBudgetLeft(1);
      const cpu = G.players[1], opp = G.players[0];
      const oppHp = opp.cityHps[opp.activeCityIdx];
      const cpuHp = cpu.cityHps[cpu.activeCityIdx];
      if (budget === 0) { endTurn(); return; }
      const affordable = cpu.hand.filter(c => c.cost <= budget);
      if (!affordable.length) { endTurn(); return; }
      const ranked = affordable.filter(c => c.type === 'disaster')
        .map(c => ({ c, dmg: _cpuEstimateDmg(c, 0) })).sort((a, b) => b.dmg - a.dmg);
      // 1) とどめ
      if (ranked.length && ranked[0].dmg >= oppHp) { playCard(ranked[0].c.uid); return; }
      // 2) テロ準備済みなら即攻撃してフラグを無駄にしない
      if (cpu.effects.terrorNextDisaster && ranked.length && ranked[0].dmg > 0) { playCard(ranked[0].c.uid); return; }
      // 3) HP危機なら回復
      if (cpuHp < 25) { const h = affordable.find(c => c.effectType === 'heal'); if (h) { playCard(h.uid); return; } }
      // 4) 公害：最善攻撃を妨げるシールドを剥がす（公害+攻撃の予算が必要）
      const pollution = affordable.find(c => c.id === 'pollution');
      if (pollution && _cpuHasShield() && ranked.length) {
        const best = ranked[0]; const e = opp.effects;
        const blocked = (e.shieldQuakeFire && (best.c.id === 'earthquake' || best.c.id === 'wildfire'))
                     || (e.shieldFlood && (best.c.id === 'flood' || best.c.id === 'tsunami'))
                     || (e.damageReduceHits > 0);
        if (blocked && best.c.cost + 1 <= budget) { playCard(pollution.uid); return; }
      }
      // 5) テロ攻撃：大型災害(≥30)の対応を封じる（テロ+災害の予算が必要・相手が広域避難指示未設置）
      const terror = affordable.find(c => c.id === 'terror');
      if (terror && !cpu.effects.terrorNextDisaster && !opp.effects.negateSpecial && ranked.length) {
        const big = ranked[0];
        if (big.dmg >= 30 && big.c.cost + 1 <= budget) { playCard(terror.uid); return; }
      }
      // 6) 攻撃
      if (ranked.length && ranked[0].dmg > 0) { playCard(ranked[0].c.uid); return; }
      // 7) 防御シールド設置
      const sh = affordable.find(c => c.effectType === 'shield_quake_fire' || c.effectType === 'shield_flood' || c.effectType === 'damage_reduce_2t');
      if (sh) { playCard(sh.uid); return; }
      // 8) ハザードマップ整備
      const dr = affordable.find(c => c.effectType === 'draw');
      if (dr) { playCard(dr.uid); return; }
      // 9) デマ拡散：攻撃手段がないターンのテンポ妨害（余り予算の活用）
      const rumor = affordable.find(c => c.id === 'rumor');
      if (rumor) { playCard(rumor.uid); return; }
      endTurn();
    }

    function _cpuDoMainHard() {
      const budget = getBudgetLeft(1);
      const cpu = G.players[1], opp = G.players[0];
      const oppHp = opp.cityHps[opp.activeCityIdx];
      const cpuHp = cpu.cityHps[cpu.activeCityIdx];
      const oppCity = opp.cities[opp.activeCityIdx];
      if (budget === 0) { endTurn(); return; }
      const affordable = cpu.hand.filter(c => c.cost <= budget);
      if (!affordable.length) { endTurn(); return; }
      const ranked = affordable.filter(c => c.type === 'disaster')
        .map(c => ({ c, dmg: _cpuEstimateDmg(c, 0) })).sort((a, b) => b.dmg - a.dmg);
      const terror = affordable.find(c => c.id === 'terror');
      const pollution = affordable.find(c => c.id === 'pollution');
      // ① Killing blow / overkill avoidance (掟⑪)
      if (oppHp <= 20) {
        const fin = affordable.filter(c => c.type === 'disaster' && _cpuEstimateDmg(c, 0) >= oppHp)
          .sort((a, b) => a.cost - b.cost)[0];
        if (fin) { playCard(fin.uid); return; }
      }
      if (ranked.length && ranked[0].dmg >= oppHp) { playCard(ranked[0].c.uid); return; }
      // ①a テロ準備済みなら即攻撃（フラグを無駄にしない）
      if (cpu.effects.terrorNextDisaster && ranked.length && ranked[0].dmg > 0) { playCard(ranked[0].c.uid); return; }
      // ①b テロで確殺：対応を封じれば倒し切れる場合（相手が広域避難指示未設置）
      if (terror && !cpu.effects.terrorNextDisaster && !opp.effects.negateSpecial && ranked.length) {
        const big = ranked[0];
        if (big.c.cost + 1 <= budget && big.dmg >= 30 && big.dmg >= oppHp - 15) { playCard(terror.uid); return; }
      }
      // ①c 公害で確殺：シールドを剥がせば最善攻撃が通る場合
      if (pollution && _cpuHasShield() && ranked.length) {
        const best = ranked[0]; const e = opp.effects;
        const blocked = (e.shieldQuakeFire && (best.c.id === 'earthquake' || best.c.id === 'wildfire'))
                     || (e.shieldFlood && (best.c.id === 'flood' || best.c.id === 'tsunami'))
                     || (e.damageReduceHits > 0);
        if (blocked && best.c.cost + 1 <= budget) { playCard(pollution.uid); return; }
      }
      // ② Evacuation proactive (掟⑥, early game only)
      if (!cpu.effects.negateSpecial && G.turnsEach[1] < 4 && cpu.budgetUsed === 0) {
        const ev = affordable.find(c => c.id === 'evacuation'); if (ev) { playCard(ev.uid); return; }
      }
      // ③ bousai_cho early defense
      if (!cpu.effects.damageReduceHits && G.turnsEach[1] < 5 && cpu.budgetUsed === 0) {
        const bc = affordable.find(c => c.id === 'bousai_cho'); if (bc) { playCard(bc.uid); return; }
      }
      // ④ Heal if HP critical
      if (cpuHp < 30) {
        const h = affordable.filter(c => c.effectType === 'heal').sort((a, b) => b.value - a.value)[0];
        if (h) { playCard(h.uid); return; }
      }
      // ④a テロ＋大型災害(≥40)：確殺でなくても対応を封じる価値が高い
      if (terror && !cpu.effects.terrorNextDisaster && !opp.effects.negateSpecial && ranked.length) {
        const big = ranked[0];
        if (big.dmg >= 40 && big.c.cost + 1 <= budget) { playCard(terror.uid); return; }
      }
      // ⑤ Attack with best disaster (terrain-smart, 掟⑤⑥)
      if (ranked.length && ranked[0].dmg > 0) { playCard(ranked[0].c.uid); return; }
      // ⑥ Preemptive shield matching opponent terrain (掟⑧)
      if (oppCity) {
        if (!cpu.effects.shieldQuakeFire && !oppCity.isCoastal && !oppCity.isMountain) {
          const qw = affordable.find(c => c.id === 'quake_wall'); if (qw) { playCard(qw.uid); return; }
        }
        if (!cpu.effects.shieldFlood && oppCity.isCoastal) {
          const dm = affordable.find(c => c.id === 'dam'); if (dm) { playCard(dm.uid); return; }
        }
      }
      // ⑦ Hazard map (use leftover budget)
      const hm = affordable.find(c => c.id === 'hazard_map'); if (hm) { playCard(hm.uid); return; }
      // ⑧ Heal moderately
      if (cpuHp < 50) {
        const h = affordable.filter(c => c.effectType === 'heal').sort((a, b) => b.value - a.value)[0];
        if (h) { playCard(h.uid); return; }
      }
      // ⑨ デマ拡散：余り予算でのテンポ妨害（最後の手段）
      const rumor = affordable.find(c => c.id === 'rumor');
      if (rumor) { playCard(rumor.uid); return; }
      endTurn();
    }

    function _cpuDoResponse() {
      const atk = G.pendingAttack.card;
      const policies = G.players[1].hand.filter(c => c.type === 'policy');
      if (!policies.length) { skipResponse(); return; }
      if (cpuDifficulty === 'easy') {
        if (Math.random() < 0.55) { skipResponse(); return; }
        playResponseCard(policies[Math.random() * policies.length | 0].uid); return;
      }
      let use = null;
      if (atk.id === 'earthquake' || atk.id === 'wildfire') use = policies.find(c => c.id === 'quake_wall');
      else if (atk.id === 'flood' || atk.id === 'tsunami') use = policies.find(c => c.id === 'dam');
      if (!use) use = policies.find(c => c.id === 'agreement');
      if (!use && cpuDifficulty === 'hard' && atk.baseDamage >= 30) use = policies.find(c => c.id === 'evacuation');
      if (use) playResponseCard(use.uid); else skipResponse();
    }

    function _cpuDoDiscard() {
      const cpu = G.players[1]; const hand = cpu.hand;
      const oppCity = G.players[0].cities[G.players[0].activeCityIdx];
      if (cpuDifficulty === 'easy') { discardCard(hand[Math.random() * hand.length | 0].uid); return; }
      if (cpu.effects.shieldQuakeFire) { const c = hand.find(c => c.id === 'quake_wall'); if (c) { discardCard(c.uid); return; } }
      if (cpu.effects.shieldFlood) { const c = hand.find(c => c.id === 'dam'); if (c) { discardCard(c.uid); return; } }
      if (cpuDifficulty === 'hard' && oppCity && !oppCity.isMountain) {
        const ls = hand.find(c => c.id === 'landslide'); if (ls) { discardCard(ls.uid); return; }
      }
      const order = ['drill', 'hazard_map', 'rumor', 'pact', 'typhoon', 'pollution', 'terror', 'landslide', 'earthquake', 'flood', 'quake_wall', 'dam', 'evacuation', 'agreement', 'bousai_cho', 'compound', 'tsunami', 'wildfire'];
      for (const id of order) { const c = hand.find(c => c.id === id); if (c) { discardCard(c.uid); return; } }
      discardCard(hand[0].uid);
    }

    // ═══════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════
    window.addEventListener('load', () => {
      const params = new URLSearchParams(window.location.search);
      const coopParam = params.get('coop');          // 協力モードの招待リンク（対戦の ?room= とは分離）
      const roomParam = coopParam ? null : params.get('room');
      const savedRoom = localStorage.getItem('ron_lastRoom');
      const savedName = localStorage.getItem('ron_lastName');
      if (savedName) lobbyState.nameInput = savedName;
      if (coopParam) {
        lobbyState.mode = 'coop'; lobbyState.coopNet = 'join'; lobbyState.coopStep = 2;
        lobbyState.coopJoinSide = lobbyState.coopJoinSide || 'city';
        lobbyState.coopJoinInput = coopParam.toUpperCase().slice(0, 6);
      } else if (roomParam) {
        lobbyState.joinCodeInput = roomParam.toUpperCase().slice(0, 6); lobbyState.mode = 'join';
      } else if (savedRoom) {
        lobbyState.joinCodeInput = savedRoom; lobbyState.mode = 'join';
      }
      if (isFirebaseConfigured()) initFirebase();
      if (params.get('spv')) { specPreview(params.get('spv') === '1' ? 'main' : params.get('spv')); return; }
      render();
      // 協力モード（MP）の再接続を最優先で試す：保存した部屋・playerId があり、対戦リンクでなく、
      // coopリンクが無い or 保存部屋と一致するときに自動復帰。失敗時は通常の参加画面/ロビーへフォールバック。
      const savedCoopRoom = localStorage.getItem('ron_coopRoom');
      const savedCoopId = localStorage.getItem('ron_coopId');
      const coopRejoinCode = coopParam ? coopParam.toUpperCase().slice(0, 6) : null;
      const wantCoopRejoin = isFirebaseConfigured() && savedCoopRoom && savedCoopId && !roomParam &&
        (!coopRejoinCode || coopRejoinCode === savedCoopRoom);
      if (wantCoopRejoin) {
        coopMPRejoin(savedCoopRoom).then(ok => { if (!ok) { if (!coopParam) { lobbyState.mode = 'select'; } render(); } });
      } else if (isFirebaseConfigured() && savedName && !coopParam) {
        // URLパラメータあり or localStorage両方あり → 自動参加（対戦・再接続含む）
        if (roomParam) joinRoom();
        else if (savedRoom) joinRoom({ silent: true });
      }
      // 名前未保存でも ?room= があれば満員チェック → 観戦オファーを先行表示（名前不要）
      if (isFirebaseConfigured() && roomParam && !savedName) {
        const _rc = roomParam.toUpperCase().slice(0, 6);
        db.ref(`rooms/${_rc}/p2Joined`).get().then(snap => {
          if (snap.val() === true && !lobbyState.spectateCode) { lobbyState.spectateCode = _rc; render(); }
        }).catch(() => {});
      }
    });

    // ═══════════════════════════════════════════════════════════════════
    // 協力モード（ソロ：人間=都市側 / CPU=自然側）  ※対戦エンジンとは独立した追加モジュール
    // ═══════════════════════════════════════════════════════════════════
    function _coCancelTimer() { if (_coTimer) { clearTimeout(_coTimer); _coTimer = null; } }
    function _coLog(m) { CO.log.unshift(m); if (CO.log.length > 30) CO.log.length = 30; }
    function coopBuildPolicyDeck() { const d = []; for (const c of POLICY_CARDS) for (let i = 0; i < 3; i++) d.push({ ...c, uid: 'cp_' + c.id + '_' + i }); return shuffle(d); }
    // compoundCount を渡すと複合災害だけ枚数を変えられる（MPで人数別に削減。未指定＝従来の各3枚でソロ不変）
    function coopBuildNatureDeck(compoundCount) { const d = []; for (const c of DISASTER_CARDS) { const n = (c.id === 'compound' && compoundCount != null) ? compoundCount : 3; for (let i = 0; i < n; i++) d.push({ ...c, uid: 'cn_' + c.id + '_' + i }); } return shuffle(d); }
    // 人間=自然側プールの1種あたり枚数（MP）。CPU自然はデッキ再シャッフルで無限供給だが、人間自然は naturePool が有限で
    // 都市が増えると弾切れする（例：3都市は4枚/ターン×8＝32発に対し従来21枚で約5ターンで枯渇）。
    // ゲーム全体の攻撃回数（coopMPAttackCount×maxTurns）を非複合6種でまかなえる枚数にスケールする。
    // 同種は1ターン1回ゆえ1種が必要になる最大回数は maxTurns なので、それを上限にする（無駄に持たせない）。
    function coopNaturePoolPer(n, draw, maxTurns) {
      if (n <= 2) return 3; // 2都市は従来どおり（攻撃2枚×8ターン=16 ≦ 非複合6種×3＋複合）
      const totalAttacks = (draw + (n - 1)) * maxTurns; // = coopMPAttackCount × ターン数
      return Math.max(3, Math.min(maxTurns, Math.ceil(totalAttacks / 6) + 1));
    }
    function coopShieldBadges(e) { const b = []; if (e.shieldQuakeFire) b.push('🏗️'); if (e.shieldFlood) b.push('🌊'); if (e.negateSpecial) b.push('📢'); if (e.damageReduceHits > 0) b.push('🏛️' + e.damageReduceHits); return b.join(' '); }
    function coopTerrainMatch(card, city) { return (card.specialType === 'coastal_bonus' && city.isCoastal) || (card.specialType === 'mountain_bonus' && city.isMountain) || (card.specialType === 'inland_bonus' && !city.isCoastal && !city.isMountain); }

    function coopDraw(n) {
      for (let i = 0; i < n; i++) {
        if (CO.policyDeck.length === 0) { if (CO.policyDiscard.length === 0) break; CO.policyDeck = shuffle([...CO.policyDiscard]); CO.policyDiscard = []; }
        CO.hand.push(CO.policyDeck.shift());
      }
      while (CO.hand.length > 5) CO.policyDiscard.push(CO.hand.pop());
    }
    function coopDrawNature() {
      if (CO.natureDeck.length === 0) { if (CO.natureDiscard.length === 0) return null; CO.natureDeck = shuffle([...CO.natureDiscard]); CO.natureDiscard = []; }
      const c = CO.natureDeck.shift(); CO.natureDiscard.push(c); return c;
    }
    function coopEnsureNature() { if (CO.natureDeck.length < 3 && CO.natureDiscard.length > 0) { CO.natureDeck = [...CO.natureDeck, ...shuffle([...CO.natureDiscard])]; CO.natureDiscard = []; } }

    // ── ゲーム開始・セットアップ ──
    function startCoopGame(diffKey, side) {
      _coCancelTimer();
      _coopTipOpen = false;
      const D = COOP_DIFF[diffKey]; const sideKey = (side === 'nature') ? 'nature' : 'city'; const sc = D[sideKey];
      const d = { key: D.key, label: D.label, color: D.color, rgb: D.rgb, hp: sc.hp, maxTurns: sc.maxTurns, draw: sc.draw, events: sc.events, cpuSkip: sc.cpuSkip };
      const name = lobbyState.nameInput.trim() || 'プレイヤー';
      const pool = shuffle([...CITIES]);
      CO = {
        diff: d, name, turn: 1, phase: 'setup', humanSide: sideKey,
        cities: [pool[0], pool[1]].map(c => ({ city: c, hp: d.hp, maxHp: d.hp, effects: mkEffects() })),
        budget: 6, budgetUsed: 0, nextBudgetBonus: 0,
        policyDeck: coopBuildPolicyDeck(), policyDiscard: [],
        natureDeck: coopBuildNatureDeck(), natureDiscard: [],
        hand: [], naturePool: Object.fromEntries(DISASTER_CARDS.map(c => [c.id, 3])), attacksLeft: 0,
        log: [], incoming: [], confirm: null, responseBlocked: false, blockReason: '', cpuReview: null,
        result: null, intel: null, intelPopup: false, drawState: null, eventPopup: null,
        gameLog: [], cpuPlayedLog: [],
        // ── オンライン協力（既定はオフライン＝ソロ。挙動は従来どおり） ──
        online: false, host: false, mySide: sideKey, roomId: null, outcome: null,
        oppName: '', oppPresent: true,
      };
      try { localStorage.setItem('ron_lastName', name); } catch (e) { }
      renderCoop();
    }
    function coopReroll() { const pool = shuffle([...CITIES]); CO.cities = [pool[0], pool[1]].map(c => ({ city: c, hp: CO.diff.hp, maxHp: CO.diff.hp, effects: mkEffects() })); renderCoop(); }
    function coopRequestQuit() { CO.confirm = { quit: true }; renderCoop(); }
    function coopQuit() { _coCancelTimer(); coopCleanupOnline(); _coClearSession(); CO = null; lobbyState.mode = 'select'; lobbyState.error = ''; render(); }
    function coopRestart() { startCoopGame(CO.diff.key, CO.humanSide); }
    function coopPlayOtherSide(side) { startCoopGame(CO.diff.key, side); }

    // ═══════════════════════════════════════════════════════════
    // 協力モード オンライン対戦（ホスト権威＋インテントキュー・段階1）
    //  ・名前空間は coopRooms/{code}（対戦の rooms/ には一切触れない）
    //  ・ホストだけが正本COを保持しエンジンを実行、state を配信
    //  ・ゲストは受信描画＋操作を intent として送信、ホストが適用
    // ═══════════════════════════════════════════════════════════
    let _coStateRef = null, _coIntentsRef = null, _coGuestRef = null;
    let _coPresMeRef = null, _coPresOppRef = null, _coConnRef = null;
    let _coLastPush = null, _coOnlineHandler = null, _coVisHandler = null;
    let _coSeq = 0, _coHeartbeat = null, _coLastRecv = null; // seq付きpush＋ハートビート再配信で欠落更新からゲストを自己修復
    let _coRoomPlayersRef = null, _coRoomPresRef = null, _coStartedRef = null; // MP：ロビーのロスター・在席・開始フラグ購読
    let _coRoleShown = false; // MP：配役発表スプラッシュを1度だけ出す

    // 勝敗を中立 outcome から自分視点に変換（オンライン用）
    function coopResultFor(side) {
      if (!CO.outcome) return CO.result;
      return (side === 'nature') ? (CO.outcome === 'destroyed' ? 'win' : 'lose')
                                 : (CO.outcome === 'survived' ? 'win' : 'lose');
    }
    // 現在のフェーズが自分（mySide）の操作フェーズか（オフラインは常にtrue）
    function coopMyPhase() {
      if (!CO.online) return true;
      if (CO.mp) return coopMyPhaseMP();
      switch (CO.phase) {
        case 'city': case 'draw': return CO.mySide === 'city';
        case 'natureHuman': return CO.mySide === 'nature';
        case 'coopResponse': return CO.mySide === 'city';
        case 'summary': return CO.mySide === 'city'; // 次ターンは都市から → 都市側が進行
        case 'setup': return CO.host;
        default: return false; // resolving 等は自動進行（操作なし）
      }
    }
    // ゲストの操作を intent として送り、ローカルUIを閉じる
    function coopClientCommit(type, payload) { coopSendIntent(type, payload || {}); CO.confirm = null; renderCoop(); }

    // ── ルーム作成（ホスト）。host が自分のサイドを選び、相手は反対サイド ──
    async function coopCreateRoom(diffKey, hostSide) {
      const name = (lobbyState.nameInput || '').trim();
      if (!name) { lobbyState.error = '名前を入力してください'; render(); return; }
      if (!db) { lobbyState.error = 'オンライン機能が利用できません'; render(); return; }
      const code = generateRoomCode();
      startCoopGame(diffKey, hostSide);              // ホストが正本COを生成
      CO.online = true; CO.host = true; CO.mySide = hostSide; CO.roomId = code; CO.name = name;
      CO.oppName = ''; CO.oppPresent = false; CO.phase = 'waitOnline';
      renderCoop();                                  // セットアップ画面を経由せず待機画面へ
      try {
        await db.ref(`coopRooms/${code}`).set({
          hostName: name, hostSide, diff: diffKey,
          guestName: '', guestJoined: false, state: null,
          createdAt: Date.now(), lastActiveAt: Date.now(),
        });
        _coGuestRef = db.ref(`coopRooms/${code}/guestJoined`);
        _coGuestRef.on('value', snap => {
          if (snap.val() === true) {
            _coGuestRef.off(); _coGuestRef = null;
            db.ref(`coopRooms/${code}/guestName`).get().then(s => {
              if (!CO || !CO.online) return;
              CO.oppName = s.val() || 'プレイヤー2'; CO.oppPresent = true;
              coopOnlineStartHost();
            });
          }
        });
        renderCoop();
      } catch (e) { lobbyState.error = 'ルーム作成に失敗: ' + e.message; CO = null; render(); }
    }
    // ホスト：両者そろったらゲーム開始
    function coopOnlineStartHost() {
      coopListenIntents(); coopSetupPresence();
      coopBeginPlay();   // turn=1・都市ターン開始（host がエンジン実行 → renderCoop で自動 push）
      coopPushState(true);
      // ハートビート：1.5秒ごとに現在の正本状態を再配信。単発の更新欠落があってもゲストが収束する
      if (_coHeartbeat) clearInterval(_coHeartbeat);
      _coHeartbeat = setInterval(() => { if (CO && CO.online && CO.host) coopPushState(true); }, 1500);
    }
    // ── ルーム参加（ゲスト）。サイドはホストの反対 ──
    async function coopJoinRoom(codeArg) {
      const name = (lobbyState.nameInput || '').trim();
      const code = (codeArg || lobbyState.coopJoinInput || '').trim().toUpperCase();
      if (!name) { lobbyState.error = '名前を入力してください'; render(); return; }
      if (code.length !== 6) { lobbyState.error = 'ルームコードは6文字です'; render(); return; }
      if (!db) { lobbyState.error = 'オンライン機能が利用できません'; render(); return; }
      try {
        const snap = await db.ref(`coopRooms/${code}`).get();
        const room = snap.val();
        if (!room) { lobbyState.error = 'ルームが見つかりません'; render(); return; }
        if (room.guestJoined) { lobbyState.error = 'このルームは満員です'; render(); return; }
        const mySide = room.hostSide === 'city' ? 'nature' : 'city';
        startCoopGame(room.diff, mySide);            // ゲストは描画用のCO（エンジンは持たない）
        CO.online = true; CO.host = false; CO.mySide = mySide; CO.roomId = code; CO.name = name;
        CO.oppName = room.hostName || 'ホスト'; CO.oppPresent = true; CO.phase = 'waitOnline';
        renderCoop();                                // セットアップ画面を経由せず待機画面へ
        await db.ref(`coopRooms/${code}/guestName`).set(name);
        await db.ref(`coopRooms/${code}/guestJoined`).set(true);
        coopListenState(); coopSetupPresence();
        renderCoop();
      } catch (e) { lobbyState.error = '参加に失敗: ' + e.message; CO = null; render(); }
    }
    // ── 状態配信（ホスト専用）。confirm 等のローカルUIは共有しない ──
    // force=true でハートビート再配信（内容が同じでも seq を更新して必ずゲストに届ける）
    function coopPushState(force) {
      if (!CO || !CO.online || !CO.host || !db || !CO.roomId) return;
      try {
        const s = { ...CO };
        delete s.confirm; delete s.host; delete s.mySide; delete s.online;
        delete s.roomId; delete s.name; delete s.oppName; delete s.oppPresent;
        delete s._applying; delete s.myId; delete s.humanSide; // 各クライアント固有の値は配信しない
        const json = JSON.stringify(s);
        if (!force && json === _coLastPush) return;
        _coLastPush = json;
        _coSeq++;
        db.ref(`coopRooms/${CO.roomId}/state`).set({ q: _coSeq, d: json })
          .catch(e => console.error('coopPushState set失敗:', e && e.message));
        db.ref(`coopRooms/${CO.roomId}/lastActiveAt`).set(Date.now());
      } catch (e) { console.error('coopPushState例外:', e && e.message); }
    }
    // ── 状態受信（ゲスト専用）。視点・勝敗を自分のサイドへ変換 ──
    function coopListenState() {
      _coStateRef = db.ref(`coopRooms/${CO.roomId}/state`);
      _coStateRef.on('value', snap => {
        const v = snap.val(); if (!v || !CO) return;
        const data = (typeof v === 'object') ? v.d : v; // {q,d} 形式（旧: 文字列）両対応
        if (!data || data === _coLastRecv) return;       // ハートビートで内容不変なら再描画しない
        _coLastRecv = data;
        const remote = JSON.parse(data);
        const ui = { confirm: CO.confirm, online: true, host: false, mySide: CO.mySide, roomId: CO.roomId, name: CO.name, oppName: CO.oppName, oppPresent: CO.oppPresent };
        CO = { ...remote, ...ui };
        CO.humanSide = CO.mySide;                  // 視点を自分側へ
        CO.result = coopResultFor(CO.mySide);      // 勝敗を自分視点へ
        if (!coopMyPhase()) CO.confirm = null;     // 自分の手番でなければローカル確認を消す
        renderCoop();
      });
    }
    // ── インテント受信（ホスト専用） ──
    function coopListenIntents() {
      _coIntentsRef = db.ref(`coopRooms/${CO.roomId}/intents`);
      _coIntentsRef.on('child_added', snap => {
        const it = snap.val(); snap.ref.remove();
        if (it && CO && CO.host) (CO.mp ? coopApplyIntentMP(it) : coopApplyIntent(it));
      });
    }
    // ── インテント送信（ゲスト専用） ──
    function coopSendIntent(type, payload) {
      if (!db || !CO || !CO.roomId) return;
      db.ref(`coopRooms/${CO.roomId}/intents`).push({ type, payload: payload || {}, by: CO.mp ? CO.myId : CO.mySide, ts: Date.now() });
    }
    // ホスト：ゲストの intent をサイド・フェーズ検証のうえ既存ロジックで適用
    function coopApplyIntent(it) {
      const side = it.by, p = it.payload || {};
      switch (it.type) {
        case 'confirmPlay':    if (side === 'city' && CO.phase === 'city') { CO.confirm = { uid: p.uid }; coopConfirmPlay(p.i); } break;
        case 'endTurn':        if (side === 'city' && CO.phase === 'city') coopEndCityTurn(); break;
        case 'pullDraw':       if (side === 'city' && CO.phase === 'draw') coopPullDrawCard(); break;
        case 'acceptDraw':     if (side === 'city' && CO.phase === 'draw') coopAcceptDrawCard(); break;
        case 'respApply':      if (side === 'city' && CO.phase === 'coopResponse') { CO.confirm = { uid: p.uid, resp: true }; coopConfirmRespApply(p.ai); } break;
        case 'skipResp':       if (side === 'city' && CO.phase === 'coopResponse') coopSkipResponse(); break;
        case 'attack':         if (side === 'nature' && CO.phase === 'natureHuman') { CO.confirm = { attackId: p.id, attack: true }; coopConfirmAttack(p.cityIdx); } break;
        case 'dismissEvent':   if (CO.eventPopup && side === 'city') coopDismissEventPopup(); break;
        case 'dismissSummary': if (CO.phase === 'summary') coopDismissSummary(); break;
        case 'dismissIntel':   CO.intelPopup = false; renderCoop(); break;
      }
      coopPushState();
    }
    // ── presence / 切断検知 ──
    function coopSetupPresence() {
      if (!db || !CO || !CO.roomId) return;
      const me = CO.host ? 'host' : 'guest', opp = CO.host ? 'guest' : 'host';
      _coPresMeRef = db.ref(`coopRooms/${CO.roomId}/presence/${me}`);
      _coConnRef = db.ref('.info/connected');
      _coConnRef.on('value', s => { if (!s.val()) return; _coPresMeRef.set(true); _coPresMeRef.onDisconnect().set(false); });
      _coPresOppRef = db.ref(`coopRooms/${CO.roomId}/presence/${opp}`);
      _coPresOppRef.on('value', s => { if (!CO) return; CO.oppPresent = (s.val() !== false); renderCoop(); });
      _coOnlineHandler = () => { if (db && CO && CO.roomId && _coPresMeRef) { _coPresMeRef.set(true); _coPresMeRef.onDisconnect().set(false); } };
      window.addEventListener('online', _coOnlineHandler);
      _coVisHandler = () => { if (document.visibilityState === 'visible') _coOnlineHandler(); };
      document.addEventListener('visibilitychange', _coVisHandler);
    }
    function coopCleanupOnline() {
      [_coStateRef, _coIntentsRef, _coGuestRef, _coPresMeRef, _coPresOppRef, _coConnRef, _coRoomPlayersRef, _coRoomPresRef, _coStartedRef].forEach(r => { try { r && r.off(); } catch (e) {} });
      _coStateRef = _coIntentsRef = _coGuestRef = _coPresMeRef = _coPresOppRef = _coConnRef = _coRoomPlayersRef = _coRoomPresRef = _coStartedRef = null;
      if (_coOnlineHandler) { window.removeEventListener('online', _coOnlineHandler); _coOnlineHandler = null; }
      if (_coVisHandler) { document.removeEventListener('visibilitychange', _coVisHandler); _coVisHandler = null; }
      if (_coHeartbeat) { clearInterval(_coHeartbeat); _coHeartbeat = null; }
      _coLastPush = null; _coSeq = 0; _coLastRecv = null; _coRoleShown = false;
    }
    // ── 再接続用：自分のルーム・playerId を localStorage に保存／消去（対戦の ron_lastRoom と同方式） ──
    function _coSaveSession() {
      if (!CO || !CO.mp || !CO.roomId || !CO.myId) return;
      try {
        localStorage.setItem('ron_coopRoom', CO.roomId);
        localStorage.setItem('ron_coopId', CO.myId);
        localStorage.setItem('ron_coopName', CO.name || '');
        localStorage.setItem('ron_coopHost', CO.host ? '1' : '0');
      } catch (e) {}
    }
    function _coClearSession() {
      try {
        localStorage.removeItem('ron_coopRoom'); localStorage.removeItem('ron_coopId');
        localStorage.removeItem('ron_coopName'); localStorage.removeItem('ron_coopHost');
      } catch (e) {}
    }
    // 配役発表スプラッシュ（ゲーム開始時に1度だけ。ランダム配役の発表演出）
    function coopSplashRole() {
      if (!CO || !CO.mp || _coRoleShown) return;
      _coRoleShown = true;
      const nat = CO.mySide === 'nature';
      coopSplash(nat ? 'あなたは自然側！' : 'あなたは都市側！', nat ? '都市の壊滅を狙え' : 'みんなで街を守ろう', nat ? '248,81,73' : '56,139,253', nat ? 'images/icons/icon_disaster.webp' : 'images/icons/icon_city.webp');
    }

    // ═══════════════════════════════════════════════════════════
    // 協力モード オンライン多人数（段階2）：1人=1都市・都市スロットに資源
    //  ・各 city スロットが {ownerId, budget, hand, policyDeck, ...} を独立保持
    //  ・ホストは処理対象プレイヤーのスロットを CO スクラッチへスワップインし、既存エンジンを実行
    //  ・ソロ（!CO.online）は一切経由しない。CO.mp フラグで判定
    // ═══════════════════════════════════════════════════════════
    function coopMySlot() { return (CO.cities || []).find(cs => cs.ownerId === CO.myId) || null; }
    // スロットの資源を CO スクラッチへ（既存エンジンが CO.budget/CO.hand 等を読むため）
    function coopLoadActor(cs) {
      if (!cs) return;
      CO.budget = cs.budget; CO.budgetUsed = cs.budgetUsed; CO.nextBudgetBonus = cs.nextBudgetBonus;
      CO.hand = cs.hand; CO.policyDeck = cs.policyDeck; CO.policyDiscard = cs.policyDiscard;
    }
    function coopSaveActor(cs) {
      if (!cs) return;
      cs.budget = CO.budget; cs.budgetUsed = CO.budgetUsed; cs.nextBudgetBonus = CO.nextBudgetBonus;
      cs.hand = CO.hand; cs.policyDeck = CO.policyDeck; cs.policyDiscard = CO.policyDiscard;
    }
    // 描画用：自分視点（都市プレイヤーは自分の都市スロット）の資源を CO スクラッチへ
    function coopLoadMyActor() { if (CO.mp && CO.mySide === 'city') coopLoadActor(coopMySlot()); }

    // MPゲーム状態を構築（ロビーの開始・検証ハーネスから呼ぶ）
    // opts: { diffKey, players:[{id,name,side}], natureIsCpu, myId }
    function coopBuildMPState(opts) {
      _coCancelTimer();
      const D = COOP_DIFF[opts.diffKey]; const sc = D.city;
      const d = { key: D.key, label: D.label, color: D.color, rgb: D.rgb, hp: sc.hp, maxTurns: sc.maxTurns, draw: sc.draw, events: sc.events, cpuSkip: sc.cpuSkip };
      d.events = (opts.socialVuln === false) ? [] : _COOP_EVENTS_ALL;
      if (opts.cityHp != null) d.hp = Math.max(80, Math.min(120, opts.cityHp));
      const cityPlayers = opts.players.filter(p => p.side === 'city');
      const naturePlayer = opts.players.find(p => p.side === 'nature') || null;
      const pool = shuffle([...CITIES]);
      const cities = cityPlayers.map((p, i) => ({
        city: pool[i % pool.length], hp: d.hp, maxHp: d.hp, effects: mkEffects(),
        ownerId: p.id, ownerName: p.name,
        budget: 0, budgetUsed: 0, nextBudgetBonus: 0,
        hand: [], policyDeck: coopBuildPolicyDeck(), policyDiscard: [],
        ready: false, ack: false, resp: undefined,
      }));
      // 複合災害は対応スキップが強力なため人数別に枚数を削減（2都市=1枚／3〜4都市=2枚。他災害は各3枚）
      const compoundCount = cityPlayers.length <= 2 ? 1 : 2;
      CO = {
        diff: d, turn: 1, phase: 'setup',
        online: true, mp: true, host: false,
        // 人数別バランス：都市3人以上で1都市への攻撃上限を3に引き上げる（後方支援による終盤の硬直を相殺）
        maxHits: cityPlayers.length >= 3 ? 3 : 2,
        natureIsCpu: !!opts.natureIsCpu,
        natureId: naturePlayer ? naturePlayer.id : null,
        natureName: naturePlayer ? naturePlayer.name : (opts.natureIsCpu ? 'CPU自然' : '自然'),
        cities,
        naturePool: Object.fromEntries(DISASTER_CARDS.map(c => [c.id, c.id === 'compound' ? compoundCount : coopNaturePoolPer(cityPlayers.length, d.draw, d.maxTurns)])), attacksLeft: 0,
        natureDeck: coopBuildNatureDeck(compoundCount), natureDiscard: [],
        incoming: [], responseBlocked: false, blockReason: '',
        // CO スクラッチ（実体は各スロット。描画・既存エンジンが参照）
        budget: 0, budgetUsed: 0, nextBudgetBonus: 0, hand: [], policyDeck: [], policyDiscard: [],
        log: [], confirm: null, result: null, intel: null, intelPopup: false, drawState: null, eventPopup: null,
        outcome: null, summary: null, gameLog: [], cpuPlayedLog: [], cpuReview: null,
        myId: opts.myId || (naturePlayer ? naturePlayer.id : (cityPlayers[0] && cityPlayers[0].id)) || null,
        mySide: null, humanSide: null, roomId: null, name: '', oppPresent: true,
      };
      CO.mySide = (CO.myId === CO.natureId) ? 'nature' : 'city';
      CO.humanSide = CO.mySide;
      return CO;
    }

    // 予算（MP）：生存都市ごとに基本3pt＋自分の都市能力。デマは各都市 −1
    function coopApplyBudgetMP() {
      const rumor = CO.diff.events.some(ev => ev.t === CO.turn && ev.id === 'rumor');
      CO.cities.forEach(cs => {
        // 壊滅都市は後方支援役：予算は毎ターン +GAIN たまり上限 CAP（使った残りは持ち越す）。デマの影響は受けない。
        // 神戸など予算ボーナス都市は上限もその分高い（生存時の予算ルールと一貫）
        if (cs.hp <= 0) {
          const cap = COOP_SUPPORT_CAP + (cs.city.abilityType === 'extra_budget' ? cs.city.abilityValue : 0);
          const leftover = Math.max(0, (cs.budget || 0) - (cs.budgetUsed || 0));
          cs.budget = Math.min(cap, leftover + COOP_SUPPORT_GAIN);
          cs.budgetUsed = 0; cs.nextBudgetBonus = 0; return;
        }
        let b = 3;
        if (cs.city.abilityType === 'extra_budget') b += cs.city.abilityValue;
        if (cs.nextBudgetBonus > 0) b += cs.nextBudgetBonus;
        cs.nextBudgetBonus = 0;
        if (rumor) b = Math.max(0, b - 1);
        cs.budget = b; cs.budgetUsed = 0;
      });
      if (rumor) _coLog('📱 デマ拡散イベント：各都市の予算 −1（社会的脆弱性）');
    }

    // 都市ターン開始（MP）：全スロットの予算・ドロー・各種フラグをリセット
    function coopStartCityTurnMP(initial) {
      if (_coAutoEndTimer) { clearTimeout(_coAutoEndTimer); _coAutoEndTimer = null; } // 前ターンの自動終了タイマーを破棄
      CO.phase = 'city'; CO.confirm = null; CO.intel = null; CO.intelPopup = false; CO.eventPopup = null;
      CO.cities.forEach(cs => { cs.effects.disastersReceivedThisTurn = 0; cs.ready = false; cs.ack = false; cs.resp = undefined; });
      coopApplyBudgetMP();
      // 壊滅都市も後方支援として手札を回すため毎ターン1枚は引く（生存都市は通常通り4/2枚）
      CO.cities.forEach(cs => { coopLoadActor(cs); coopDraw(cs.hp <= 0 ? 1 : (initial ? 4 : 2)); coopSaveActor(cs); });
      coopLoadMyActor();
      const evs = CO.diff.events.filter(ev => ev.t === CO.turn).map(e => e.id);
      if (evs.length) CO.eventPopup = evs;
      renderCoop();
    }

    // 都市ターン終了後（MP）：自然が人間ならその攻撃ターン、CPUなら自動攻撃
    function coopAfterCityTurnMP() {
      if (CO.natureIsCpu) coopNatureTurnMP();
      else coopStartNatureHumanTurn();
    }

    // 1ターンの攻撃枚数（MP）：基本 diff.draw に「開始時の都市人数−1」を加算する。
    // 生存数ではなく人数基準にすることで、都市が壊滅して後方支援に回っても中盤の攻撃圧が緩まない。
    // 終盤は CO.maxHits（1都市への攻撃上限）が自然に上限を作るため過剰にはならない。
    // 例外：2都市は構造的に最も自然有利なため draw のみ（=2枚）に緩和し、各都市が概ね対応1回で受けきれる水準にする。
    // ※ 係数は暫定。実機プレイテストでバランス調整する想定（§7.2）
    function coopMPAttackCount() {
      const n = CO.cities.length;
      return n <= 2 ? CO.diff.draw : CO.diff.draw + (n - 1);
    }
    // 自然ターン（MP・CPU）：HP最低都市を狙って攻撃キューを組み、対応フェーズへ
    function coopNatureTurnMP() {
      _coCancelTimer();
      CO.phase = 'nature'; CO.confirm = null; CO.responseBlocked = false; CO.blockReason = '';
      CO.cities.forEach(cs => cs._turnStartHp = cs.hp);
      if (CO.diff.events.some(ev => ev.t === CO.turn && ev.id === 'pollution')) coopEventPollution();
      if (CO.diff.events.some(ev => ev.t === CO.turn && ev.id === 'terror')) { CO.responseBlocked = true; CO.blockReason = '💣 テロ攻撃イベントにより対応フェーズはスキップ'; _coLog('💣 テロ攻撃イベント：今回の自然ターンは対応フェーズ不可'); }
      // 即死防止：同種は1ターン1回／1都市への攻撃は最大 COOP_MAX_HITS 回
      CO.atkUsedTypes = {}; CO.atkCityHits = {};
      const nAtk = coopMPAttackCount();
      const cards = []; CO.incoming = [];
      let guard = 0;
      while (cards.length < nAtk && guard++ < 40) {
        const c = coopDrawNature(); if (!c) break;
        if (CO.atkUsedTypes[c.id]) { CO.natureDiscard.push(c); continue; } // 同種は今ターン使用済み→引き直す
        const idx = coopPickTarget(c); if (idx < 0) { CO.natureDiscard.push(c); break; } // 全都市が攻撃上限
        CO.atkUsedTypes[c.id] = true; CO.atkCityHits[idx] = (CO.atkCityHits[idx] || 0) + 1;
        cards.push(c); CO.incoming.push({ card: c, idx, est: coopEstimate(c, CO.cities[idx]) });
      }
      if (cards.length) {
        // MPでは複合災害の対応スキップは「当たった都市だけ」に限定する（coopEnterResponseMP）。全都市の対応を奪う旧挙動は不採用
        _coLog(`🌪️ 自然の攻撃：${cards.map(c => c.name).join('・')}`);
      } else _coLog('🌪️ 自然山札が尽きた。今回の攻撃なし');
      coopEnterResponseMP();
    }

    // 対応フェーズ開始（MP）：被弾した生存都市の所有者が各自1回対応。被弾なし・強制スキップなら即解決。
    // 複合災害（広域避難指示で防げていない）に当たった都市だけは対応不可にする（ローカル化：他都市の対応は奪わない）
    function coopEnterResponseMP() {
      const hitIdx = [...new Set(CO.incoming.filter(a => CO.cities[a.idx].hp > 0).map(a => a.idx))];
      const compoundBlocked = new Set(CO.incoming.filter(a => a.card.specialType === 'skip_response' && !CO.cities[a.idx].effects.negateSpecial).map(a => a.idx));
      compoundBlocked.forEach(i => { if (CO.cities[i].hp > 0) _coLog(`⚡ 複合災害：${CO.cities[i].city.name}は対応フェーズをスキップ（広域避難指示で防げる）`); });
      const respondable = hitIdx.filter(i => !compoundBlocked.has(i));
      if (CO.incoming.length === 0 || CO.responseBlocked || respondable.length === 0) {
        CO.cities.forEach(cs => cs.resp = undefined);
        CO.phase = 'resolving'; renderCoop();
        _coTimer = setTimeout(coopResolveRoundMP, 500); return;
      }
      CO.cities.forEach((cs, i) => { cs.resp = respondable.includes(i) ? null : undefined; }); // null=被弾・未決（複合直撃の都市は除外）
      CO.phase = 'coopResponse'; renderCoop();
    }
    // 全ての被弾都市が対応を決めたか（null が残っていなければ完了）
    function coopMPAllResponded() { return CO.cities.every(cs => cs.resp !== null); }

    // ダメージ解決（MP）：被弾都市ごとに所有者の対応カードを適用。台風・脆弱性ドロー等は被弾都市の所有者の手札で計算
    function coopResolveRoundMP() {
      _coCancelTimer();
      CO.phase = 'resolving'; CO.confirm = null;
      const summary = { attacks: [], regens: [], cityStart: CO.cities.map(cs => ({ name: cs.city.name, hp: cs._turnStartHp ?? cs.hp, maxHp: cs.maxHp })) };
      const respConsumed = {};
      CO.incoming.forEach((atk) => {
        const cs = CO.cities[atk.idx];
        if (cs.hp <= 0) { summary.attacks.push({ cardIcon: atk.card.icon, cardName: atk.card.name, cityName: cs.city.name, dead: true }); _coLog(`　${atk.card.name}：${cs.city.name}は既に壊滅`); return; }
        coopLoadActor(cs); // 被弾都市の所有者の手札・予算で計算
        let respCard = null;
        if (!respConsumed[atk.idx] && cs.resp && cs.resp.uid != null) {
          respCard = CO.hand.find(c => c.uid === cs.resp.uid) || null;
          if (respCard) { CO.hand.splice(CO.hand.indexOf(respCard), 1); CO.policyDiscard.push(respCard); }
          respConsumed[atk.idx] = true;
        }
        const r = coopResolveAttack(atk.card, cs, respCard, coopComboBonus(atk.card, atk.idx));
        _coLog(`💥 ${atk.card.name} → ${cs.city.name}：${r.dmg}ダメージ（残${Math.max(0, cs.hp)}）`);
        r.lines.forEach(l => _coLog(`　↳ ${l.t}${l.d != null ? `（${l.d > 0 ? '+' : ''}${l.d}）` : ''}`));
        const chain = coopApplyChain(atk.card, cs);
        chain.forEach(c => _coLog(`　⚡ 連鎖：${c.label} +${c.dmg}（残${Math.max(0, cs.hp)}）`));
        summary.attacks.push({ cardId: atk.card.id, cardIcon: atk.card.icon, cardName: atk.card.name, cityName: cs.city.name, maxHp: cs.maxHp, base: atk.card.baseDamage, hpBefore: r.fromHp, damage: r.dmg, lines: r.lines, chain, hpAfter: cs.hp });
        const terrainBonus = (r.lines.filter(l => /地形リスク/.test(l.t)).reduce((s, l) => s + (l.d || 0), 0));
        const blocked = (r.lines.filter(l => l.d != null && l.d < 0).reduce((s, l) => s + (-l.d), 0));
        const chainDmg = chain.reduce((s, c) => s + c.dmg, 0);
        CO.gameLog.push({ turn: CO.turn, cardId: atk.card.id, cardIcon: atk.card.icon, cardName: atk.card.name, cityId: cs.city.id, cityName: cs.city.name, damage: r.dmg + chainDmg, base: atk.card.baseDamage, terrainBonus, blocked, chainDmg, chainLabels: chain.map(c => c.label) });
        coopSaveActor(cs); // 台風破棄・被災ドロー・洪水予算ボーナスを所有者スロットへ反映
      });
      CO.incoming = [];
      CO.cities.forEach(cs => cs.resp = undefined);
      if (CO.cities.every(cs => cs.hp <= 0)) { CO.outcome = 'destroyed'; CO.result = (CO.mySide === 'nature') ? 'win' : 'lose'; CO.phase = 'over'; CO.summary = summary; coopLoadMyActor(); renderCoop(); return; }
      coopApplyRegen(summary);
      summary.cityEnd = CO.cities.map(cs => ({ name: cs.city.name, hp: cs.hp, maxHp: cs.maxHp, dead: cs.hp <= 0 }));
      CO.summary = summary; CO.phase = 'summary';
      CO.cities.forEach(cs => cs.ack = false);
      coopLoadMyActor(); renderCoop();
    }

    // サマリー確認後（MP）：制限ターン到達で都市勝利、未到達なら次ターンへ
    function coopDismissSummaryMP() {
      if (CO.turn >= CO.diff.maxTurns) { CO.outcome = 'survived'; CO.result = (CO.mySide === 'nature') ? 'lose' : 'win'; CO.phase = 'over'; coopLoadMyActor(); renderCoop(); return; }
      CO.turn++;
      coopStartCityTurnMP(false);
    }

    // 自分の操作フェーズか（MP）：都市は自分のスロット状態、自然は自然フェーズで判定
    function coopMyPhaseMP() {
      const s = coopMySlot();
      switch (CO.phase) {
        case 'city': case 'draw': return CO.mySide === 'city' && !!s && !s.ready; // 壊滅都市も後方支援で手番を持つ
        case 'natureHuman': return CO.mySide === 'nature';
        case 'coopResponse': return CO.mySide === 'city' && !!s && s.resp === null;
        case 'summary': return CO.mySide === 'city' && !!s && s.hp > 0 && !s.ack;
        case 'setup': return CO.host;
        default: return false;
      }
    }

    // ホスト：ゲストの intent を playerId 単位に検証し、スワップインで既存エンジンへ適用
    function coopApplyIntentMP(it) {
      const p = it.payload || {}, pid = it.by;
      const slotOf = id => CO.cities.find(cs => cs.ownerId === id);
      CO._applying = true;
      try {
        switch (it.type) {
          case 'confirmPlay': {
            if (CO.phase !== 'city') break;
            const slot = slotOf(pid); if (!slot || slot.ready) break;
            // 壊滅都市（後方支援）：自己完結カード（ドロー）と自己対象は不可。生存する別都市への回復・シールド・共助支援（防災協定）のみ
            if (slot.hp <= 0) {
              const card = slot.hand.find(x => x.uid === p.uid);
              const selfIdx = CO.cities.indexOf(slot);
              const tgt = CO.cities[p.i];
              const SUPPORT_OK = ['heal', 'shield_quake_fire', 'shield_flood', 'negate_special', 'damage_reduce_2t', 'peek_all'];
              if (!card || p.i < 0 || p.i === selfIdx || !tgt || tgt.hp <= 0 || !SUPPORT_OK.includes(card.effectType)) break;
            }
            coopLoadActor(slot); CO.confirm = { uid: p.uid }; coopConfirmPlay(p.i);
            // ハザードマップ整備（draw）はMPでは即時ドロー（グローバルなdrawフェーズを作らない）
            if (CO.phase === 'draw' && CO.drawState) {
              let g = 0; while (CO.drawState && g++ < 12) { coopPullDrawCard(); if (CO.drawState && CO.drawState.revealed) coopAcceptDrawCard(); }
              CO.drawState = null; CO.phase = 'city';
            }
            coopSaveActor(slot);
            break;
          }
          case 'endTurn': {
            if (CO.phase !== 'city' && CO.phase !== 'draw') break;
            const slot = slotOf(pid); if (!slot || slot.ready) break;
            slot.ready = true;
            // 壊滅都市も後方支援役として手番を持つため、全都市（生存・壊滅とも）の完了を待つ
            if (CO.cities.every(cs => cs.ready)) coopAfterCityTurnMP();
            break;
          }
          case 'attack': {
            if (CO.phase !== 'natureHuman' || pid !== CO.natureId) break;
            CO.confirm = { attackId: p.id, attack: true }; coopConfirmAttack(p.cityIdx);
            break;
          }
          case 'finishAttack': {
            if (CO.phase === 'natureHuman' && pid === CO.natureId) coopFinishNatureHuman();
            break;
          }
          case 'respApply': {
            if (CO.phase !== 'coopResponse') break;
            const slot = slotOf(pid); if (!slot || slot.resp !== null) break;
            if (!slot.hand.find(c => c.uid === p.uid)) break;
            slot.resp = { uid: p.uid };
            if (coopMPAllResponded()) coopResolveRoundMP();
            break;
          }
          case 'skipResp': {
            if (CO.phase !== 'coopResponse') break;
            const slot = slotOf(pid); if (!slot || slot.resp !== null) break;
            slot.resp = { skip: true };
            if (coopMPAllResponded()) coopResolveRoundMP();
            break;
          }
          case 'dismissSummary': {
            if (CO.phase !== 'summary') break;
            const slot = slotOf(pid); if (!slot || slot.ack) break;
            slot.ack = true;
            if (CO.cities.every(cs => cs.hp <= 0 || cs.ack)) coopDismissSummaryMP();
            break;
          }
          case 'dismissEvent': { CO.eventPopup = null; break; }
          case 'dismissIntel': { CO.intelPopup = false; break; }
        }
      } finally { CO._applying = false; }
      coopLoadMyActor();
      coopPushState();
      renderCoop();
    }

    // ── クライアント操作の統一窓口（MP）：ホストは即適用、ゲストは intent 送信 ──
    function coopMPCommit(type, payload) {
      CO.confirm = null;
      if (CO.host) coopApplyIntentMP({ type, by: CO.myId, payload: payload || {} });
      else { coopSendIntent(type, payload || {}); renderCoop(); }
    }

    // ═══ オンライン多人数：ルーム作成・参加・開始・購読 ═══
    function _coNewPid() { return 'p_' + Math.random().toString(36).slice(2, 9); }

    // 参加画面：コードからルームの状態を取得し、選べるサイド（自然側の空き有無）を判定する
    function coopMPCheckRoom(code) {
      code = (code || '').trim().toUpperCase();
      if (!db || code.length !== 6) return;
      if (lobbyState._coopCheckCode === code) return; // 同じコードは再取得しない
      lobbyState._coopCheckCode = code;
      db.ref(`coopRooms/${code}`).get().then(snap => {
        if ((lobbyState.coopJoinInput || '').trim().toUpperCase() !== code) return; // 入力が変わっていたら破棄
        const room = snap.val();
        if (!room) { lobbyState.coopJoinRoomInfo = { code, exists: false }; render(); return; }
        const players = room.players || {};
        const assign = room.assign || 'fixed';
        const natureTaken = Object.values(players).some(p => p.side === 'nature');
        const cityCount = Object.values(players).filter(p => p.side === 'city').length;
        const partCount = Object.keys(players).length;
        const natureOpen = assign === 'fixed' && room.natureMode === 'human' && !natureTaken; // 固定かつ人間設定かつ未着席のときだけ自然側を出す
        lobbyState.coopJoinRoomInfo = { code, exists: true, started: !!room.started, assign, natureMode: room.natureMode, natureTaken, cityCount, natureOpen, cityFull: cityCount >= 4, partCount, partFull: partCount >= 5 };
        if (!natureOpen && lobbyState.coopJoinSide === 'nature') lobbyState.coopJoinSide = 'city';
        render();
      }).catch(() => { lobbyState._coopCheckCode = null; });
    }

    // ホスト：ルーム作成 → 待機ロビーへ。natureMode: 'cpu'|'human'（自分が都市のときのみ意味を持つ）
    function coopMPCreateRoom(diffKey, hostSide, natureMode, assign, socialVuln, cityHp) {
      const name = (lobbyState.nameInput || '').trim();
      if (!name) { lobbyState.error = '名前を入力してください'; render(); return; }
      if (!db) { lobbyState.error = 'オンライン機能が利用できません'; render(); return; }
      assign = assign || 'fixed';
      const sv = socialVuln !== false;
      const hp = (cityHp != null) ? Math.max(80, Math.min(120, cityHp)) : 95;
      const code = generateRoomCode();
      const hostId = _coNewPid();
      const natMode = (assign === 'random') ? 'human' : (hostSide === 'nature' ? 'human' : (natureMode || 'cpu'));
      const mySideStored = (assign === 'random') ? 'participant' : hostSide; // ランダムは開始時まで配役未定
      const players = { [hostId]: { name, side: mySideStored, slot: 0, joinedAt: Date.now() } };
      CO = {
        mp: true, online: true, host: true, phase: 'lobby',
        roomId: code, myId: hostId, mySide: mySideStored, humanSide: mySideStored,
        name, diff: COOP_DIFF[diffKey], diffKey, natureMode: natMode, assign, socialVuln: sv, cityHp: hp,
        lobby: { players, presence: {} }, oppPresent: true, cities: [], log: [],
      };
      renderCoop();
      db.ref(`coopRooms/${code}`).set({
        hostId, hostName: name, diff: diffKey, natureMode: natMode, assign, socialVuln: sv, cityHp: hp, started: false,
        players, createdAt: Date.now(), lastActiveAt: Date.now(),
      }).then(() => { coopMPListenRoom(); coopMPSetupPresence(); _coSaveSession(); renderCoop(); })
        .catch(e => { lobbyState.error = 'ルーム作成に失敗: ' + (e && e.message); CO = null; render(); });
    }

    // 参加：ルームへ自分を登録し待機ロビーへ。joinSide は 'city'|'nature'
    async function coopMPJoinRoom(codeArg, joinSide) {
      const name = (lobbyState.nameInput || '').trim();
      const code = (codeArg || lobbyState.coopJoinInput || '').trim().toUpperCase();
      if (!name) { lobbyState.error = '名前を入力してください'; render(); return; }
      if (code.length !== 6) { lobbyState.error = 'ルームコードは6文字です'; render(); return; }
      if (!db) { lobbyState.error = 'オンライン機能が利用できません'; render(); return; }
      try {
        const snap = await db.ref(`coopRooms/${code}`).get();
        const room = snap.val();
        if (!room) { lobbyState.error = 'ルームが見つかりません'; render(); return; }
        if (room.started) { lobbyState.error = 'このルームは既に開始しています'; render(); return; }
        const players = room.players || {};
        const assign = room.assign || 'fixed';
        let side;
        if (assign === 'random') {
          if (Object.keys(players).length >= 5) { lobbyState.error = '満員です（最大5人）'; render(); return; }
          side = 'participant'; // 配役は開始時に抽選
        } else {
          const cityCount = Object.values(players).filter(p => p.side === 'city').length;
          const natureTaken = Object.values(players).some(p => p.side === 'nature');
          const natureOpen = room.natureMode === 'human' && !natureTaken;
          side = joinSide || 'city';
          if (side === 'nature' && !natureOpen) { lobbyState.error = '自然側は空きがありません'; render(); return; }
          if (side === 'city' && cityCount >= 4) { lobbyState.error = '都市側は満員です（最大4人）'; render(); return; }
        }
        const myId = _coNewPid();
        const slot = Object.keys(players).length;
        CO = {
          mp: true, online: true, host: false, phase: 'lobby',
          roomId: code, myId, mySide: side, humanSide: side,
          name, diff: COOP_DIFF[room.diff], diffKey: room.diff, natureMode: room.natureMode, assign,
          socialVuln: room.socialVuln !== false, cityHp: room.cityHp || 95,
          lobby: { players, presence: {} }, oppPresent: true, cities: [], log: [],
        };
        renderCoop();
        await db.ref(`coopRooms/${code}/players/${myId}`).set({ name, side, slot, joinedAt: Date.now() });
        await db.ref(`coopRooms/${code}/lastActiveAt`).set(Date.now());
        coopMPListenRoom(); coopMPSetupPresence(); _coSaveSession(); renderCoop();
      } catch (e) { lobbyState.error = '参加に失敗: ' + (e && e.message); CO = null; render(); }
    }

    // ロビー購読：ロスター（players）・在席（presence）・開始フラグ（ゲスト）
    function coopMPListenRoom() {
      const code = CO.roomId;
      _coRoomPlayersRef = db.ref(`coopRooms/${code}/players`);
      _coRoomPlayersRef.on('value', s => { if (!CO || !CO.mp) return; CO.lobby = CO.lobby || {}; CO.lobby.players = s.val() || {}; if (CO.phase === 'lobby') renderCoop(); });
      _coRoomPresRef = db.ref(`coopRooms/${code}/presence`);
      _coRoomPresRef.on('value', s => {
        if (!CO || !CO.mp) return;
        const pres = s.val() || {}; CO.lobby = CO.lobby || {}; CO.lobby.presence = pres;
        const ids = Object.keys((CO.lobby.players) || {});
        const prev = CO.oppPresent;
        CO.oppPresent = ids.every(id => id === CO.myId || pres[id] !== false);
        // 仲間が戻ってきた（不在→在席）ら再接続ポップを出す（対戦モードと同じUX。プレイ中のみ）
        if (prev === false && CO.oppPresent === true && !['lobby', 'over', 'setup'].includes(CO.phase)) showReconnectPopup();
        renderCoop();
      });
      if (!CO.host) {
        _coStartedRef = db.ref(`coopRooms/${code}/started`);
        _coStartedRef.on('value', s => { if (!CO || !CO.mp || CO.host) return; if (s.val() === true && CO.phase === 'lobby') { if (_coStartedRef) { _coStartedRef.off(); _coStartedRef = null; } coopMPListenState(); } });
      }
    }

    // ホスト：参加者が揃ったらゲーム開始（ロスターから本体stateを構築）
    function coopMPStartHost() {
      if (!CO || !CO.host) return;
      const playersObj = (CO.lobby && CO.lobby.players) || {};
      const arr = Object.keys(playersObj).map(id => ({ id, name: playersObj[id].name, side: playersObj[id].side, slot: playersObj[id].slot })).sort((a, b) => a.slot - b.slot);
      // ランダム配役：参加者から自然1人を抽選し、残りは都市
      if (CO.assign === 'random') {
        if (arr.length < 2) { CO.lobbyMsg = 'ランダム配役には2人以上の参加が必要です'; renderCoop(); return; }
        const pick = arr[Math.floor(Math.random() * arr.length)];
        arr.forEach(p => p.side = (p.id === pick.id) ? 'nature' : 'city');
      }
      const cityPlayers = arr.filter(p => p.side === 'city');
      if (cityPlayers.length === 0) { lobbyState.error = '都市プレイヤーが1人以上必要です'; renderCoop(); return; }
      const natureHuman = arr.some(p => p.side === 'nature');
      const natureIsCpu = !natureHuman; // 自然プレイヤーがいなければ CPU
      if (CO.natureMode === 'human' && CO.assign !== 'random' && !natureHuman) { CO.lobbyMsg = '自然側の参加を待っています（または CPU で開始してください）'; renderCoop(); return; }
      const code = CO.roomId, hostId = CO.myId, hostName = CO.name, diffKey = CO.diffKey;
      coopBuildMPState({ diffKey, players: arr, natureIsCpu, myId: hostId, socialVuln: CO.socialVuln, cityHp: CO.cityHp });
      CO.host = true; CO.roomId = code; CO.name = hostName; CO.myId = hostId;
      CO.mySide = (CO.myId === CO.natureId) ? 'nature' : 'city'; CO.humanSide = CO.mySide;
      CO.lobby = { players: playersObj, presence: (CO.lobby && CO.lobby.presence) || {} };
      coopLoadMyActor();
      coopListenIntents();
      coopBeginPlay(); // turn=1・都市ターン（MP）
      coopSplashRole(); // 配役発表（ホスト）
      db.ref(`coopRooms/${code}/started`).set(true);
      db.ref(`coopRooms/${code}/lastActiveAt`).set(Date.now());
      coopPushState(true);
      _coSaveSession(); // 開始後もホストとして再接続できるよう保存
      if (_coHeartbeat) clearInterval(_coHeartbeat);
      _coHeartbeat = setInterval(() => { if (CO && CO.online && CO.host) coopPushState(true); }, 1500);
    }

    // ホストが CPU 自然で開始（自然の人間参加を待たない）
    function coopMPStartHostCpu() { if (CO) { CO.natureMode = 'cpu'; } coopMPStartHost(); }

    // 状態受信（ゲスト・MP）：自分の都市スロットを描画用にロードし、視点・勝敗を変換
    function coopMPListenState() {
      _coStateRef = db.ref(`coopRooms/${CO.roomId}/state`);
      _coStateRef.on('value', snap => {
        const v = snap.val(); if (!v || !CO) return;
        const data = (typeof v === 'object') ? v.d : v;
        if (!data || data === _coLastRecv) return;
        _coLastRecv = data;
        const remote = JSON.parse(data);
        const ui = { online: true, mp: true, host: false, myId: CO.myId, roomId: CO.roomId, name: CO.name, oppPresent: CO.oppPresent, lobby: CO.lobby, confirm: CO.confirm };
        CO = { ...remote, ...ui };
        CO.mySide = (CO.myId === CO.natureId) ? 'nature' : 'city';
        CO.humanSide = CO.mySide;
        coopLoadMyActor();
        CO.result = coopResultFor(CO.mySide);
        if (!coopMyPhase()) CO.confirm = null;
        coopSplashRole(); // ゲスト：初回のみ配役発表
        renderCoop();
      });
    }

    // presence（MP）：自分の playerId 単位で在席を登録
    function coopMPSetupPresence() {
      if (!db || !CO || !CO.roomId || !CO.myId) return;
      _coPresMeRef = db.ref(`coopRooms/${CO.roomId}/presence/${CO.myId}`);
      _coConnRef = db.ref('.info/connected');
      _coConnRef.on('value', s => { if (!s.val()) return; _coPresMeRef.set(true); _coPresMeRef.onDisconnect().set(false); });
      _coOnlineHandler = () => { if (db && CO && CO.roomId && _coPresMeRef) { _coPresMeRef.set(true); _coPresMeRef.onDisconnect().set(false); } };
      window.addEventListener('online', _coOnlineHandler);

    // 予測ダメージ（read-only。coopResolveAttack の主要計算を再現。resp を渡すと対応カード適用後の予測）
    function coopPredictDamage(atkCard, cs, resp) {
