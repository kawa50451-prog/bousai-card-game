    .confirm-card-img { width:108px; border-radius:8px; display:block; margin:0 auto }
    /* ガチャ・ドロー画面のカード型エリア */
    .gacha-card-reveal-area { width:200px; aspect-ratio:288/450; border-radius:14px; overflow:hidden; cursor:pointer; border:3px solid var(--bg3); transition:transform .2s, border-color .2s }
    .gacha-card-reveal-area img { width:100%; height:100%; object-fit:cover; display:block }
    .gacha-card-reveal-area:hover:not(.revealed) { transform:scale(1.03); border-color:var(--yellow) }
    .gacha-card-reveal-area.revealed { border-color:var(--yellow); box-shadow:0 0 32px rgba(210,153,34,.35); cursor:default }
    .cityorder-city-img { width:120px; border-radius:8px; display:block; margin:0 auto 8px }

    /* ── 1. Usable card glow ── */
    .card.card-usable.policy { box-shadow: 0 0 10px rgba(56,139,253,.32), 0 0 0 1px rgba(56,139,253,.2) }
    .card.card-usable.disaster { box-shadow: 0 0 10px rgba(248,81,73,.32), 0 0 0 1px rgba(248,81,73,.2) }

    /* ── 3. HP danger zone ── */
    @keyframes hp-danger-pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
    @keyframes hp-critical-blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .hp-bar-fill.hp-warn { animation: hp-danger-pulse 1.3s ease-in-out infinite }
    .hp-danger-badge { font-size:.65rem; color:var(--yellow); font-weight:700; padding:1px 6px; border-radius:4px; background:rgba(210,153,34,.18); animation:hp-danger-pulse 1.3s ease-in-out infinite; white-space:nowrap }
    .hp-critical-badge { font-size:.65rem; color:var(--red); font-weight:700; padding:1px 6px; border-radius:4px; background:rgba(248,81,73,.22); border:1px solid rgba(248,81,73,.5); animation:hp-critical-blink .8s ease-in-out infinite; white-space:nowrap }

    /* ── 4. State banner ── */
    .state-banner { text-align:center; padding:8px 14px; border-radius:10px; font-size:.88rem; font-weight:700 }
    .state-banner-waiting { background:rgba(56,139,253,.1); border:1px solid rgba(56,139,253,.25); color:var(--blue) }
    .state-banner-response { background:rgba(248,81,73,.1); border:1px solid rgba(248,81,73,.25); color:var(--red) }

    /* ── 5. City info modal ── */
    .city-info-overlay { position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; justify-content:center; z-index:1001; padding:20px; cursor:pointer }
    .city-info-box { background:var(--bg2); border:1.5px solid var(--bg3); border-radius:16px; padding:20px 18px; max-width:300px; width:100%; cursor:default; display:flex; flex-direction:column; gap:8px; box-shadow:0 12px 40px rgba(0,0,0,.6) }

    /* ── 6. Response damage preview ── */
    .response-dmg-preview { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px }
    .rdp-item { font-size:.76rem; padding:3px 8px; border-radius:5px; font-weight:600 }
    .rdp-skip { background:rgba(248,81,73,.15); color:var(--red) }
    .rdp-special { background:rgba(227,179,65,.15); color:var(--yellow); border:1px solid rgba(227,179,65,.3) }
    .rdp-breakdown { font-size:.74rem; color:var(--t2); margin-top:3px; }
    .rdp-breakdown b { color:var(--red); font-weight:700; }
    .card-ineffective { opacity:.35; }
    .card-hp-band { position:absolute; bottom:18px; left:0; width:72%; padding:2px 3px 2px 4px; background:rgba(0,0,0,.6); clip-path:polygon(0 0,100% 0,82% 100%,0 100%); font-size:.42rem; font-weight:700; color:var(--green); z-index:2; white-space:nowrap; }

    /* ── 8. Log critical/divider ── */
    .log-entry.critical { background:rgba(248,81,73,.18) !important; border-left:3px solid var(--red); color:var(--red) !important; font-weight:700; padding-left:8px }
    .log-entry.divider { text-align:center; color:var(--t3); font-size:.6rem; padding:2px 0; background:none !important; letter-spacing:.06em; opacity:.7 }

    /* ── 9. Mobile hand horizontal scroll ── */
    @media (max-width:600px) {
      .hand-groups { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; gap:12px; scroll-snap-type:x mandatory }
      .hand-group-cards { flex-wrap:nowrap }
      .hand-group { scroll-snap-align:start }
    }

    /* ── 10. Hint overlay ── */
    .hint-btn { position:fixed; bottom:16px; right:16px; width:40px; height:40px; border-radius:50%; background:transparent; border:1.5px solid #fff; color:#fff; font-size:1rem; font-weight:700; cursor:pointer; z-index:9100; transition:.2s; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.4) }
    .hint-btn:hover { border-color:#fa2a4e; color:#fa2a4e; background:rgba(250,42,78,.1) }
    .spec-invite-btn { position:fixed; bottom:16px; right:64px; z-index:9100; padding:7px 12px; border-radius:20px; background:rgba(56,139,253,.15); border:1.5px solid #388bfd; color:#388bfd; font-size:.75rem; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:5px; box-shadow:0 2px 8px rgba(0,0,0,.4); transition:.2s; white-space:nowrap; }
    .spec-invite-btn:hover { background:rgba(56,139,253,.3); }
    .spec-invite-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:9200; display:flex; align-items:flex-end; justify-content:flex-end; padding:72px 12px; }
    .spec-invite-panel { background:var(--bg1); border:1px solid rgba(56,139,253,.5); border-radius:18px; padding:18px; width:min(280px, 90vw); display:flex; flex-direction:column; gap:0; }
    .spec-invite-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .spec-invite-title { font-size:.9rem; font-weight:700; color:var(--t1); }
    .spec-invite-close { background:transparent; border:none; color:var(--t3); font-size:1.1rem; cursor:pointer; padding:2px 6px; line-height:1; }
    .spec-invite-copy-btn { width:100%; padding:10px; border-radius:10px; border:none; background:#388bfd; color:#fff; font-size:.85rem; font-weight:700; cursor:pointer; }
    .hint-overlay { position:fixed; inset:0; background:rgba(0,0,0,.65); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:9200; display:flex; align-items:flex-end; justify-content:center; padding:12px }
    .hint-box { background:var(--bg1); border:1px solid var(--bg3); border-radius:20px; padding:20px 18px; max-width:520px; width:100%; max-height:72vh; overflow-y:auto; display:flex; flex-direction:column; gap:10px }
    .hint-box-header { display:flex; align-items:center; justify-content:space-between }
    .hint-title { font-size:.95rem; font-weight:700; color:var(--blue) }
    .hint-close { background:none; border:none; color:var(--t3); font-size:1.2rem; cursor:pointer; padding:0 4px; line-height:1 }
    .hint-section { font-size:.83rem; color:var(--t2); line-height:1.8 }
    .hint-section strong { color:var(--t1) }
    .hint-divider { border:none; border-top:1px solid var(--bg3); margin:2px 0 }
    .hint-tag { display:inline-block; padding:1px 7px; border-radius:5px; font-size:.72rem; font-weight:700; margin-right:3px }
    .hint-tag.green { background:rgba(63,185,80,.18); color:var(--green); border:1px solid rgba(63,185,80,.25) }
    .hint-tag.yellow { background:rgba(210,153,34,.18); color:var(--yellow); border:1px solid rgba(210,153,34,.25) }
    .hint-tag.red { background:rgba(248,81,73,.18); color:var(--red); border:1px solid rgba(248,81,73,.25) }
    .hint-tag.blue { background:rgba(56,139,253,.18); color:var(--blue); border:1px solid rgba(56,139,253,.25) }

    /* ── 11. Tutorial ── */
    .city-tap-btn.tut-pulse { animation:tutCityPulse 1.2s ease-in-out infinite; border-color:var(--blue) !important; color:var(--blue) !important }
    @keyframes tutCityPulse { 0%,100% { background:rgba(56,139,253,.15); box-shadow:0 0 0 2px var(--blue) } 50% { background:rgba(56,139,253,.3); box-shadow:0 0 0 3px var(--blue),0 0 12px rgba(56,139,253,.5) } }
    .terrain-badge.tut-flash { animation:tutTerrainFlash 1.4s ease-in-out infinite; border-radius:6px }
    @keyframes tutTerrainFlash { 0%,100% { color:#ffffff } 50% { color:#000000 } }
    .card.tut-glow { animation:tutGlow 1.1s ease-in-out infinite alternate; cursor:pointer !important; opacity:1 !important }
    @keyframes tutGlow { from { box-shadow:0 0 0 2px var(--blue),0 0 10px rgba(56,139,253,.4); transform:translateY(-2px) } to { box-shadow:0 0 0 3px var(--blue),0 0 22px rgba(56,139,253,.7); transform:translateY(-7px) } }
    .btn-end.tut-glow { animation:tutGlowBtn 1.1s ease-in-out infinite alternate }
    @keyframes tutGlowBtn { from { box-shadow:0 0 0 2px var(--green),0 0 8px rgba(63,185,80,.35) } to { box-shadow:0 0 0 3px var(--green),0 0 18px rgba(63,185,80,.65) } }
    .tut-dim { opacity:.28 !important; pointer-events:none !important }
    .tut-dim-soft { opacity:.28 !important }
    .tut-guide { background:var(--bg1); border:1.5px solid var(--blue); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:10px }
    .tut-guide-title { font-size:.88rem; font-weight:700; color:var(--blue) }
    .tut-guide-body { font-size:.82rem; color:var(--t1); line-height:1.8 }
    .tut-progress { display:flex; align-items:center; gap:5px }
    .tut-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0 }
    /* Tutorial: slide-in / neon / gate / vfx */
    @keyframes tut-slide-top { from{opacity:0;transform:translateY(-18px)} to{opacity:1;transform:translateY(0)} }
    @keyframes tut-slide-btm { from{opacity:0;transform:translateY(14px)}  to{opacity:1;transform:translateY(0)} }
    .tut-anim-title { animation:tut-slide-top .45s cubic-bezier(.23,1,.32,1) both }
    .tut-anim-body  { animation:tut-slide-btm .45s cubic-bezier(.23,1,.32,1) .10s both }
    .tut-panel-0 { animation:tut-slide-btm .38s cubic-bezier(.23,1,.32,1) .05s both }
    .tut-panel-1 { animation:tut-slide-btm .38s cubic-bezier(.23,1,.32,1) .13s both }
    .tut-panel-2 { animation:tut-slide-btm .38s cubic-bezier(.23,1,.32,1) .21s both }
    .tneon-blue   { text-shadow:0 0 8px rgba(56,139,253,.9),0 0 20px rgba(56,139,253,.4) }
    .tneon-white  { text-shadow:0 0 8px rgba(200,210,235,.7),0 0 18px rgba(200,210,235,.3) }
    .tneon-yellow { text-shadow:0 0 8px rgba(210,153,34,.9),0 0 20px rgba(210,153,34,.4) }
    @keyframes tut-gate-l { from{transform:scaleX(1)} to{transform:scaleX(0)} }
    @keyframes tut-gate-r { from{transform:scaleX(1)} to{transform:scaleX(0)} }
    .tut-gate   { position:fixed;inset:0;z-index:8500;pointer-events:none;display:flex }
    .tut-gate-l { flex:1;background:#080d14;transform-origin:left center; animation:tut-gate-l .55s cubic-bezier(.77,0,.18,1) .04s both }
    .tut-gate-r { flex:1;background:#080d14;transform-origin:right center;animation:tut-gate-r .55s cubic-bezier(.77,0,.18,1) .04s both }
    @keyframes tut-resp-pulse { 0%,100%{border-color:var(--red);box-shadow:0 0 8px rgba(248,81,73,.3)} 50%{border-color:rgba(248,81,73,.6);box-shadow:0 0 22px rgba(248,81,73,.55)} }
    .tut-resp-anim { animation:tut-resp-pulse 1.3s ease-in-out infinite }
    @keyframes tut-zero-anim { 0%{opacity:0;transform:translate(-50%,-50%) scale(.45)} 25%{opacity:1;transform:translate(-50%,-50%) scale(1.2)} 65%{opacity:1;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-50%) scale(.85)} }
    @keyframes neon-use-fade { from{opacity:.8} to{opacity:0} }

    /* ── ロビー登場アニメーション ── */
    @keyframes lobby-fade-in { from { opacity:0; transform:translateY(18px) scale(.97) } to { opacity:1; transform:translateY(0) scale(1) } }
    .lobby-box.lobby-enter { animation: lobby-fade-in .5s cubic-bezier(.23,1,.32,1) both }

    /* ── 新都市登場アニメーション ── */
    @keyframes city-appear { 0% { opacity:0; transform:translateX(-22px) } 50% { box-shadow:0 0 0 2px var(--yellow),0 0 18px rgba(210,153,34,.45) } 100% { opacity:1; transform:translateX(0); box-shadow:none } }
    .city-appear-anim { animation: city-appear .75s cubic-bezier(.23,1,.32,1) both }

    /* ── HPバーダメージフラッシュ ── */
    @keyframes hp-damage-flash { 0%,100% { filter:brightness(1) } 30% { filter:brightness(2.5) } }
    .hp-flash { animation: hp-damage-flash .35s ease }

    /* ── 浮き上がりダメージ数字 ── */
    @keyframes float-up-dmg { 0% { opacity:1; transform:translateY(0) scale(1) } 70% { opacity:.9; transform:translateY(-48px) scale(1.1) } 100% { opacity:0; transform:translateY(-64px) scale(.9) } }
    .float-dmg {
      position: fixed;
      pointer-events: none;
      font-size: 1.5rem;
      font-weight: 900;
      text-shadow: 0 2px 8px rgba(0,0,0,.8);
      animation: float-up-dmg .95s cubic-bezier(.23,1,.32,1) forwards;
      z-index: 9000;
      user-select: none
    }

    /* ── ターン開始スプラッシュ ── */
    @keyframes turn-splash-anim { 0% { opacity:0; transform:scale(.82) } 15% { opacity:1; transform:scale(1.04) } 65% { opacity:1; transform:scale(1) } 100% { opacity:0; transform:scale(1.06) } }
    .turn-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 8000;
      background: rgba(0,0,0,.22)
    }
    .turn-splash-inner {
      padding: 20px 48px;
      border-radius: 18px;
      text-align: center;
      animation: turn-splash-anim 1.5s cubic-bezier(.23,1,.32,1) forwards
    }
    .turn-splash-icon {
      width: 72px;
      height: 72px;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px
    }

    /* ── スキャンライン演出（ホーム画面ロード） ── */
    .sl-overlay {
      position: fixed;
      inset: 0;
      background: #080d14;
      z-index: 9500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      overflow: hidden
    }
    .sl-header { text-align: center }
    .sl-title {
      font-size: 2.6rem;
      font-weight: 900;
      font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif;
      color: rgba(255,255,255,.9);
      letter-spacing: .18em;
    }
    .sl-subtitle {
      font-size: .78rem;
      color: rgba(255,255,255,.4);
      letter-spacing: .14em;
      margin-top: 6px;
      opacity: 0;
      transition: opacity .5s ease .15s
    }
    .sl-icon-row {
      display: flex;
      gap: clamp(12px, 3.5vw, 32px);
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0 16px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden
    }
    .sl-icon-wrap {
      position: relative;
      width: clamp(64px, 18vw, 96px);
      overflow: visible;
      text-align: center
    }
    .sl-icon-clip {
      position: relative;
      width: clamp(64px, 18vw, 96px);
      height: clamp(64px, 18vw, 96px);
      overflow: hidden
    }
    .sl-icon-wrap img {
      width: clamp(64px, 18vw, 96px);
      height: clamp(64px, 18vw, 96px);
      object-fit: contain;
      display: block;
      filter: brightness(0);
      transition: filter .15s ease
    }
    .sl-icon-wrap.sl-lit img {
      filter: brightness(1)
    }
    @keyframes sl-sweep-45 {
      from { transform: rotate(45deg) translateX(-160px) }
      to   { transform: rotate(45deg) translateX(160px) }
    }
    .sl-scan-line {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 200px;
      height: clamp(48px, 10vw, 72px);
      margin-left: -100px;
      margin-top: clamp(-36px, -5vw, -24px);
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(255,255,255,.12) 20%,
        rgba(255,255,255,.72) 44%,
        rgba(255,255,255,.72) 56%,
        rgba(255,255,255,.12) 80%,
        transparent 100%
      );
      transform: rotate(45deg) translateX(-160px);
      animation: sl-sweep-45 .56s ease-in forwards
    }
    @keyframes sl-icon-zoom {
      0%   { transform: scale(1);   opacity: 1 }
      30%  { transform: scale(2);   opacity: .9 }
      100% { transform: scale(14);  opacity: 0 }
    }
    .sl-icon-wrap.sl-zoom {
      animation: sl-icon-zoom .65s cubic-bezier(.28, 0, .9, 1) forwards
    }
    @keyframes sl-icon-reveal {
      0%   { filter: brightness(0) }
      15%  { filter: brightness(2.6) }
      30%  { filter: brightness(0.1) }
      52%  { filter: brightness(1.9) }
      72%  { filter: brightness(0.65) }
      100% { filter: brightness(1) }
    }
    .sl-icon-reveal {
      animation: sl-icon-reveal .46s ease-in-out forwards
    }
    .lobby-neon-icons {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
    }
    .lobby-neon-icon {
      width: 44px;
      height: 44px;
      object-fit: contain;
      mix-blend-mode: screen;
    }
    .btn-icon {
      width: 1.3rem;
      height: 1.3rem;
      flex-shrink: 0;
      color: white;
    }
    @keyframes ron-flicker {
      0%,100% { opacity: 1 }
      7%  { opacity: .82 }
      10% { opacity: 1 }
      12% { opacity: .91 }
      20% { opacity: 1 }
      33% { opacity: .86 }
      36% { opacity: 1 }
      55% { opacity: .94 }
      58% { opacity: 1 }
      80% { opacity: .89 }
      83% { opacity: 1 }
    }
    .ron-wrap {
      position: relative;
      display: inline-block;
    }
    .ron-lines {
      position: absolute;
      left: -30px; right: -30px; top: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      pointer-events: none;
    }
    .ron-line {
      height: 1px;
      background: rgba(245, 208, 96, .3);
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform .52s cubic-bezier(.25, .8, .25, 1);
    }
    .ron-line:nth-child(1) { transition-delay: .00s }
    .ron-line:nth-child(2) { transition-delay: .06s }
    .ron-line:nth-child(3) { transition-delay: .12s }
    .ron-line:nth-child(4) { transition-delay: .18s }
    .ron-line:nth-child(5) { transition-delay: .24s }
    .ron-lines.ron-active .ron-line { transform: scaleX(1) }
    .ron-text {
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(7px);
      transition: opacity .4s ease, transform .4s ease;
    }
    .ron-text.ron-active {
      opacity: 1;
      transform: translateY(0);
    }
    .ron-text.ron-flicker {
      animation: ron-flicker 3s ease-in-out infinite;
    }

    /* ═══════════════════════════════════════════════════
       YOASOBI-inspired UI v2 enhancements
    ═══════════════════════════════════════════════════ */

    /* ── Keyframes ── */
    @keyframes yb-fadeInUp {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes yb-shimmer-over {
      from { transform:translateX(-130%) skewX(-15deg); }
      to   { transform:translateX(230%) skewX(-15deg); }
    }
    @keyframes yb-scale-in {
      from { opacity:0; transform:scale(0.86); }
      to   { opacity:1; transform:scale(1); }
    }
    @keyframes yb-slide-in-left {
      from { clip-path:inset(0 100% 0 0); opacity:.5; }
      to   { clip-path:inset(0 0% 0 0); opacity:1; }
    }
    @keyframes yb-zone-flash-dmg {
      0%,100% { background:rgba(22,27,34,0.65); }
      25%     { background:rgba(248,81,73,0.20); box-shadow:inset 0 0 0 1.5px rgba(248,81,73,.5); }
    }
    @keyframes yb-zone-flash-heal {
      0%,100% { background:rgba(22,27,34,0.65); }
      25%     { background:rgba(63,185,80,0.16); box-shadow:inset 0 0 0 1.5px rgba(63,185,80,.4); }
    }

    /* ── Phase 1-A: Card type left bar + header tint ── */
    .card[data-ctype="disaster"] { border-left:3px solid var(--red) !important; }
    .card[data-ctype="disaster"] .card-header { background:rgba(248,81,73,.13); }
    .card[data-ctype="instant"]  { border-left:3px solid var(--yellow) !important; }
    .card[data-ctype="instant"]  .card-header { background:rgba(210,153,34,.13); }
    .card[data-ctype="shield"]   { border-left:3px solid var(--green) !important; }
    .card[data-ctype="shield"]   .card-header { background:rgba(63,185,80,.13); }

    /* ── Phase 1-A: Cost Roboto Condensed ── */
    .card-cost { font-family:'Roboto Condensed',sans-serif; font-size:.88rem !important; font-weight:900; }

    /* ── Phase 1-B: Card hover glow by type (PC only) ── */
    @media (hover:hover) {
      .card.card-usable { transition:transform .18s cubic-bezier(.23,1,.32,1), box-shadow .2s; }
      .card.card-usable:hover { transform:translateY(-7px) scale(1.03) !important; }
      .card.card-usable[data-ctype="disaster"]:hover { box-shadow:0 12px 28px rgba(248,81,73,.6), 0 0 0 1px rgba(248,81,73,.35) !important; }
      .card.card-usable[data-ctype="instant"]:hover  { box-shadow:0 12px 28px rgba(210,153,34,.6), 0 0 0 1px rgba(210,153,34,.35) !important; }
      .card.card-usable[data-ctype="shield"]:hover   { box-shadow:0 12px 28px rgba(63,185,80,.6),  0 0 0 1px rgba(63,185,80,.35)  !important; }
    }

    /* ── Phase 1-C: Hand card enter stagger ── */
    .hand-group-cards .card { animation:yb-fadeInUp .38s cubic-bezier(.23,1,.32,1) both; }
    .hand-group-cards .card:nth-child(1) { animation-delay:.02s; }
    .hand-group-cards .card:nth-child(2) { animation-delay:.07s; }
    .hand-group-cards .card:nth-child(3) { animation-delay:.12s; }
    .hand-group-cards .card:nth-child(4) { animation-delay:.17s; }
    .hand-group-cards .card:nth-child(5) { animation-delay:.22s; }
    .hand-group-cards .card:nth-child(6) { animation-delay:.27s; }
    .hand-group-cards .card:nth-child(7) { animation-delay:.32s; }
    .hand-group-cards .card:nth-child(8) { animation-delay:.37s; }

    /* ── Phase 2-A: Typography ── */
    .zone-label { letter-spacing:.09em; text-transform:uppercase; font-size:.68rem !important; font-weight:700; }
    .hp-text    { font-family:'Roboto Condensed',sans-serif; font-weight:700; }
    .budget-display { font-family:'Roboto Condensed',sans-serif; font-weight:900; font-size:1.05rem; }

    /* ── Phase 2-B: Zone damage / heal flash ── */
    .zone-flash-dmg  { animation:yb-zone-flash-dmg .55s ease; }
    .zone-flash-heal { animation:yb-zone-flash-heal .55s ease; }

    /* ── Phase 2-C: Response bar clip-from-bottom / waiting-banner drop-from-top ── */
    .response-pending-bar { animation:yb-clip-from-bottom .45s cubic-bezier(.23,1,.32,1) both; }
    .waiting-banner       { animation:yb-drop-from-top .45s cubic-bezier(.23,1,.32,1) both; }

    /* ── Phase 3-A: Gacha/draft reveal shimmer ── */
    .gacha-card-reveal-area { position:relative; overflow:hidden; }
    .gacha-card-reveal-area.revealed::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(105deg, transparent 25%, rgba(255,255,255,.24) 50%, transparent 75%);
      transform:translateX(-130%) skewX(-15deg);
      pointer-events:none;
      animation:yb-shimmer-over .85s cubic-bezier(.23,1,.32,1) .6s both;
    }

    /* ── Phase 4-B: Confirm drop-in / city modal scale-in ── */
    .confirm-box   { animation:yb-drop-in .38s cubic-bezier(.23,1,.32,1) both; }
    .city-info-box { animation:yb-scale-in .32s cubic-bezier(.23,1,.32,1) both; }

    /* ── Phase 4-C: Turn summary stagger ── */
    .ts-ev { animation:yb-fadeInUp .36s cubic-bezier(.23,1,.32,1) both; }
    .ts-ev:nth-child(1) { animation-delay:.04s; }
    .ts-ev:nth-child(2) { animation-delay:.12s; }
    .ts-ev:nth-child(3) { animation-delay:.20s; }
    .ts-ev:nth-child(4) { animation-delay:.28s; }
    .ts-ev:nth-child(5) { animation-delay:.36s; }
    .ts-ev:nth-child(6) { animation-delay:.44s; }
    .ts-ev:nth-child(7) { animation-delay:.52s; }
    .ts-ev:nth-child(8) { animation-delay:.60s; }

    /* ── A-1: Card just-drawn flash overlay ── */
    @keyframes card-draw-flash {
      0%   { background:rgba(255,255,255,.38); }
      35%  { background:rgba(255,255,255,.08); }
      65%  { background:rgba(255,255,255,.18); }
      100% { background:rgba(255,255,255,0);   }
    }
    @keyframes card-flip-in {
      0%   { transform:perspective(500px) rotateY(90deg) scale(.9); opacity:0; }
      40%  { opacity:1; }
      58%  { transform:perspective(500px) rotateY(-10deg) scale(1.06); }
      80%  { transform:perspective(500px) rotateY(4deg)   scale(1.01); }
      100% { transform:perspective(500px) rotateY(0deg)   scale(1);    opacity:1; }
    }
    .card-just-drawn { position:relative; animation:card-flip-in .5s cubic-bezier(.22,.68,0,1.2) forwards; }
    .card-just-drawn::after {
      content:''; position:absolute; inset:0; border-radius:inherit;
      pointer-events:none; z-index:10;
      animation:card-draw-flash .9s ease forwards;
    }
    .card.card-spectator { cursor:default; }

    /* ── A-2: Confirm wipe-out on play ── */
    @keyframes yb-clip-out {
      from { clip-path:inset(0 0% 0 0); opacity:1; }
      to   { clip-path:inset(0 100% 0 0); opacity:0; }
    }

    /* ── A-3: Screen shake ── */
    @keyframes yb-screen-shake {
      0%,100% { transform:translate(0,0); }
      10%     { transform:translate(-5px,2px); }
      20%     { transform:translate(5px,-2px); }
      35%     { transform:translate(-3px,3px); }
      50%     { transform:translate(3px,-2px); }
      65%     { transform:translate(-2px,2px); }
      80%     { transform:translate(2px,-1px); }
    }
    .screen-shake { animation:yb-screen-shake .42s cubic-bezier(.36,.07,.19,.97) both; }

    /* ── B-1: Card play-out ── */
    @keyframes card-play-out {
      0%   { transform:translateY(0) scale(1); opacity:1; }
      100% { transform:translateY(-56px) scale(.82); opacity:0; }
    }
    .card-play-out { animation:card-play-out .22s cubic-bezier(.4,0,.6,1) both; pointer-events:none; }

    /* ── B-2: Large damage red flash ── */
    @keyframes red-flash-anim { 0%,100%{opacity:0} 18%{opacity:1} }

    /* ── B-1: Your turn clip-path banner ── */
    @keyframes yb-turn-banner {
      0%   { clip-path:inset(0 100% 0 0); opacity:1; }
      30%  { clip-path:inset(0 0%   0 0); opacity:1; }
      72%  { clip-path:inset(0 0%   0 0); opacity:1; }
      100% { clip-path:inset(0 0%   0 0); opacity:0; }
    }
    .turn-banner {
      position:fixed; top:0; left:0; right:0;
      background:linear-gradient(90deg,rgba(250,42,78,.92) 0%,rgba(160,20,45,.7) 100%);
      color:#fff;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 22px 10px;
      font-family:'Roboto Condensed','Arial Narrow',sans-serif;
      font-weight:900; font-size:1.25rem; letter-spacing:.18em; text-transform:uppercase;
      z-index:9999; pointer-events:none;
      animation:yb-turn-banner 1.8s cubic-bezier(.86,0,.07,1) forwards;
    }

    /* ── B-2: Drop from top / clip from bottom ── */
    @keyframes yb-drop-from-top {
      from { transform:translateY(-100%); opacity:0; }
      to   { transform:translateY(0);     opacity:1; }
    }
    @keyframes yb-clip-from-bottom {
      from { clip-path:inset(100% 0 0 0); }
      to   { clip-path:inset(0    0 0 0); }
    }

    /* ── C-3: HP flicker when critical ── */
    @keyframes yb-flicker {
      0%,41%,43%,100% { opacity:1; }
      4%              { opacity:.88; }
      38%             { opacity:.35; }
      42%             { opacity:.9; }
    }
    .hp-text-warn { animation:yb-flicker 2.4s linear infinite; }

    /* ── D-2: Confirm drop-in ── */
    @keyframes yb-drop-in {
      from { opacity:0; transform:translateY(-44px) scale(.94); }
      to   { opacity:1; transform:translateY(0)     scale(1);   }
    }

    /* ── E-2: Zone border neon pulse when your turn ── */
    @keyframes zone-border-pulse {
      0%,100% { border-color:rgba(250,42,78,.35); }
      50%     { border-color:rgba(250,42,78,.8);  }
    }
    .player-zone.my-turn-active { animation:zone-border-pulse 2s ease-in-out infinite; }

    /* ═══════════════════════════════════════════════════
       GAME OVER / VICTORY SCREEN
    ═══════════════════════════════════════════════════ */
    .go-screen { gap: 0 !important; }

    /* ── Hero: full viewport ── */
    .go-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: -12px -12px 0;
      width: calc(100% + 24px);
    }

    /* Scrolling background text (same mechanism as lobby) */
    .go-hero-bg {
      position: absolute; inset: 0;
      display: flex;
      pointer-events: none; user-select: none;
      overflow: hidden;
    }
    .go-hero-bg-col { flex: 1; overflow: hidden; display: flex; justify-content: center; }
    .go-hero-bg-col-inner {
      writing-mode: vertical-rl;
      font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif;
      font-weight: 900;
      font-size: 13vh;
      letter-spacing: 0;
      white-space: nowrap;
      will-change: transform;
    }
    .go-victory .go-hero-bg-col-inner { color: rgba(210,153,34,.10); }
    .go-defeat  .go-hero-bg-col-inner { color: rgba(248,81,73,.08); }
    @keyframes go-scroll-up   { from{transform:translateY(0)} to{transform:translateY(-50%)} }
    @keyframes go-scroll-down { from{transform:translateY(-50%)} to{transform:translateY(0)} }
    .go-scroll-a { animation: go-scroll-up   32s linear infinite; }
    .go-scroll-b { animation: go-scroll-down 32s linear infinite; }

    /* Center content */
    .go-hero-content {
      position: relative; z-index: 1;
      text-align: center;
      display: flex; flex-direction: column;
      align-items: center; gap: 16px;
      padding: 0 24px;
    }

    /* Big title — VICTORY: clip-path reveal / GAME OVER: flash */
    @keyframes go-flash {
      0%   { opacity: 0; }
      10%  { opacity: 0.5; }
      15%  { opacity: 0.3; }
      40%  { opacity: 0.3; }
      50%  { opacity: 0.7; }
      55%  { opacity: 0.3; }
      60%  { opacity: 0.7; }
      65%  { opacity: 0.2; }
      70%  { opacity: 0.5; }
      100% { opacity: 1; }
    }
    @keyframes go-title-reveal {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0% 0 0); }
    }
    .go-big-title {
      font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif;
      font-weight: 900;
      font-size: min(20vw, 6.5rem);
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .go-victory .go-big-title { color: var(--yellow); text-shadow: 0 0 80px rgba(210,153,34,.5); clip-path: inset(0 100% 0 0); animation: go-title-reveal 0.75s cubic-bezier(0.86,0,0.07,1) 0.2s forwards; }
    .go-defeat  .go-big-title { color: var(--red);    text-shadow: 0 0 80px rgba(248,81,73,.4); opacity: 0; animation: go-flash 1.2s ease 0.1s forwards; }

    /* Subtitle (player name + win/lose) */
    .go-player-name {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 6vw, 2.2rem);
      color: var(--t1);
      opacity: 0;
      animation: yb-fadeInUp 0.5s cubic-bezier(0.23,1,0.32,1) 0.9s forwards;
    }
    .go-flavor-txt {
      font-size: clamp(0.82rem, 3.5vw, 0.95rem);
      color: var(--t1);
      opacity: 0;
      animation: yb-fadeInUp 0.5s cubic-bezier(0.23,1,0.32,1) 1.1s forwards;
      line-height: 1.9;
      text-align: center;
      white-space: nowrap;
    }

    /* SCROLL DOWN — YOASOBI fv-scroll pattern */
    .go-scroll-hint {
      position: absolute;
      left: 18px; bottom: 24px;
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      opacity: 0;
      animation: yb-fadeInUp 0.5s ease 1.6s forwards;
    }
    .go-scroll-txt {
      writing-mode: vertical-rl;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.16em;
      color: var(--t1);
      text-transform: uppercase;
    }
    .go-scroll-line {
      width: 1px; height: 48px;
      background: var(--bg3);
      overflow: hidden;
      position: relative;
    }
    .go-scroll-line span {
      display: block;
      position: absolute;
      left: 0; width: 100%; height: 100%;
    }
    .go-scroll-line span::before {
      content: '';
      display: block;
      width: 100%; height: 100%;
      background: #fa2a4e;
      animation: go-line 3s ease 0.5s infinite;
    }
    @keyframes go-line {
      0%   { transform:translateY(-100%); animation-timing-function:cubic-bezier(0.65,0.05,0.36,1); }
      30%  { transform:translateY(0); }
      70%  { transform:translateY(0); animation-timing-function:cubic-bezier(0.65,0.05,0.36,1); }
      90%  { transform:translateY(100%); }
      100% { transform:translateY(100%); }
    }

    /* ── Details (below hero, scroll target) ── */
    .go-details {
      padding: 48px 12px 72px;
      display: flex; flex-direction: column;
      gap: 20px;
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
    }
    .go-section-label {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 900; font-size: 1.1rem;
      letter-spacing: 0.15em;
      color: var(--t1); text-transform: uppercase;
      display: inline-block;
      border-bottom: 2px solid #fa2a4e;
      padding-bottom: 3px;
    }

    /* Stats table */
    .go-stats-table {
      background: var(--bg1);
      border: 1px solid var(--bg3);
      border-radius: 14px; overflow: hidden;
    }
    .go-stats-section-header {
      padding: 8px 16px;
      font-size: 0.88rem; font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--t1); background: var(--bg2);
      border-bottom: 1px solid var(--bg3);
      display: flex; align-items: center; gap: 6px;
    }
    .go-stats-row {
      display: flex; align-items: center;
      padding: 10px 16px; gap: 8px;
      border-bottom: 1px solid var(--bg3);
      font-size: 0.88rem;
    }
    .go-stats-row:last-child { border-bottom: none; }
    .go-stats-row-name { flex: 1; color: var(--t1); }
    .go-hp-alive { color:var(--green); font-weight:700; font-family:'Roboto Condensed',sans-serif; }
    .go-hp-dead  { color:var(--red);   font-weight:700; font-family:'Roboto Condensed',sans-serif; }

    /* Turns badge */
    .go-turns-badge {
      text-align: center; font-size: 0.82rem;
      color: var(--t1); padding: 12px;
      background: var(--bg2);
      border-radius: 10px; border: 1px solid var(--bg3);
    }
    .go-turns-badge strong {
      font-family: 'Roboto Condensed', sans-serif;
      color: var(--t1); font-size: 1.15rem;
    }

    /* Last-card highlight */
    .go-mvp-wrap {
      background: var(--bg1);
      border: 1px solid var(--bg3);
      border-radius: 14px; padding: 16px;
    }
    .go-mvp-label {
      font-size: 0.82rem; font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--t1); margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .go-mvp-card-row { display: flex; gap: 14px; align-items: flex-start; }
    .go-mvp-img { width: 72px; border-radius: 8px; flex-shrink: 0; }
    .go-mvp-info { flex: 1; }
    .go-mvp-name { font-weight: 700; font-size: 0.98rem; margin-bottom: 2px; }
    .go-mvp-type { font-size: 0.68rem; color: var(--t1); margin-bottom: 6px; }
    .go-mvp-desc { font-size: 0.78rem; color: var(--t1); line-height: 1.4; }

    /* Replay button — pill style (YOASOBI blue-btn / white-btn) */
    .go-replay-btn {
      width: 100%; padding: 14px 32px;
      border-radius: 40px; border: 2px solid;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; background: transparent;
      font-family: 'Roboto Condensed', sans-serif;
      letter-spacing: 0.06em; transition: 0.2s;
    }
    .go-victory .go-replay-btn { border-color:var(--yellow); color:var(--yellow); }
    .go-victory .go-replay-btn:hover { background:var(--yellow); color:#000; }

    /* ── 防災協定（Peek）画面：縦方向センタリング ── */

        height: 100%;

      .battle-layout {
        height: 100%;
        overflow: hidden;
        gap: 4px;
        padding-top: 4px;

      /* ── 3. ログ：モバイルバトル画面では非表示（ターンサマリーで代替） ── */
      .battle-layout .log-area,
      .screen.active > .log-area {
        display: none;
      }

      /* ── 4. 相手ゾーン：固定サイズ・コンパクト化 ── */
      .opponent-zone {
        flex-shrink: 0;
        padding: 8px 10px;
      }

      /* ── 5. ステータスバー・バナー類：縮まない ── */
      .state-banner,
      .status-bar,
      .auto-end-bar {
        flex-shrink: 0;
      }

      /* ── 6. プレイヤーゾーン：自ターン時はコンテンツ分だけ（コンパクト）、対応フェーズ時に拡張 ── */
      .player-zone {
        flex: 0 1 auto;   /* 自ターン：コンテンツ高さだけ使用、余白は枠外に */
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 8px 10px 4px;
      }
      /* 対応フェーズ：response-pending-bar のスペースを確保するために拡張 */
      .battle-layout.response-phase .player-zone {
        flex: 1;
      }

      /* ── 7. 手札エリア：自然高さ+縮小可能（flex:1 だと空白ができるため削除） ── */
      .player-zone .hand-cards-area {
        flex-shrink: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* ── 8a. ターン終了・自動終了：カードとの間にスペースを作り下部へ押し出す ── */
      .player-zone .action-bar,
      .player-zone .auto-end-bar {
        flex-shrink: 0;
        margin-top: auto;
        margin-bottom: 4px;
      }

      /* ── 8b. 対応フェーズバー：カードの直下に自然配置（下部に押し出すと見切れるため） ── */
      .player-zone .response-pending-bar {
        flex-shrink: 0;
        margin-top: 10px;
        margin-bottom: 4px;
        padding: 8px 10px;
        gap: 6px;
      }
      .player-zone .response-pending-bar .rpb-icon { font-size: 1.1rem; }
      .player-zone .response-pending-bar .rpb-text { font-size: .78rem; }

      /* ── 9. ハテナ(?)ボタン：プレイヤーゾーンのフレーム右下コーナーに重ねる ── */
      .hint-btn {
        right: calc(env(safe-area-inset-right, 0px) + 12px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      }
      .spec-invite-btn {
        right: calc(env(safe-area-inset-right, 0px) + 12px + 40px + 8px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      }

      /* ── 10. カードサイズ微調整 ── */
      :root {
        --card-h: 108px;
        --card-w: 76px;
      }

      /* ── 11. 相手手札バックカード：横スクロール化 ── */
      .hand-back-row {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
        gap: 5px;
        scrollbar-width: none;
      }
      .hand-back-row::-webkit-scrollbar { display: none; }
      .hand-back-row .card-back {
        flex-shrink: 0;
        width: 62px;
        height: 84px;
      }

      /* ── 12. ターンサマリー：タイトルを下方向にずらす ── */
      .turn-summary-box {
        padding-top: 36px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;

      /* ── 13. YOUR TURN バナー：ターンサマリータイトルと同じ高さに表示 ── */
      .turn-banner {
        top: calc(env(safe-area-inset-top, 0px) + 72px);
        padding: 10px 22px;
        border-radius: 0 0 8px 8px;
      }
    }
  </style>

    function _tl(label) {
      const s = label.replace(/[\s→←]+$/, '').replace(/^[\s→←]+/, '');
      if (s === '次へ') return '＞';
      if (s === '戻る') return '＜';
      return s + ' ＞';
    }
    function tutorialAction(action) {
      const ts = tutorialState; if (!ts) return;
      ts.skipWarning = false; ts.confirmCard = null;
      let _vfx = null;
      if (action === 'next')          { ts.feedback = null; ts.step++; }
      else if (action === 'play_dam')  { ts.usedUids.push('tu_dam'); ts.budgetUsed += 2; ts.shieldActive = true; ts.feedback = '✅ 堤防建設を設置！シールドバッジが表示されています。'; ts.step++; _vfx = 'dam'; }
      else if (action === 'play_drill'){ ts.usedUids.push('tu_drill'); ts.budgetUsed += 1; const prev = ts.playerHp; ts.playerHp = Math.min(60, prev + 20); ts.feedback = `✅ HP +20 回復！（${prev} → ${ts.playerHp}）`; ts.step++; _vfx = 'drill'; }
      else if (action === 'end_turn')  { ts.feedback = null; ts.step++; }
      else if (action === 'skip_attempt') { ts.skipWarning = true; }
      else if (action === 'respond')   { ts.usedUids.push('tu_agr'); ts.feedback = '✅ 洪水ダメージ 15 − 相互支援協定 +15 = 実ダメージ 0！'; ts.step++; _vfx = 'respond'; }
      else if (action === 'finish')    { _lobbyEnter = true; tutorialState = null; G.screen = 'lobby'; }
      else if (action === 'back') {
        const prev = ts.step - 1;
        if (prev >= 0 && TUT_STEP_STATES[prev]) {
          const s = TUT_STEP_STATES[prev];
          ts.step = prev; ts.playerHp = s.playerHp; ts.budgetUsed = s.budgetUsed;
          ts.shieldActive = s.shieldActive; ts.usedUids = [...s.usedUids];
          ts.feedback = null; ts.skipWarning = false; ts.cityPopup = null; ts.confirmCard = null;
        }
      }
      render();
      if (ts.step === 5) setTimeout(() => { const el = document.querySelector('.btn-end.tut-glow'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 150);
      if (_vfx === 'dam')    requestAnimationFrame(() => showTutNeonFlash('rgba(63,185,80,.32)'));
      else if (_vfx === 'drill')   requestAnimationFrame(() => { showTutNeonFlash('rgba(210,153,34,.32)'); showTutHPFloat('+20', 'var(--green)'); });
      else if (_vfx === 'respond') requestAnimationFrame(() => { showTutNeonFlash('rgba(56,139,253,.32)'); });
    }

    function showTutGate() {
      const g = document.createElement('div'); g.className = 'tut-gate';
      g.innerHTML = '<div class="tut-gate-l"></div><div class="tut-gate-r"></div>';
      document.body.appendChild(g); setTimeout(() => g.remove(), 720);
    }
    function showTutNeonFlash(color) {
      const el = document.createElement('div');
      el.style.cssText = `position:fixed;inset:0;background:radial-gradient(ellipse at center,${color} 0%,transparent 68%);pointer-events:none;z-index:8800;animation:neon-use-fade .45s ease-out forwards`;
      document.body.appendChild(el); setTimeout(() => el.remove(), 500);
    }
    function showTutHPFloat(text, color) {
      const sec = document.querySelector('.player-zone .hp-section');
      const el = document.createElement('div'); el.className = 'float-dmg';
      el.textContent = text; el.style.color = color;
      if (sec) { const r = sec.getBoundingClientRect(); el.style.left = (r.left + r.width * 0.45) + 'px'; el.style.top = (r.top - 4) + 'px'; }
      else { el.style.left = '50%'; el.style.top = '55%'; }
      document.body.appendChild(el); setTimeout(() => el.remove(), 1050);
    }
    function showTutZeroFlash() {
      const el = document.createElement('div');
      el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9100;pointer-events:none;animation:tut-zero-anim 1.8s cubic-bezier(.23,1,.32,1) forwards;width:min(300px,88vw)';
      el.innerHTML = '<div style="background:var(--bg2);border-radius:8px;padding:9px 13px;border-left:3px solid var(--green)"><div style="font-weight:700;font-size:.88rem;color:var(--green);margin-bottom:4px">堤防建設 — 完全軽減！</div><div style="font-size:.78rem;color:var(--t2)">洪水 15ダメージ → 堤防 −25 → 最終ダメージ <strong style="color:var(--green)">0</strong></div></div>';
      document.body.appendChild(el); setTimeout(() => el.remove(), 2000);
    }
    function tutorialShowCity(id) { if (tutorialState) { tutorialState.cityPopup = CITIES.find(c => c.id === id) || null; render(); } }
    function tutorialCloseCityPopup() { if (tutorialState) { tutorialState.cityPopup = null; render(); } }
    function tutorialShowConfirm(uid) { if (!tutorialState) return; const card = tutorialState.hand.find(c => c.uid === uid); if (card) { tutorialState.confirmCard = card; render(); } }
    function tutorialCancelConfirm() { if (tutorialState) { tutorialState.confirmCard = null; render(); } }
    function exitTutorial() { _lobbyEnter = true; tutorialState = null; G.screen = 'lobby'; render(); }

    function renderTutorial() {
      const ts = tutorialState; const step = TUT_STEPS[ts.step];
      const isPreBattle = ts.step <= 1;
      const isResp = (ts.step === 8); const isFinish = (ts.step === 10);
      const budgetLeft = 3 - ts.budgetUsed;

      // ── 共通：進捗ドット・戻るボタン ──
      const dots = TUT_STEPS.map((_, i) => `<div class="tut-dot" style="background:${i === ts.step ? 'var(--blue)' : i < ts.step ? 'var(--green)' : 'var(--bg3)'}"></div>`).join('');
      const stepCounter = `<span style="font-size:.72rem;color:var(--t1);font-weight:600">${ts.step + 1} / ${TUT_STEPS.length}</span>`;
      const backBtn = ts.step > 0 ? `<button class="sq-btn" style="font-size:.75rem;min-height:28px;padding:3px 10px" onclick="tutorialAction('back')">＜</button>` : '';
      const progressRow = `<div style="display:flex;align-items:center;gap:6px">${backBtn}<div class="tut-progress">${dots}</div>${stepCounter}</div>`;
      const lobbyBackBtn = `<button class="sq-btn" style="margin-top:4px;align-self:flex-start" onclick="exitTutorial()">＜ ロビーに戻る</button>`;

      // ── 前半：説明カード（ステップ 0-1）──
      if (isPreBattle) {
        return `<div class="screen active"><div style="display:flex;flex-direction:column;flex:1;padding:10px;overflow-y:auto;gap:10px">
          <div class="tut-guide" style="width:100%;gap:14px">
            <div class="tut-guide-title tut-anim-title" style="font-size:1rem">${step.title}</div>
            <div class="tut-guide-body tut-anim-body">${step.body}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
              ${progressRow}
              <button class="sq-btn" onclick="tutorialAction('${step.action}')">${_tl(step.btnLabel)}</button>
            </div>
          </div>
          ${lobbyBackBtn}
        </div></div>`;
      }

      // ── 結果確認画面（ステップ 9）──
      if (step.isResultSummary) {
        const cBad = 'display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:4px 11px;border-radius:12px;background:rgba(248,81,73,.12);color:var(--red);border:1px solid rgba(248,81,73,.28);white-space:nowrap';
        const cOk  = 'display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:4px 11px;border-radius:12px;background:rgba(63,185,80,.15);color:var(--green);border:1px solid rgba(63,185,80,.3);white-space:nowrap';
        const cYel = 'display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:4px 11px;border-radius:12px;background:rgba(227,179,65,.15);color:var(--yellow);border:1px solid rgba(227,179,65,.35);white-space:nowrap';
        const chips = `<span style="${cBad}">基礎 30</span><span style="${cBad}">海岸都市 +10</span><span style="${cOk}">堤防建設 −25</span><span style="${cYel}">相互支援協定 +15</span>`;
        return `<div class="screen active"><div class="turn-summary-box">
          <div class="ts-title">📋 仙台のターン — 対応結果</div>
          <div class="ts-events"><div class="ts-ev heal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-weight:700;font-size:.88rem;color:var(--t1)">🌧️ 洪水</div><div style="text-align:right;line-height:1"><span style="font-size:1.55rem;font-weight:900;color:var(--green)">0</span><span style="font-size:.68rem;font-weight:600;color:var(--green);margin-left:2px">ダメージ</span></div></div><div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:.7rem;color:var(--t3);margin-bottom:3px"><span>HP</span><span>60（変化なし）</span></div><div style="background:var(--bg3);border-radius:4px;height:7px;overflow:hidden;position:relative"><div style="position:absolute;left:0;top:0;height:100%;width:100%;background:var(--green);border-radius:4px"></div></div></div><div style="display:flex;flex-wrap:wrap;gap:4px">${chips}</div></div></div>
          <div style="text-align:center;margin-top:12px"><button class="btn-ho" onclick="tutorialAction('next')">確認 →</button></div>
        </div></div>`;
      }

      // ── 完了画面（ステップ 10）──
      if (isFinish) {
        const feedbackHtml = ts.feedback ? `<div style="background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.28);border-radius:8px;padding:10px 12px;font-size:.82rem;color:var(--green)">${ts.feedback}</div>` : '';
        return `<div class="screen active"><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:20px">
          <div class="tut-guide" style="max-width:480px;width:100%;gap:14px">
            <div style="font-size:2.2rem;text-align:center">🎉</div>
            <div class="tut-guide-title" style="font-size:1rem;text-align:center">${step.title}</div>
            ${feedbackHtml}
            <div class="tut-guide-body">${step.body}</div>
            <button class="sq-btn" style="width:100%;padding:12px;font-size:.9rem" onclick="tutorialAction('finish')">${_tl(step.btnLabel)}</button>
          </div>
        </div></div>`;
      }

      // ── ガイドボックス（バトル用）──
      const guideBtn = step.btnLabel ? `<button class="sq-btn tut-action-btn" onclick="tutorialAction('${step.action}')">${_tl(step.btnLabel)}</button>` : `<span style="font-size:.72rem;color:var(--t3)">↓ 光っているものをタップ</span>`;
      const feedbackLine = ts.feedback ? `<div style="background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.28);border-radius:8px;padding:8px 10px;font-size:.8rem;color:var(--green)">${ts.feedback}</div>` : '';
      const guideBox = `<div class="tut-guide">
        <div class="tut-guide-title">${step.title}</div>
        ${feedbackLine}
        <div class="tut-guide-body">${step.body}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          ${progressRow}
          ${guideBtn}
        </div>
      </div>`;

      // ── 相手ゾーン ──
      const isAttackActive = ts.step >= 6;
      const oppZone = `<div class="opponent-zone" style="border-left:3px solid var(--red)">
        <div class="zone-header"><span class="zone-label">相手</span><span class="city-icon-sm"><img src="images/icons/terrain_inland.webp" alt="" style="width:22px;height:22px;object-fit:contain"></span><button class="city-tap-btn${ts.step === 2 ? ' tut-pulse' : ''}" onclick="tutorialShowCity('tokyo')">東京 ⓘ</button><span class="terrain-badge">(内陸)</span></div>
        <div class="hp-section"><div class="hp-bar-wrap"><div class="hp-bar-fill" style="width:100%;background:var(--green)"></div></div><div class="hp-text" style="color:var(--green)">60/60</div></div>
        <div style="margin-top:4px">${isAttackActive ? `<div style="background:rgba(248,81,73,.15);border:1px solid rgba(248,81,73,.3);border-radius:6px;padding:4px 10px;font-size:.75rem;color:var(--red);display:inline-block">🌧️ 洪水 発動中</div>` : `<div class="hand-back-row">${Array(3).fill('<div class="card-back"><img src="images/cards/back.webp" alt=""></div>').join('')}</div>`}</div>
      </div>`;

      // ── 手札カード ──
      function mkTutCard(card) {
        const used = ts.usedUids.includes(card.uid); if (used) return '';
        const isGlow = step.highlight === card.id;
        const isDim = step.highlight !== null && !isGlow;
        const isDimSoft = ts.step === 2;
        const oc = `onclick="tutorialShowConfirm('${card.uid}')"`;
        return `<div class="card policy${isGlow ? ' tut-glow' : ''}${isDim ? ' tut-dim' : isDimSoft ? ' tut-dim-soft' : ''}" data-ctype="${cardCtype(card)}" style="cursor:pointer" ${oc}>
          <div class="card-header"><span class="card-icon">${card.icon}</span><span class="card-cost">${isResp ? '無料' : card.cost}</span></div>
          <div class="card-img-wrap"><img class="card-img" src="images/cards/${card.id}.webp" alt="" onerror="this.closest('.card').classList.add('img-fail')"><div class="card-name-bar">${card.name}</div></div>
          <div class="card-name card-text-fallback">${card.name}</div><div class="card-desc card-text-fallback">${card.desc}</div>
          <span class="card-type-badge">${isResp ? '対応可' : card.color === 'green' ? 'シールド' : '即時'}</span>
        </div>`;
      }
      const visibleHand = ts.hand.filter(c => !ts.usedUids.includes(c.uid));
      const handHtml = visibleHand.length > 0
        ? `<div class="hand-groups"><div class="hand-group"><div class="hand-group-label policy-label">${isResp ? '政策（対応可）' : '政策'}</div><div class="hand-group-cards">${visibleHand.map(mkTutCard).join('')}</div></div></div>`
        : `<div style="color:var(--t3);font-size:.82rem;padding:8px">手札なし</div>`;

      // ── ステータスバー・バッジ・アクションバー ──
      const statusBar = (ts.step >= 2 && ts.step <= 5) ? `<div class="status-bar"><span class="turn-badge" style="color:#e6edf3">チュートリアル | あなたのターン</span><div class="budget-display"><span class="budget-label" style="color:#e6edf3">予算</span><div class="budget-pips">${Array(3).fill(0).map((_,i)=>`<div class="pip ${i<ts.budgetUsed?'used':'avail'}"></div>`).join('')}</div><span style="font-size:.8rem;font-weight:700;color:var(--green)">${budgetLeft}<span style="color:var(--t3);font-weight:400">/3</span></span></div></div>` : '';
      const shieldBadge = ts.shieldActive ? `<div style="background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.25);border-radius:6px;padding:3px 8px;font-size:.72rem;color:var(--green);display:inline-block">🌊 堤防設置中 -25</div>` : '';
      const skipWarn = ts.skipWarning ? `<div style="background:rgba(210,153,34,.15);border:1px solid rgba(210,153,34,.3);border-radius:6px;padding:5px 10px;font-size:.75rem;color:var(--yellow);margin-top:6px">⚠️ まず上のカードをタップして対応を試してみましょう！</div>` : '';
      const respBar = isResp ? `<div class="response-pending-bar tut-resp-anim"><div class="rpb-icon">⚠️</div><div class="rpb-text"><strong>東京が「🌧️ 洪水」を使用！</strong><br>想定ダメージ: 40 → 堤防 -25 → 実ダメージ <strong>15</strong><br>政策カードを選んで対応するか「対応しない」を押してください。${skipWarn}</div><button class="btn-skip-resp" onclick="tutorialAction('skip_attempt')">対応しない</button></div>` : '';
      const actionBar = step.action === 'end_turn' ? `<div class="action-bar"><button class="btn-end tut-glow" onclick="tutorialAction('end_turn')">ターン終了 →</button></div>` : (ts.step >= 2 && ts.step <= 4) ? `<div class="action-bar"><button class="btn-end" style="opacity:.3;pointer-events:none">ターン終了 →</button></div>` : '';

      // ── プレイヤーゾーン ──
      const hpColor = ts.playerHp > 30 ? 'var(--green)' : ts.playerHp > 10 ? 'var(--yellow)' : 'var(--red)';
      const playerZone = `<div class="player-zone" style="border-left:3px solid var(--green)">
        <div class="zone-header"><span class="zone-label">${isResp ? 'あなた（対応中）' : 'あなた'}</span><span class="city-icon-sm"><img src="images/icons/terrain_coastal.webp" alt="" style="width:22px;height:22px;object-fit:contain"></span><button class="city-tap-btn${ts.step === 2 ? ' tut-pulse' : ''}" onclick="tutorialShowCity('sendai')">仙台 ⓘ</button><span class="terrain-badge">(海岸)</span></div>
        <div class="hp-section"><div class="hp-bar-wrap"><div class="hp-bar-fill" style="width:${ts.playerHp/60*100}%;background:${hpColor}"></div></div><div class="hp-text" style="color:${hpColor}">${ts.playerHp}/60</div></div>
        <div style="margin-top:4px;min-height:24px">${shieldBadge}</div>
        <div class="hand-cards-area">${handHtml}</div>
        ${isResp ? respBar : actionBar}
      </div>`;

      // ── 都市情報ポップアップ ──
      let cityOverlay = '';
      if (ts.cityPopup) {
        const cy = ts.cityPopup;
        const terrain = cy.isCoastal ? '海岸都市' : cy.isMountain ? '山間部都市' : '内陸都市';
        const terrainNote = cy.isCoastal ? '洪水・津波で +10ダメージ' : cy.isMountain ? '土砂崩れで +10ダメージ' : '地震で +10ダメージ';
        cityOverlay = `<div class="confirm-overlay" onclick="tutorialCloseCityPopup()"><div class="confirm-box" onclick="event.stopPropagation()" style="max-width:300px;max-height:85vh;overflow-y:auto;padding:16px 20px;gap:10px">
          <img src="images/cities/${cy.id}.webp" alt="" style="width:100%;object-fit:contain;border-radius:10px;display:block" onerror="this.style.display='none'">
          <div class="confirm-card-preview"><span>${terrainImg(cy, 20)} ${cy.name}</span></div>
          <div style="background:rgba(56,139,253,.1);border-radius:6px;padding:6px 10px;font-size:.78rem;color:var(--t2);margin:4px 0">
            <div style="color:var(--blue);font-weight:700;margin-bottom:2px">地形：${terrain}</div>
            <div>${terrainNote}</div>
          </div>
          <div style="background:rgba(63,185,80,.1);border-radius:6px;padding:6px 10px;font-size:.78rem;color:var(--t2);margin:4px 0">
            <div style="color:var(--green);font-weight:700;margin-bottom:2px">都市能力</div>
            <div>${cy.abilityDesc}</div>
          </div>
          <div class="confirm-btns" style="margin-top:10px"><button class="btn-cancel" style="width:100%" onclick="tutorialCloseCityPopup()">閉じる</button></div>

      }

      // ── カード確認モーダル ──
      let cardOverlay = '';
      if (ts.confirmCard) {
        const card = ts.confirmCard;
        const isTargetCard = step.highlight === card.id;
        const typeLabel = card.color === 'green' ? 'シールド型政策' : '即時型政策';
        const effectNote = card.color === 'green'
          ? `<div style="background:rgba(63,185,80,.1);border-radius:6px;padding:5px 10px;font-size:.78rem;color:var(--t2);margin:4px 0"><span style="color:var(--green);font-weight:700">設置型：</span>使用後も効果が持続します</div>`
          : `<div style="background:rgba(210,153,34,.1);border-radius:6px;padding:5px 10px;font-size:.78rem;color:var(--t2);margin:4px 0"><span style="color:var(--yellow);font-weight:700">即時型：</span>タップした瞬間に効果発動</div>`;
        const actionBtns = isTargetCard
          ? `<div class="confirm-btns"><button class="btn-ok" onclick="tutorialAction('${step.action}')">使用する</button><button class="btn-cancel" onclick="tutorialCancelConfirm()">キャンセル</button></div>`
          : `<div class="confirm-btns"><button class="btn-cancel" style="width:100%" onclick="tutorialCancelConfirm()">閉じる</button></div>`;
        cardOverlay = `<div class="confirm-overlay" onclick="tutorialCancelConfirm()"><div class="confirm-box" onclick="event.stopPropagation()">
          <img class="confirm-card-img" src="images/cards/${card.id}.webp" alt="" onerror="this.style.display='none'">
          <div class="confirm-card-preview" style="display:flex;align-items:center;gap:6px">${cardTypeIconHtml(card.type, card.color)}<span>${card.name}</span></div>
          <div style="font-size:.72rem;color:var(--blue);text-align:center;margin:-4px 0 4px">${typeLabel}　コスト ${isResp ? '無料（対応）' : card.cost + 'pt'}</div>
          <div style="background:rgba(139,148,158,.08);border-radius:6px;padding:5px 10px;font-size:.8rem;color:var(--t2);text-align:center;margin:4px 0">${card.desc}</div>
          ${effectNote}
          ${!isTargetCard ? `<div style="font-size:.72rem;color:var(--t3);text-align:center;margin-top:4px">今はこのカードを使う手順ではありません</div>` : ''}
          ${actionBtns}
        </div></div>`;
      }

      return `<div class="screen active"><div class="battle-layout">
        ${guideBox}${oppZone}${statusBar}${playerZone}
        ${lobbyBackBtn}
      </div>${cityOverlay}${cardOverlay}</div>`;
    }

    // ═══════════════════════════════════════
    // DATA
    // ═══════════════════════════════════════
    const CITIES = [

      { id: 'new_orleans', name: 'ニューオーリンズ', icon: '🎷', hp: 60, isCoastal: true, isMountain: false, abilityType: 'vulnerability_draw', abilityValue: 10, abilityDesc: '手札≤2枚のとき +10被害・1枚ドロー', concept: '社会的脆弱性と地域の底力。打たれるほどに立ち上がるコミュニティの力。', learn: '2005年ハリケーン・カトリーナで被害が社会的弱者に集中したことが「社会的脆弱性」概念を世界に知らしめた。手札が少ない（準備不足の）状態でさらに被害が増える。' },

    const POLICY_CARDS = [

      { id: 'dam', name: '堤防建設', icon: '🌊', cost: 2, type: 'policy', color: 'green', effectType: 'shield_flood', value: 25, desc: '次の洪水・津波 −25', realConcept: '洪水・津波に対するハード対策（治水インフラ）。物理的に水害を防ぐ構造物への投資で、効果は確実だが規模の上限がある。' },

      { id: 'hazard_map', name: 'ハザードマップ整備', icon: '🗺️', cost: 1, type: 'policy', color: 'yellow', effectType: 'draw', value: 2, desc: '山札から2枚ドロー', realConcept: 'リスク情報の整備が対応選択肢（手札）を広げる。「情報は備えの前提」という防災情報整備の本質を2枚ドローで表現。' },

      { id: 'bousai_cho', name: '防災庁設置', icon: '🏛️', cost: 3, type: 'policy', color: 'green', effectType: 'damage_reduce_2t', value: 15, desc: '全ダメージ −15（2回）', realConcept: '包括的な防災組織・制度的基盤の整備（日本では2025年に設置）。2回分のダメージ軽減という持続型効果が、制度投資の長期的な価値を示す。' },
      { id: 'pact', name: '防災協定', icon: '📋', cost: 1, type: 'policy', color: 'yellow', effectType: 'peek_all', value: 0, desc: '相手の手札を全公開＋任意で手札1枚を捨てられる', realConcept: '自治体・企業間の防災情報共有体制。相手の手札を知る（情報収集）ことが効果的な備えの前提になることを示す。' },
    ];

    const DISASTER_CARDS = [
      { id: 'earthquake', name: '地震', icon: '🌍', cost: 2, type: 'disaster', baseDamage: 30, specialType: 'inland_bonus', desc: '30（内陸都市 +10）', columnTitle: 'リスク ＝ ハザード × 曝露 × 脆弱性', column: '内陸都市に追加ダメージ+10（曝露の違い）。東京は都市能力で軽減（対策の違い）、ニューオーリンズは手札不足でさらに被害増（脆弱性の違い）。同じ災害カード1枚で、「被害はなぜ都市によって異なるのか」を体験できる。' },
      { id: 'flood', name: '洪水', icon: '🌧️', cost: 2, type: 'disaster', baseDamage: 30, specialType: 'coastal_bonus', desc: '30（海岸都市 +10）', columnTitle: '防災の哲学は一つではない', column: '海岸都市に追加ダメージ+10。ロッテルダム（水と共存するオランダ哲学）もニューオーリンズ（社会的脆弱性が被害を拡大）も同じ海岸都市だが、防災への向き合い方は全く異なる。日本の都市だけでは体感できない「防災の多様性」がここに詰まっている。' },
      { id: 'typhoon', name: '台風', icon: '🌀', cost: 2, type: 'disaster', baseDamage: 20, specialType: 'discard_policy', desc: '20+相手の手札1枚を捨てる', columnTitle: 'ソフト対策の重要性', column: '手札1枚をランダムで廃棄し、どんな備えも突然失われることを示す。1枚のカードに頼らず複数を積み重ねること、そして広域避難指示のようなソフト対策（行動計画）の価値を実感できる。' },
      { id: 'tsunami', name: '津波', icon: '🌊', cost: 3, type: 'disaster', baseDamage: 40, specialType: 'coastal_bonus', desc: '40（海岸都市 +10）', columnTitle: '知識と行動の両立', column: '初期手札に政策2枚・災害2枚が保証されているのは偶然ではない。「どんな脅威があるか知ること（災害カード）」と「それに備えること（政策カード）」の両方がなければ防災は機能しない。知識だけでも行動だけでも不十分という防災の本質。' },
      { id: 'landslide', name: '土砂崩れ', icon: '⛰️', cost: 1, type: 'disaster', baseDamage: 20, specialType: 'mountain_bonus', desc: '20（山間部 +10）', columnTitle: null, column: null },
      { id: 'wildfire', name: '大火災', icon: '🔥', cost: 3, type: 'disaster', baseDamage: 50, specialType: null, desc: 'ダメージ 50', columnTitle: '事前投資の費用対効果', column: '最大ダメージ50のカードに対し、コスト2の耐震補強を事前設置すれば大幅に軽減できる。コスト2の政策でコスト3の災害を防ぐ「事前投資の費用対効果」を最もはっきり体験できる場面。' },
      { id: 'compound', name: '複合災害', icon: '⚡', cost: 3, type: 'disaster', baseDamage: 40, specialType: 'skip_response', desc: '40+相手の対応フェーズを1回強制スキップ（事前の広域避難指示で無効化可能）', columnTitle: '複合・連鎖災害の恐ろしさ', column: '相手は対応フェーズを強制スキップされ、政策カードを使う機会を奪われる。2011年東日本大震災の地震→津波→原発事故の連鎖が示すように、複合災害は「備えが追いつかない状況」を生み出す。ただし事前に広域避難指示を設置していれば無効化でき、ソフト対策の重要性を体験できる。' },
    ];
    const ALL_CARDS = [...POLICY_CARDS, ...DISASTER_CARDS];

    // 災害カード → 効果的な対抗政策カード（カード図鑑誘導用）
    const COUNTER_MAP = {
      'earthquake': ['quake_wall', 'bousai_cho'],
      'flood':      ['dam', 'evacuation'],
      'tsunami':    ['dam', 'evacuation'],
      'typhoon':    ['evacuation', 'bousai_cho'],
      'landslide':  ['bousai_cho', 'quake_wall'],
      'wildfire':   ['quake_wall', 'bousai_cho'],
      'compound':   ['evacuation', 'bousai_cho'],
    };

    // ═══════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════
    const mkEffects = () => ({
      shieldQuakeFire: false, shieldFlood: false, negateSpecial: false,
      damageReduceHits: 0,
      disastersReceivedThisTurn: 0, quakeHitThisTurn: false, floodBonusTurns: 0,
    });

    let G = {
      screen: 'lobby', activePlayer: 0, turnsEach: [0, 0],
      players: [
        { name: 'プレイヤー1', cities: [], cityHps: [], activeCityIdx: 0, hand: [], budgetUsed: 0, effects: mkEffects() },
        { name: 'プレイヤー2', cities: [], cityHps: [], activeCityIdx: 0, hand: [], budgetUsed: 0, effects: mkEffects() },
      ],
      deck: [], discard: [], log: [],
      pendingAttack: null, peekCard: null, peekByPlayerIdx: null, winner: null,
      gachaPickedIds: [], gachaCurrent: null, draftState: null,
      discardNeeded: null, confirm: null, turnDrawState: null, cityOrderState: null,
      _nextTurnEvents: { 0: [], 1: [] }, _turnSummary: null, _gameHistory: [],
    };

    // ═══════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════
    function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    function createDeck() { const d = []; for (const c of ALL_CARDS) for (let i = 0; i < 3; i++)d.push({ ...c, uid: c.id + '_' + i }); return shuffle(d); }
    function getActiveCity(pi) { const p = G.players[pi]; return p.cities[p.activeCityIdx]; }
    function getActiveCityHp(pi) { const p = G.players[pi]; return p.cityHps[p.activeCityIdx]; }
    function getActiveMaxHp(pi) { return G.players[pi].cities[G.players[pi].activeCityIdx].hp; }
    function getBudget(pi) { const p = G.players[pi]; const c = getActiveCity(pi); let b = 3; if (c && c.abilityType === 'extra_budget') b += c.abilityValue; if (c && c.abilityType === 'flood_budget' && p.effects.floodBonusTurns > 0) b += c.abilityValue; return b; }
    function getBudgetLeft(pi) { return getBudget(pi) - G.players[pi].budgetUsed; }
    function getEffectiveCostToAttack(card, pi) { return card.cost; }
    function addLog(msg, cls = '') {
      let finalCls = cls;
      if (msg.includes('壊滅')) finalCls = (cls ? cls + ' critical' : 'critical');
      if (cls === 'sys' && msg.startsWith('───')) {
        G.log.unshift({ msg: '─ ─ ─', cls: 'divider' });
      }
      G.log.unshift({ msg, cls: finalCls });
      if (G.log.length > 40) G.log.length = 40;
    }
    function hpColor(hp, max) { const r = hp / max; if (r > 0.6) return '#3fb950'; if (r > 0.3) return '#d29922'; return '#f85149'; }
    function cardCtype(card) {
      if (card.type === 'disaster') return 'disaster';
      return card.color === 'green' ? 'shield' : 'instant';
    }
    function terrainImg(city, size) {
      const sz = size || 22;
      const src = city.isCoastal ? 'images/icons/terrain_coastal.webp' : city.isMountain ? 'images/icons/terrain_mountain.webp' : 'images/icons/terrain_inland.webp';
      return `<img src="${src}" alt="" style="width:${sz}px;height:${sz}px;object-fit:contain;vertical-align:middle;display:inline-block">`;
    }

    function drawCards(pi, n) {
      const p = G.players[pi];
      for (let i = 0; i < n; i++) {
        if (G.deck.length === 0) { if (G.discard.length === 0) break; G.deck = shuffle([...G.discard]); G.discard = []; addLog('山札をシャッフルしました', 'sys'); }
        if (p.hand.some(c => c.id === 'pact')) {
          const altIdx = G.deck.findIndex(c => c.id !== 'pact');
          if (altIdx > 0) G.deck.unshift(...G.deck.splice(altIdx, 1));
        }
        p.hand.push(G.deck.shift());
      }
    }
    function autoDiscard(pi) { const p = G.players[pi]; while (p.hand.length > 5) { const d = p.hand.pop(); G.discard.push(d); addLog(`📤 ${p.name}の手札超過：自動で1枚捨てた`, 'sys'); } }
    function handleDiscardIfNeeded(pi, returnTo) {
      if (G.players[pi].hand.length > 5) { G.discardNeeded = { pi, returnTo }; G.screen = 'discard'; pushState(); render(); return true; }
      return false;
    }
    function computeEstDmg(card, defIdx) {
      const d = getActiveCity(defIdx); let e = card.baseDamage;
      if (card.specialType === 'coastal_bonus' && d && d.isCoastal) e += 10;
      else if (card.specialType === 'mountain_bonus' && d && d.isMountain) e += 10;
      else if (card.specialType === 'inland_bonus' && d && !d.isCoastal && !d.isMountain) e += 10;
      return e;
    }
    // 防御側が把握できる全要素を込みにした精度の高い予測ダメージ（対応フェーズ用）
    function computeFullDefenderEst(attackCard, defIdx, forceNegate) {
      const def = G.players[defIdx]; const defCity = getActiveCity(defIdx);
      let e = attackCard.baseDamage;
      const negated = forceNegate || def.effects.negateSpecial;
      if (negated) { e -= 10; }
      else {
        if (attackCard.specialType === 'coastal_bonus' && defCity && defCity.isCoastal) e += 10;
        else if (attackCard.specialType === 'mountain_bonus' && defCity && defCity.isMountain) e += 10;
        else if (attackCard.specialType === 'inland_bonus' && defCity && !defCity.isCoastal && !defCity.isMountain) e += 10;
      }
      if (defCity) {
        if (defCity.abilityType === 'resist_compound' && attackCard.id === 'compound') e -= defCity.abilityValue;
        if (defCity.abilityType === 'resist_quake_fire' && (attackCard.id === 'earthquake' || attackCard.id === 'wildfire')) e -= defCity.abilityValue;
        if (defCity.abilityType === 'resist_landslide' && attackCard.id === 'landslide') e -= defCity.abilityValue;
        if (defCity.abilityType === 'resist_flood' && (attackCard.id === 'flood' || attackCard.id === 'tsunami')) e -= defCity.abilityValue;
        if (defCity.abilityType === 'second_hit_reduce' && def.effects.disastersReceivedThisTurn >= 1) e -= defCity.abilityValue;
      }
      if (def.effects.damageReduceHits > 0) e -= 15;
      if (def.effects.shieldQuakeFire && (attackCard.id === 'earthquake' || attackCard.id === 'wildfire')) e -= 30;
      if (def.effects.shieldFlood && (attackCard.id === 'flood' || attackCard.id === 'tsunami')) e -= 25;
      if (defCity && defCity.abilityType === 'vulnerability_draw' && def.hand.length <= 2) e += defCity.abilityValue;
      return Math.max(0, e);
    }
    // 対応カードを使った場合の推定ダメージ（④HP予測用）
    function computeResponseEst(atkCard, defIdx, responseCard) {
      const def = G.players[defIdx]; const defCity = getActiveCity(defIdx);
      let e = atkCard.baseDamage;
      let specialNegated = def.effects.negateSpecial;
      if (specialNegated) e -= 10;
      if (!specialNegated && responseCard && responseCard.effectType === 'negate_special') { specialNegated = true; e -= 10; }
      if (!specialNegated && atkCard.specialType) {
        if (atkCard.specialType === 'coastal_bonus' && defCity && defCity.isCoastal) e += 10;
        else if (atkCard.specialType === 'mountain_bonus' && defCity && defCity.isMountain) e += 10;
        else if (atkCard.specialType === 'inland_bonus' && defCity && !defCity.isCoastal && !defCity.isMountain) e += 10;
      }
      if (defCity) {
        if (defCity.abilityType === 'resist_compound' && atkCard.id === 'compound') e -= defCity.abilityValue;
        if (defCity.abilityType === 'resist_quake_fire' && (atkCard.id === 'earthquake' || atkCard.id === 'wildfire')) e -= defCity.abilityValue;
        if (defCity.abilityType === 'resist_landslide' && atkCard.id === 'landslide') e -= defCity.abilityValue;

    // 対応バーのダメージ内訳を生成（①ダメージ内訳表示用）

        if (defCity.abilityType === 'resist_quake_fire' && (atkCard.id === 'earthquake' || atkCard.id === 'wildfire')) { mods.push({label:'都市',delta:-defCity.abilityValue}); e -= defCity.abilityValue; }
        if (defCity.abilityType === 'resist_landslide' && atkCard.id === 'landslide') { mods.push({label:'都市',delta:-defCity.abilityValue}); e -= defCity.abilityValue; }
        if (defCity.abilityType === 'resist_flood' && (atkCard.id === 'flood' || atkCard.id === 'tsunami')) { mods.push({label:'都市',delta:-defCity.abilityValue}); e -= defCity.abilityValue; }

      }

    // ─── online版checkWin: 即時都市切り替え ───

    // ═══════════════════════════════════════
    // DAMAGE RESOLUTION
    // ═══════════════════════════════════════
    function resolveDamage(attackCard, defIdx, responseCard) {

      const fromHp = def.cityHps[def.activeCityIdx]; let dmg = attackCard.baseDamage; const log = [];

        if (attackCard.specialType === 'mountain_bonus' && defCity && defCity.isMountain) { dmg += 10; ld('exposure', '山間部都市（地形リスク：土砂崩れへの曝露）', +10); }
        if (attackCard.specialType === 'inland_bonus' && defCity && !defCity.isCoastal && !defCity.isMountain) { dmg += 10; ld('exposure', '内陸都市（地形リスク：地震への曝露）', +10); }

          else ld('special', '台風：手札なし（効果なし）', null);

      }

        if (defCity.abilityType === 'resist_quake_fire' && (attackCard.id === 'earthquake' || attackCard.id === 'wildfire')) { dmg -= defCity.abilityValue; ld('city_policy', `${defCity.name}の都市対策：地震・大火災軽減（防災投資）`, -defCity.abilityValue); }
        if (defCity.abilityType === 'resist_landslide' && attackCard.id === 'landslide') { dmg -= defCity.abilityValue; ld('city_policy', `${defCity.name}の都市対策：土砂崩れ軽減（防災投資）`, -defCity.abilityValue); }
        if (defCity.abilityType === 'resist_flood' && (attackCard.id === 'flood' || attackCard.id === 'tsunami')) { dmg -= defCity.abilityValue; ld('city_policy', `${defCity.name}の都市対策：洪水・津波軽減（防災投資）`, -defCity.abilityValue); }

    // ═══════════════════════════════════════

    function pullGacha() {
      const gc = G.gachaCurrent;

      if (isCpuMode && gc.playerIdx === 0 && cpuDifficulty !== 'hard') {
        const n = cpuDifficulty === 'easy' ? 3 : 2;
        gc.candidates = shuffle([...rem]).slice(0, Math.min(n, rem.length));
        gc.revealed = null;
        pushState(); render();
      } else {
        // Random mode (online or CPU HARD): animated reveal
        const city = rem[Math.random() * rem.length | 0];
        _startCityReveal(city);
      }
    }

      acceptGachaCity();

    async function cleanupOldRooms() {
      if (!db) return;
      const EXPIRE_MS = 3 * 60 * 60 * 1000; // 3時間
      const cutoff = Date.now() - EXPIRE_MS;
      try {
        const snap = await db.ref('rooms').once('value');
        const rooms = snap.val();
        if (!rooms) return;
        const deletes = [];
        for (const [id, room] of Object.entries(rooms)) {
          const lastActive = room.lastActiveAt || room.createdAt || 0;
          if (lastActive < cutoff) deletes.push(db.ref(`rooms/${id}`).remove());
        }
        await Promise.all(deletes);
      } catch (e) {}
    }
