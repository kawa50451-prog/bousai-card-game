    // ─── 手札描画（対応フェーズ） ───
    function renderResponseHand(p, atkCard) {
      if (p.hand.length === 0) return `<div style="color:var(--t3);font-size:.85rem;padding:10px">手札なし</div>`;
      const mi = myPlayerIdx;
      const curHp = getActiveCityHp(mi);
      function mkCard(card) {
        const dis = card.type !== 'policy';
        // ③ シールドカードのディム：使っても0軽減になるカードを視覚的に減退させる
        const ineff = !dis && atkCard && (
          (card.effectType === 'shield_quake_fire' && atkCard.id !== 'earthquake' && atkCard.id !== 'wildfire') ||
          (card.effectType === 'shield_flood' && atkCard.id !== 'flood' && atkCard.id !== 'tsunami')
        );
        const oc = dis ? '' : `requestConfirm('playResponseCard','${card.uid}','${card.name.replace(/'/g, "\\'")}','${card.icon}','${card.type}','対応に使用')`;
        const _isPlaying = card.uid === _playingCardUid;
        // ④ カードごとのHP予測をバッジに表示
        const hpBand = (!dis && atkCard) ? `<div class="card-hp-band" style="white-space:nowrap">予測HP<strong>${Math.max(0, curHp - computeResponseEst(atkCard, mi, card))}</strong></div>` : '';

      }
      const pols = p.hand.filter(c => c.type === 'policy').sort((a, b) => a.cost - b.cost);
      const dis = p.hand.filter(c => c.type === 'disaster').sort((a, b) => a.cost - b.cost);

      if (jin.length > 0) s.push(`<div class="hand-group"><div class="hand-group-label jinzai-label">人為災害（使用不可）</div><div class="hand-group-cards">${jin.map(mkCard).join('')}</div></div>`);
      return `<div class="hand-groups">${s.join('')}</div>`;
    }

    // ─── メインゲーム（自分が常に下ゾーン） ───
    function renderMain(isResponsePhase) {

      const budget = getBudget(ap), left = getBudgetLeft(ap);

      const stateBanner = !amIHolder ? `<div class="state-banner ${isResponsePhase ? 'state-banner-response' : 'state-banner-waiting'}">${isResponsePhase ? '⚠️ 相手が対応フェーズを処理中...' : `<strong>${G.players[ap].name}</strong> のターン進行中...`}</div>` : '';

          const _breakHtml = `<div class="rdp-breakdown">推定 <b>${_rpbBreak.total}</b>ダメージ${_rpbBreak.mods.length ? `<span style="font-size:.68rem;color:var(--t3);margin-left:5px">基礎${_rpbBreak.base} ${_modStr}</span>` : ''}</div>`;
          const _specialLabels = { 'discard_policy': '特殊効果：手札を1枚ランダム廃棄', 'coastal_bonus': '特殊効果：海岸・沿岸都市に +10', 'mountain_bonus': '特殊効果：山間部都市に +10', 'inland_bonus': '特殊効果：内陸都市に +10' };
          const _specialLabel = _rpbAtk.card.specialType ? (_specialLabels[_rpbAtk.card.specialType] || '') : '';
          const _specialSpan = _specialLabel ? `<span class="rdp-item rdp-special">${_specialLabel}</span>` : '';
          const _dmgPreview = `<div class="response-dmg-preview"><span class="rdp-item rdp-skip">対応なし → HP <strong>${_rpbHpAfter}</strong></span>${_specialSpan}</div>`;
          pendingBar = `<div class="response-pending-bar"><div class="rpb-icon">⚠️</div><div class="rpb-text"><strong>${G.players[_rpbAtk.attackerIdx].name}が「${_rpbAtk.card.icon} ${_rpbAtk.card.name}」を使用！</strong>${_breakHtml}${_dmgPreview}</div><button class="btn-skip-resp" onclick="skipResponse()">対応しない</button></div>`;
        } else if (isMyAttack) {
          const _atk = G.pendingAttack;
          const _defHasNegate = G.players[_atk.defenderIdx].effects.negateSpecial;
          if (_atk.card.specialType === 'skip_response' && !_defHasNegate) {
            pendingBar = `<div class="response-pending-bar"><div class="rpb-icon">⚡</div><div class="rpb-text"><strong>「${_atk.card.icon} ${_atk.card.name}」を宣言！</strong><br>複合災害：${G.players[_atk.defenderIdx].name}の対応フェーズを強制スキップ中...</div></div>`;
            if (!G._pendingAutoHandover) { G._pendingAutoHandover = true; setTimeout(() => { G._pendingAutoHandover = false; goResponseHandover(); }, 700); }
          } else if (_atk.card.specialType === 'skip_response' && _defHasNegate) {
            pendingBar = `<div class="response-pending-bar"><div class="rpb-icon">⚡</div><div class="rpb-text"><strong>「${_atk.card.icon} ${_atk.card.name}」を宣言！</strong><br>広域避難指示が有効 — 対応フェーズへ移行中...</div></div>`;
            if (!G._pendingAutoHandover) { G._pendingAutoHandover = true; setTimeout(() => { G._pendingAutoHandover = false; goResponseHandover(); }, 700); }
          } else {
            pendingBar = `<div class="response-pending-bar"><div class="rpb-icon">⚔️</div><div class="rpb-text"><strong>「${_atk.card.icon} ${_atk.card.name}」を宣言！</strong><br>${G.players[_atk.defenderIdx].name}の対応フェーズへ移行中...</div></div>`;
            if (!G._pendingAutoHandover) { G._pendingAutoHandover = true; setTimeout(() => { G._pendingAutoHandover = false; goResponseHandover(); }, 700); }
          }
        }
      }

      const logAll = G.log.slice(0, 30).map(l => `<div class="log-entry ${l.cls}">${l.msg}</div>`).join('');
      const toggleBtn = G.log.length > 3 ? `<button class="log-toggle" onclick="_logExpanded=!_logExpanded;render()">${_logExpanded ? '▲ 閉じる' : `▼ ${Math.min(G.log.length, 30)}件すべて表示`}</button>` : '';
      let statusBar = '';
      if (ap === mi && !hasPending && !isResponsePhase) {
        statusBar = `<div class="status-bar"><span class="turn-badge">ターン ${G.turnsEach[ap] + 1} | ${G.players[ap].name}</span>
      <div class="budget-display"><span class="budget-label">予算</span><div class="budget-pips">${Array(budget).fill(0).map((_, i) => `<div class="pip ${i < (budget - left) ? 'used' : 'avail'}"></div>`).join('')}</div><span style="font-size:.8rem;font-weight:700;color:var(--green)">${left}<span style="color:var(--t2);font-weight:400">/${budget}</span></span></div>
      </div>`;
      }

      const isFirstTurn = (ap === mi && G.turnsEach[0] === 0);
      // 自動ターン終了判定
      function canPlayAnyCard() {
        if (hasPending || isResponsePhase) return true;
        const p = G.players[ap]; if (ap !== mi) return true;
        const bl = getBudgetLeft(ap);
        return p.hand.some(c => {
          if (c.cost > bl) return false;
          if (isFirstTurn && c.type === 'disaster') return false;
          return true;
        });
      }
      const shouldAutoEnd = (ap === mi && !hasPending && !isResponsePhase && !canPlayAnyCard());

      function renderZone(idx, position, footer = '') {
        const p = G.players[idx]; const c = getActiveCity(idx); const hp = getActiveCityHp(idx); const mxHp = getActiveMaxHp(idx);
        const isHolder = (idx === deviceHolder); const isMe = (idx === mi);
        const label = isMe ? (isResponsePhase ? 'あなた（対応中）' : 'あなた') : (isHolder ? '相手（操作中）' : '相手（待機中）');

        const isMyActive = isMe && ap === mi && !hasPending && !isResponsePhase;
        return `<div class="${position}-zone${isMyActive ? " my-turn-active" : ""}" style="${bdr}">
      <div class="zone-header"><span class="zone-label">${label}</span><span class="city-icon-sm">${c ? terrainImg(c) : ''}</span><button class="city-tap-btn" onclick="showCityInfo(${idx})">${c ? c.name : '?'} ⓘ</button>${terrainLabel}</div>
      <div class="hp-section" id="hp-section-${idx}"><div class="hp-bar-wrap"><div class="hp-bar-ghost" id="hp-ghost-${idx}" style="width:${_cityEnterAnimPi === idx ? 0 : Math.max(0, hp / mxHp * 100)}%"></div><div class="hp-bar-fill${hp <= 10 ? ' hp-warn' : ''}" id="hp-fill-${idx}" style="width:${_cityEnterAnimPi === idx ? 0 : Math.max(0, hp / mxHp * 100)}%;background:${hpColor(hp, mxHp)}"></div></div><div class="hp-text" id="hp-text-${idx}" style="color:${hpColor(hp, mxHp)}">${Math.max(0, hp)}/${mxHp}</div>${hp <= 10 ? '<span class="hp-critical-badge">⚠️ 壊滅寸前</span>' : hp <= 30 ? '<span class="hp-danger-badge">危険</span>' : ''}</div>

      }

      // レイアウト: 相手ゾーン → ログ → ステータスバー → pendingBar/ターン終了 → 自分ゾーン

      if (shouldAutoEnd) {

        if (!G._autoEndScheduled) { G._autoEndScheduled = true; setTimeout(() => { G._autoEndScheduled = false; endTurn(); }, 2500); }
      } else if (hasPending) {
        actionBar = pendingBar;

      }

      return `<div class="screen active"><div class="battle-layout${isResponsePhase ? ' response-phase' : ''}">
    ${stateBanner}
    ${renderZone(oi, 'opponent')}
    <div class="log-area${_logExpanded ? '' : ' log-collapsed'}" id="log-area">${logAll || '<div class="log-entry sys">ゲーム開始</div>'}${toggleBtn}</div>
    ${statusBar}
    ${renderZone(mi, 'player', actionBar)}
  </div></div>`;
    }

    function cardTypeIconHtml(type, color, size) {
      size = size || 24;
      let src;
      if (type === 'policy') src = color === 'green' ? 'images/icons/icon_policy_green.webp' : 'images/icons/icon_policy_yellow.webp';
      else if (type === 'disaster') src = 'images/icons/icon_disaster.webp';

    // ─── 確認モーダル ───
    function renderConfirmModal() {
      const c = G.confirm;
      if (c.fn === 'endTurn') {
        const left = getBudgetLeft(G.activePlayer);
        return `<div class="confirm-overlay" onclick="cancelConfirm()"><div class="confirm-box" onclick="event.stopPropagation()">
          <div style="text-align:center;margin-bottom:8px"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:44px;height:44px"><circle cx="12" cy="12" r="9"/><path d="M9 7l3 4 3-4M9 11h6M9 14h6M12 11v6"/></svg></div>
          <div class="confirm-card-preview"><strong>予算 ${left}pt が残っています</strong></div>
          <p>本当にターンを終了しますか？</p>
          <div class="confirm-btns"><button class="btn-ok" onclick="confirmWithAnim()">終了する</button><button class="btn-cancel" onclick="cancelConfirm()">キャンセル</button></div>
        </div></div>`;
      }
      const tl = c.cardType === 'policy' ? '政策カード' : c.cardType === 'disaster' ? '自然災害カード' : c.cardType === 'jinzai' ? '人為災害カード' : 'カード';
      let hint = '';
      if (c.cardType === 'jinzai' && c.fn === 'playCard') {
        const card = G.players[G.activePlayer].hand.find(cd => cd.uid === c.uid);
        let jh = '';
        if (card?.id === 'pollution') { const defIdx = G.activePlayer === 0 ? 1 : 0; const n = getActiveShields(G.players[defIdx]).length; jh = n > 0 ? `相手のシールド ${n} 個から1つを選んで破壊` : '相手にシールドがないため効果なし（空振り）'; }
        else if (card?.id === 'terror') { const defIdx = G.activePlayer === 0 ? 1 : 0; jh = G.players[defIdx].effects.negateSpecial ? '相手は広域避難指示を設置済み → 無効化される' : '次に使う災害への対応フェーズを封じる'; }
        else if (card?.id === 'rumor') {
          jh = '次のターン、相手の予算が1減少する';
          // デマ拡散（コスト1）使用後の残り予算で、手札の自然災害カードを今ターンに打てるか確認
          const me = G.players[G.activePlayer];
          const remAfter = getBudgetLeft(G.activePlayer) - 1;
          const nat = me.hand.filter(cd => cd.type === 'disaster');
          if (nat.length > 0) {
            const minCost = Math.min(...nat.map(cd => cd.cost));
            if (remAfter < minCost) {
              jh += `<br><span style="color:var(--red);font-weight:700"><img src="images/icons/neon_jinzai.webp" alt="" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;margin-right:3px;filter:drop-shadow(0 0 4px rgba(168,85,247,.85)) drop-shadow(0 0 2px rgba(168,85,247,1))">使用後の残り予算 ${Math.max(0, remAfter)}pt では、手札の自然災害カード（最小 ${minCost}pt）を今ターンに使えません</span>`;
            }
          }
        }
        if (jh) hint = `<div style="margin:4px 0;padding:6px 10px;background:rgba(168,85,247,.14);border-radius:6px;font-size:.8rem;color:var(--t2);text-align:center">${jh}</div>`;
      }
      if (c.cardType === 'disaster' && c.fn === 'playCard') {
        const defIdx = G.activePlayer === 0 ? 1 : 0; const defCity = getActiveCity(defIdx); const card = G.players[G.activePlayer].hand.find(cd => cd.uid === c.uid);
        if (card && defCity && card.baseDamage) {
          const base = card.baseDamage; let bonus = 0; let bl = '';
          if (card.specialType === 'coastal_bonus' && defCity.isCoastal) { bonus = 10; bl = `${defCity.name}（海岸）`; }
          else if (card.specialType === 'mountain_bonus' && defCity.isMountain) { bonus = 10; bl = `${defCity.name}（山間部）`; }
          else if (card.specialType === 'inland_bonus' && !defCity.isCoastal && !defCity.isMountain) { bonus = 10; bl = `${defCity.name}（内陸）`; }
          if (bonus > 0) hint = `<div style="margin:4px 0;padding:6px 10px;background:rgba(248,81,73,.12);border-radius:6px;font-size:.8rem;text-align:center">基礎 <strong>${base}</strong> + <strong style="color:var(--red)">+${bonus}</strong> = <strong style="color:var(--red)">${base + bonus}</strong> ダメージ<br><span style="color:var(--t3);font-size:.7rem">${bl}に有効</span></div>`;
          else hint = `<div style="margin:4px 0;padding:5px 10px;background:rgba(139,148,158,.1);border-radius:6px;font-size:.8rem;color:var(--t2);text-align:center">基礎ダメージ <strong style="color:var(--t1)">${base}</strong></div>`;

      if (c.cardType === 'policy') {

        if (card) {
          const p = G.players[pi]; const curHp = p.cityHps[p.activeCityIdx]; const mxHp = getActiveMaxHp(pi); let h = '';
          if (c.fn === 'playResponseCard' && G.pendingAttack) {
            // 対応フェーズ：防御側が把握できる全要素を込みにした予測
            const atk = G.pendingAttack.card; const est = computeFullDefenderEst(atk, pi);
            if (card.effectType === 'heal') { const healResp = Math.floor(card.value / 2); h = `HP +${healResp} 回復（対応時半減）`; }
            else if (card.effectType === 'shield_quake_fire') { if (atk.id === 'earthquake' || atk.id === 'wildfire') { h = `この攻撃に適用：−30 → 予測ダメージ <strong style="color:var(--green)">${Math.max(0, est - 30)}</strong>`; } else { h = 'この攻撃には不適用（次の地震・大火災に −30 設置）'; } }
            else if (card.effectType === 'shield_flood') { if (atk.id === 'flood' || atk.id === 'tsunami') { h = `この攻撃に適用：−25 → 予測ダメージ <strong style="color:var(--green)">${Math.max(0, est - 25)}</strong>`; } else { h = 'この攻撃には不適用（次の洪水・津波に −25 設置）'; } }
            else if (card.effectType === 'negate_special') { const withN = computeFullDefenderEst(atk, pi, true); h = `特殊効果を無効＋ダメージ−10 → 予測ダメージ <strong style="color:var(--green)">${withN}</strong>`; }

            else if (card.effectType === 'shield_quake_fire') { if (G.pendingAttack && (G.pendingAttack.card.id === 'earthquake' || G.pendingAttack.card.id === 'wildfire')) { const e = computeEstDmg(G.pendingAttack.card, pi); h = `この攻撃に適用：−30 → 予測 <strong style="color:var(--green)">${Math.max(0, e - 30)}</strong>`; } else h = '次の地震・大火災を −30（シールド設置）'; }
            else if (card.effectType === 'shield_flood') { if (G.pendingAttack && (G.pendingAttack.card.id === 'flood' || G.pendingAttack.card.id === 'tsunami')) { const e = computeEstDmg(G.pendingAttack.card, pi); h = `この攻撃に適用：−25 → 予測 <strong style="color:var(--green)">${Math.max(0, e - 25)}</strong>`; } else h = '次の洪水・津波を −25（シールド設置）'; }

            else if (card.effectType === 'damage_reduce_2t') { if (G.pendingAttack) { const e = computeEstDmg(G.pendingAttack.card, pi); h = `全ダメージ −15（次2回）→ 予測 <strong style="color:var(--green)">${Math.max(0, e - 15)}</strong>`; } else h = '全ダメージ −15（次2回の攻撃）'; }

      const _ccard = G.players[_cpi]?.hand.find(cd => cd.uid === c.uid);
      const _cIcon = cardTypeIconHtml(c.cardType, _ccard?.color);
      return `<div class="confirm-overlay" onclick="cancelConfirm()"><div class="confirm-box" onclick="event.stopPropagation()">
    <img class="confirm-card-img" src="images/cards/${cardId}.webp" alt="" onerror="this.style.display='none'">

    <div class="confirm-btns"><button class="btn-ok${c.danger ? ' danger' : ''}" onclick="confirmWithAnim()">はい</button><button class="btn-cancel" onclick="cancelConfirm()">キャンセル</button></div>
  </div></div>`;
    }

    // ─── 捨て札選択 ───
    function renderDiscard() {
      const dn = G.discardNeeded; const pi = dn.pi ?? dn.playerIdx; const p = G.players[pi]; const excess = p.hand.length - 5;
      const cards = p.hand.map(card => `<div class="card ${card.type}" onclick="requestConfirm('discardCard','${card.uid}','${card.name.replace(/'/g, "\\'")}','${card.icon}','${card.type}','捨て札にする',true)" style="cursor:pointer"><div class="card-header"><span class="card-icon">${card.icon}</span><span class="card-cost">${card.cost}</span></div><div class="card-img-wrap"><img class="card-img" src="images/cards/${card.id}.webp" alt="" onerror="this.closest('.card').classList.add('img-fail')"><div class="card-name-bar">${card.name}</div></div><div class="card-name card-text-fallback">${card.name}</div><div class="card-desc card-text-fallback">${card.desc}</div><span class="card-type-badge">${card.type === 'policy' ? '政策' : card.type === 'jinzai' ? '人為' : '自然'}</span></div>`).join('');
      return `<div class="screen active"><div class="section-title">📤 ${p.name} — 捨てるカードを選んでください</div>
    <div class="discard-info">手札が上限（5枚）を超えています。<strong style="color:var(--red)">${excess}枚</strong>を捨ててください。<br><span style="font-size:.75rem;color:var(--t3)">カードをクリックすると捨て札になります</span></div>
    <div style="font-size:.8rem;color:var(--t2);text-align:center">現在の手札：<strong style="color:var(--yellow)">${p.hand.length}枚</strong>　→　目標：5枚</div>
    <div class="discard-cards">${cards}</div></div>`;
    }

    // ─── ターン開始ドロー ───
    function renderTurnDraw() {
      const ts = G.turnDrawState; const pi = ts.pi ?? ts.playerIdx; const p = G.players[pi];
      const pips = Array(ts.target).fill(0).map((_, i) => { const cls = i < ts.drawn ? 'done' : i === ts.drawn ? 'current' : ''; return `<div class="draft-pip ${cls}"></div>`; }).join('');
      let ca = '';
      if (!ts.revealed) { ca = `<div class="gacha-card-reveal-area" onclick="pullTurnCard()"><img src="images/cards/back.webp" alt=""></div><button class="btn-gacha" onclick="pullTurnCard()">🃏 カードを引く！</button>`; }
      else { const c = ts.revealed; ca = `<div class="gacha-card-reveal-area revealed gacha-reveal"><img src="images/cards/${c.id}.webp" alt="" onerror="this.style.opacity='.3'"></div><button class="btn-accept" onclick="acceptTurnCard()">✅ 手札に加える</button>`; }
      const titleLabel = ts.isHazardMap ? 'ハザードマップ整備' : 'ターン開始ドロー';
      return `<div class="screen active"><div class="section-title" style="margin-bottom:0">${p.name}｜${titleLabel} <span style="font-size:.7rem;font-weight:400;color:var(--t2)">${ts.drawn + 1}／${ts.target}枚</span></div>
    <div class="draft-progress"><div><span style="font-size:.8rem;color:var(--t1)">ドロー </span><strong style="color:var(--yellow)">${ts.drawn} / ${ts.target}</strong><span style="font-size:.8rem;color:var(--t1)"> 枚</span></div><div class="draft-pips">${pips}</div></div>
    <div class="gacha-stage">${ca}</div></div>`;
    }

    // ─── 初期ドラフト ───
    function renderDraft() {
      const ds = G.draftState; const p = G.players[ds.playerIdx];
      if (!ds.dealtCards || !ds.dealtCards.length) return `<div class="screen active"><div style="text-align:center;padding:40px;color:var(--t2);font-size:.9rem">読み込み中…</div></div>`;
      const allFlipped = ds.flippedUids.length >= ds.picksTarget;

      // Reveal overlay (full-screen, fixed position)
      const revealOverlay = (() => {
        const rc = ds.revealingCard;
        if (!rc) return '';
        const neonSrc = rc.type === 'disaster' ? 'neon_disaster.webp'
          : rc.type === 'jinzai' ? 'neon_jinzai.webp'
          : rc.color === 'green' ? 'neon_policy_shield.webp'
          : 'neon_policy_instant.webp';
        if (ds.animState === 'revealing_neon') {
          return `<div class="draft-reveal-overlay">
            <div class="draft-neon-bg">
              <img class="draft-neon-icon-pos" id="drni-0" src="images/icons/${neonSrc}" alt="" style="top:50%;left:50%;transform:translate(-50%,-50%);width:min(55vw,180px);filter:brightness(0.04)">
            </div>
          </div>`;
        }
        if (ds.animState === 'revealing_card') {
          return `<div class="draft-reveal-overlay">
            <div class="draft-large-card">
              <img src="images/cards/${rc.id}.webp" alt="" onerror="this.style.opacity='.3'">
              <div class="draft-large-flash"></div>
              <div class="draft-card-label">${cardTypeIconHtml(rc.type, rc.color, 22)}<span>${rc.name}</span></div>
            </div>
          </div>`;
        }
        if (ds.animState === 'card_paused') {
          return `<div class="draft-reveal-overlay">
            <div class="draft-large-card" style="animation:none">
              <img src="images/cards/${rc.id}.webp" alt="" onerror="this.style.opacity='.3'">
              <div class="draft-card-label">${cardTypeIconHtml(rc.type, rc.color, 22)}<span>${rc.name}</span></div>
            </div>
            <button class="draft-advance-btn" onclick="advanceDraftCard()">›</button>
          </div>`;
        }
        if (ds.animState === 'card_exiting') {
          return `<div class="draft-reveal-overlay">
            <div class="draft-large-card exiting">
              <img src="images/cards/${rc.id}.webp" alt="" onerror="this.style.opacity='.3'">
              <div class="draft-card-label">${cardTypeIconHtml(rc.type, rc.color, 22)}<span>${rc.name}</span></div>
            </div>
          </div>`;
        }
        return '';
      })();

      // Stack (remaining face-down cards)
      const unflipped = ds.dealtCards.filter(c => !ds.flippedUids.includes(c.uid));
      const stackHtml = unflipped.length ? (() => {
        const cards = unflipped.map((c, i) => {
          const isTop = i === 0;
          const offset = i * 6; // 0, 6, 12, 18 px — deeper cards shift right+down
          const br = (1 - i * 0.16).toFixed(2); // brightness: 1.0, 0.84, 0.68, 0.52
          return `<div class="draft-stack-card${isTop ? ' top-card' : ''}"
            data-draft-uid="${c.uid}"
            style="top:${offset}px;left:${offset}px;z-index:${unflipped.length - i};filter:brightness(${br})"
            ${isTop ? `onclick="flipDraftCard('${c.uid}')"` : ''}>
            <img src="images/cards/back.webp" alt="">
            ${isTop && !allFlipped ? '<div class="draft-tap-hint-overlay">タップして開封</div>' : ''}
          </div>`;
        }).join('');
        return `<div class="draft-stack-wrap">${cards}</div><div class="draft-tap-text">カードをタップしよう</div>`;
      })() : (() => {
        const ordered = [
          ...ds.dealtCards.filter(c => c.type === 'disaster'),
          ...ds.dealtCards.filter(c => c.type === 'policy'),
          ...ds.dealtCards.filter(c => c.type === 'jinzai'),
        ];
        return `<div class="draft-all-revealed">${ordered.map((c, i) =>
          `<div class="draft-all-card" style="animation-delay:${i * 85}ms"><img src="images/cards/${c.id}.webp" alt="" onerror="this.style.opacity='.3'"></div>`
        ).join('')}</div>`;
      })();

      // Thumbnails (revealed cards, small)
      const flipped = ds.dealtCards.filter(c => ds.flippedUids.includes(c.uid));
      const thumbsHtml = flipped.map(c => {
        const isNew = c.uid === ds.lastFlippedUid;
        return `<div class="draft-thumb-card" style="${isNew ? '' : 'animation:none'}">
          <img src="images/cards/${c.id}.webp" alt="" onerror="this.style.opacity='.3'">
        </div>`;
      }).join('');

      const flipAllBtn = (allFlipped || _draftAnimBusy) ? '' : `<button id="draft-flip-all-btn" class="btn-flip-all" onclick="flipAllDraftCards()">一括開封</button>`;
      const confirmBtn = allFlipped
        ? `<button class="btn-ho draft-confirm-appear" onclick="finalizeAllDraftCards()" style="padding:13px 44px;font-size:1rem">✅ 手札を確定する</button>`
        : '';

      return `<div class="screen active" style="gap:6px;height:calc(100dvh - 24px);max-height:calc(100dvh - 24px);overflow:hidden">${revealOverlay}
        <div class="section-title" style="margin-bottom:0">${p.name}｜初期手札のドロー <span style="font-size:.7rem;font-weight:400;color:var(--t2)">${ds.flippedUids.length}／${ds.picksTarget}枚</span></div>
        <div class="draft-stack-area">
          ${stackHtml}
        </div>
        ${allFlipped ? '' : `<div class="draft-thumb-row">${thumbsHtml}</div>`}
        <div class="draft-actions">${flipAllBtn}${confirmBtn}</div>
      </div>`;
    }

    // ─── 防災協定（全公開＋任意捨て） ───
    function renderPeek() {
      const pi = G.peekByPlayerIdx ?? G.activePlayer;
      const oppCards = G.peekCards || (G.peekCard ? [G.peekCard] : []);
      const cardTile = (c, tappable) => {
        const ct = cardCtype(c);
        const borderColor = ct === 'disaster' ? 'var(--red)' : ct === 'shield' ? 'var(--green)' : ct === 'jinzai' ? '#c084fc' : 'var(--yellow)';
        return `<div class="peek-card-big" style="flex-shrink:0;border-color:${borderColor}${tappable ? ';cursor:pointer;opacity:.95' : ''}"${tappable ? ` onclick="peekDiscard('${c.uid}')"` : ''}>
          <img src="images/cards/${c.id}.webp" style="width:72px;border-radius:6px" alt="" onerror="this.style.display='none'">
          <div class="pk-icon">${cardTypeIconHtml(c.type, c.color, 32)}</div><div class="pk-name">${c.name}</div>
          <div class="pk-cost" style="color:${borderColor}">コスト: ${c.cost}</div>
          <div class="pk-desc">${c.desc}</div>
          ${tappable ? `<div style="margin-top:6px;font-size:.73rem;color:var(--red);font-weight:700">タップで捨てる</div>` : ''}</div>`;
      };
      const rowStyle = 'display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:8px;padding:6px 12px 12px;justify-content:flex-start';
      const sectionLabel = (text, color) => `<div style="text-align:center;padding:8px 12px 2px;color:${color};font-size:.85rem;font-weight:700">${text}</div>`;
      const divider = `<div style="height:1px;background:rgba(255,255,255,.25);margin:4px 16px 8px"></div>`;
      const oppSection = `${sectionLabel(`相手の手札一覧（${oppCards.length}枚）`, 'var(--t1)')}<div class="peek-card-display" style="${rowStyle}">${oppCards.map(c => cardTile(c, false)).join('')}</div>`;

      if (_peekDiscardMode) {
        const myHand = G.players[pi].hand;
        let mySection;
        if (myHand.length === 0) {
          mySection = `<div style="text-align:center;color:var(--t2);font-size:.85rem;padding:8px">捨てられる手札がありません</div>
            <div style="text-align:center;margin-top:8px"><button class="btn-ho" onclick="closePeek()" style="font-size:.9rem">閉じる</button></div>`;
        } else {
          mySection = `${sectionLabel('自分の手札一覧 — 捨てる1枚を選択', 'var(--yellow)')}
            <div style="${rowStyle}">${myHand.map(c => cardTile(c, true)).join('')}</div>
            <div style="text-align:center"><button class="btn-ho" onclick="closePeek()" style="font-size:.9rem">やめる（捨てない）</button></div>`;
        }
        return `<div class="screen active"><div class="peek-wrap">${oppSection}${divider}${mySection}</div></div>`;
      }

      const actionHtml = `<div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap">
          <button class="btn-ho" onclick="startPeekDiscard()" style="font-size:.9rem;border-color:var(--red);color:var(--red);background:rgba(248,81,73,.12)">📤 手札を1枚捨てる</button>
          <button class="btn-ho" onclick="closePeek()" style="font-size:.9rem">スキップ（捨てない）</button>
        </div>`;
      return `<div class="screen active"><div class="peek-wrap">${oppSection}${actionHtml}</div></div>`;
    }

    function startPeekDiscard() { _peekDiscardMode = true; render(); }

    function peekDiscard(uid) {
      const pi = G.peekByPlayerIdx ?? G.activePlayer;
      const p = G.players[pi];
      const idx = p.hand.findIndex(c => c.uid === uid);
      if (idx === -1) return;
      const card = p.hand.splice(idx, 1)[0];
      G.discard.push(card);
      addLog(`📤 ${p.name}が防災協定で手札1枚を捨てた（${card.icon} ${card.name}）`, 'sys');
      closePeek();
    }

    // ─── 公害（破壊する相手シールドの選択） ───
    function renderPollution() {
      const pp = G.pendingPollution; const atkIdx = pp?.attackerIdx ?? G.activePlayer; const defIdx = atkIdx === 0 ? 1 : 0;
      const def = G.players[defIdx];
      const shields = getActiveShields(def);
      const header = `<div style="text-align:center;padding:12px 12px 0"><img src="images/icons/neon_jinzai.webp" alt="" style="width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(168,85,247,.85)) drop-shadow(0 0 3px rgba(168,85,247,1))"></div>
    <div style="text-align:center;padding:4px 12px 2px;color:#c084fc;font-size:.92rem;font-weight:700">☣️ 公害：破壊する相手のシールドを選択</div>`;
      if (shields.length === 0) { return `<div class="screen active"><div class="peek-wrap">${header}<div style="text-align:center;padding:24px;color:var(--t2)">破壊できるシールドがありません</div><div style="text-align:center"><button class="btn-ho" onclick="destroyPollutionShield('none')">閉じる</button></div></div></div>`; }
      const tiles = shields.map(s => {

        return `<div class="peek-card-big" style="flex-shrink:0;border-color:var(--green);cursor:pointer;opacity:.95" onclick="destroyPollutionShield('${s.key}')">
        <img src="images/cards/${s.cardId}.webp" style="width:72px;border-radius:6px" alt="" onerror="this.style.display='none'">
        <div class="pk-icon">${cardTypeIconHtml(pc ? pc.type : 'policy', pc ? pc.color : 'green', 32)}</div><div class="pk-name">${name}</div>
        <div class="pk-cost" style="color:var(--green)">${s.desc}</div>
        ${remain}
        <div style="margin-top:6px;font-size:.73rem;color:#c084fc;font-weight:700">タップで破壊</div>
      </div>`;
      }).join('');
      return `<div class="screen active"><div class="peek-wrap">
    ${header}
    <div style="text-align:center;color:var(--t2);font-size:.78rem;margin-bottom:4px">${def.name} が設置中のシールド（${shields.length}個）</div>
    <div class="peek-card-display" style="display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:8px;padding:8px 12px 16px;justify-content:flex-start">${tiles}</div>
  </div></div>`;
    }

    // ─── ターンサマリー ───
    function _buildTurnSummaryItems(events) {
      const cBad='display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:4px 11px;border-radius:12px;background:rgba(248,81,73,.12);color:var(--red);border:1px solid rgba(248,81,73,.28);white-space:nowrap';
      const cOk='display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:4px 11px;border-radius:12px;background:rgba(63,185,80,.15);color:var(--green);border:1px solid rgba(63,185,80,.3);white-space:nowrap';
      const cYel='display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:4px 11px;border-radius:12px;background:rgba(227,179,65,.15);color:var(--yellow);border:1px solid rgba(227,179,65,.35);white-space:nowrap';
      const chipLbl=(d)=>{const t=d.text||'';if(d.cat==='city_policy'||d.cat==='city_effect'){const cm=t.match(/^(.+?)の都市/);const am=t.match(/：(.+?)（/);return cm&&am?`${cm[1]} ${am[1]}`:cm?cm[1]:t.split(/[（：]/)[0].trim();}return t.split(/[（：]/)[0].trim();};
      return events.map(ev => {
        if (ev.type === 'damage') {
          const details=ev.details||[];
          const baseChip=ev.baseDamage!=null?`<span style="${cBad}">基礎 ${ev.baseDamage}</span>`:'';
          const atkChips=details.filter(d=>typeof d==='object'&&d.cat&&d.delta>0).map(d=>`<span style="${cBad}">${chipLbl(d)} +${d.delta}</span>`).join('');
          const defChips=details.filter(d=>typeof d==='object'&&d.cat&&d.delta<0).map(d=>`<span style="${cOk}">${chipLbl(d)} ${d.delta}</span>`).join('');
          const healChip=ev.healAmount>0?`<span style="${cYel}">${ev.healCardName} +${ev.healAmount}</span>`:'';
          const chipsHtml=baseChip+atkChips+defChips+healChip;
          const isBlock=ev.damage===0;const dmgCol=isBlock?'var(--green)':'var(--red)';
          const hpBefore=ev.hpBefore??60;const hpAfterDmg=ev.hpAfterDamage??hpBefore;
          const pR=Math.max(0,Math.min(100,Math.round(hpAfterDmg/60*100)));
          const pD=isBlock?0:Math.max(0,Math.min(100-pR,Math.round(ev.damage/60*100)));
          const noChange=isBlock&&!ev.healAmount;
          const hpLabel=noChange?`${hpBefore}（変化なし）`:`${hpBefore} → ${hpAfterDmg}`;
          return `<div class="ts-ev ${isBlock?'heal':'damage'}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-weight:700;font-size:.88rem;color:var(--t1)">${ev.cardIcon} ${ev.cardName}</div><div style="text-align:right;line-height:1"><span style="font-size:1.55rem;font-weight:900;color:${dmgCol}">${ev.damage}</span><span style="font-size:.68rem;font-weight:600;color:${dmgCol};margin-left:2px">ダメージ</span></div></div><div style="margin-bottom:${chipsHtml?'6px':'2px'}"><div style="display:flex;justify-content:space-between;font-size:.7rem;color:#fff;margin-bottom:3px"><span>HP</span><span>${hpLabel}</span></div><div style="background:var(--bg3);border-radius:4px;height:7px;overflow:hidden;position:relative"><div style="position:absolute;left:0;top:0;height:100%;width:${pR}%;background:var(--green);border-radius:4px 0 0 4px"></div><div style="position:absolute;left:${pR}%;top:0;height:100%;width:${pD}%;background:rgba(248,81,73,0.75)"></div></div></div>${chipsHtml?`<div style="display:flex;flex-wrap:wrap;gap:4px">${chipsHtml}</div>`:''}</div>`;
        }
        if (ev.type === 'disaster_agency_remaining') { if (ev.remaining === 0) return `<div class="ts-ev warn"><div class="ts-ev-title">🏛️ 防災庁設置の効果が終了しました</div><div class="ts-ev-detail">次の攻撃からは全ダメージ −15 の軽減はありません</div></div>`; return `<div class="ts-ev warn"><div class="ts-ev-title">🏛️ 防災庁設置：残り ${ev.remaining} 回</div><div class="ts-ev-detail">あと ${ev.remaining} 回の被攻撃まで全ダメージ −15</div></div>`; }
        if (ev.type === 'response_skipped') return `<div class="ts-ev warn" style="border-color:var(--red)"><div class="ts-ev-title">${ev.byTerror ? '💣 テロ攻撃' : '⚡ 複合災害'}：対応フェーズがスキップされました</div><div class="ts-ev-detail">${ev.cityName ? `「${ev.cityName}」` : '相手'}は政策カードを使用できませんでした</div></div>`;
        if (ev.type === 'rumor_debt') return `<div class="ts-ev warn" style="border-color:#c084fc"><div class="ts-ev-title">📱 デマ拡散の影響：このターン予算 −1</div><div class="ts-ev-detail">情報の混乱で使えるコストが1減っています</div></div>`;
        if (ev.type === 'pollution_broken') return `<div class="ts-ev warn" style="border-color:#c084fc"><div class="ts-ev-title">☣️ 公害：${ev.shieldName}が破壊されました</div><div class="ts-ev-detail">設置していたシールドが人為災害で無効化されました</div></div>`;
        if (ev.type === 'opp_regen') return `<div class="ts-ev heal"><div class="ts-ev-title">💚 ${ev.cityIcon} ${ev.cityName}：HP +${ev.amount} 回復</div><div class="ts-ev-detail">HP ${ev.hpBefore} → ${ev.hpAfter}</div></div>`;
        if (ev.type === 'flood_budget') return `<div class="ts-ev budget"><div class="ts-ev-title">💧 ${ev.cityIcon} ${ev.cityName}：今ターン予算 +${ev.bonusAmt ?? 1}</div><div class="ts-ev-detail">洪水・津波後の復旧ボーナス（このターン有効）</div></div>`;
        if (ev.type === 'typhoon_discard') return `<div class="ts-ev typhoon" style="border-color:var(--yellow);border-width:2px;background:rgba(227,179,65,.1)"><div class="ts-ev-title" style="font-size:1.1rem">🌀 台風の特殊効果！</div><div style="margin:6px 0;padding:7px 10px;background:rgba(248,81,73,.1);border-radius:6px;border:1px solid rgba(248,81,73,.3);text-align:center;color:var(--red);font-weight:700;font-size:.88rem">⚠️ 手札からカードが奪われました！</div><div class="ts-ev-detail" style="font-size:1rem;text-align:center"><span style="font-size:2rem">${ev.cardIcon}</span><br>「<strong>${ev.cardName}</strong>」が手札から失われました</div></div>`;
        if (ev.type === 'city_switch') return `<div class="ts-ev warn" style="border-color:var(--yellow);border-width:2px;background:rgba(227,179,65,.1)"><div class="ts-ev-title" style="font-size:1.15rem">💥 ${ev.oldCityName}が壊滅！</div><div class="ts-ev-detail">${ev.newCityIcon} <strong>${ev.newCityName}</strong> が次の都市として登場します</div></div>`;
        return '';
      }).join('');
    }

    function renderTurnSummary() {
      const events = G._turnSummary || []; const p = G.players[G.activePlayer];
      const _catLabel = { exposure: '地形リスク', city_policy: '都市対策', city_effect: '都市能力', shield_pre: 'シールド', shield_resp: '対応シールド', agency: '防災庁', negate: '特殊無効', vuln: '脆弱性', special: '特殊効果' };

      function renderDetail(d) {

    // ─── 観戦者ビュー ───
    function renderSpectator() {

      let karte = '';
      if (viewerDmg.length > 0) {
        const rows = viewerDmg.map(ev => { const tb = (ev.details||[]).some(d=>d.cat==='exposure')?`<span class="go-karte-badge">地形+</span>`:''; return `<div class="go-stats-row"><span style="font-size:1rem">${ev.cardIcon}</span><span class="go-stats-row-name">${ev.cardName}${tb}</span><span class="go-hp-dead" style="font-size:.85rem">−${ev.damage}</span></div>`; }).join('');
        const totalDmg = viewerDmg.reduce((s,ev)=>s+ev.damage,0);
        karte = `<div class="go-inview go-stats-table"><div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_disaster.webp" style="width:20px;height:20px;object-fit:contain"> 被害カルテ — ${G.players[_specTab].name} が受けたダメージ</div>${rows}<div class="go-stats-row" style="border-top:1px solid var(--bg3);margin-top:2px"><span class="go-stats-row-name" style="font-size:.78rem">合計</span><span class="go-hp-dead">−${totalDmg}</span></div></div>`;
      }

      // 地形リスク
      const terrainHits = viewerDmg.filter(ev=>(ev.details||[]).some(d=>d.cat==='exposure'));
      let terrainStat = '';
      if (terrainHits.length > 0) {
        const tRows = terrainHits.map(ev=>{ const d=ev.details.find(d=>d.cat==='exposure'); return `<div class="go-stats-row"><span style="font-size:.9rem">${ev.cardIcon}</span><span class="go-stats-row-name" style="font-size:.82rem">${d.text}</span><span style="color:var(--red);font-weight:700;font-family:'Roboto Condensed',sans-serif;font-size:.82rem">+${d.delta}</span></div>`; }).join('');
        terrainStat = `<div class="go-inview go-stats-table"><div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_city.webp" style="width:20px;height:20px;object-fit:contain"> 地形リスク発動 — ${terrainHits.length}回</div>${tRows}<div class="go-terrain-note">都市の地形によってダメージが増減します → カード図鑑で確認</div></div>`;
      }

      // カウンター提案
      let counterHtml = '';
      if (viewerDmg.length > 0) {
        const worst = viewerDmg.reduce((m,ev)=>ev.damage>(m?.damage??0)?ev:m,null);
        const counterCard = worst ? POLICY_CARDS.find(c=>c.id===(COUNTER_MAP[worst.cardId]||[])[0]) : null;
        if (counterCard && worst) {
          const ctColor = counterCard.color==='green'?'var(--green)':'var(--yellow)';
          counterHtml = `<div class="go-inview go-counter-wrap"><div class="go-mvp-label"><img src="images/icons/neon_policy_shield.webp" style="width:20px;height:20px;object-fit:contain"> 次はこのカードで備えよう</div><div class="go-counter-trigger"><span style="font-size:1.1rem">${worst.cardIcon}</span><span class="go-counter-arrow">→</span><span style="font-size:.82rem;color:var(--t1)">${worst.cardName} ${worst.damage}ダメージへの対策</span></div><div class="go-mvp-card-row" style="margin-top:10px"><img class="go-mvp-img" src="images/cards/${counterCard.id}.webp" alt="" onerror="this.style.display='none'"><div class="go-mvp-info"><div class="go-mvp-name" style="color:${ctColor}">${counterCard.icon} ${counterCard.name}</div><div class="go-mvp-type">${counterCard.desc}</div><div class="go-mvp-desc">${counterCard.realConcept}</div></div></div></div>`;
        }
      }

      // 観戦者限定: 防災ポイント（両プレイヤーの都市 learn テキスト）
      const learnBoxes = [0,1].map(pi => {
        const p = G.players[pi];
        if (!p.cities || p.cities.length === 0) return '';
        return p.cities.filter(c=>c.learn).map(c => `<div class="spec-learn-box"><div class="spec-learn-city-header">${terrainImg(c,18)}<strong>${c.name}</strong><span class="terrain-badge">(${c.isCoastal?'海岸':c.isMountain?'山間部':'内陸'})</span></div><div class="spec-learn-text">${c.learn}</div></div>`).join('');
      }).join('');
      const disasterLearn = `<div class="go-inview go-stats-table"><div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_city.webp" style="width:20px;height:20px;object-fit:contain"> 今試合の防災ポイント</div>${learnBoxes}</div>`;

      // 観戦者限定: 試合ハイライト
      const allDmg = hist.filter(ev=>ev.type==='damage');
      let highlightHtml = '';
      if (allDmg.length > 0) {
        const maxAtk = allDmg.reduce((m,ev)=>ev.damage>(m?.damage??0)?ev:m,null);
        const p0dealt = allDmg.filter(ev=>ev.playerIdx===1).reduce((s,ev)=>s+ev.damage,0);
        const p1dealt = allDmg.filter(ev=>ev.playerIdx===0).reduce((s,ev)=>s+ev.damage,0);
        highlightHtml = `<div class="go-inview go-stats-table"><div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_disaster.webp" style="width:20px;height:20px;object-fit:contain"> 試合ハイライト</div>${maxAtk?`<div class="go-stats-row"><span style="font-size:1rem">${maxAtk.cardIcon}</span><span class="go-stats-row-name">最大ダメージ：${maxAtk.cardName}</span><span class="go-hp-dead">−${maxAtk.damage}</span></div>`:''}<div class="go-stats-row"><span style="font-size:1rem">⚔️</span><span class="go-stats-row-name">${G.players[0].name} 総与ダメージ</span><span style="color:var(--t1);font-weight:700;font-family:'Roboto Condensed',sans-serif">${p0dealt}</span></div><div class="go-stats-row"><span style="font-size:1rem">⚔️</span><span class="go-stats-row-name">${G.players[1].name} 総与ダメージ</span><span style="color:var(--t1);font-weight:700;font-family:'Roboto Condensed',sans-serif">${p1dealt}</span></div><div class="go-stats-row"><span style="font-size:1rem">🕐</span><span class="go-stats-row-name">総ターン数</span><span style="color:var(--t1);font-weight:700;font-family:'Roboto Condensed',sans-serif">${totalTurns}</span></div></div>`;
      }

      // 観戦者限定: 観戦レポートコピー
      const reportHtml = `<div class="go-inview go-counter-wrap"><div class="go-mvp-label"><img src="images/icons/neon_policy_instant.webp" style="width:20px;height:20px;object-fit:contain"> 観戦レポートをシェア</div><button class="go-gallery-btn" onclick="copySpecReport()">📋 観戦レポートをコピー</button></div>`;

      return `<div class="screen active go-screen ${themeCls}">
        <div class="go-hero">
          <div class="go-hero-bg" aria-hidden="true">
            <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-a">${bgText}</div></div>
            <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-b">${bgText}</div></div>
            <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-a">${bgText}</div></div>
          </div>
          <div class="go-hero-content">
            <div style="font-size:.78rem;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.1em;margin-bottom:6px">👁 SPECTATOR</div>
            <div class="go-big-title">${bigTitle}</div>
            <div class="go-player-name">${w.name} の勝利！</div>
          </div>
          <div class="go-scroll-hint"><p class="go-scroll-txt">SCROLL DOWN</p><div class="go-scroll-line"><span></span></div></div>
        </div>
        <div class="go-details">
          ${tabBar}
          <div class="go-inview go-section-label">RESULT — ${G.players[_specTab].name}</div>
          <div class="go-inview go-stats-table">
            <div class="go-stats-section-header">WINNER ${w.name}</div>${wRows}
            <div class="go-stats-section-header">LOSER ${l.name}</div>${lRows}
          </div>

          ${karte}${terrainStat}${counterHtml}
          ${disasterLearn}
          ${highlightHtml}
          ${reportHtml}
          <button class="go-inview go-replay-btn" onclick="restartGame()">ロビーに戻る</button>
        </div>

    // ─── ゲームオーバー ───
    function renderGameOver() {
      localStorage.removeItem('ron_lastRoom');
      setupRematchListener();
      const wi = G.winner; const li = wi === 0 ? 1 : 0;
      const w = G.players[wi]; const l = G.players[li];
      const isMyWin = wi === myPlayerIdx;
      const totalTurns = G.turnsEach[0] + G.turnsEach[1];

      // ── Flavor text (2行・文の途中改行なし) ──
      const wRemHp = w.cityHps.reduce((s, h) => s + Math.max(0, h), 0);
      let flavorLine1, flavorLine2;
      if (isMyWin) {
        if (wRemHp >= 80) { flavorLine1 = '完璧な防災都市。'; flavorLine2 = 'ほぼノーダメージで制した。'; }
        else if (wRemHp >= 40) { flavorLine1 = '堅実な勝利。'; flavorLine2 = '確かな政策が都市を守った。'; }
        else { flavorLine1 = 'ギリギリの勝利。'; flavorLine2 = 'あと一撃あれば敗北だった。'; }
      } else {
        if (wRemHp >= 80) { flavorLine1 = '相手の守りが固かった。'; flavorLine2 = '戦略を変えてみよう。'; }
        else if (wRemHp >= 40) { flavorLine1 = 'あと一歩だった。'; flavorLine2 = '次は逆転できる。'; }
        else { flavorLine1 = `あと ${wRemHp} ダメージで逆転だった。`; flavorLine2 = '次こそ。'; }
      }
      const flavorText = `${flavorLine1}<br>${flavorLine2}`;

      // subtitle も文節で改行
      const winnerName = w.name;
      const subtitleLine1 = isMyWin ? `${winnerName} の勝利！` : `${winnerName} の勝利...`;

      const themeCls = isMyWin ? 'go-victory' : 'go-defeat';
      const bigTitle = isMyWin ? 'VICTORY' : 'GAME OVER';
      const subtitle = subtitleLine1;
      const bgRepeat = `${bigTitle} `.repeat(6);
      const bgText = bgRepeat + bgRepeat;

      // ── City result rows ──
      const wRows = w.cities.map((c, i) => {
        const hp = Math.max(0, w.cityHps[i]);
        return `<div class="go-stats-row"><span>${terrainImg(c,15)}</span><span class="go-stats-row-name">${c.name}</span><span class="${hp > 0 ? 'go-hp-alive' : 'go-hp-dead'}">${hp > 0 ? 'HP ' + hp : '壊滅'}</span></div>`;
      }).join('');
      const lRows = l.cities.map((c) =>
        `<div class="go-stats-row"><span>${terrainImg(c,15)}</span><span class="go-stats-row-name">${c.name}</span><span class="go-hp-dead">壊滅</span></div>`
      ).join('');

      // ── A: 被害カルテ（自分が受けたダメージ一覧） ──
      const hist = G._gameHistory || [];
      const mi = myPlayerIdx, oi = mi === 0 ? 1 : 0;
      const myCity = G.players[mi].cities[0];
      const oppCity = G.players[oi].cities[0];
      const myCity2 = G.players[mi].cities[1] || null;
      const oppCity2 = G.players[oi].cities[1] || null;
      const _svgChevron = `<svg width="9" height="9" viewBox="0 0 9 9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5,1 6.5,4.5 2.5,8"/></svg>`;
      const _mkCityBadge = (city, label) => city
        ? `<div class="go-city-badge" onclick="goGalleryFromResult('city','${city.id}','${city.name}','city')"><img src="images/cities/${city.id}.webp" alt="" onerror="this.style.opacity='.3'"><div class="go-city-badge-playerlabel">${label}</div><div class="go-city-badge-name">${city.name}</div></div>`
        : `<div class="go-city-badge" style="opacity:.3;cursor:default;pointer-events:none"><div class="go-city-badge-playerlabel">${label}</div><div class="go-city-badge-name" style="font-size:.7rem">未使用</div></div>`;
      const hasCity2 = !!(myCity2 || oppCity2);
      const _page1 = `<div class="go-city-badges-page">${_mkCityBadge(myCity,'あなた')}<div class="go-city-badge-vs">VS</div>${_mkCityBadge(oppCity,'相手')}</div>`;
      const _page2 = hasCity2 ? `<div class="go-city-badges-page">${_mkCityBadge(myCity2,'あなた2')}<div class="go-city-badge-vs">VS</div>${_mkCityBadge(oppCity2,'相手2')}</div>` : '';
      const _nextBtn = hasCity2 ? `<button class="go-city-badges-next" id="city-badge-next-btn" onclick="toggleCityBadgePage()">${_svgChevron}</button>` : '';
      const cityBadgesHtml = (myCity && oppCity) ? `<div class="go-inview go-stats-table"><div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_city.webp" style="width:20px;height:20px;object-fit:contain"> 対戦都市 — タップしてカード図鑑へ</div><div class="go-city-badges-outer"><div class="go-city-badges-clip"><div class="go-city-badges-track" id="city-badges-track">${_page1}${_page2}</div></div>${_nextBtn}</div></div>` : '';
      const myDmgEvts = hist.filter(ev => ev.type === 'damage' && ev.playerIdx === myPlayerIdx);
      let karte = '';
      if (myDmgEvts.length > 0) {
        const rows = myDmgEvts.map(ev => {
          const hasTerrainBonus = (ev.details || []).some(d => d.cat === 'exposure');
          const bonusBadge = hasTerrainBonus ? `<span class="go-karte-badge">地形+</span>` : '';
          return `<div class="go-stats-row">
            <span style="font-size:1rem">${ev.cardIcon}</span>
            <span class="go-stats-row-name">${ev.cardName}${bonusBadge}</span>
            <span class="go-hp-dead" style="font-size:.85rem">−${ev.damage}</span>
          </div>`;
        }).join('');
        const totalDmg = myDmgEvts.reduce((s, ev) => s + ev.damage, 0);
        karte = `<div class="go-inview go-stats-table">
          <div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_disaster.webp" style="width:20px;height:20px;object-fit:contain"> 被害カルテ — あなたが受けたダメージ</div>
          ${rows}
          <div class="go-stats-row" style="border-top:1px solid var(--bg3);margin-top:2px">
            <span class="go-stats-row-name" style="font-size:.78rem">合計</span>
            <span class="go-hp-dead">−${totalDmg}</span>
          </div>
        </div>`;
      }

      // ── A2: 人為災害による妨害履歴 ──
      const myJinzaiEvts = hist.filter(ev => ev.playerIdx === myPlayerIdx && (
        (ev.type === 'response_skipped' && ev.byTerror) || ev.type === 'rumor_debt' || ev.type === 'pollution_broken'));
      let jinzaiKarte = '';
      if (myJinzaiEvts.length > 0) {
        const jRows = myJinzaiEvts.map(ev => {
          let icon = '☣️', label = '公害', detail = '';
          if (ev.type === 'response_skipped') { icon = '💣'; label = 'テロ攻撃'; detail = '対応フェーズを封じられた'; }
          else if (ev.type === 'rumor_debt') { icon = '📱'; label = 'デマ拡散'; detail = '予算 −1'; }
          else if (ev.type === 'pollution_broken') { icon = '☣️'; label = '公害'; detail = `${ev.shieldName}を破壊された`; }
          return `<div class="go-stats-row"><span style="font-size:1rem">${icon}</span><span class="go-stats-row-name">${label}</span><span style="color:#c084fc;font-weight:700;font-size:.8rem">${detail}</span></div>`;
        }).join('');
        const hadTerror = myJinzaiEvts.some(ev => ev.type === 'response_skipped');
        const tip = hadTerror ? `<div class="go-terrain-note" style="margin-top:8px">テロ攻撃は<strong style="color:var(--green)">広域避難指示</strong>を事前設置すると無効化できます</div>` : '';
        jinzaiKarte = `<div class="go-inview go-stats-table">
          <div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_jinzai.webp" style="width:20px;height:20px;object-fit:contain"> 人為災害による妨害 — ${myJinzaiEvts.length}回</div>
          ${jRows}
          ${tip}
        </div>`;
      }

      // ── C: 地形リスク発動スタッツ ──
      const terrainHits = myDmgEvts.filter(ev => (ev.details || []).some(d => d.cat === 'exposure'));
      let terrainStat = '';
      if (terrainHits.length > 0) {
        const tRows = terrainHits.map(ev => {
          const d = ev.details.find(d => d.cat === 'exposure');
          return `<div class="go-stats-row">
            <span style="font-size:.9rem">${ev.cardIcon}</span>
            <span class="go-stats-row-name" style="font-size:.82rem">${d.text}</span>
            <span style="color:var(--red);font-weight:700;font-family:'Roboto Condensed',sans-serif;font-size:.82rem">+${d.delta}</span>
          </div>`;
        }).join('');
        terrainStat = `<div class="go-inview go-stats-table">
          <div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_city.webp" style="width:20px;height:20px;object-fit:contain"> 地形リスク発動 — ${terrainHits.length}回</div>
          ${tRows}
          ${myCity ? `<button class="go-gallery-btn" style="margin-top:8px" onclick="goGalleryFromResult('city','${myCity.id}','${myCity.name}','city')">${myCity.name}のカードを見る →</button>` : `<div class="go-terrain-note">都市の地形によってダメージが増減します</div>`}
        </div>`;
      }

      // ── B: カウンター提案（最大ダメージ災害への対抗カード） ──
      let counterHtml = '';
      if (myDmgEvts.length > 0) {
        const worst = myDmgEvts.reduce((m, ev) => ev.damage > (m?.damage ?? 0) ? ev : m, null);
        const counterIds = worst ? (COUNTER_MAP[worst.cardId] || []) : [];
        const counterCard = counterIds.length > 0 ? POLICY_CARDS.find(c => c.id === counterIds[0]) : null;
        if (counterCard && worst) {
          const ctColor = counterCard.color === 'green' ? 'var(--green)' : 'var(--yellow)';
          counterHtml = `<div class="go-inview go-counter-wrap">
            <div class="go-mvp-label"><img src="images/icons/neon_policy_shield.webp" style="width:20px;height:20px;object-fit:contain"> 次はこのカードで備えよう</div>
            <div class="go-counter-trigger">
              <span style="font-size:1.1rem">${worst.cardIcon}</span>
              <span class="go-counter-arrow">→</span>
              <span style="font-size:.82rem;color:var(--t1)">${worst.cardName} ${worst.damage}ダメージへの対策</span>
            </div>
            <div class="go-mvp-card-row" style="margin-top:10px">
              <img class="go-mvp-img" src="images/cards/${counterCard.id}.webp" alt="" onerror="this.style.display='none'">
              <div class="go-mvp-info">
                <div class="go-mvp-name" style="color:${ctColor}">${counterCard.icon} ${counterCard.name}</div>
                <div class="go-mvp-type">${counterCard.desc}</div>
                <div class="go-mvp-desc">${counterCard.realConcept}</div>
              </div>
            </div>
            <button class="go-gallery-btn" onclick="goGalleryFromResult('card','${counterCard.id}','${counterCard.name}','policy')">カード図鑑で詳しく見る</button>
          </div>`;
        }
      }

      return `<div class="screen active go-screen ${themeCls}">

  <div class="go-hero">
    <div class="go-hero-bg" aria-hidden="true">
      <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-a">${bgText}</div></div>
      <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-b">${bgText}</div></div>
      <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-a">${bgText}</div></div>
    </div>
    <div class="go-hero-content">
      <div class="go-big-title">${bigTitle}</div>
      <div class="go-player-name">${subtitle}</div>
      <div class="go-flavor-txt">${flavorText}</div>
    </div>
    <div class="go-scroll-hint">
      <p class="go-scroll-txt">SCROLL DOWN</p>
      <div class="go-scroll-line"><span></span></div>
    </div>
  </div>

  <div class="go-details">
    <div class="go-inview go-section-label">RESULT</div>
    <div class="go-inview go-stats-table">
      <div class="go-stats-section-header">WINNER ${w.name}</div>${wRows}
      <div class="go-stats-section-header">LOSER ${l.name}</div>${lRows}
    </div>
    <div class="go-inview go-turns-badge">総ターン数 <strong>${totalTurns}</strong></div>
    ${cityBadgesHtml}
    ${karte}
    ${jinzaiKarte}
    ${terrainStat}
    ${counterHtml}
    ${isCpuMode ? `<button class="go-inview go-rematch-btn" onclick="replayCpuGame()">⚔️ もう一度戦う</button>` : roomId ? `<button class="go-inview go-rematch-btn" onclick="requestRematch()" ${_rematchRequested ? 'disabled' : ''}>${_rematchRequested ? '⏳ 相手の返答待ち...' : '⚔️ もう1戦'}</button>` : ''}
    <button class="go-inview go-replay-btn" onclick="restartGame()">ロビーに戻る</button>
  </div>

</div>`;
    }

    function initGoObserver() {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('inview'); obs.unobserve(e.target); } });
      }, { threshold: 0.12 });
      document.querySelectorAll('.go-inview').forEach(el => obs.observe(el));
    }


    // ─── 都市情報モーダル ───
    function showCityInfo(idx) { _cityInfoModal = idx; render(); }
    function hideCityInfo() { _cityInfoModal = null; render(); }

    function renderCityInfoModal() {
      const idx = _cityInfoModal;
      if (idx === null || !G.players[idx]) { _cityInfoModal = null; return ''; }
      const p = G.players[idx]; const c = getActiveCity(idx);
      if (!c) { _cityInfoModal = null; return ''; }
      const hp = getActiveCityHp(idx); const mxHp = getActiveMaxHp(idx);
      const terrain = c.isCoastal ? '海岸都市' : c.isMountain ? '山間部都市' : '内陸都市';
      return `<div class="city-info-overlay" onclick="hideCityInfo()">
        <div class="city-info-box" onclick="event.stopPropagation()">

    function playCard(uid) {
      const p = G.players[G.activePlayer]; const idx = p.hand.findIndex(c => c.uid === uid); if (idx === -1) return; const card = p.hand[idx];
      if (G.activePlayer === 0 && G.turnsEach[0] === 0 && (card.type === 'disaster' || card.type === 'jinzai')) { alert('先攻1ターン目は災害カード（自然・人為）を使えません。'); return; }
      if (getBudgetLeft(G.activePlayer) < card.cost) return;
      p.hand.splice(idx, 1); G.discard.push(card); p.budgetUsed += card.cost;
      showBudgetToast(card.cost, getBudgetLeft(G.activePlayer), getBudget(G.activePlayer));
      if (card.type === 'policy') {
        applyPolicyEffect(card, G.activePlayer, false);
        if (G.screen === 'peek') { pushState(); render(); return; }
        if (G.screen === 'turnDraw') { pushState(); render(); return; }
        if (!handleDiscardIfNeeded(G.activePlayer, 'main')) goMain();
      } else if (card.type === 'jinzai') {
        applyJinzaiEffect(card, G.activePlayer);
        if (G.screen === 'pollution') { pushState(); render(); return; }
        if (!handleDiscardIfNeeded(G.activePlayer, 'main')) goMain();

        const defIdx = G.activePlayer === 0 ? 1 : 0; G.pendingAttack = { card, attackerIdx: G.activePlayer, defenderIdx: defIdx };

      }
    }

    function goResponseHandover() {
      const atk = G.pendingAttack;
      const def = G.players[atk.defenderIdx];
      const atkPlayer = G.players[atk.attackerIdx];
      // テロ攻撃のフラグは「次に使う災害」で必ず消費する（被弾側が広域避難指示を設置していれば無効）
      const terrorActive = atkPlayer.effects.terrorNextDisaster;
      if (terrorActive) atkPlayer.effects.terrorNextDisaster = false;
      if (atk.card.specialType === 'skip_response' && !def.effects.negateSpecial) {
        addLog(`⚡ 複合災害：${def.name}の対応フェーズを強制スキップ！`, 'sys');
        G._nextTurnEvents[atk.defenderIdx].push({ type: 'response_skipped', cityName: getActiveCity(atk.defenderIdx)?.name || '' });
        resolveDamage(atk.card, atk.defenderIdx, null);
        _responseAnimatedPis.add(atk.defenderIdx);
        G.pendingAttack = null;
        if (checkWin()) return;
        G.screen = 'main'; pushState(); render();
        return;

      if (terrorActive && !def.effects.negateSpecial) {
        addLog(`💣 テロ攻撃：${def.name}の対応フェーズを強制スキップ！`, 'sys');
        G._nextTurnEvents[atk.defenderIdx].push({ type: 'response_skipped', cityName: getActiveCity(atk.defenderIdx)?.name || '', byTerror: true });
