    // ─── Firebase Presence（切断検知・自動ルーム削除） ───
    function setupPresence() {
      if (!db || !roomId || myRole === 'spectator') return;
      const myKey = myRole;
      const oppKey = myRole === 'p1' ? 'p2' : 'p1';
      const myPresRef = db.ref(`rooms/${roomId}/presence/${myKey}`);

      _presenceConnRef = db.ref('.info/connected');
      _presenceConnRef.on('value', snap => {
        if (!snap.val()) return;
        myPresRef.set(true);
        myPresRef.onDisconnect().set(false);
      });

      // ネットワーク復帰・iOSバックグラウンド復帰のどちらでもプレゼンスを再登録
      _onlineHandler = () => {
        if (db && roomId) { myPresRef.set(true); myPresRef.onDisconnect().set(false); }
      };
      window.addEventListener('online', _onlineHandler);

      _visibilityHandler = () => {
        if (document.visibilityState === 'visible' && db && roomId) {
          myPresRef.set(true);
          myPresRef.onDisconnect().set(false);
        }
      };
      document.addEventListener('visibilitychange', _visibilityHandler);

      _presenceOppRef = db.ref(`rooms/${roomId}/presence/${oppKey}`);
      _presenceOppRef.on('value', snap => {
        const connected = snap.val();
        const inGame = ['gacha','cityOrder','draft','turnDraw','turnSummary','main','response','discard','peek'].includes(G.screen);
        if (connected === false && inGame) {
          showDisconnectOverlay();
        } else if (connected === true) {
          const wasDisconnected = !!document.getElementById('disconnect-overlay');
          hideDisconnectOverlay();
          if (wasDisconnected) showReconnectPopup();
        }
      });
      listenSpectatorCount();
    }

    function listenSpectatorCount() {
      if (!db || !roomId || myRole === 'spectator') return;
      _spectatorCountRef = db.ref(`rooms/${roomId}/spectators`);
      _spectatorCountRef.on('value', snap => {
        const v = snap.val();
        _spectatorCount = v ? Object.keys(v).length : 0;
        render();
      });
    }

    function cleanupPresence() {
      if (_presenceConnRef) { _presenceConnRef.off(); _presenceConnRef = null; }
      if (_presenceOppRef) { _presenceOppRef.off(); _presenceOppRef = null; }
      if (_onlineHandler) { window.removeEventListener('online', _onlineHandler); _onlineHandler = null; }
      if (_visibilityHandler) { document.removeEventListener('visibilitychange', _visibilityHandler); _visibilityHandler = null; }
      if (_spectatorCountRef) { _spectatorCountRef.off(); _spectatorCountRef = null; _spectatorCount = 0; }
      if (_specPresRef) { try { _specPresRef.remove(); } catch(e) {} _specPresRef = null; }
      hideDisconnectOverlay();
    }

    function pushState() {
      if (isCpuMode) return;
      if (!db || !roomId || myRole === 'spectator') return;
      const s = JSON.stringify({ ...G, confirm: null }); myLastPush = s;
      db.ref(`rooms/${roomId}/state`).set(s);
      db.ref(`rooms/${roomId}/lastActiveAt`).set(Date.now());
    }

    function listenToState() {
      let _prevActivePlayer = null; let _prevGScreen = null;
      db.ref(`rooms/${roomId}/state`).on('value', snap => {
        const data = snap.val(); if (!data || data === myLastPush) return;
        const prevScreen = G.screen;
        // 観戦者: 手札フリップ検出 & ターンサマリー解除時HPアニメキュー
        if (myRole === 'spectator') {
          const prevUids = [0, 1].map(pi => new Set((G.players[pi].hand || []).map(c => c.uid)));
          const next = JSON.parse(data);
          for (let pi = 0; pi < 2; pi++) {
            const newCard = (next.players[pi].hand || []).find(c => !prevUids[pi].has(c.uid));
            if (newCard) { _lastDrawnCardUid = newCard.uid; break; }
          }
          // ターンサマリーが解除されたタイミングでHPアニメをキュー（Gが上書きされる前に取得）
          if (prevScreen === 'turnSummary' && (next.screen === 'main' || next.screen === 'turnDraw') && G._turnSummary) {
            const _ap = G.activePlayer;
            const _evts = G._turnSummary;
            const _hasSwitch = _evts.some(ev => ev.type === 'city_switch');
            if (!_hasSwitch) {
              for (const ev of _evts) {
                if (ev.type === 'damage' && ev.hpBefore != null && ev.hpAfter != null && ev.hpBefore !== ev.hpAfter) {
                  _pendingMainHpAnims.push({ pi: _ap, fh: ev.hpBefore, th: ev.hpAfter, delay: 80 });
                }
              }
            } else {
              _pendingCityEnterAnim = true;
              const _np = next.players[_ap]; const _nh = _np.cityHps[_np.activeCityIdx];
              if (_nh > 0) { _cityEnterAnimPi = _ap; _pendingMainHpAnims.push({ pi: _ap, fh: 0, th: _nh, delay: 480 }); }
            }
          }
        }
        G = { ...JSON.parse(data), confirm: null };
        const newAp = G.activePlayer; const newScreen = G.screen;
        // メインフェーズ ターン切り替え
        if (myRole !== 'spectator' && _prevActivePlayer !== null && _prevActivePlayer !== newAp && (newScreen === 'main' || newScreen === 'turnDraw') && prevScreen !== 'turnSummary') {
          setTimeout(() => showTurnSplash(newAp === myPlayerIdx, false), 80);
        }
        // 対応フェーズ開始（ディフェンダー側デバイスでの検知）
        if (myRole !== 'spectator' && _prevGScreen !== 'response' && newScreen === 'response' && G.pendingAttack?.defenderIdx === myPlayerIdx) {
          setTimeout(() => showTurnSplash(true, true), 120);
        }
        _prevActivePlayer = newAp; _prevGScreen = newScreen;
        render(); processHpAnims();
      });
    }

    async function createRoom() {
      const name = lobbyState.nameInput.trim();
      if (!name) { lobbyState.error = '名前を入力してください'; render(); return; }
      myRole = 'p1'; myPlayerIdx = 0; roomId = generateRoomCode(); G.players[0].name = name;
      history.replaceState(null, '', '?room=' + roomId);
      localStorage.setItem('ron_lastRoom', roomId); localStorage.setItem('ron_lastName', name); localStorage.setItem('ron_lastRole', 'p1');
      try {
        await db.ref(`rooms/${roomId}`).set({ p1Name: name, p2Name: '', p2Joined: false, state: null, createdAt: Date.now() });
        db.ref(`rooms/${roomId}/p2Joined`).on('value', snap => {
          if (snap.val() === true) {
            db.ref(`rooms/${roomId}/p2Joined`).off();
            db.ref(`rooms/${roomId}/p2Name`).get().then(s2 => {
              G.players[1].name = s2.val() || 'プレイヤー2';
              listenToState();
              setupPresence();
              G.gachaPickedIds = []; G.gachaCurrent = { playerIdx: 0, pickNum: 0, revealed: null }; G.screen = 'gacha';
              pushState(); render();
            });
          }
        });
        G.screen = 'waiting_connection'; render();
      } catch (e) { lobbyState.error = 'ルーム作成に失敗: ' + e.message; render(); }
    }

    async function joinRoom({ silent = false } = {}) {
      const name = lobbyState.nameInput.trim(); const code = lobbyState.joinCodeInput.trim().toUpperCase();
      if (!name) { lobbyState.error = '名前を入力してください'; render(); return; }
      if (code.length !== 6) { lobbyState.error = 'ルームコードは6文字です'; render(); return; }
      try {
        const snap = await db.ref(`rooms/${code}`).get();
        if (!snap.val()) {
          if (silent) { lobbyState.mode = 'select'; lobbyState.joinCodeInput = ''; render(); return; }
          lobbyState.error = 'ルームが見つかりません'; render(); return;
        }
        const roomData = snap.val();

        const savedRole = localStorage.getItem('ron_lastRole');
        const savedRoom = localStorage.getItem('ron_lastRoom');

        // ── p1 再接続: ローカルのロール記録 + Firebase の p1Name が一致 ──
        const isP1Rejoin = savedRole === 'p1' && savedRoom === code && roomData.p1Name === name;
        if (isP1Rejoin) {
          myRole = 'p1'; myPlayerIdx = 0; roomId = code; G.players[0].name = name;
          history.replaceState(null, '', '?room=' + code);
          localStorage.setItem('ron_lastRoom', code); localStorage.setItem('ron_lastName', name); localStorage.setItem('ron_lastRole', 'p1');
          if (roomData.p2Joined) {
            // ゲーム進行中 → Firebase の現在状態をそのまま読み込んで復帰
            G.players[1].name = roomData.p2Name || 'プレイヤー2';
            listenToState(); setupPresence();
          } else {
            // p2未参加 → 待機画面に戻り p2Joined を監視
            db.ref(`rooms/${code}/p2Joined`).on('value', snap => {
              if (snap.val() === true) {
                db.ref(`rooms/${code}/p2Joined`).off();
                db.ref(`rooms/${code}/p2Name`).get().then(s2 => {
                  G.players[1].name = s2.val() || 'プレイヤー2';
                  listenToState(); setupPresence();
                  G.gachaPickedIds = []; G.gachaCurrent = { playerIdx: 0, pickNum: 0, revealed: null }; G.screen = 'gacha';
                  pushState(); render();
                });
              }
            });
            G.screen = 'waiting_connection'; render();
          }
          return;
        }

        // ── p2 再接続: Firebase の p2Name と名前が一致 ──
        const isP2Rejoin = roomData.p2Joined && roomData.p2Name === name;
        if (isP2Rejoin) {
          myRole = 'p2'; myPlayerIdx = 1; roomId = code; G.players[1].name = name;
          G.players[0].name = roomData.p1Name || 'プレイヤー1';
          history.replaceState(null, '', '?room=' + code);
          localStorage.setItem('ron_lastRoom', code); localStorage.setItem('ron_lastName', name); localStorage.setItem('ron_lastRole', 'p2');
          listenToState(); setupPresence();
          return;
        }

        // ── 満員 → 観戦オファー ──
        if (roomData.p2Joined) { lobbyState.spectateCode = code; lobbyState.error = ''; render(); return; }

        // ── 新規 p2 参加 ──
        myRole = 'p2'; myPlayerIdx = 1; roomId = code; G.players[1].name = name;
        G.players[0].name = roomData.p1Name || 'プレイヤー1';
        history.replaceState(null, '', '?room=' + code);
        localStorage.setItem('ron_lastRoom', code); localStorage.setItem('ron_lastName', name); localStorage.setItem('ron_lastRole', 'p2');
        await db.ref(`rooms/${roomId}/p2Name`).set(name);
        await db.ref(`rooms/${roomId}/p2Joined`).set(true);
        listenToState(); setupPresence();
        G.screen = 'waiting_connection'; render();
      } catch (e) { lobbyState.error = '参加に失敗: ' + e.message; render(); }
    }

    function generateQR() {
      const el = document.getElementById('qr-container'); if (!el || el.dataset.generated) return; el.dataset.generated = 'true';

    async function enterSpectator(code) {

    // ═══════════════════════════════════════
    // VIEW DISPATCH
    // ═══════════════════════════════════════
    function myView() {
      if (_specPv) return 'spectator';
      if (!isFirebaseConfigured()) return 'setup_required';
      if (myRole === 'spectator') return 'spectator';
      if (G.screen === 'lobby' || G.screen === 'waiting_connection' || G.screen === 'tutorial') return G.screen;
      const mi = myPlayerIdx;
      switch (G.screen) {
        case 'cityOrder': return G.cityOrderState?.playerIdx === mi ? 'cityOrder' : 'waiting';
        case 'gacha': return G.gachaCurrent?.playerIdx === mi ? 'gacha' : 'waiting';
        case 'draft': return G.draftState?.playerIdx === mi ? 'draft' : 'waiting';
        case 'turnDraw': { const pi = G.turnDrawState?.pi ?? G.turnDrawState?.playerIdx; return pi === mi ? 'turnDraw' : 'waiting'; }
        case 'turnSummary':
          if (G.activePlayer === mi) return 'turnSummary';
          return G._atkSummaryConfirmed ? 'waiting' : 'attackerSummary';
        case 'main':
          if (G.pendingAttack) { if (G.pendingAttack.attackerIdx === mi) return 'main'; if (G.pendingAttack.defenderIdx === mi) return 'waiting_response'; }
          return G.activePlayer === mi ? 'main' : 'waiting';
        case 'response': return G.pendingAttack?.defenderIdx === mi ? 'response' : 'waiting';
        case 'discard': { const pi = G.discardNeeded?.pi ?? G.discardNeeded?.playerIdx; return pi === mi ? 'discard' : 'waiting'; }
        case 'peek': return (G.peekByPlayerIdx ?? G.activePlayer) === mi ? 'peek' : 'waiting';
        case 'gameover': return 'gameover';
        default: return 'waiting';
      }
    }

    // ═══════════════════════════════════════
    // MAIN TUTORIAL SPOTLIGHT
    // ═══════════════════════════════════════
    function showMainTutorial() {
      if (_mainTutorialShown) return;
      _mainTutorialShown = true;
      const btn = document.querySelector('.player-zone .city-tap-btn');
      const badge = document.querySelector('.player-zone .terrain-badge');
      const budget = document.querySelector('.budget-display');
      if (!btn) return;
      const vw = window.innerWidth, vh = window.innerHeight;
      const PAD = 8;
      function elR(el) {
        const r = el.getBoundingClientRect();
        return { x: r.left-PAD, y: r.top-PAD, w: r.width+PAD*2, h: r.height+PAD*2, cx: r.left+r.width/2, cy: r.top+r.height/2 };
      }
      const b1 = elR(btn);
      const b2 = badge ? elR(badge) : null;
      const b3 = budget ? elR(budget) : null;
      const ITEMS = [

    function showStepSpotlight(step) {
      if (_tutStepSpotlights.has(step)) return;
      _tutStepSpotlights.add(step);
      const CFG = {
        3: { sel: '.player-zone .card.tut-glow',  title: '緑カードをタップ',        body: '光っているカードをタップして設置しましょう',           color: '#3fb950' },
        4: { sel: '.player-zone .card.tut-glow',  title: '黄カードをタップ',        body: '光っているカードをタップして即時回復！',             color: '#d29922' },
        5: { sel: '.btn-end.tut-glow',            title: 'ターン終了をタップ',      body: '光っているボタンを押して相手にターンを渡しましょう', color: '#388bfd' },
        6: { sel: '.tut-action-btn',              title: '対応フェーズへ',          body: '右のボタンをタップして対応フェーズへ進みましょう',   color: '#f85149' },

        8: { sel: '.player-zone .card.tut-glow',  title: '黄カードをタップ',        body: '光っているカードで洪水ダメージを相殺！',             color: '#d29922' }
      };
      const cfg = CFG[step]; if (!cfg) return;
      const el = document.querySelector(cfg.sel); if (!el) return;
      const PAD = 10;
      const r = el.getBoundingClientRect();
      const b = { x: r.left-PAD, y: r.top-PAD, w: r.width+PAD*2, h: r.height+PAD*2, cx: r.left+r.width/2, cy: r.top+r.height/2 };
      const vw = window.innerWidth, vh = window.innerHeight;
      const cw = Math.min(220, vw-40);
      const cx = Math.round((vw-cw)/2);
      const above = b.cy > vh*0.5;
      const cy = above ? Math.max(16, Math.round(b.y - 110)) : Math.round(b.y + b.h + 20);
      const overlay = document.createElement('div');
      overlay.id = 'step-spotlight-overlay';
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9500;cursor:pointer';
      overlay.innerHTML =
        `<svg style="position:absolute;top:0;left:0;pointer-events:none" width="${vw}" height="${vh}" xmlns="http://www.w3.org/2000/svg"><defs><mask id="ss-mask"><rect width="${vw}" height="${vh}" fill="white"/><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="8" fill="black"/></mask></defs><rect width="${vw}" height="${vh}" fill="rgba(0,0,0,0.72)" mask="url(#ss-mask)"/><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="8" fill="none" stroke="${cfg.color}" stroke-width="2.5"><animate attributeName="stroke-opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="2.5;4.5;2.5" dur="1.2s" repeatCount="indefinite"/></rect><line id="ss-line" x1="${cx+cw/2}" y1="${above?cy+80:cy}" x2="${b.cx}" y2="${above?b.y:b.y+b.h}" stroke="${cfg.color}" stroke-width="1"/></svg>` +
        `<div id="ss-callout" style="position:absolute;left:${cx}px;top:${cy}px;width:${cw}px;background:rgba(22,27,34,0.96);border:2px solid ${cfg.color};border-radius:12px;padding:10px 14px;font-size:.8rem;color:#e6edf3;line-height:1.55;pointer-events:auto" onclick="event.stopPropagation()"><button onclick="event.stopPropagation();document.getElementById('step-spotlight-overlay').remove();document.body.style.overflow=''" style="position:absolute;top:6px;right:8px;background:none;border:none;color:#ffffff;font-size:1rem;cursor:pointer;padding:2px 4px;line-height:1">×</button><div style="font-weight:700;color:${cfg.color};margin-bottom:5px;padding-right:20px">${cfg.title}</div><div>${cfg.body}</div></div>`;
      overlay.onclick = () => { overlay.remove(); document.body.style.overflow = ''; };
      document.body.style.overflow = 'hidden';
      document.body.appendChild(overlay);
      requestAnimationFrame(() => {
        const callout = document.getElementById('ss-callout');
        const line = document.getElementById('ss-line');
        if (callout && line) {
          const cr = callout.getBoundingClientRect();
          line.setAttribute('x1', cr.left + cr.width/2);
          line.setAttribute('y1', above ? cr.bottom : cr.top);
          line.setAttribute('x2', b.cx);
          line.setAttribute('y2', above ? b.y : b.y+b.h);
        }
      });
    }

        case 'setup_required': html = renderSetupRequired(); break;

        case 'lobby': html = renderLobby(); break;
        case 'waiting_connection': html = renderWaitingConnection(); break;
        case 'cityOrder': html = renderCityOrderSelect(); break;
        case 'gacha': html = renderGacha(); break;
        case 'draft': html = renderDraft(); break;
        case 'turnDraw': html = renderTurnDraw(); break;
        case 'turnSummary': html = renderTurnSummary(); break;
        case 'attackerSummary': html = renderAttackerSummary(); break;
        case 'main': html = renderMain(false); break;
        case 'response': html = renderMain(true); break;
        case 'waiting_response': html = renderWaitingResponse(); break;
        case 'discard': html = renderDiscard(); break;
        case 'peek': html = renderPeek(); break;
        case 'gameover': html = renderGameOver(); break;
        case 'waiting': html = renderWaiting(); break;

      if (_pendingMainHpAnims.length > 0 && ['main','response','waiting','waiting_response'].includes(view)) { const _tp = _pendingMainHpAnims.splice(0); for (const a of _tp) setTimeout(() => _animateHp(a.pi, a.fh, a.th), a.delay || 80); }

    // ─── ロビー ───
    function openGalleryZoom(type, id, name) { lobbyState.galleryZoom = { type, id, name }; render(); }

      const track = document.getElementById('city-badges-track');
      const btn = document.getElementById('city-badge-next-btn');
      if (track) track.classList.toggle('page2');
      if (btn) btn.classList.toggle('page2');
    }
    function goGalleryFromResult(type, id, name, tab) {
      G.screen = 'lobby';

      render();

    function galleryBack() {
      lobbyState.galleryZoom = null;
      if (lobbyState.fromResult) {
        G.screen = 'gameover'; lobbyState.mode = 'select'; lobbyState.fromResult = false;
      } else {
        lobbyState.mode = 'select';
      }
      render();
    }

      const _svgCpu = `<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="2" x2="9" y2="4"/><line x1="15" y1="2" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="22"/><line x1="15" y1="20" x2="15" y2="22"/><line x1="20" y1="9" x2="22" y2="9"/><line x1="20" y1="15" x2="22" y2="15"/><line x1="2" y1="9" x2="4" y2="9"/><line x1="2" y1="15" x2="4" y2="15"/></svg>`;
      if (lobbyState.mode === 'select') {
        body = `<div><label class="lobby-label">あなたの名前</label><input id="lobby-name" class="lobby-input" type="text" placeholder="例: 田中" maxlength="12" value="${nv}" oninput="lobbyState.nameInput=this.value"></div>
    ${err}
    <div class="lobby-mode-btns">
      <button class="lobby-btn host" onclick="handleHostClick()">${_svgHouse}<strong>ルームを作成</strong><span style="font-size:.72rem;color:rgba(255,255,255,.6)">ホスト（先攻）</span></button>

    </div>

    </div>`;
      } else if (lobbyState.mode === 'cpu') {
        const _diffBtns = [
          { key: 'easy',   label: 'EASY',   color: '#3fb950', rgb: '63,185,80',  desc: 'ランダム行動<br>練習向け' },
          { key: 'normal', label: 'NORMAL', color: '#d29922', rgb: '210,153,34', desc: 'バランス型<br>標準的な読み' },

        body = `<div><label class="lobby-label">あなたの名前</label><input id="lobby-name" class="lobby-input" type="text" placeholder="例: 田中" maxlength="12" value="${nv}" oninput="lobbyState.nameInput=this.value"></div>

    <div><label class="lobby-label">ルームコード（6文字）</label><input id="lobby-code" class="lobby-input code-input" type="text" placeholder="AB3K7X" maxlength="6" value="${jv}" oninput="lobbyState.joinCodeInput=this.value.toUpperCase();this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')handleJoinClick()"></div>

      const _rlHtml = `<div class="ron-wrap" id="lobby-ron"><div class="ron-lines${_rlLinesCls}"><div class="ron-line"></div><div class="ron-line"></div><div class="ron-line"></div><div class="ron-line"></div><div class="ron-line"></div></div><h1 class="lobby-title ron-text${_rlTextCls}">Ready or Not</h1></div>`;
      const _LICONS = [{src:'images/icons/neon_disaster.webp',glow:'248,81,73'},{src:'images/icons/neon_policy_instant.webp',glow:'210,153,34'},{src:'images/icons/neon_policy_shield.webp',glow:'63,185,80'},{src:'images/icons/neon_city.webp',glow:'56,139,253'}];
      const _neonIconsHtml = `<div class="lobby-neon-icons">${_LICONS.map((ic,i) => { const f = _lobbyTitleAnimDone ? `brightness(1) drop-shadow(0 0 8px rgba(${ic.glow},.85)) drop-shadow(0 0 3px rgba(${ic.glow},1))` : 'brightness(0.04)'; return `<img class="lobby-neon-icon" id="lni-${i}" src="${ic.src}" alt="" style="filter:${f}">`; }).join('')}</div>`;
      const _bgText = Array(12).fill('Ready or Not　　').join('');
      const _bgCols = [0,1,2,3].map(i => {
        const anim = i%2===0 ? 'lobby-scroll-up 28s linear infinite' : 'lobby-scroll-down 28s linear infinite';
        return `<div class="lobby-bg-col"><div class="lobby-bg-col-inner" style="animation:${anim}">${_bgText}</div></div>`;
      }).join('');
      return `<div class="screen active"><div class="lobby-wrap"><div class="lobby-bg-title" aria-hidden="true">${_bgCols}</div><div class="lobby-box${enterClass}">
    <div class="lobby-hero">${_neonIconsHtml}${_rlHtml}</div>
    ${body}
  </div></div></div>`;
    }

      const _svgBack = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0"><polyline points="15 18 9 12 15 6"/></svg>`;
      if (myRole === 'p1') {
        return `<div class="screen active"><div class="lobby-wrap"><div class="lobby-box">
      <div style="text-align:center"><div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;color:#e6edf3"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg><span style="font-size:1.3rem;font-weight:700;color:#e6edf3">ホスト待機中</span></div><p style="color:var(--t1);font-size:.88rem">相手にルームコードまたはURLを共有してください</p></div>

    // ─── 待機画面 ───
    function renderWaiting() {
      let msg = '';
      switch (G.screen) {
        case 'cityOrder': msg = `${G.players[G.cityOrderState?.playerIdx ?? 0].name} が戦闘順を選んでいます`; break;
        case 'gacha': msg = `${G.players[G.gachaCurrent?.playerIdx ?? 0].name} が都市を選んでいます`; break;
        case 'draft': msg = `${G.players[G.draftState?.playerIdx ?? 0].name} が手札を引いています`; break;
        case 'turnDraw': { const pi = G.turnDrawState?.pi ?? G.turnDrawState?.playerIdx ?? 0; msg = G.turnDrawState?.isHazardMap ? `${G.players[pi].name} がハザードマップ整備で<br>カードを引いています` : `${G.players[pi].name} がカードを引いています`; } break;
        case 'turnSummary': msg = `${G.players[G.activePlayer].name} がターンサマリーを確認しています`; break;
        case 'response': msg = `${G.players[G.pendingAttack?.defenderIdx ?? 0].name} が対応カードを選んでいます`; break;
        case 'discard': { const pi = G.discardNeeded?.pi ?? G.discardNeeded?.playerIdx ?? 0; msg = `${G.players[pi].name} が捨て札を選んでいます`; } break;
        case 'peek': msg = `相手が防災協定を使用して<br>あなたの手札を確認しています`; break;
        default: msg = `${G.players[G.activePlayer].name} のターンです`;
      }
      const showBoard = ['main', 'response'].includes(G.screen) && G.players[0].cities.length > 0;
      if (showBoard) {
        const mi = myPlayerIdx, oi = mi === 0 ? 1 : 0;
        return `<div class="screen active">
      <div class="waiting-banner"><span class="pulse-dot" style="background:var(--blue);min-width:10px;height:10px"></span><span>${msg}</span></div>
      ${renderZoneReadOnly(oi, 'opponent')}
      <div class="log-area">${G.log.slice(0, 4).map(l => `<div class="log-entry ${l.cls}">${l.msg}</div>`).join('') || '<div class="log-entry sys">待機中</div>'}</div>
      ${renderZoneReadOnly(mi, 'player')}
    </div>`;
      }
      const _WICONS = [{src:'images/icons/neon_disaster.webp',glow:'248,81,73'},{src:'images/icons/neon_policy_instant.webp',glow:'210,153,34'},{src:'images/icons/neon_policy_shield.webp',glow:'63,185,80'},{src:'images/icons/neon_city.webp',glow:'56,139,253'}];
      const _wNeonHtml = `<div class="lobby-neon-icons">${_WICONS.map((ic,i) => `<img class="lobby-neon-icon" id="wni-${i}" src="${ic.src}" alt="" style="filter:brightness(0.04)">`).join('')}</div>`;
      return `<div class="screen active"><div class="wait-screen">
    ${_wNeonHtml}<div class="wait-title">${msg}</div>
    <div class="wait-sub">相手の操作をお待ちください</div>
  </div></div>`;
    }

    // ─── 対応待ち（守備側が攻撃宣言後に相手の選択を待つ） ───
    function renderWaitingResponse() {
      const atk = G.pendingAttack; if (!atk) return renderWaiting();
      const mi = myPlayerIdx, oi = mi === 0 ? 1 : 0;
      const defHasNegate = G.players[atk.defenderIdx].effects.negateSpecial;
      const isCompoundSkip = atk.card.specialType === 'skip_response' && !defHasNegate;
      const banner = isCompoundSkip
        ? `<div class="waiting-banner red">⚡ ${G.players[atk.attackerIdx].name}が「${atk.card.icon} ${atk.card.name}」を宣言！複合災害：対応フェーズが強制スキップされます...</div>`
        : `<div class="waiting-banner red">⚔️ ${G.players[atk.attackerIdx].name}が「${atk.card.icon} ${atk.card.name}」を宣言！対応フェーズへ自動移行中...</div>`;
      const notice = isCompoundSkip
        ? `<div class="response-pending-bar"><div class="rpb-icon">⚡</div><div class="rpb-text"><strong>複合災害：対応フェーズ強制スキップ</strong><br>政策カードは使用できません。攻撃の解決をお待ちください。</div></div>`
        : `<div class="response-pending-bar"><div class="rpb-icon">⚔️</div><div class="rpb-text"><strong>${G.players[atk.attackerIdx].name}が「${atk.card.icon} ${atk.card.name}」を使用！</strong><br>対応フェーズへ自動移行中...</div></div>`;
      return `<div class="screen active">
    ${banner}
    ${renderZoneReadOnly(oi, 'opponent')}
    ${notice}
    <div class="log-area">${G.log.slice(0, 4).map(l => `<div class="log-entry ${l.cls}">${l.msg}</div>`).join('')}</div>
    ${renderZoneReadOnly(mi, 'player')}
  </div>`;
    }

    // ─── 読み取り専用ゾーン ───
    function renderZoneReadOnly(idx, position) {
      const p = G.players[idx]; if (!p || !p.cities || p.cities.length === 0) return '';
      const c = getActiveCity(idx); const hp = getActiveCityHp(idx); const mxHp = getActiveMaxHp(idx);
      const isMe = (idx === myPlayerIdx);
      return `<div class="${position}-zone">
    <div class="zone-header"><span class="zone-label">${isMe ? 'あなた' : '相手'}</span><span class="city-icon-sm">${c ? terrainImg(c) : ''}</span><button class="city-tap-btn" onclick="showCityInfo(${idx})">${c ? c.name : '?'} ⓘ</button>${c ? `<span class="terrain-badge">(${c.isCoastal ? '海岸' : c.isMountain ? '山間部' : '内陸'})</span>` : ''}</div>
    <div class="hp-section" id="hp-section-${idx}"><div class="hp-bar-wrap"><div class="hp-bar-ghost" id="hp-ghost-${idx}" style="width:${_cityEnterAnimPi === idx ? 0 : Math.max(0, hp / mxHp * 100)}%"></div><div class="hp-bar-fill${hp <= 10 ? ' hp-warn' : ''}" id="hp-fill-${idx}" style="width:${_cityEnterAnimPi === idx ? 0 : Math.max(0, hp / mxHp * 100)}%;background:${hpColor(hp, mxHp)}"></div></div><div class="hp-text" id="hp-text-${idx}" style="color:${hpColor(hp, mxHp)}">${Math.max(0, hp)}/${mxHp}</div>${hp <= 10 ? '<span class="hp-critical-badge">⚠️ 壊滅寸前</span>' : hp <= 30 ? '<span class="hp-danger-badge">危険</span>' : ''}</div>
    ${renderBackupCity(idx)}
    <div class="effects-row">${renderEffectBadges(p.effects, idx)}</div>
    <div class="hand-cards-area">
      ${isMe ? renderPlayerHandReadOnly(p) : `<div class="hand-back-row">${Array(p.hand.length).fill('<div class="card-back"><img src="images/cards/back.webp" alt="" onerror="this.style.display=\'none\'"></div>').join('')}</div>`}
      <div class="hand-count">手札 ${p.hand.length} 枚</div>
    </div>
  </div>`;
    }

    // ─── ガチャ ───
    function renderGacha() {
      const gc = G.gachaCurrent; const p = G.players[gc.playerIdx];

      // All revealed: show 2 picked cities side by side
      if (_gachaAnimState === 'all_revealed') {
        return `<div class="screen active" style="gap:8px;height:calc(100dvh - 24px);max-height:calc(100dvh - 24px);overflow:hidden">
          <div class="section-title" style="margin-bottom:0">${p.name}｜引いた都市 <span style="font-size:.7rem;font-weight:400;color:var(--t2)">2枚</span></div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center">
            <div class="gacha-city-duo">
              ${(_gachaAllCities||[]).map((c,i) => `<div class="gacha-city-duo-item" style="animation-delay:${i*120}ms"><div class="gacha-city-duo-card"><img src="images/cities/${c.id}.webp" alt="" onerror="this.style.opacity='.3'"></div><div class="gacha-city-duo-label">${c.name}</div></div>`).join('')}
            </div>
          </div>
          <div style="display:flex;justify-content:center;padding:6px 0"><button class="btn-ho draft-confirm-appear" onclick="proceedToCityOrder()" style="padding:13px 44px;font-size:1rem">⚔️ 戦闘順を選ぶ</button></div>
        </div>`;
      }

      // Reveal overlay (neon → slide → pause → exit)
      const overlay = (() => {
        const city = _gachaRevealingCity;
        if (!city) return '';
        if (_gachaAnimState === 'revealing_neon') {
          return `<div class="draft-reveal-overlay"><div class="draft-neon-bg"><img class="draft-neon-icon-pos" id="gcni-0" src="images/icons/neon_city.webp" alt="" style="top:50%;left:50%;transform:translate(-50%,-50%);width:min(55vw,180px);filter:brightness(0.04)"></div></div>`;
        }
        if (_gachaAnimState === 'revealing_card') {
          return `<div class="draft-reveal-overlay"><div class="draft-large-card"><img src="images/cities/${city.id}.webp" alt="" onerror="this.style.opacity='.3'"><div class="draft-large-flash"></div><div class="draft-card-label">${cardTypeIconHtml('city',null,22)}<span>${city.name}</span></div></div></div>`;
        }
        if (_gachaAnimState === 'card_paused') {
          const advBtn = _gachaBulkMode ? '' : `<button class="draft-advance-btn" onclick="advanceGachaCard()">›</button>`;
          return `<div class="draft-reveal-overlay"><div class="draft-large-card" style="animation:none"><img src="images/cities/${city.id}.webp" alt="" onerror="this.style.opacity='.3'"><div class="draft-card-label">${cardTypeIconHtml('city',null,22)}<span>${city.name}</span></div></div>${advBtn}</div>`;
        }
        if (_gachaAnimState === 'card_exiting') {
          return `<div class="draft-reveal-overlay"><div class="draft-large-card exiting"><img src="images/cities/${city.id}.webp" alt="" onerror="this.style.opacity='.3'"><div class="draft-card-label">${cardTypeIconHtml('city',null,22)}<span>${city.name}</span></div></div></div>`;
        }
        return '';
      })();

      let firstPickInfo = '';
      if (gc.pickNum === 1 && p.cities.length > 0) { const fc = p.cities[0]; firstPickInfo = `<div class="gacha-first-pick">✅ 1枚目：${terrainImg(fc, 18)} <strong>${fc.name}</strong>　${fc.abilityDesc}</div>`; }

      const isRandomMode = !isCpuMode || cpuDifficulty === 'hard';
      const pickLabel = gc.pickNum === 0 ? '1枚目' : '2枚目';

      // Random mode (online / CPU HARD) and player's turn: show stacked cards like draft
      if (isRandomMode && gc.playerIdx === myPlayerIdx && !gc.candidates && !gc.revealed) {
        const remaining = 2 - gc.pickNum; // 2 or 1 cards left in stack
        const stackCards = Array.from({ length: remaining }, (_, i) => {
          const isTop = i === 0;
          const offset = i * 6;
          const br = (1 - i * 0.16).toFixed(2);
          return `<div class="draft-stack-card${isTop ? ' top-card' : ''}" style="top:${offset}px;left:${offset}px;z-index:${remaining - i};filter:brightness(${br})"${isTop ? ' onclick="pullGacha()"' : ''}><img src="images/cities/back.webp" alt=""></div>`;
        }).join('');
        const wrapW = 118 + (remaining > 1 ? 6 : 0) + 12;
        const flipAllBtn = _gachaAnimState ? '' : `<button class="btn-flip-all" onclick="flipAllGachaCities()">一括開封</button>`;
        return `<div class="screen active" style="gap:6px;height:calc(100dvh - 24px);max-height:calc(100dvh - 24px);overflow:hidden">
          ${overlay}
          <div class="section-title" style="margin-bottom:0">${p.name}｜都市ガチャ <span style="font-size:.7rem;font-weight:400;color:var(--t2)">${pickLabel}</span></div>
          ${firstPickInfo}
          <div class="draft-stack-area">
            <div class="draft-stack-wrap" style="width:${wrapW}px;height:192px">${stackCards}</div>
            <div class="draft-tap-text">カードをタップしよう</div>
          </div>
          <div class="draft-actions">${flipAllBtn}</div>
        </div>`;
      }

      // Non-random (CPU EASY/NORMAL): candidate selection, already revealed, or awaiting opponent
      let ca = '';
      if (gc.candidates && gc.candidates.length) {
        const cols = gc.candidates.length === 2 ? 'repeat(2,1fr)' : 'repeat(3,1fr)';
        const cards = gc.candidates.map(c => `<div class="gacha-candidate-card" onclick="acceptGachaCandidate('${c.id}')"><img src="images/cities/${c.id}.webp" alt="" onerror="this.style.opacity='.3'"><div class="gacha-cand-info"><div style="font-weight:700;font-size:.85rem;line-height:1.2">${c.name}</div><div style="font-size:.7rem;color:var(--t2);margin-top:2px">${c.isCoastal ? '🌊 海岸' : c.isMountain ? '⛰️ 山間部' : '🏙️ 内陸'} · HP ${c.hp}</div><div style="font-size:.65rem;color:var(--t3);margin-top:3px;line-height:1.3">${c.abilityDesc}</div></div></div>`).join('');
        ca = `<div class="gacha-candidates" style="grid-template-columns:${cols}">${cards}</div><div style="text-align:center;color:var(--t3);font-size:.75rem;margin-top:10px">都市をタップして選択</div>`;
      } else if (!gc.revealed) {
        const btnLabel = cpuDifficulty === 'easy' ? '🎲 3枚から選ぶ' : '🎲 2枚から選ぶ';
        ca = `<div class="gacha-card-reveal-area" onclick="pullGacha()"><img src="images/cities/back.webp" alt=""></div><button class="btn-gacha" onclick="pullGacha()">${btnLabel}</button>`;
      } else {
        const c = gc.revealed; ca = `<div class="gacha-card-reveal-area revealed gacha-reveal"><img src="images/cities/${c.id}.webp" alt="" onerror="this.style.opacity='.3'"></div><button class="btn-accept" onclick="acceptGachaCity()">✅ この都市で進む</button>`;
      }
      return `<div class="screen active">${overlay}<div class="section-title" style="margin-bottom:0">${p.name}｜都市ガチャ <span style="font-size:.7rem;font-weight:400;color:var(--t2)">${pickLabel}</span></div>${firstPickInfo}<div class="gacha-stage">${ca}</div></div>`;
    }

    // ─── 予備都市 ───
    function renderBackupCity(pi) {
      const p = G.players[pi];
      if (p.activeCityIdx !== 0) return `<div style="font-size:.7rem;color:var(--t3);margin-bottom:4px">予備都市なし</div>`;
      if (p.cities.length < 2) return '';
      // 相手の2体目は1体目が壊滅するまで常に隠す。自分の2体目は常に見える
      if (pi !== myPlayerIdx && myRole !== 'spectator') return `<div class="backup-city-row"><span class="backup-label" style="color:var(--t3);font-style:italic">予備都市: 未登場</span></div>`;
      const bc = p.cities[1]; const bHp = p.cityHps[1]; const pct = Math.max(0, bHp / bc.hp * 100);
      return `<div class="backup-city-row"><span class="backup-label">予備: ${terrainImg(bc, 16)} ${bc.name}</span><div class="hp-bar-mini"><div class="hp-bar-mini-fill" style="width:${pct}%;background:${hpColor(bHp, bc.hp)}"></div></div><span class="backup-hp-text" style="color:${hpColor(bHp, bc.hp)}">${bHp}/${bc.hp}</span></div>`;
    }

    // ─── 効果バッジ ───
    function renderEffectBadges(eff, pi) {
      const b = [];
      if (eff.shieldQuakeFire) b.push(`<span class="eff-badge eff-blue">🏗️ 耐震シールド</span>`);
      if (eff.shieldFlood) b.push(`<span class="eff-badge eff-blue">🌊 堤防シールド</span>`);
      if (eff.negateSpecial) b.push(`<span class="eff-badge eff-blue">📢 特殊効果無効</span>`);
      if (eff.damageReduceHits > 0) b.push(`<span class="eff-badge eff-yellow">🏛️ 全ダメ−15（残${eff.damageReduceHits}回）</span>`);
      if (eff.floodBonusTurns > 0) { const _fc = pi != null ? getActiveCity(pi) : null; const _fa = _fc?.abilityValue ?? 1; b.push(`<span class="eff-badge eff-blue">💧 予算+${_fa}</span>`); }
      return b.join('') || `<span class="eff-badge eff-gray">効果なし</span>`;
    }

    // ─── 手札描画（操作可能） ───
    function renderPlayerHand(p, pi) {
      const isFirstTurn = (pi === 0 && G.turnsEach[0] === 0); const left = getBudgetLeft(pi);
      function mkCard(card) {
        const cantAfford = left < card.cost; const ftBlk = isFirstTurn && card.type === 'disaster'; const dis = cantAfford || ftBlk;
        let reason = ''; if (cantAfford) reason = '予算不足'; else if (ftBlk) reason = '先攻1ターン目は使用不可';
        const oc = dis ? '' : `requestConfirm('playCard','${card.uid}','${card.name.replace(/'/g, "\\'")}','${card.icon}','${card.type}','使用')`;
        const _isNew = card.uid === _lastDrawnCardUid;
        const _isPlaying = card.uid === _playingCardUid;
        return `<div class="card ${card.type} ${dis ? 'card-disabled' : 'card-usable'}${_isNew ? ' card-just-drawn' : ''}${_isPlaying ? ' card-play-out' : ''}" data-ctype="${cardCtype(card)}" onclick="${oc}" style="cursor:${dis ? 'not-allowed' : 'pointer'}"><div class="card-header"><span class="card-icon">${card.icon}</span><span class="card-cost">${card.cost}</span></div><div class="card-img-wrap"><img class="card-img" src="images/cards/${card.id}.webp" alt="" onerror="this.closest('.card').classList.add('img-fail')"><div class="card-name-bar">${card.name}</div></div><div class="card-name card-text-fallback">${card.name}</div><div class="card-desc card-text-fallback">${card.desc}</div><span class="card-type-badge">${card.type === 'policy' ? '政策' : '災害'}</span>${reason ? `<div class="card-disabled-reason">${reason}</div>` : ''}</div>`;
      }
      const pols = p.hand.filter(c => c.type === 'policy').sort((a, b) => a.cost - b.cost);
      const dis = p.hand.filter(c => c.type === 'disaster').sort((a, b) => a.cost - b.cost);
      const s = [];
      if (pols.length > 0) s.push(`<div class="hand-group"><div class="hand-group-label policy-label">政策</div><div class="hand-group-cards">${pols.map(mkCard).join('')}</div></div>`);
      if (dis.length > 0) s.push(`<div class="hand-group"><div class="hand-group-label disaster-label">災害</div><div class="hand-group-cards">${dis.map(mkCard).join('')}</div></div>`);
      return `<div class="hand-groups">${s.join('')}</div>`;
    }

    // ─── 手札描画（読み取り専用：自分のターン外） ───
    function renderPlayerHandReadOnly(p) {
      function mkCard(card) { return `<div class="card ${card.type} card-disabled" data-ctype="${cardCtype(card)}" style="cursor:default"><div class="card-header"><span class="card-icon">${card.icon}</span><span class="card-cost">${card.cost}</span></div><div class="card-img-wrap"><img class="card-img" src="images/cards/${card.id}.webp" alt="" onerror="this.closest('.card').classList.add('img-fail')"><div class="card-name-bar">${card.name}</div></div><div class="card-name card-text-fallback">${card.name}</div><div class="card-desc card-text-fallback">${card.desc}</div><span class="card-type-badge">${card.type === 'policy' ? '政策' : '災害'}</span></div>`; }
      const pols = p.hand.filter(c => c.type === 'policy').sort((a, b) => a.cost - b.cost);
      const dis = p.hand.filter(c => c.type === 'disaster').sort((a, b) => a.cost - b.cost);
      const s = [];
      if (pols.length > 0) s.push(`<div class="hand-group"><div class="hand-group-label policy-label">政策</div><div class="hand-group-cards">${pols.map(mkCard).join('')}</div></div>`);
      if (dis.length > 0) s.push(`<div class="hand-group"><div class="hand-group-label disaster-label">災害</div><div class="hand-group-cards">${dis.map(mkCard).join('')}</div></div>`);
      return `<div class="hand-groups">${s.join('')}</div>`;
    }

    // ─── 手札描画（観戦者神視点：黒レイヤーなし・フリップ対応） ───
    function renderPlayerHandSpectator(p) {
      function mkCard(card) {
        const isNew = card.uid === _lastDrawnCardUid;
        return `<div class="card ${card.type} card-spectator${isNew ? ' card-just-drawn' : ''}" data-ctype="${cardCtype(card)}" style="cursor:default"><div class="card-header"><span class="card-icon">${card.icon}</span><span class="card-cost">${card.cost}</span></div><div class="card-img-wrap"><img class="card-img" src="images/cards/${card.id}.webp" alt="" onerror="this.closest('.card').classList.add('img-fail')"><div class="card-name-bar">${card.name}</div></div><div class="card-name card-text-fallback">${card.name}</div><div class="card-desc card-text-fallback">${card.desc}</div><span class="card-type-badge">${card.type === 'policy' ? '政策' : '災害'}</span></div>`;
      }
      const pols = p.hand.filter(c => c.type === 'policy').sort((a, b) => a.cost - b.cost);
      const dis  = p.hand.filter(c => c.type === 'disaster').sort((a, b) => a.cost - b.cost);
      const s = [];
      if (pols.length > 0) s.push(`<div class="hand-group"><div class="hand-group-label policy-label">政策</div><div class="hand-group-cards">${pols.map(mkCard).join('')}</div></div>`);
      if (dis.length  > 0) s.push(`<div class="hand-group"><div class="hand-group-label disaster-label">災害</div><div class="hand-group-cards">${dis.map(mkCard).join('')}</div></div>`);
      return `<div class="hand-groups">${s.join('')}</div>`;
    }

    // ─── 手札描画（対応フェーズ） ───
    function renderResponseHand(p, atkCard) {
      if (p.hand.length === 0) return `<div style="color:var(--t3);font-size:.85rem;padding:10px">手札なし</div>`;
      const mi = myPlayerIdx;
      const curHp = getActiveCityHp(mi);
      function mkCard(card) {
        const dis = card.type !== 'policy';
        // ③ シールドカードのディム：使っても0軽減になるカードを視覚的に減退させる
        const ineff = !dis && atkCard && (
          (card.effectType === 'shield_quake_fire' && atkCard.id !== 'earthquake' && atkCard.id !== 'wildfire') ||
          (card.effectType === 'shield_flood' && atkCard.id !== 'flood' && atkCard.id !== 'tsunami')
        );
        const oc = dis ? '' : `requestConfirm('playResponseCard','${card.uid}','${card.name.replace(/'/g, "\\'")}','${card.icon}','${card.type}','対応に使用')`;
        const _isPlaying = card.uid === _playingCardUid;
        // ④ カードごとのHP予測をバッジに表示
        const hpBand = (!dis && atkCard) ? `<div class="card-hp-band" style="white-space:nowrap">予測HP<strong>${Math.max(0, curHp - computeResponseEst(atkCard, mi, card))}</strong></div>` : '';
        const badge = dis ? `<span class="card-type-badge">災害（使用不可）</span>` : `<span class="card-type-badge">対応</span>`;
        return `<div class="card ${card.type} ${dis ? 'card-disabled' : 'card-usable'}${_isPlaying ? ' card-play-out' : ''}${ineff ? ' card-ineffective' : ''}" data-ctype="${cardCtype(card)}" onclick="${oc}" style="cursor:${dis ? 'not-allowed' : 'pointer'}"><div class="card-header"><span class="card-icon">${card.icon}</span><span class="card-cost" style="font-size:.6rem">${dis ? card.cost + 'pt' : '無料'}</span></div><div class="card-img-wrap"><img class="card-img" src="images/cards/${card.id}.webp" alt="" onerror="this.closest('.card').classList.add('img-fail')"><div class="card-name-bar">${card.name}</div>${hpBand}</div><div class="card-name card-text-fallback">${card.name}</div><div class="card-desc card-text-fallback">${card.desc}</div>${badge}${dis ? `<div class="card-disabled-reason">対応フェーズは政策カードのみ</div>` : ''}</div>`;
      }
      const pols = p.hand.filter(c => c.type === 'policy').sort((a, b) => a.cost - b.cost);
      const dis = p.hand.filter(c => c.type === 'disaster').sort((a, b) => a.cost - b.cost);
      const s = [];
      if (pols.length > 0) s.push(`<div class="hand-group"><div class="hand-group-label policy-label">政策（対応可）</div><div class="hand-group-cards">${pols.map(mkCard).join('')}</div></div>`);
      if (dis.length > 0) s.push(`<div class="hand-group"><div class="hand-group-label disaster-label">災害（使用不可）</div><div class="hand-group-cards">${dis.map(mkCard).join('')}</div></div>`);
      return `<div class="hand-groups">${s.join('')}</div>`;
    }

    // ─── メインゲーム（自分が常に下ゾーン） ───
    function renderMain(isResponsePhase) {
      const mi = myPlayerIdx, oi = mi === 0 ? 1 : 0; const ap = G.activePlayer;
      const deviceHolder = isResponsePhase ? G.pendingAttack.defenderIdx : ap;

      const budget = getBudget(ap), left = getBudgetLeft(ap);

      const stateBanner = !amIHolder ? `<div class="state-banner ${isResponsePhase ? 'state-banner-response' : 'state-banner-waiting'}">${isResponsePhase ? '⚠️ 相手が対応フェーズを処理中...' : `<strong>${G.players[ap].name}</strong> のターン進行中...`}</div>` : '';

      function zoneHand(idx) {
        const isMe = (idx === mi);

        if (amIHolder) return isResponsePhase ? renderResponseHand(G.players[idx], G.pendingAttack ? G.pendingAttack.card : null) : renderPlayerHand(G.players[idx], idx);
        return renderPlayerHandReadOnly(G.players[idx]);
      }

      let pendingBar = '';
      if (hasPending) {
        if (isResponsePhase) {
          const _rpbAtk = G.pendingAttack;
          const _rpbBreak = buildDmgBreakdown(_rpbAtk.card, mi);
          const _rpbHpAfter = Math.max(0, getActiveCityHp(mi) - _rpbBreak.total);
          const _modStr = _rpbBreak.mods.filter(m => m.delta !== 0).map(m => m.delta > 0 ? `<span style="color:var(--red)">+${m.delta}(${m.label})</span>` : `<span style="color:var(--green)">${m.delta}(${m.label})</span>`).join(' ');
          const _breakHtml = `<div class="rdp-breakdown">推定 <b>${_rpbBreak.total}</b>ダメージ${_rpbBreak.mods.length ? `<span style="font-size:.68rem;color:var(--t3);margin-left:5px">基礎${_rpbBreak.base} ${_modStr}</span>` : ''}</div>`;
          const _specialLabels = { 'discard_policy': '特殊効果：手札を1枚ランダム廃棄', 'coastal_bonus': '特殊効果：海岸・沿岸都市に +10', 'mountain_bonus': '特殊効果：山間部都市に +10', 'inland_bonus': '特殊効果：内陸都市に +10' };
          const _specialLabel = _rpbAtk.card.specialType ? (_specialLabels[_rpbAtk.card.specialType] || '') : '';
          const _specialSpan = _specialLabel ? `<span class="rdp-item rdp-special">${_specialLabel}</span>` : '';
          const _dmgPreview = `<div class="response-dmg-preview"><span class="rdp-item rdp-skip">対応なし → HP <strong>${_rpbHpAfter}</strong></span>${_specialSpan}</div>`;
          pendingBar = `<div class="response-pending-bar"><div class="rpb-icon">⚠️</div><div class="rpb-text"><strong>${G.players[_rpbAtk.attackerIdx].name}が「${_rpbAtk.card.icon} ${_rpbAtk.card.name}」を使用！</strong>${_breakHtml}${_dmgPreview}</div><button class="btn-skip-resp" onclick="skipResponse()">対応しない</button></div>`;
        } else if (isMyAttack) {
          const _atk = G.pendingAttack;
          const _defHasNegate = G.players[_atk.defenderIdx].effects.negateSpecial;
          if (_atk.card.specialType === 'skip_response' && !_defHasNegate) {
            pendingBar = `<div class="response-pending-bar"><div class="rpb-icon">⚡</div><div class="rpb-text"><strong>「${_atk.card.icon} ${_atk.card.name}」を宣言！</strong><br>複合災害：${G.players[_atk.defenderIdx].name}の対応フェーズを強制スキップ中...</div></div>`;
            if (!G._pendingAutoHandover) { G._pendingAutoHandover = true; setTimeout(() => { G._pendingAutoHandover = false; goResponseHandover(); }, 700); }
          } else if (_atk.card.specialType === 'skip_response' && _defHasNegate) {
            pendingBar = `<div class="response-pending-bar"><div class="rpb-icon">⚡</div><div class="rpb-text"><strong>「${_atk.card.icon} ${_atk.card.name}」を宣言！</strong><br>広域避難指示が有効 — 対応フェーズへ移行中...</div></div>`;
            if (!G._pendingAutoHandover) { G._pendingAutoHandover = true; setTimeout(() => { G._pendingAutoHandover = false; goResponseHandover(); }, 700); }
          } else {
            pendingBar = `<div class="response-pending-bar"><div class="rpb-icon">⚔️</div><div class="rpb-text"><strong>「${_atk.card.icon} ${_atk.card.name}」を宣言！</strong><br>${G.players[_atk.defenderIdx].name}の対応フェーズへ移行中...</div></div>`;
            if (!G._pendingAutoHandover) { G._pendingAutoHandover = true; setTimeout(() => { G._pendingAutoHandover = false; goResponseHandover(); }, 700); }
          }
        }
      }

      const logAll = G.log.slice(0, 30).map(l => `<div class="log-entry ${l.cls}">${l.msg}</div>`).join('');
      const toggleBtn = G.log.length > 3 ? `<button class="log-toggle" onclick="_logExpanded=!_logExpanded;render()">${_logExpanded ? '▲ 閉じる' : `▼ ${Math.min(G.log.length, 30)}件すべて表示`}</button>` : '';
      let statusBar = '';
      if (ap === mi && !hasPending && !isResponsePhase) {
        statusBar = `<div class="status-bar"><span class="turn-badge">ターン ${G.turnsEach[ap] + 1} | ${G.players[ap].name}</span>
      <div class="budget-display"><span class="budget-label">予算</span><div class="budget-pips">${Array(budget).fill(0).map((_, i) => `<div class="pip ${i < (budget - left) ? 'used' : 'avail'}"></div>`).join('')}</div><span style="font-size:.8rem;font-weight:700;color:var(--green)">${left}<span style="color:var(--t2);font-weight:400">/${budget}</span></span></div>
      </div>`;
      }

      const isFirstTurn = (ap === mi && G.turnsEach[0] === 0);
      // 自動ターン終了判定
      function canPlayAnyCard() {
        if (hasPending || isResponsePhase) return true;
        const p = G.players[ap]; if (ap !== mi) return true;
        const bl = getBudgetLeft(ap);
        return p.hand.some(c => {
          if (c.cost > bl) return false;
          if (isFirstTurn && c.type === 'disaster') return false;
          return true;
        });
      }
      const shouldAutoEnd = (ap === mi && !hasPending && !isResponsePhase && !canPlayAnyCard());

      function renderZone(idx, position, footer = '') {
        const p = G.players[idx]; const c = getActiveCity(idx); const hp = getActiveCityHp(idx); const mxHp = getActiveMaxHp(idx);
        const isHolder = (idx === deviceHolder); const isMe = (idx === mi);
        const label = isMe ? (isResponsePhase ? 'あなた（対応中）' : 'あなた') : (isHolder ? '相手（操作中）' : '相手（待機中）');
        const bdr = isHolder && isMe ? 'border-left:3px solid var(--green)' : isHolder && !isMe ? 'border-left:3px solid var(--red)' : '';
        const terrainLabel = c ? `<span class="terrain-badge">(${c.isCoastal ? '海岸' : c.isMountain ? '山間部' : '内陸'})</span>` : '';
        const isMyActive = isMe && ap === mi && !hasPending && !isResponsePhase;
        return `<div class="${position}-zone${isMyActive ? " my-turn-active" : ""}" style="${bdr}">
      <div class="zone-header"><span class="zone-label">${label}</span><span class="city-icon-sm">${c ? terrainImg(c) : ''}</span><button class="city-tap-btn" onclick="showCityInfo(${idx})">${c ? c.name : '?'} ⓘ</button>${terrainLabel}</div>
      <div class="hp-section" id="hp-section-${idx}"><div class="hp-bar-wrap"><div class="hp-bar-ghost" id="hp-ghost-${idx}" style="width:${_cityEnterAnimPi === idx ? 0 : Math.max(0, hp / mxHp * 100)}%"></div><div class="hp-bar-fill${hp <= 10 ? ' hp-warn' : ''}" id="hp-fill-${idx}" style="width:${_cityEnterAnimPi === idx ? 0 : Math.max(0, hp / mxHp * 100)}%;background:${hpColor(hp, mxHp)}"></div></div><div class="hp-text" id="hp-text-${idx}" style="color:${hpColor(hp, mxHp)}">${Math.max(0, hp)}/${mxHp}</div>${hp <= 10 ? '<span class="hp-critical-badge">⚠️ 壊滅寸前</span>' : hp <= 30 ? '<span class="hp-danger-badge">危険</span>' : ''}</div>
      ${renderBackupCity(idx)}
      <div class="effects-row">${renderEffectBadges(p.effects, idx)}</div>
      <div class="hand-cards-area">${isMe ? zoneHand(idx) : `<div class="hand-back-row">${zoneHand(idx)}</div>`}${!isMe ? `<div class="hand-count">手札 ${p.hand.length} 枚</div>` : ''}</div>
    ${footer}</div>`;
      }

      // レイアウト: 相手ゾーン → ログ → ステータスバー → pendingBar/ターン終了 → 自分ゾーン
      let actionBar = '';
      if (shouldAutoEnd) {
        actionBar = `<div class="auto-end-bar"><div class="auto-end-text">⚙️ 使えるカードがありません。ターンを終了します…</div></div>`;
        if (!G._autoEndScheduled) { G._autoEndScheduled = true; setTimeout(() => { G._autoEndScheduled = false; endTurn(); }, 2500); }
      } else if (hasPending) {
        actionBar = pendingBar;
      } else if (ap === mi && !isResponsePhase) {
        actionBar = `<div class="action-bar"><button class="btn-end" onclick="requestEndTurn()">ターン終了 →</button></div>`;
      }

      return `<div class="screen active"><div class="battle-layout${isResponsePhase ? ' response-phase' : ''}">
    ${stateBanner}

    function cardTypeIconHtml(type, color, size) {

    // ─── 確認モーダル ───
    function renderConfirmModal() {
      const c = G.confirm;
      if (c.fn === 'endTurn') {
        const left = getBudgetLeft(G.activePlayer);
        return `<div class="confirm-overlay" onclick="cancelConfirm()"><div class="confirm-box" onclick="event.stopPropagation()">
          <div style="text-align:center;margin-bottom:8px"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:44px;height:44px"><circle cx="12" cy="12" r="9"/><path d="M9 7l3 4 3-4M9 11h6M9 14h6M12 11v6"/></svg></div>
          <div class="confirm-card-preview"><strong>予算 ${left}pt が残っています</strong></div>
          <p>本当にターンを終了しますか？</p>

        </div></div>`;

      const tl = c.cardType === 'policy' ? '政策カード' : c.cardType === 'disaster' ? '災害カード' : 'カード';
      let hint = '';
      if (c.cardType === 'disaster' && c.fn === 'playCard') {
        const defIdx = G.activePlayer === 0 ? 1 : 0; const defCity = getActiveCity(defIdx); const card = G.players[G.activePlayer].hand.find(cd => cd.uid === c.uid);
        if (card && defCity && card.baseDamage) {
          const base = card.baseDamage; let bonus = 0; let bl = '';
          if (card.specialType === 'coastal_bonus' && defCity.isCoastal) { bonus = 10; bl = `${defCity.name}（海岸）`; }
          else if (card.specialType === 'mountain_bonus' && defCity.isMountain) { bonus = 10; bl = `${defCity.name}（山間部）`; }
          else if (card.specialType === 'inland_bonus' && !defCity.isCoastal && !defCity.isMountain) { bonus = 10; bl = `${defCity.name}（内陸）`; }

          else hint = `<div style="margin:4px 0;padding:5px 10px;background:rgba(139,148,158,.1);border-radius:6px;font-size:.8rem;color:var(--t2);text-align:center">基礎ダメージ <strong style="color:var(--t1)">${base}</strong></div>`;
        }
      }
      if (c.cardType === 'policy') {
        const pi = (c.fn === 'playResponseCard') ? G.pendingAttack.defenderIdx : G.activePlayer; const card = G.players[pi].hand.find(cd => cd.uid === c.uid);
        if (card) {
          const p = G.players[pi]; const curHp = p.cityHps[p.activeCityIdx]; const mxHp = getActiveMaxHp(pi); let h = '';
          if (c.fn === 'playResponseCard' && G.pendingAttack) {
            // 対応フェーズ：防御側が把握できる全要素を込みにした予測
            const atk = G.pendingAttack.card; const est = computeFullDefenderEst(atk, pi);

            else if (card.effectType === 'shield_quake_fire') { if (atk.id === 'earthquake' || atk.id === 'wildfire') { h = `この攻撃に適用：−30 → 予測ダメージ <strong style="color:var(--green)">${Math.max(0, est - 30)}</strong>`; } else { h = 'この攻撃には不適用（次の地震・大火災に −30 設置）'; } }
            else if (card.effectType === 'shield_flood') { if (atk.id === 'flood' || atk.id === 'tsunami') { h = `この攻撃に適用：−25 → 予測ダメージ <strong style="color:var(--green)">${Math.max(0, est - 25)}</strong>`; } else { h = 'この攻撃には不適用（次の洪水・津波に −25 設置）'; } }
            else if (card.effectType === 'negate_special') { const withN = computeFullDefenderEst(atk, pi, true); h = `特殊効果を無効＋ダメージ−10 → 予測ダメージ <strong style="color:var(--green)">${withN}</strong>`; }
            else if (card.effectType === 'damage_reduce_2t') { h = `全ダメージ −15（次2回）→ 予測ダメージ <strong style="color:var(--green)">${Math.max(0, est - 15)}</strong>`; }
            else if (card.effectType === 'draw') { h = `山札から ${card.value} 枚ドロー`; }
            else if (card.effectType === 'peek_all') { h = '相手の手札を全公開'; }
          } else {

            if (card.effectType === 'heal') { const aH = Math.min(curHp + card.value, mxHp); h = `HP +${card.value} 回復　<strong style="color:var(--green)">${curHp} → ${aH}</strong>`; }
            else if (card.effectType === 'shield_quake_fire') { if (G.pendingAttack && (G.pendingAttack.card.id === 'earthquake' || G.pendingAttack.card.id === 'wildfire')) { const e = computeEstDmg(G.pendingAttack.card, pi); h = `この攻撃に適用：−30 → 予測 <strong style="color:var(--green)">${Math.max(0, e - 30)}</strong>`; } else h = '次の地震・大火災を −30（シールド設置）'; }
            else if (card.effectType === 'shield_flood') { if (G.pendingAttack && (G.pendingAttack.card.id === 'flood' || G.pendingAttack.card.id === 'tsunami')) { const e = computeEstDmg(G.pendingAttack.card, pi); h = `この攻撃に適用：−25 → 予測 <strong style="color:var(--green)">${Math.max(0, e - 25)}</strong>`; } else h = '次の洪水・津波を −25（シールド設置）'; }
            else if (card.effectType === 'negate_special') h = G.pendingAttack ? '特殊効果を無効化＋ダメージ−10' : '次の災害の特殊効果を無効化＋ダメージ−10';
            else if (card.effectType === 'damage_reduce_2t') { if (G.pendingAttack) { const e = computeEstDmg(G.pendingAttack.card, pi); h = `全ダメージ −15（次2回）→ 予測 <strong style="color:var(--green)">${Math.max(0, e - 15)}</strong>`; } else h = '全ダメージ −15（次2回の攻撃）'; }

          if (h) hint = `<div style="margin:4px 0;padding:6px 10px;background:rgba(56,139,253,.12);border-radius:6px;font-size:.8rem;color:var(--t2);text-align:center">${h}</div>`;
        }
      }
      const cardId = c.uid.replace(/_\d+$/, '');
      const _cpi = (c.fn === 'playResponseCard') ? G.pendingAttack.defenderIdx : G.activePlayer;
      const _ccard = G.players[_cpi]?.hand.find(cd => cd.uid === c.uid);
      const _cIcon = cardTypeIconHtml(c.cardType, _ccard?.color);
      return `<div class="confirm-overlay" onclick="cancelConfirm()"><div class="confirm-box" onclick="event.stopPropagation()">

    // ─── 捨て札選択 ───
    function renderDiscard() {
      const dn = G.discardNeeded; const pi = dn.pi ?? dn.playerIdx; const p = G.players[pi]; const excess = p.hand.length - 5;

    // ─── 初期ドラフト ───
    function renderDraft() {
      const ds = G.draftState; const p = G.players[ds.playerIdx];

        const rc = ds.revealingCard;
        if (!rc) return '';
        const neonSrc = rc.type === 'disaster' ? 'neon_disaster.webp'
          : rc.color === 'green' ? 'neon_policy_shield.webp'
          : 'neon_policy_instant.webp';

          return `<div class="draft-reveal-overlay">
            <div class="draft-neon-bg">
              <img class="draft-neon-icon-pos" id="drni-0" src="images/icons/${neonSrc}" alt="" style="top:50%;left:50%;transform:translate(-50%,-50%);width:min(55vw,180px);filter:brightness(0.04)">
            </div>
          </div>`;
        }
        if (ds.animState === 'revealing_card') {
          return `<div class="draft-reveal-overlay">

        }
        if (ds.animState === 'card_paused') {
          return `<div class="draft-reveal-overlay">
            <div class="draft-large-card" style="animation:none">
              <img src="images/cards/${rc.id}.webp" alt="" onerror="this.style.opacity='.3'">

      // Stack (remaining face-down cards)
      const unflipped = ds.dealtCards.filter(c => !ds.flippedUids.includes(c.uid));

        <div class="section-title" style="margin-bottom:0">${p.name}｜初期手札のドロー <span style="font-size:.7rem;font-weight:400;color:var(--t2)">${ds.flippedUids.length}／${ds.picksTarget}枚</span></div>

      </div>`;

    function startPeekDiscard() { _peekDiscardMode = true; render(); }

    function peekDiscard(uid) {
      const pi = G.peekByPlayerIdx ?? G.activePlayer;
      const p = G.players[pi];
      const idx = p.hand.findIndex(c => c.uid === uid);
      if (idx === -1) return;
      const card = p.hand.splice(idx, 1)[0];
      G.discard.push(card);
      addLog(`📤 ${p.name}が防災協定で手札1枚を捨てた（${card.icon} ${card.name}）`, 'sys');
      closePeek();
    }
