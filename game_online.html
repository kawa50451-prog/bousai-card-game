<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ready or Not</title>
  <link rel="icon" href="images/icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ready or Not">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      background: #080d14;
      touch-action: pan-x pan-y;
    }

    :root {
      --bg0: #0d1117;
      --bg1: #161b22;
      --bg2: #21262d;
      --bg3: #30363d;
      --t1: #e6edf3;
      --t2: #8b949e;
      --t3: #484f58;
      --blue: #388bfd;
      --red: #f85149;
      --green: #3fb950;
      --yellow: #e3b341;
      --purple: #a371f7;
      --card-h: 140px;
      --card-w: 100px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: radial-gradient(ellipse at 30% 0%, #111827 0%, #0d1117 45%, #080d14 100%);
      color: var(--t1);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden
    }

    #app {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column
    }

    .screen {
      display: none;
      flex-direction: column;
      gap: 12px;
      flex: 1
    }

    .screen.active {
      display: flex
    }

    /* LOBBY */
    .lobby-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .lobby-bg-title {
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
      display: flex;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      overflow: hidden;
    }
    .lobby-bg-col {
      flex: 1;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }
    .lobby-bg-col-inner {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif;
      font-weight: 900;
      font-size: 13vh;
      color: #1c2438;
      letter-spacing: 0;
      white-space: nowrap;
      will-change: transform;
    }
    @keyframes lobby-scroll-up {
      from { transform: translateY(0) }
      to   { transform: translateY(-50%) }
    }
    @keyframes lobby-scroll-down {
      from { transform: translateY(-50%) }
      to   { transform: translateY(0) }
    }

    .lobby-box {
      background: var(--bg1);
      border: 1px solid var(--bg3);
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 440px;
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .5)
    }

    .lobby-hero {
      text-align: center
    }

    .lobby-title {
      font-size: 4rem;
      font-weight: 900;
      font-style: normal;
      font-family: 'Roboto Condensed', 'Arial Narrow', 'Hiragino Sans', sans-serif;
      color: #fa2a4e;
      margin: 0;
      letter-spacing: 0;
      word-spacing: -0.12em;
      line-height: 1.1;
      white-space: nowrap;
      text-align: center
    }
    .lobby-hero .ron-wrap {
      padding: 12px 0;
      margin-bottom: 4px;
      display: block;
      width: 100%;
    }
    .lobby-hero .ron-lines {
      left: 0;
      right: 0;
    }

    .lobby-label {
      display: block;
      font-size: .8rem;
      color: var(--t2);
      margin-bottom: 5px;
      font-weight: 600;
      letter-spacing: .04em
    }

    .lobby-input {
      width: 100%;
      background: var(--bg2);
      border: 1.5px solid var(--bg3);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--t1);
      font-size: 1rem;
      outline: none;
      transition: .2s
    }

    .lobby-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(56, 139, 253, .2)
    }

    .lobby-input.code-input {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: .15em;
      text-align: center;
      text-transform: uppercase
    }

    .lobby-mode-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .lobby-btn {
      background: var(--bg2);
      border: 1.5px solid var(--bg3);
      border-radius: 12px;
      padding: 16px 12px;
      color: var(--t1);
      cursor: pointer;
      transition: .2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-size: .9rem
    }

    .lobby-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .4)
    }

    .lobby-btn.host {
      border-color: rgba(56, 139, 253, .5);
      background: rgba(56, 139, 253, .08)
    }

    .lobby-btn.host:hover {
      background: rgba(56, 139, 253, .18);
      border-color: var(--blue)
    }

    .lobby-btn.join {
      border-color: rgba(63, 185, 80, .5);
      background: rgba(63, 185, 80, .08)
    }

    .lobby-btn.join:hover {
      background: rgba(63, 185, 80, .18);
      border-color: var(--green)
    }

    .lobby-btn.cpu {
      border-color: rgba(99, 102, 241, .5);
      background: rgba(99, 102, 241, .08);
      color: #a5b4fc
    }

    .lobby-btn.cpu:hover {
      background: rgba(99, 102, 241, .18);
      border-color: #6366f1
    }

    .lobby-btn-single {
      width: 100%;
      background: linear-gradient(135deg, #1f6feb, #388bfd);
      border: none;
      border-radius: 12px;
      padding: 13px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: .2s
    }

    .lobby-btn-single:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(56, 139, 253, .4)
    }

    .lobby-btn-back {
      width: 100%;
      background: var(--bg3);
      border: none;
      border-radius: 10px;
      padding: 10px;
      color: var(--t2);
      font-size: .9rem;
      cursor: pointer;
      transition: .2s;
      margin-top: 4px
    }

    .lobby-btn-back:hover {
      background: rgba(250,42,78,.1);
      color: #fa2a4e
    }

    .lobby-error {
      background: rgba(248, 81, 73, .1);
      border: 1px solid rgba(248, 81, 73, .4);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: .82rem;
      color: var(--red)
    }

    /* WAITING / CONNECTION */
    .wait-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 30px 20px
    }

    .wait-icon {
      font-size: 3.5rem
    }

    .wait-title {
      font-size: 1.3rem;
      font-weight: 700;
      text-align: center
    }

    .wait-sub {
      color: var(--t2);
      font-size: .88rem
    }

    .room-code-display {
      background: var(--bg2);
      border: 2px solid var(--yellow);
      border-radius: 14px;
      padding: 16px 24px;
      text-align: center
    }

    .room-code-label {
      font-size: .72rem;
      color: var(--t1);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 6px
    }

    .room-code-value {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: .25em;
      color: var(--yellow)
    }

    .pulse-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      animation: pulse-anim 1.2s ease-in-out infinite
    }

    .waiting-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 139, 253, .08);
      border: 1px solid rgba(56, 139, 253, .3);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: .83rem;
      color: var(--blue)
    }

    .waiting-banner.red {
      background: rgba(248, 81, 73, .08);
      border-color: rgba(248, 81, 73, .3);
      color: var(--red)
    }

    @keyframes pulse-anim {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      50% {
        opacity: .5;
        transform: scale(.85)
      }
    }

    /* SETUP REQUIRED */
    .setup-box {
      max-width: 520px;
      margin: auto;
      padding: 24px;
      background: var(--bg1);
      border-radius: 16px;
      border: 1px solid var(--bg3)
    }

    .setup-step {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 14px;
      font-size: .85rem;
      color: var(--t2);
      line-height: 1.6
    }

    .setup-num {
      min-width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--yellow);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
      font-weight: 700;
      flex-shrink: 0
    }

    .setup-box code {
      background: var(--bg3);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: .82rem;
      color: var(--t1)
    }

    /* TITLE / GACHA / DRAFT (from game.html) */
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--t1);
      padding: 4px 0
    }

    .gacha-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px 0
    }

    .gacha-mystery {
      background: var(--bg2);
      border: 3px dashed var(--bg3);
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      width: 240px;
      cursor: pointer;
      transition: .2s
    }

    .gacha-mystery:hover {
      border-color: var(--yellow);
      transform: scale(1.03)
    }

    .gacha-card-box {
      background: linear-gradient(145deg, #1a2540, #0d1a2d);
      border: 3px solid var(--yellow);
      border-radius: 20px;
      padding: 28px 32px;
      text-align: center;
      width: 260px;
      box-shadow: 0 0 32px rgba(210, 153, 34, .35)
    }

    .gacha-first-pick {
      background: var(--bg2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: .85rem;
      color: var(--t2);
      border-left: 3px solid var(--green)
    }

    .gacha-candidates {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 380px
    }

    .gacha-candidate-card {
      background: linear-gradient(145deg, #1a2540, #0d1a2d);
      border: 2px solid var(--bg3);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s, border-color .15s, box-shadow .15s
    }

    .gacha-candidate-card:hover, .gacha-candidate-card:active {
      border-color: var(--yellow);
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(210,153,34,.35)
    }

    .gacha-candidate-card img {
      width: 100%;
      aspect-ratio: 288/450;
      object-fit: cover;
      display: block
    }

    .gacha-cand-info {
      padding: 6px 6px 8px
    }

    @keyframes gacha-reveal {
      0% {
        transform: scale(0.2) rotateY(90deg);
        opacity: 0
      }

      55% {
        transform: scale(1.08) rotateY(-6deg);
        opacity: 1
      }

      100% {
        transform: scale(1) rotateY(0deg);
        opacity: 1
      }
    }

    .gacha-reveal {
      animation: gacha-reveal .5s cubic-bezier(.22, .68, 0, 1.2) forwards
    }

    .btn-gacha {
      padding: 16px 52px;
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, #b45309, #d29922);
      border: none;
      border-radius: 14px;
      color: #fff;
      cursor: pointer;
      transition: .2s;
      letter-spacing: .04em
    }

    .btn-gacha:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(210, 153, 34, .5)
    }

    .btn-accept {
      padding: 13px 44px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--bg2);
      border: 2px solid var(--green);
      border-radius: 10px;
      color: var(--green);
      cursor: pointer;
      transition: .2s
    }

    .btn-accept:hover {
      background: var(--green);
      color: #000
    }

    .draft-progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg2);
      border-radius: 8px;
      padding: 8px 12px;
      border: 1px solid var(--bg3)
    }

    .draft-pips {
      display: flex;
      gap: 5px
    }

    .draft-pip {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg3)
    }

    .draft-pip.done {
      background: var(--green)
    }

    .draft-pip.current {
      background: var(--yellow);
      box-shadow: 0 0 6px rgba(210, 153, 34, .6)
    }

    .draft-hand-preview {
      background: var(--bg1);
      border-radius: 8px;
      padding: 8px 12px;
      border: 1px solid var(--bg3)
    }

    .draft-hand-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg2);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: .75rem;
      border: 1px solid var(--bg3)
    }

    /* DRAFT STACK */
    .draft-stack-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 0;
    }

    .draft-stack-wrap {
      position: relative;
      width: 142px;
      height: 204px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .draft-stack-card {
      position: absolute;
      width: 118px;
      border-radius: 9px;
      box-shadow: 0 6px 22px rgba(0,0,0,.55);
      cursor: default;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .draft-stack-card img {
      width: 100%;
      display: block;
      border-radius: 9px;
    }

    .draft-stack-card.top-card {
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .draft-stack-card.top-card:hover {
      transform: translate(0,0) translateY(-8px) !important;
      box-shadow: 0 16px 36px rgba(227,179,65,.5);
    }

    .draft-stack-card.top-card:active {
      transform: translate(0,0) scale(.93) !important;
    }

    .draft-tap-hint-overlay {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .65rem;
      font-weight: 700;
      color: var(--yellow);
      white-space: nowrap;
      pointer-events: none;
      animation: draft-hint-blink 1.6s ease-in-out infinite;
    }

    .draft-stack-card.spinning-out {
      animation: draft-spin-out .38s cubic-bezier(.55,.06,.68,.19) forwards !important;
      pointer-events: none;
      cursor: default;
    }

    /* Full-screen reveal overlay */
    .draft-reveal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      pointer-events: none;
    }

    .draft-large-card {
      position: relative;
      width: min(52vw, 180px);
      border-radius: 12px;
      box-shadow: 0 0 50px rgba(227,179,65,.45), 0 16px 48px rgba(0,0,0,.7);
      animation: draft-card-enter .28s cubic-bezier(.12,0,.3,1) both;
      z-index: 3;
    }

    .draft-large-card img {
      width: 100%;
      border-radius: 12px;
      display: block;
    }

    .draft-large-flash {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: rgba(255,255,255,.85);
      pointer-events: none;
      animation: draft-flash .55s ease-out forwards;
    }

    .draft-reveal-badge {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .62rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
      pointer-events: none;
    }

    .draft-reveal-badge.policy  { background: rgba(63,185,80,.92);  color: #000 }
    .draft-reveal-badge.disaster{ background: rgba(248,81,73,.92); color: #fff }

    /* Thumbnail row */
    .draft-thumb-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: flex-end;
      padding: 4px 8px 0;
      min-height: 0;
    }

    .draft-thumb-card {
      position: relative;
      width: 54px;
      border-radius: 7px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.45);
      animation: draft-thumb-appear .45s cubic-bezier(.34,1.56,.64,1) both;
    }

    .draft-thumb-card img {
      width: 100%;
      display: block;
      border-radius: 7px;
    }

    .draft-thumb-badge {
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .5rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .draft-thumb-badge.policy  { background: rgba(63,185,80,.9);  color: #000 }
    .draft-thumb-badge.disaster{ background: rgba(248,81,73,.9); color: #fff }

    .draft-tap-text {
      color: rgba(255,255,255,.82);
      font-size: .78rem;
      font-weight: 600;
      text-align: center;
      margin-top: 14px;
      letter-spacing: .05em;
    }

    .draft-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 6px 0 4px;
    }

    .btn-flip-all {
      padding: 9px 28px;
      font-size: .88rem;
      font-weight: 700;
      background: var(--bg2);
      border: 1.5px solid var(--yellow);
      border-radius: 10px;
      color: var(--yellow);
      cursor: pointer;
      transition: .18s;
    }

    .btn-flip-all:disabled { opacity: .5; cursor: default; }
    .btn-flip-all:not(:disabled):hover { background: rgba(227,179,65,.15); }

    .draft-confirm-appear {
      animation: draft-confirm-pop .4s cubic-bezier(.34,1.56,.64,1) both;
    }

    @keyframes draft-spin-out {
      0%   { transform: translate(0,0) rotate(0deg)   scale(1);  opacity: 1; }
      35%  { transform: translate(18px,-28px) rotate(390deg) scale(.55); opacity: .8; }
      100% { transform: translate(36px,-14px) rotate(720deg) scale(0);  opacity: 0; }
    }

    @keyframes draft-card-enter {
      0%   { transform: translateX(-120vw) scale(.72); opacity: 0; }
      20%  { transform: translateX(-6vw)   scale(1.03); opacity: 1; }
      50%  { transform: translateX(4.5vw)  scale(1.06); opacity: 1; }
      100% { transform: translateX(0)      scale(1);    opacity: 1; }
    }

    @keyframes draft-card-exit {
      0%   { transform: translateX(0)      rotate(0deg) scale(1);   opacity: 1; }
      100% { transform: translateX(120vw)  rotate(5deg) scale(.82); opacity: 0; }
    }

    .draft-large-card.exiting {
      animation: draft-card-exit .28s cubic-bezier(.4,0,1,1) forwards !important;
    }

    .draft-advance-btn {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 201;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.45);
      background: rgba(255,255,255,.13);
      color: #fff;
      font-size: 1.25rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      animation: draft-thumb-appear .35s cubic-bezier(.34,1.56,.64,1) both;
      line-height: 1;
      padding: 0;
    }

    .draft-card-label {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: .03em;
      text-shadow: 0 1px 10px rgba(0,0,0,1), 0 0 24px rgba(0,0,0,.9);
      pointer-events: none;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    @keyframes draft-flash {
      0%   { opacity: 0; }
      12%  { opacity: 1; }
      45%  { opacity: .6; }
      80%  { opacity: .75; }
      100% { opacity: 0; }
    }

    @keyframes draft-thumb-appear {
      from { transform: translateY(-20px) scale(.5); opacity: 0; }
      to   { transform: translateY(0)     scale(1);  opacity: 1; }
    }

    @keyframes draft-confirm-pop {
      from { opacity: 0; transform: scale(.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes draft-hint-blink {
      0%, 100% { opacity: .35; }
      50%       { opacity: 1; }
    }

    /* All-revealed 2×2 grid */
    .draft-all-revealed {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: min(80vw, 276px);
    }

    .draft-all-card {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 22px rgba(0,0,0,.55);
      animation: draft-card-rise .48s cubic-bezier(.34,1.56,.64,1) both;
    }

    .draft-all-card img {
      width: 100%;
      display: block;
      border-radius: 10px;
    }

    @keyframes draft-card-rise {
      from { transform: translateY(72px) scale(.76); opacity: 0; }
      to   { transform: translateY(0)    scale(1);   opacity: 1; }
    }

    /* Gacha city duo (2 cities side-by-side after random pick) */
    .gacha-city-duo {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: flex-start;
    }

    .gacha-city-duo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      animation: draft-card-rise .48s cubic-bezier(.34,1.56,.64,1) both;
    }

    .gacha-city-duo-card {
      width: min(40vw, 150px);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 22px rgba(0,0,0,.55);
    }

    .gacha-city-duo-card img {
      width: 100%;
      display: block;
      border-radius: 10px;
    }

    .gacha-city-duo-label {
      color: rgba(255,255,255,.88);
      font-size: .82rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: .02em;
    }

    /* Draft reveal neon background */
    .draft-neon-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .draft-neon-icon-pos {
      position: absolute;
      object-fit: contain;
      mix-blend-mode: screen;
      will-change: filter;
    }

    /* MAIN GAME */
    .battle-layout {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1
    }

    .opponent-zone,
    .player-zone {
      background: rgba(22, 27, 34, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 12px;
      padding: 12px
    }

    .opponent-zone {
      border: 1px solid rgba(139, 148, 158, 0.2)
    }

    .player-zone {
      border: 2px solid rgba(250, 42, 78, 0.35);
      box-shadow: 0 0 20px rgba(250, 42, 78, 0.08)
    }

    .zone-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap
    }

    .zone-label {
      font-size: .75rem;
      font-weight: 600;
      color: var(--t1);
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .city-name-display {
      font-size: 1rem;
      font-weight: 700
    }

    .city-icon-sm {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }
    .city-icon-sm img { width: 22px; height: 22px; object-fit: contain }

    .hp-section {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px
    }

    .hp-bar-wrap {
      flex: 1;
      height: 14px;
      background: var(--bg3);
      border-radius: 7px;
      overflow: hidden;
      position: relative
    }

    .hp-bar-ghost {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      border-radius: 7px;
      background: rgba(210, 153, 34, 0.55);
      z-index: 1;
      transition: width 1.2s ease
    }

    .hp-bar-fill {
      position: relative;
      height: 100%;
      border-radius: 7px;
      transition: width .6s cubic-bezier(.25,.8,.25,1), background .6s ease;
      z-index: 2
    }

    .hp-text {
      font-size: .85rem;
      font-weight: 700;
      min-width: 56px;
      text-align: right
    }

    .backup-city-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      padding: 3px 0;
      border-top: 1px solid var(--bg3);
      opacity: .75
    }

    .backup-label {
      font-size: .7rem;
      color: var(--t1);
      white-space: nowrap
    }

    .hp-bar-mini {
      flex: 1;
      max-width: 80px;
      height: 6px;
      background: var(--bg3);
      border-radius: 3px;
      overflow: hidden
    }

    .hp-bar-mini-fill {
      height: 100%;
      border-radius: 3px
    }

    .backup-hp-text {
      font-size: .7rem;
      min-width: 36px;
      text-align: right
    }

    .effects-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 22px;
      margin-bottom: 4px
    }

    .eff-badge {
      font-size: .68rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600
    }

    .eff-blue {
      background: rgba(56, 139, 253, .2);
      color: var(--blue);
      border: 1px solid rgba(56, 139, 253, .3)
    }

    .eff-red {
      background: rgba(248, 81, 73, .2);
      color: var(--red);
      border: 1px solid rgba(248, 81, 73, .3)
    }

    .eff-yellow {
      background: rgba(210, 153, 34, .2);
      color: var(--yellow);
      border: 1px solid rgba(210, 153, 34, .3)
    }

    .eff-gray {
      background: rgba(139, 148, 158, .15);
      color: var(--t2);
      border: 1px solid var(--bg3)
    }

    .hand-cards-area {
      margin-top: 6px
    }

    .hand-back-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .card-back {
      width: var(--card-w);
      height: var(--card-h);
      background: repeating-linear-gradient(45deg, var(--bg2) 0, var(--bg2) 8px, var(--bg3) 8px, var(--bg3) 16px);
      border-radius: 8px;
      border: 1px solid var(--bg3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--t3)
    }

    .hand-count {
      font-size: .8rem;
      color: var(--t1);
      margin-top: 4px
    }

    .hand-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .hand-groups {
      display: flex;
      gap: 16px;
      flex-wrap: wrap
    }

    .hand-group {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .hand-group-label {
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase
    }

    .hand-group-label.policy-label {
      color: var(--blue)
    }

    .hand-group-label.disaster-label {
      color: var(--red)
    }

    .hand-group-label.jinzai-label {
      color: #c084fc
    }

    .hand-group-cards {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    /* CARD */
    .card {
      width: var(--card-w);
      height: var(--card-h);
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: .2s;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative
    }

    .card {
      perspective: 600px
    }

    .card:hover:not(.card-disabled) {
      transform: translateY(-12px) rotateX(5deg) scale(1.04);
      box-shadow: 0 16px 32px rgba(0, 0, 0, .7)
    }

    .card.policy:hover:not(.card-disabled) {
      box-shadow: 0 12px 28px rgba(56, 139, 253, .45), 0 0 0 1px rgba(56, 139, 253, .4)
    }

    .card.disaster:hover:not(.card-disabled) {
      box-shadow: 0 12px 28px rgba(248, 81, 73, .45), 0 0 0 1px rgba(248, 81, 73, .4)
    }

    .card-disabled {
      opacity: .6;
      cursor: not-allowed
    }
    .card.card-disabled::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .52);
      border-radius: inherit;
      pointer-events: none;
      z-index: 3;
      animation: none
    }

    .card.disaster {
      background: linear-gradient(160deg, #2d0d0d, #1a0a0a);
      border-color: #f85149
    }

    .card.policy {
      background: linear-gradient(160deg, #0d1a2d, #0a1020);
      border-color: #388bfd
    }

    .card-header {
      padding: 5px 6px;
      display: flex;
      align-items: center;
      gap: 4px
    }

    .card.disaster .card-header {
      background: rgba(248, 81, 73, .2)
    }

    .card.policy .card-header {
      background: rgba(56, 139, 253, .2)
    }

    .card-icon {
      font-size: 1rem
    }

    .card-cost {
      margin-left: auto;
      font-size: .75rem;
      font-weight: 700;
      background: var(--bg0);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .card.disaster .card-cost {
      color: var(--red)
    }

    .card.policy .card-cost {
      color: var(--blue)
    }

    .card-name {
      padding: 4px 6px;
      font-size: .75rem;
      font-weight: 700;
      line-height: 1.2
    }

    .card-desc {
      padding: 0 6px 6px;
      font-size: .62rem;
      color: var(--t2);
      line-height: 1.35;
      flex: 1
    }

    .card-type-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      font-size: .55rem;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 600
    }

    .card.disaster .card-type-badge {
      background: rgba(248, 81, 73, .2);
      color: var(--red)
    }

    .card.policy .card-type-badge {
      background: rgba(56, 139, 253, .2);
      color: var(--blue)
    }

    .card.jinzai .card-type-badge {
      background: rgba(168, 85, 247, .22);
      color: #c084fc
    }

    .card-disabled-reason {
      font-size: .65rem;
      color: var(--t3);
      text-align: center;
      margin-top: 4px
    }

    /* STATUS BAR */
    .status-bar {
      background: var(--bg2);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--bg3)
    }

    .turn-badge {
      font-size: .8rem;
      font-weight: 700;
      color: var(--t1)
    }

    .budget-display {
      display: flex;
      align-items: center;
      gap: 4px
    }

    .budget-label {
      font-size: .75rem;
      color: var(--t1)
    }

    .budget-pips {
      display: flex;
      gap: 3px
    }

    .pip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg3)
    }

    .pip.used {
      background: var(--bg0)
    }

    .pip.avail {
      background: var(--green)
    }

    .status-bar .spacer {
      flex: 1
    }

    .btn-end {
      padding: 7px 20px;
      font-size: .85rem;
      font-weight: 700;
      background: var(--bg3);
      border: none;
      border-radius: 8px;
      color: var(--t1);
      cursor: pointer;
      transition: .2s
    }

    .btn-end:hover {
      background: #fa2a4e;
      color: #fff
    }

    /* LOG - 折りたたみ式＋色分け強化 */
    .log-area {
      background: var(--bg1);
      border-radius: 10px;
      padding: 8px 10px;
      border: 1px solid var(--bg3);
    }

    .log-entry {
      font-size: .75rem;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 3px;
    }

    .log-entry.dmg {
      color: var(--red);
      background: rgba(248, 81, 73, .08);
    }

    .log-entry.heal {
      color: var(--green);
      background: rgba(63, 185, 80, .08);
    }

    .log-entry.policy {
      color: var(--blue);
      background: rgba(56, 139, 253, .08);
    }

    .log-entry.sys {
      color: var(--yellow);
      font-weight: 600;
      background: rgba(227, 179, 65, .06);
    }

    .log-entry:not(.dmg):not(.heal):not(.policy):not(.sys) {
      color: var(--t2);
    }

    .log-collapsed .log-entry:nth-child(n+3) {
      display: none;
    }

    .log-toggle {
      display: block;
      width: 100%;
      background: none;
      border: 1px dashed var(--bg3);
      border-radius: 6px;
      padding: 4px 0;
      color: var(--t3);
      font-size: .72rem;
      cursor: pointer;
      margin-top: 4px;
      text-align: center;
    }

    .log-toggle:hover {
      background: var(--bg2);
      color: var(--t2);
    }

    /* TERRAIN BADGE */
    .terrain-badge {
      font-size: 1rem;
      color: var(--t1);
      font-weight: 700;
      margin-left: 2px;
    }

    /* ACTION BAR (ターン終了ボタン) */
    .action-bar {
      display: flex;
      justify-content: center;
      padding: 6px 0;
    }

    .action-bar .btn-end {
      font-size: .85rem;
      padding: 8px 24px;
    }

    /* AUTO END BAR */
    .auto-end-bar {
      background: rgba(227, 179, 65, .12);
      border: 1px solid var(--yellow);
      border-radius: 10px;
      padding: 10px 14px;
      text-align: center;
      animation: pulse-glow 1.5s ease-in-out infinite;
    }

    .auto-end-text {
      font-size: .85rem;
      color: var(--yellow);
      font-weight: 600;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: .6; }
    }

    /* RESPONSE */
    .response-pending-bar {
      background: rgba(248, 81, 73, .1);
      border: 1px solid var(--red);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .rpb-icon {
      font-size: 1.4rem
    }

    .rpb-text {
      flex: 1;
      font-size: .85rem;
      color: var(--t1);
      line-height: 1.4;
      min-width: 160px
    }

    .btn-respond {
      padding: 6px 16px;
      background: var(--red);
      border: none;
      border-radius: 7px;
      color: #fff;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer
    }

    .btn-skip-resp {
      padding: 6px 16px;
      background: var(--bg3);
      border: none;
      border-radius: 7px;
      color: var(--t1);
      font-size: .82rem;
      cursor: pointer
    }

    /* CONFIRM MODAL */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999
    }

    .confirm-box {
      background: var(--bg2);
      border: 1px solid var(--bg3);
      border-radius: 14px;
      padding: 28px 32px;
      max-width: 320px;
      width: 90%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .6)
    }

    .confirm-box .confirm-card-preview {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700
    }

    .confirm-box .confirm-card-preview .ci {
      font-size: 2rem
    }

    .confirm-box p {
      color: var(--t2);
      font-size: .9rem;
      margin: 0
    }

    .confirm-btns {
      display: flex;
      gap: 12px;
      justify-content: center
    }

    .confirm-btns .btn-ok {
      flex: 1;
      padding: 10px;
      background: var(--blue);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: .15s
    }

    .confirm-btns .btn-ok:hover {
      background: #4da3ff
    }

    .confirm-btns .btn-ok.danger {
      background: var(--red)
    }

    .confirm-btns .btn-ok.danger:hover {
      background: #ff6b6b
    }

    .confirm-btns .btn-cancel {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--bg3);
      border-radius: 8px;
      color: var(--t2);
      font-size: .95rem;
      cursor: pointer;
      transition: .15s
    }

    .confirm-btns .btn-cancel:hover {
      background: var(--bg3)
    }

    /* PEEK */
    .peek-card-display {
      text-align: center;
      padding: 20px
    }

    .peek-card-big {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: var(--bg2);
      border: 2px solid var(--blue);
      border-radius: 12px;
      padding: 20px 28px
    }

    .peek-card-big .pk-icon {
      font-size: 2.4rem
    }

    .peek-card-big .pk-name {
      font-size: 1.1rem;
      font-weight: 700
    }

    .peek-card-big .pk-cost {
      font-size: .85rem;
      color: var(--blue)
    }

    .peek-card-big .pk-desc {
      font-size: .78rem;
      color: var(--t2);
      max-width: 180px;
      text-align: center;
      line-height: 1.4
    }

    /* DISCARD */
    .discard-info {
      background: rgba(248, 81, 73, .08);
      border: 1px solid rgba(248, 81, 73, .4);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .88rem
    }

    .discard-cards {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 8px 0
    }

    .discard-cards .card {
      width: 110px;
      height: 155px
    }

    .discard-cards .card:hover:not(.card-disabled) {
      border-color: var(--red) !important;
      box-shadow: 0 8px 20px rgba(248, 81, 73, .45);
      transform: translateY(-8px)
    }

    .btn-ho {
      padding: 14px 40px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--bg2);
      border: 2px solid var(--green);
      border-radius: 10px;
      color: var(--green);
      cursor: pointer;
      transition: .2s
    }

    .btn-ho:hover {
      background: #fa2a4e;
      border-color: #fa2a4e;
      color: #fff
    }

    /* TURN SUMMARY */
    @keyframes ts-fade-in { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    .turn-summary-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      animation: ts-fade-in .35s cubic-bezier(.23,1,.32,1) both;
    }

    .ts-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--t1);
      padding: 4px 0
    }

    .ts-events {
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .ts-ev {
      background: var(--bg2);
      border-radius: 8px;
      padding: 9px 13px;
      font-size: .83rem;
      border-left: 3px solid var(--bg3)
    }

    .ts-ev.damage {
      border-color: var(--red)
    }

    .ts-ev.heal {
      border-color: var(--green)
    }

    .ts-ev.budget {
      border-color: var(--blue)
    }

    .ts-ev.typhoon {
      border-color: var(--yellow)
    }

    .ts-ev.warn {
      border-color: var(--yellow)
    }

    .ts-ev-title {
      font-weight: 700;
      margin-bottom: 2px
    }

    .ts-ev-detail {
      color: var(--t2);
      font-size: .77rem
    }

    .ts-ev-subline {
      color: var(--t2);
      font-size: .77rem;
      padding-left: 8px;
      border-left: 2px solid var(--bg3);
      margin: 2px 0
    }

    /* DAMAGE BREAKDOWN */
    .ts-ev-breakdown { display: flex; align-items: center; gap: 5px; padding: 3px 4px; font-size: .76rem; border-radius: 4px; margin: 2px 0 }
    .ts-cat { font-size: .64rem; font-weight: 700; padding: 1px 6px; border-radius: 10px; white-space: nowrap; min-width: 56px; text-align: center }
    .ts-cat-exposure { background: rgba(248,81,73,.18); color: var(--red) }
    .ts-cat-policy { background: rgba(63,185,80,.18); color: var(--green) }
    .ts-cat-shield { background: rgba(56,139,253,.18); color: var(--blue) }
    .ts-cat-agency { background: rgba(210,153,34,.18); color: var(--yellow) }
    .ts-cat-vuln { background: rgba(248,81,73,.18); color: var(--red) }
    .ts-cat-negate { background: rgba(163,113,247,.18); color: var(--purple) }
    .ts-bd-text { flex: 1; color: var(--t2) }
    .ts-bd-delta { font-weight: 700; min-width: 28px; text-align: right }
    .ts-bd-delta.pos { color: var(--red) }
    .ts-bd-delta.neg { color: var(--green) }
    .ts-bd-run { color: var(--t3); font-size: .7rem; min-width: 26px }

    /* BUDGET TOAST */
    @keyframes toast-in-out {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(20px) scale(.9)
      }

      15% {

        transform: translateX(-50%) translateY(0) scale(1)
      }

      75% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1)
      }

      }

    .gallery-btn-back:hover { background:rgba(250,42,78,.1); border-color:#fa2a4e; color:#fa2a4e }
    .sq-btn { background:transparent; border:1.5px solid #fff; border-radius:0; color:#fff; cursor:pointer; font-size:.9rem; font-weight:700; padding:8px 14px; min-height:40px; display:inline-flex; align-items:center; justify-content:center; transition:.2s; white-space:nowrap }
    .sq-btn:hover { background:rgba(250,42,78,.1); border-color:#fa2a4e; color:#fa2a4e }
    .sq-btn-r { background:transparent; border:1.5px solid #fff; border-radius:0; color:#fff; cursor:pointer; font-size:.9rem; font-weight:700; padding:10px 14px; width:100%; display:flex; align-items:center; justify-content:center; transition:.2s; margin-top:4px }
    .sq-btn-r:hover { background:rgba(250,42,78,.1); border-color:#fa2a4e; color:#fa2a4e }
    .gallery-tabs { display:flex; flex-direction:column; gap:8px }
    .gallery-tab-btn { padding:12px 16px; background:var(--bg2); border:1.5px solid var(--bg3); border-radius:10px; color:var(--t1); cursor:pointer; font-size:.85rem; font-weight:600; transition:.2s; text-align:left; display:flex; align-items:center; gap:10px }
    .gallery-tab-btn:hover { border-color:#fa2a4e; background:rgba(250,42,78,.1); color:#fa2a4e }
    .gallery-tab-btn.active { border-color:#fa2a4e; background:rgba(250,42,78,.15); color:#fa2a4e }
    .tab-icon { width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0 }
    .gallery-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px }
    .gallery-section-label { display:flex; align-items:center; gap:6px; font-size:.82rem; font-weight:700; color:var(--red); margin:6px 0 2px; letter-spacing:.04em }
    .gallery-section-label.gallery-section-label-jinzai { color:#c084fc; margin-top:0 }
    .gallery-section-icon { width:20px; height:20px; object-fit:contain; border-radius:50%; flex-shrink:0 }
    .gallery-section-divider { height:1px; background:rgba(255,255,255,.35); border:none; margin:14px 0 }
    .gallery-card { border-radius:8px; overflow:hidden; cursor:pointer; border:2px solid var(--bg3); transition:.15s; aspect-ratio:288/450; position:relative }
    .gallery-card img { width:100%; height:100%; object-fit:cover; display:block }

    .gallery-nav-arrow { width:36px; height:36px; border-radius:50%; background:rgba(10,18,40,.9); border:1.5px solid currentColor; color:var(--yellow); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; flex-shrink:0; transition:transform .15s,background .15s,filter .15s }

    .gallery-nav-arrow:active { transform:scale(.9) }
    .city-tap-btn { background:rgba(56,139,253,.13); border:1px solid rgba(56,139,253,.4); border-radius:14px; padding:3px 10px; color:var(--blue); cursor:pointer; font-size:.82rem; font-weight:600; white-space:nowrap; transition:.15s }

    /* ── カード画像モード ── */

    /* ── 1. Usable card glow ── */

    .card.card-usable.disaster { box-shadow: 0 0 10px rgba(248,81,73,.32), 0 0 0 1px rgba(248,81,73,.2) }

    /* ── 3. HP danger zone ── */
    @keyframes hp-danger-pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
    @keyframes hp-critical-blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .hp-bar-fill.hp-warn { animation: hp-danger-pulse 1.3s ease-in-out infinite }
    .hp-danger-badge { font-size:.65rem; color:var(--yellow); font-weight:700; padding:1px 6px; border-radius:4px; background:rgba(210,153,34,.18); animation:hp-danger-pulse 1.3s ease-in-out infinite; white-space:nowrap }
    .hp-critical-badge { font-size:.65rem; color:var(--red); font-weight:700; padding:1px 6px; border-radius:4px; background:rgba(248,81,73,.22); border:1px solid rgba(248,81,73,.5); animation:hp-critical-blink .8s ease-in-out infinite; white-space:nowrap }

    /* ── 4. State banner ── */
    .state-banner { text-align:center; padding:8px 14px; border-radius:10px; font-size:.88rem; font-weight:700 }
    .state-banner-waiting { background:rgba(56,139,253,.1); border:1px solid rgba(56,139,253,.25); color:var(--blue) }
    .state-banner-response { background:rgba(248,81,73,.1); border:1px solid rgba(248,81,73,.25); color:var(--red) }

    /* ── 5. City info modal ── */
    .city-info-overlay { position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; justify-content:center; z-index:1001; padding:20px; cursor:pointer }
    .city-info-box { background:var(--bg2); border:1.5px solid var(--bg3); border-radius:16px; padding:20px 18px; max-width:300px; width:100%; cursor:default; display:flex; flex-direction:column; gap:8px; box-shadow:0 12px 40px rgba(0,0,0,.6) }

    /* ── 6. Response damage preview ── */
    .response-dmg-preview { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px }
    .rdp-item { font-size:.76rem; padding:3px 8px; border-radius:5px; font-weight:600 }
    .rdp-skip { background:rgba(248,81,73,.15); color:var(--red) }
    .rdp-special { background:rgba(227,179,65,.15); color:var(--yellow); border:1px solid rgba(227,179,65,.3) }
    .rdp-breakdown { font-size:.74rem; color:var(--t2); margin-top:3px; }
    .rdp-breakdown b { color:var(--red); font-weight:700; }
    .card-ineffective { opacity:.35; }
    .card-hp-band { position:absolute; bottom:18px; left:0; width:72%; padding:2px 3px 2px 4px; background:rgba(0,0,0,.6); clip-path:polygon(0 0,100% 0,82% 100%,0 100%); font-size:.42rem; font-weight:700; color:var(--green); z-index:2; white-space:nowrap; }

    /* ── 8. Log critical/divider ── */
    .log-entry.critical { background:rgba(248,81,73,.18) !important; border-left:3px solid var(--red); color:var(--red) !important; font-weight:700; padding-left:8px }
    .log-entry.divider { text-align:center; color:var(--t3); font-size:.6rem; padding:2px 0; background:none !important; letter-spacing:.06em; opacity:.7 }

    /* ── 9. Mobile hand horizontal scroll ── */
    @media (max-width:600px) {
      .hand-groups { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; gap:12px; scroll-snap-type:x mandatory }
      .hand-group-cards { flex-wrap:nowrap }
      .hand-group { scroll-snap-align:start }
    }

    /* ── 10. Hint overlay ── */
    .hint-btn { position:fixed; bottom:16px; right:16px; width:40px; height:40px; border-radius:50%; background:transparent; border:1.5px solid #fff; color:#fff; font-size:1rem; font-weight:700; cursor:pointer; z-index:9100; transition:.2s; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.4) }
    .hint-btn:hover { border-color:#fa2a4e; color:#fa2a4e; background:rgba(250,42,78,.1) }
    .spec-invite-btn { position:fixed; bottom:16px; right:64px; z-index:9100; padding:7px 12px; border-radius:20px; background:rgba(56,139,253,.15); border:1.5px solid #388bfd; color:#388bfd; font-size:.75rem; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:5px; box-shadow:0 2px 8px rgba(0,0,0,.4); transition:.2s; white-space:nowrap; }
    .spec-invite-btn:hover { background:rgba(56,139,253,.3); }
    .spec-invite-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:9200; display:flex; align-items:flex-end; justify-content:flex-end; padding:72px 12px; }
    .spec-invite-panel { background:var(--bg1); border:1px solid rgba(56,139,253,.5); border-radius:18px; padding:18px; width:min(280px, 90vw); display:flex; flex-direction:column; gap:0; }
    .spec-invite-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }

    .spec-invite-close { background:transparent; border:none; color:var(--t3); font-size:1.1rem; cursor:pointer; padding:2px 6px; line-height:1; }
    .spec-invite-copy-btn { width:100%; padding:10px; border-radius:10px; border:none; background:#388bfd; color:#fff; font-size:.85rem; font-weight:700; cursor:pointer; }
    .hint-overlay { position:fixed; inset:0; background:rgba(0,0,0,.65); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:9200; display:flex; align-items:flex-end; justify-content:center; padding:12px }
    .hint-box { background:var(--bg1); border:1px solid var(--bg3); border-radius:20px; padding:20px 18px; max-width:520px; width:100%; max-height:72vh; overflow-y:auto; display:flex; flex-direction:column; gap:10px }
    .hint-box-header { display:flex; align-items:center; justify-content:space-between }
    .hint-title { font-size:.95rem; font-weight:700; color:var(--blue) }
    .hint-close { background:none; border:none; color:var(--t3); font-size:1.2rem; cursor:pointer; padding:0 4px; line-height:1 }
    .hint-section { font-size:.83rem; color:var(--t2); line-height:1.8 }
    .hint-section strong { color:var(--t1) }
    .coop-tip-row { display:flex; align-items:center; gap:10px; color:var(--t1); font-size:.86rem; line-height:1.6 }
    .coop-tip-num { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; flex-shrink:0; border-radius:50%; background:rgba(56,139,253,.16); border:1px solid rgba(56,139,253,.5); color:var(--blue); font-weight:700; font-size:.82rem; font-family:'Roboto Condensed',sans-serif }
    .hint-divider { border:none; border-top:1px solid var(--bg3); margin:2px 0 }

    .hint-tag.green { background:rgba(63,185,80,.18); color:var(--green); border:1px solid rgba(63,185,80,.25) }
    .hint-tag.yellow { background:rgba(210,153,34,.18); color:var(--yellow); border:1px solid rgba(210,153,34,.25) }
    .hint-tag.red { background:rgba(248,81,73,.18); color:var(--red); border:1px solid rgba(248,81,73,.25) }

    /* ── 11. Tutorial ── */
    .city-tap-btn.tut-pulse { animation:tutCityPulse 1.2s ease-in-out infinite; border-color:var(--blue) !important; color:var(--blue) !important }
    @keyframes tutCityPulse { 0%,100% { background:rgba(56,139,253,.15); box-shadow:0 0 0 2px var(--blue) } 50% { background:rgba(56,139,253,.3); box-shadow:0 0 0 3px var(--blue),0 0 12px rgba(56,139,253,.5) } }
    .terrain-badge.tut-flash { animation:tutTerrainFlash 1.4s ease-in-out infinite; border-radius:6px }
    @keyframes tutTerrainFlash { 0%,100% { color:#ffffff } 50% { color:#000000 } }
    .card.tut-glow { animation:tutGlow 1.1s ease-in-out infinite alternate; cursor:pointer !important; opacity:1 !important }
    @keyframes tutGlow { from { box-shadow:0 0 0 2px var(--blue),0 0 10px rgba(56,139,253,.4); transform:translateY(-2px) } to { box-shadow:0 0 0 3px var(--blue),0 0 22px rgba(56,139,253,.7); transform:translateY(-7px) } }
    .btn-end.tut-glow { animation:tutGlowBtn 1.1s ease-in-out infinite alternate }
    @keyframes tutGlowBtn { from { box-shadow:0 0 0 2px var(--green),0 0 8px rgba(63,185,80,.35) } to { box-shadow:0 0 0 3px var(--green),0 0 18px rgba(63,185,80,.65) } }
    .tut-dim { opacity:.28 !important; pointer-events:none !important }
    .tut-dim-soft { opacity:.28 !important }
    .tut-guide { background:var(--bg1); border:1.5px solid var(--blue); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:10px }
    .tut-guide-title { font-size:.88rem; font-weight:700; color:var(--blue) }
    .tut-guide-body { font-size:.82rem; color:var(--t1); line-height:1.8 }
    .tut-progress { display:flex; align-items:center; gap:5px }
    .tut-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0 }
    /* Tutorial: slide-in / neon / gate / vfx */
    @keyframes tut-slide-top { from{opacity:0;transform:translateY(-18px)} to{opacity:1;transform:translateY(0)} }
    @keyframes tut-slide-btm { from{opacity:0;transform:translateY(14px)}  to{opacity:1;transform:translateY(0)} }
    .tut-anim-title { animation:tut-slide-top .45s cubic-bezier(.23,1,.32,1) both }
    .tut-anim-body  { animation:tut-slide-btm .45s cubic-bezier(.23,1,.32,1) .10s both }
    .tut-panel-0 { animation:tut-slide-btm .38s cubic-bezier(.23,1,.32,1) .05s both }
    .tut-panel-1 { animation:tut-slide-btm .38s cubic-bezier(.23,1,.32,1) .13s both }
    .tut-panel-2 { animation:tut-slide-btm .38s cubic-bezier(.23,1,.32,1) .21s both }
    .tneon-blue   { text-shadow:0 0 8px rgba(56,139,253,.9),0 0 20px rgba(56,139,253,.4) }
    .tneon-white  { text-shadow:0 0 8px rgba(200,210,235,.7),0 0 18px rgba(200,210,235,.3) }
    .tneon-yellow { text-shadow:0 0 8px rgba(210,153,34,.9),0 0 20px rgba(210,153,34,.4) }
    @keyframes tut-gate-l { from{transform:scaleX(1)} to{transform:scaleX(0)} }
    @keyframes tut-gate-r { from{transform:scaleX(1)} to{transform:scaleX(0)} }
    .tut-gate   { position:fixed;inset:0;z-index:8500;pointer-events:none;display:flex }
    .tut-gate-l { flex:1;background:#080d14;transform-origin:left center; animation:tut-gate-l .55s cubic-bezier(.77,0,.18,1) .04s both }
    .tut-gate-r { flex:1;background:#080d14;transform-origin:right center;animation:tut-gate-r .55s cubic-bezier(.77,0,.18,1) .04s both }
    @keyframes tut-resp-pulse { 0%,100%{border-color:var(--red);box-shadow:0 0 8px rgba(248,81,73,.3)} 50%{border-color:rgba(248,81,73,.6);box-shadow:0 0 22px rgba(248,81,73,.55)} }
    .tut-resp-anim { animation:tut-resp-pulse 1.3s ease-in-out infinite }
    @keyframes tut-zero-anim { 0%{opacity:0;transform:translate(-50%,-50%) scale(.45)} 25%{opacity:1;transform:translate(-50%,-50%) scale(1.2)} 65%{opacity:1;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-50%) scale(.85)} }
    @keyframes neon-use-fade { from{opacity:.8} to{opacity:0} }

    /* ── ロビー登場アニメーション ── */
    @keyframes lobby-fade-in { from { opacity:0; transform:translateY(18px) scale(.97) } to { opacity:1; transform:translateY(0) scale(1) } }
    .lobby-box.lobby-enter { animation: lobby-fade-in .5s cubic-bezier(.23,1,.32,1) both }

    /* ── 新都市登場アニメーション ── */
    @keyframes city-appear { 0% { opacity:0; transform:translateX(-22px) } 50% { box-shadow:0 0 0 2px var(--yellow),0 0 18px rgba(210,153,34,.45) } 100% { opacity:1; transform:translateX(0); box-shadow:none } }
    .city-appear-anim { animation: city-appear .75s cubic-bezier(.23,1,.32,1) both }

    /* ── HPバーダメージフラッシュ ── */
    @keyframes hp-damage-flash { 0%,100% { filter:brightness(1) } 30% { filter:brightness(2.5) } }
    .hp-flash { animation: hp-damage-flash .35s ease }

    /* ── 浮き上がりダメージ数字 ── */
    @keyframes float-up-dmg { 0% { opacity:1; transform:translateY(0) scale(1) } 70% { opacity:.9; transform:translateY(-48px) scale(1.1) } 100% { opacity:0; transform:translateY(-64px) scale(.9) } }
    .float-dmg {
      position: fixed;
      pointer-events: none;
      font-size: 1.5rem;
      font-weight: 900;
      text-shadow: 0 2px 8px rgba(0,0,0,.8);
      animation: float-up-dmg .95s cubic-bezier(.23,1,.32,1) forwards;
      z-index: 9000;
      user-select: none
    }

    /* ── ターン開始スプラッシュ ── */
    @keyframes turn-splash-anim { 0% { opacity:0; transform:scale(.82) } 15% { opacity:1; transform:scale(1.04) } 65% { opacity:1; transform:scale(1) } 100% { opacity:0; transform:scale(1.06) } }
    .turn-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 8000;
      background: rgba(0,0,0,.22)
    }
    .turn-splash-inner {
      padding: 20px 48px;
      border-radius: 18px;
      text-align: center;
      animation: turn-splash-anim 1.5s cubic-bezier(.23,1,.32,1) forwards
    }
    .turn-splash-icon {
      width: 72px;
      height: 72px;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px
    }

    /* ── スキャンライン演出（ホーム画面ロード） ── */
    .sl-overlay {
      position: fixed;
      inset: 0;
      background: #080d14;
      z-index: 9500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      overflow: hidden
    }
    .sl-header { text-align: center }
    .sl-title {
      font-size: 2.6rem;
      font-weight: 900;
      font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif;
      color: rgba(255,255,255,.9);
      letter-spacing: .18em;
    }
    .sl-subtitle {
      font-size: .78rem;
      color: rgba(255,255,255,.4);
      letter-spacing: .14em;
      margin-top: 6px;
      opacity: 0;
      transition: opacity .5s ease .15s
    }
    .sl-icon-row {
      display: flex;
      gap: clamp(8px, 2vw, 22px);
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0 12px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden
    }
    .sl-icon-wrap {
      position: relative;
      width: clamp(48px, 13.5vw, 82px);
      overflow: visible;
      text-align: center
    }
    .sl-icon-clip {
      position: relative;
      width: clamp(48px, 13.5vw, 82px);
      height: clamp(48px, 13.5vw, 82px);
      overflow: hidden
    }
    .sl-icon-wrap img {
      width: clamp(48px, 13.5vw, 82px);
      height: clamp(48px, 13.5vw, 82px);
      object-fit: contain;
      display: block;
      filter: brightness(0);
      transition: filter .15s ease
    }
    .sl-icon-wrap.sl-lit img {
      filter: brightness(1)
    }
    @keyframes sl-sweep-45 {
      from { transform: rotate(45deg) translateX(-160px) }
      to   { transform: rotate(45deg) translateX(160px) }
    }
    .sl-scan-line {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 200px;
      height: clamp(48px, 10vw, 72px);
      margin-left: -100px;
      margin-top: clamp(-36px, -5vw, -24px);
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(255,255,255,.12) 20%,
        rgba(255,255,255,.72) 44%,
        rgba(255,255,255,.72) 56%,
        rgba(255,255,255,.12) 80%,
        transparent 100%
      );
      transform: rotate(45deg) translateX(-160px);
      animation: sl-sweep-45 .56s ease-in forwards
    }
    @keyframes sl-icon-zoom {
      0%   { transform: scale(1);   opacity: 1 }
      30%  { transform: scale(2);   opacity: .9 }
      100% { transform: scale(14);  opacity: 0 }
    }
    .sl-icon-wrap.sl-zoom {
      animation: sl-icon-zoom .65s cubic-bezier(.28, 0, .9, 1) forwards
    }
    @keyframes sl-icon-reveal {
      0%   { filter: brightness(0) }
      15%  { filter: brightness(2.6) }
      30%  { filter: brightness(0.1) }
      52%  { filter: brightness(1.9) }
      72%  { filter: brightness(0.65) }
      100% { filter: brightness(1) }
    }
    .sl-icon-reveal {
      animation: sl-icon-reveal .46s ease-in-out forwards
    }
    .lobby-neon-icons {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
    }
    .lobby-neon-icon {
      width: clamp(34px, 10vw, 42px);
      height: clamp(34px, 10vw, 42px);
      object-fit: contain;
      mix-blend-mode: screen;
      flex-shrink: 0;
    }
    .btn-icon {
      width: 1.3rem;
      height: 1.3rem;
      flex-shrink: 0;
      color: white;
    }
    @keyframes ron-flicker {
      0%,100% { opacity: 1 }
      7%  { opacity: .82 }
      10% { opacity: 1 }
      12% { opacity: .91 }
      20% { opacity: 1 }
      33% { opacity: .86 }
      36% { opacity: 1 }
      55% { opacity: .94 }
      58% { opacity: 1 }
      80% { opacity: .89 }
      83% { opacity: 1 }
    }
    .ron-wrap {
      position: relative;
      display: inline-block;
    }
    .ron-lines {
      position: absolute;
      left: -30px; right: -30px; top: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      pointer-events: none;
    }
    .ron-line {
      height: 1px;
      background: rgba(245, 208, 96, .3);
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform .52s cubic-bezier(.25, .8, .25, 1);
    }
    .ron-line:nth-child(1) { transition-delay: .00s }
    .ron-line:nth-child(2) { transition-delay: .06s }
    .ron-line:nth-child(3) { transition-delay: .12s }
    .ron-line:nth-child(4) { transition-delay: .18s }
    .ron-line:nth-child(5) { transition-delay: .24s }
    .ron-lines.ron-active .ron-line { transform: scaleX(1) }
    .ron-text {
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(7px);
      transition: opacity .4s ease, transform .4s ease;
    }
    .ron-text.ron-active {
      opacity: 1;
      transform: translateY(0);
    }
    .ron-text.ron-flicker {
      animation: ron-flicker 3s ease-in-out infinite;
    }

    /* ═══════════════════════════════════════════════════
       YOASOBI-inspired UI v2 enhancements
    ═══════════════════════════════════════════════════ */

    /* ── Keyframes ── */
    @keyframes yb-fadeInUp {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes yb-shimmer-over {
      from { transform:translateX(-130%) skewX(-15deg); }
      to   { transform:translateX(230%) skewX(-15deg); }
    }
    @keyframes yb-scale-in {
      from { opacity:0; transform:scale(0.86); }
      to   { opacity:1; transform:scale(1); }
    }
    @keyframes yb-slide-in-left {
      from { clip-path:inset(0 100% 0 0); opacity:.5; }
      to   { clip-path:inset(0 0% 0 0); opacity:1; }
    }
    @keyframes yb-zone-flash-dmg {
      0%,100% { background:rgba(22,27,34,0.65); }
      25%     { background:rgba(248,81,73,0.20); box-shadow:inset 0 0 0 1.5px rgba(248,81,73,.5); }
    }
    @keyframes yb-zone-flash-heal {
      0%,100% { background:rgba(22,27,34,0.65); }
      25%     { background:rgba(63,185,80,0.16); box-shadow:inset 0 0 0 1.5px rgba(63,185,80,.4); }
    }

    /* ── Phase 1-A: Card type left bar + header tint ── */
    .card[data-ctype="disaster"] { border-left:3px solid var(--red) !important; }
    .card[data-ctype="disaster"] .card-header { background:rgba(248,81,73,.13); }
    .card[data-ctype="instant"]  { border-left:3px solid var(--yellow) !important; }
    .card[data-ctype="instant"]  .card-header { background:rgba(210,153,34,.13); }
    .card[data-ctype="shield"]   { border-left:3px solid var(--green) !important; }
    .card[data-ctype="shield"]   .card-header { background:rgba(63,185,80,.13); }
    .card[data-ctype="jinzai"]   { border-left:3px solid #c084fc !important; }
    .card[data-ctype="jinzai"]   .card-header { background:rgba(168,85,247,.16); }

    /* ── Phase 1-A: Cost Roboto Condensed ── */
    .card-cost { font-family:'Roboto Condensed',sans-serif; font-size:.88rem !important; font-weight:900; }

    /* ── Phase 1-B: Card hover glow by type (PC only) ── */
    @media (hover:hover) {
      .card.card-usable { transition:transform .18s cubic-bezier(.23,1,.32,1), box-shadow .2s; }
      .card.card-usable:hover { transform:translateY(-7px) scale(1.03) !important; }
      .card.card-usable[data-ctype="disaster"]:hover { box-shadow:0 12px 28px rgba(248,81,73,.6), 0 0 0 1px rgba(248,81,73,.35) !important; }
      .card.card-usable[data-ctype="instant"]:hover  { box-shadow:0 12px 28px rgba(210,153,34,.6), 0 0 0 1px rgba(210,153,34,.35) !important; }
      .card.card-usable[data-ctype="shield"]:hover   { box-shadow:0 12px 28px rgba(63,185,80,.6),  0 0 0 1px rgba(63,185,80,.35)  !important; }
      .card.card-usable[data-ctype="jinzai"]:hover   { box-shadow:0 12px 28px rgba(168,85,247,.6), 0 0 0 1px rgba(168,85,247,.35) !important; }
    }

    /* ── Phase 1-C: Hand card enter stagger ── */
    .hand-group-cards .card { animation:yb-fadeInUp .38s cubic-bezier(.23,1,.32,1) both; }
    .hand-group-cards .card:nth-child(1) { animation-delay:.02s; }
    .hand-group-cards .card:nth-child(2) { animation-delay:.07s; }
    .hand-group-cards .card:nth-child(3) { animation-delay:.12s; }
    .hand-group-cards .card:nth-child(4) { animation-delay:.17s; }
    .hand-group-cards .card:nth-child(5) { animation-delay:.22s; }
    .hand-group-cards .card:nth-child(6) { animation-delay:.27s; }
    .hand-group-cards .card:nth-child(7) { animation-delay:.32s; }
    .hand-group-cards .card:nth-child(8) { animation-delay:.37s; }

    /* ── Phase 2-A: Typography ── */
    .zone-label { letter-spacing:.09em; text-transform:uppercase; font-size:.68rem !important; font-weight:700; }
    .hp-text    { font-family:'Roboto Condensed',sans-serif; font-weight:700; }
    .budget-display { font-family:'Roboto Condensed',sans-serif; font-weight:900; font-size:1.05rem; }

    /* ── Phase 2-B: Zone damage / heal flash ── */
    .zone-flash-dmg  { animation:yb-zone-flash-dmg .55s ease; }
    .zone-flash-heal { animation:yb-zone-flash-heal .55s ease; }

    /* ── Phase 2-C: Response bar clip-from-bottom / waiting-banner drop-from-top ── */
    .response-pending-bar { animation:yb-clip-from-bottom .45s cubic-bezier(.23,1,.32,1) both; }
    .waiting-banner       { animation:yb-drop-from-top .45s cubic-bezier(.23,1,.32,1) both; }

    /* ── Phase 3-A: Gacha/draft reveal shimmer ── */
    .gacha-card-reveal-area { position:relative; overflow:hidden; }
    .gacha-card-reveal-area.revealed::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(105deg, transparent 25%, rgba(255,255,255,.24) 50%, transparent 75%);
      transform:translateX(-130%) skewX(-15deg);
      pointer-events:none;
      animation:yb-shimmer-over .85s cubic-bezier(.23,1,.32,1) .6s both;
    }

    /* ── Phase 4-B: Confirm drop-in / city modal scale-in ── */
    .confirm-box   { animation:yb-drop-in .38s cubic-bezier(.23,1,.32,1) both; }
    .city-info-box { animation:yb-scale-in .32s cubic-bezier(.23,1,.32,1) both; }

    /* ── Phase 4-C: Turn summary stagger ── */
    .ts-ev { animation:yb-fadeInUp .36s cubic-bezier(.23,1,.32,1) both; }
    .ts-ev:nth-child(1) { animation-delay:.04s; }
    .ts-ev:nth-child(2) { animation-delay:.12s; }
    .ts-ev:nth-child(3) { animation-delay:.20s; }
    .ts-ev:nth-child(4) { animation-delay:.28s; }
    .ts-ev:nth-child(5) { animation-delay:.36s; }
    .ts-ev:nth-child(6) { animation-delay:.44s; }
    .ts-ev:nth-child(7) { animation-delay:.52s; }
    .ts-ev:nth-child(8) { animation-delay:.60s; }

    /* ── A-1: Card just-drawn flash overlay ── */
    @keyframes card-draw-flash {
      0%   { background:rgba(255,255,255,.38); }
      35%  { background:rgba(255,255,255,.08); }
      65%  { background:rgba(255,255,255,.18); }
      100% { background:rgba(255,255,255,0);   }
    }
    @keyframes card-flip-in {
      0%   { transform:perspective(500px) rotateY(90deg) scale(.9); opacity:0; }
      40%  { opacity:1; }
      58%  { transform:perspective(500px) rotateY(-10deg) scale(1.06); }
      80%  { transform:perspective(500px) rotateY(4deg)   scale(1.01); }
      100% { transform:perspective(500px) rotateY(0deg)   scale(1);    opacity:1; }
    }
    .card-just-drawn { position:relative; animation:card-flip-in .5s cubic-bezier(.22,.68,0,1.2) forwards; }
    .card-just-drawn::after {
      content:''; position:absolute; inset:0; border-radius:inherit;
      pointer-events:none; z-index:10;
      animation:card-draw-flash .9s ease forwards;
    }
    .card.card-spectator { cursor:default; }

    /* ── A-2: Confirm wipe-out on play ── */
    @keyframes yb-clip-out {
      from { clip-path:inset(0 0% 0 0); opacity:1; }
      to   { clip-path:inset(0 100% 0 0); opacity:0; }
    }

    /* ── A-3: Screen shake ── */
    @keyframes yb-screen-shake {
      0%,100% { transform:translate(0,0); }
      10%     { transform:translate(-5px,2px); }
      20%     { transform:translate(5px,-2px); }
      35%     { transform:translate(-3px,3px); }
      50%     { transform:translate(3px,-2px); }
      65%     { transform:translate(-2px,2px); }
      80%     { transform:translate(2px,-1px); }
    }
    .screen-shake { animation:yb-screen-shake .42s cubic-bezier(.36,.07,.19,.97) both; }

    /* ── B-1: Card play-out ── */
    @keyframes card-play-out {
      0%   { transform:translateY(0) scale(1); opacity:1; }
      100% { transform:translateY(-56px) scale(.82); opacity:0; }
    }
    .card-play-out { animation:card-play-out .22s cubic-bezier(.4,0,.6,1) both; pointer-events:none; }

    /* ── B-2: Large damage red flash ── */
    @keyframes red-flash-anim { 0%,100%{opacity:0} 18%{opacity:1} }

    /* ── B-1: Your turn clip-path banner ── */
    @keyframes yb-turn-banner {
      0%   { clip-path:inset(0 100% 0 0); opacity:1; }
      30%  { clip-path:inset(0 0%   0 0); opacity:1; }
      72%  { clip-path:inset(0 0%   0 0); opacity:1; }
      100% { clip-path:inset(0 0%   0 0); opacity:0; }
    }
    .turn-banner {
      position:fixed; top:0; left:0; right:0;
      background:linear-gradient(90deg,rgba(250,42,78,.92) 0%,rgba(160,20,45,.7) 100%);
      color:#fff;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 22px 10px;
      font-family:'Roboto Condensed','Arial Narrow',sans-serif;
      font-weight:900; font-size:1.25rem; letter-spacing:.18em; text-transform:uppercase;
      z-index:9999; pointer-events:none;
      animation:yb-turn-banner 1.8s cubic-bezier(.86,0,.07,1) forwards;
    }

    /* ── B-2: Drop from top / clip from bottom ── */
    @keyframes yb-drop-from-top {
      from { transform:translateY(-100%); opacity:0; }
      to   { transform:translateY(0);     opacity:1; }
    }
    @keyframes yb-clip-from-bottom {
      from { clip-path:inset(100% 0 0 0); }
      to   { clip-path:inset(0    0 0 0); }
    }

    /* ── C-3: HP flicker when critical ── */
    @keyframes yb-flicker {
      0%,41%,43%,100% { opacity:1; }
      4%              { opacity:.88; }
      38%             { opacity:.35; }
      42%             { opacity:.9; }
    }
    .hp-text-warn { animation:yb-flicker 2.4s linear infinite; }

    /* ── D-2: Confirm drop-in ── */
    @keyframes yb-drop-in {
      from { opacity:0; transform:translateY(-44px) scale(.94); }
      to   { opacity:1; transform:translateY(0)     scale(1);   }
    }

    /* ── E-2: Zone border neon pulse when your turn ── */
    @keyframes zone-border-pulse {
      0%,100% { border-color:rgba(250,42,78,.35); }
      50%     { border-color:rgba(250,42,78,.8);  }
    }
    .player-zone.my-turn-active { animation:zone-border-pulse 2s ease-in-out infinite; }

    /* ═══════════════════════════════════════════════════
       GAME OVER / VICTORY SCREEN
    ═══════════════════════════════════════════════════ */
    .go-screen { gap: 0 !important; }

    /* ── Hero: full viewport ── */
    .go-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: -12px -12px 0;
      width: calc(100% + 24px);
    }

    /* Scrolling background text (same mechanism as lobby) */
    .go-hero-bg {
      position: absolute; inset: 0;
      display: flex;
      pointer-events: none; user-select: none;
      overflow: hidden;
    }
    .go-hero-bg-col { flex: 1; overflow: hidden; display: flex; justify-content: center; }
    .go-hero-bg-col-inner {
      writing-mode: vertical-rl;
      font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif;
      font-weight: 900;
      font-size: 13vh;
      letter-spacing: 0;
      white-space: nowrap;
      will-change: transform;
    }
    .go-victory .go-hero-bg-col-inner { color: rgba(210,153,34,.10); }
    .go-defeat  .go-hero-bg-col-inner { color: rgba(248,81,73,.08); }
    @keyframes go-scroll-up   { from{transform:translateY(0)} to{transform:translateY(-50%)} }
    @keyframes go-scroll-down { from{transform:translateY(-50%)} to{transform:translateY(0)} }
    .go-scroll-a { animation: go-scroll-up   32s linear infinite; }
    .go-scroll-b { animation: go-scroll-down 32s linear infinite; }

    /* Center content */
    .go-hero-content {
      position: relative; z-index: 1;
      text-align: center;
      display: flex; flex-direction: column;
      align-items: center; gap: 16px;
      padding: 0 24px;
    }

    /* Big title — VICTORY: clip-path reveal / GAME OVER: flash */
    @keyframes go-flash {
      0%   { opacity: 0; }
      10%  { opacity: 0.5; }
      15%  { opacity: 0.3; }
      40%  { opacity: 0.3; }
      50%  { opacity: 0.7; }
      55%  { opacity: 0.3; }
      60%  { opacity: 0.7; }
      65%  { opacity: 0.2; }
      70%  { opacity: 0.5; }
      100% { opacity: 1; }
    }
    @keyframes go-title-reveal {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0% 0 0); }
    }
    .go-big-title {
      font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif;
      font-weight: 900;
      font-size: min(20vw, 6.5rem);
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .go-victory .go-big-title { color: var(--yellow); text-shadow: 0 0 80px rgba(210,153,34,.5); clip-path: inset(0 100% 0 0); animation: go-title-reveal 0.75s cubic-bezier(0.86,0,0.07,1) 0.2s forwards; }
    .go-defeat  .go-big-title { color: var(--red);    text-shadow: 0 0 80px rgba(248,81,73,.4); opacity: 0; animation: go-flash 1.2s ease 0.1s forwards; }

    /* Subtitle (player name + win/lose) */
    .go-player-name {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 6vw, 2.2rem);
      color: var(--t1);
      opacity: 0;
      animation: yb-fadeInUp 0.5s cubic-bezier(0.23,1,0.32,1) 0.9s forwards;
    }
    .go-flavor-txt {
      font-size: clamp(0.82rem, 3.5vw, 0.95rem);
      color: var(--t1);
      opacity: 0;
      animation: yb-fadeInUp 0.5s cubic-bezier(0.23,1,0.32,1) 1.1s forwards;
      line-height: 1.9;
      text-align: center;
      white-space: nowrap;
    }

    /* SCROLL DOWN — YOASOBI fv-scroll pattern */
    .go-scroll-hint {
      position: absolute;
      left: 18px; bottom: 24px;
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      opacity: 0;
      animation: yb-fadeInUp 0.5s ease 1.6s forwards;
    }
    .go-scroll-txt {
      writing-mode: vertical-rl;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.16em;
      color: var(--t1);
      text-transform: uppercase;
    }
    .go-scroll-line {
      width: 1px; height: 48px;
      background: var(--bg3);
      overflow: hidden;
      position: relative;
    }
    .go-scroll-line span {
      display: block;
      position: absolute;
      left: 0; width: 100%; height: 100%;
    }
    .go-scroll-line span::before {
      content: '';
      display: block;
      width: 100%; height: 100%;
      background: #fa2a4e;
      animation: go-line 3s ease 0.5s infinite;
    }
    @keyframes go-line {
      0%   { transform:translateY(-100%); animation-timing-function:cubic-bezier(0.65,0.05,0.36,1); }
      30%  { transform:translateY(0); }
      70%  { transform:translateY(0); animation-timing-function:cubic-bezier(0.65,0.05,0.36,1); }
      90%  { transform:translateY(100%); }
      100% { transform:translateY(100%); }
    }

    /* ── Details (below hero, scroll target) ── */
    .go-details {
      padding: 48px 12px 72px;
      display: flex; flex-direction: column;
      gap: 20px;
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
    }
    .go-section-label {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 900; font-size: 1.1rem;
      letter-spacing: 0.15em;
      color: var(--t1); text-transform: uppercase;
      display: inline-block;
      border-bottom: 2px solid #fa2a4e;
      padding-bottom: 3px;
    }

    /* Stats table */
    .go-stats-table {
      background: var(--bg1);
      border: 1px solid var(--bg3);
      border-radius: 14px; overflow: hidden;
    }
    .go-stats-section-header {
      padding: 8px 16px;
      font-size: 0.88rem; font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--t1); background: var(--bg2);
      border-bottom: 1px solid var(--bg3);
      display: flex; align-items: center; gap: 6px;
    }
    .go-stats-row {
      display: flex; align-items: center;
      padding: 10px 16px; gap: 8px;
      border-bottom: 1px solid var(--bg3);
      font-size: 0.88rem;
    }
    .go-stats-row:last-child { border-bottom: none; }

    .go-city-badge:hover, .go-city-badge:active { border-color:var(--blue); background:rgba(56,139,253,.08); }
    .go-city-badge img { width:100%; max-width:72px; aspect-ratio:288/450; object-fit:cover; border-radius:8px; }
