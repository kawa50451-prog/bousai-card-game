    // ── ダメージ解決（協力版：対戦の式を踏襲しつつ CO 状態で計算） ──
    function coopResolveAttack(atk, cs, resp, comboBonus) {
      const city = cs.city, e = cs.effects; const fromHp = cs.hp;
      let dmg = atk.baseDamage; const lines = [];
      const ld = (t, d) => lines.push({ t, d: d == null ? null : d });
      let neg = false;
      if (e.negateSpecial) { neg = true; e.negateSpecial = false; dmg -= 10; ld('広域避難指示（事前）：特殊効果を無効', -10); }
      else if (resp && resp.effectType === 'negate_special') { neg = true; dmg -= 10; ld('広域避難指示（対応）：特殊効果を無効', -10); }
      if (!neg && atk.specialType) {
        if (atk.specialType === 'coastal_bonus' && city.isCoastal) { dmg += 10; ld('海岸都市（地形リスク）', +10); }
        if (atk.specialType === 'mountain_bonus' && city.isMountain) { dmg += 10; ld('山間部都市（地形リスク）', +10); }
        if (atk.specialType === 'inland_bonus' && !city.isCoastal && !city.isMountain) { dmg += 10; ld('内陸都市（地形リスク）', +10); }
        if (atk.specialType === 'discard_policy') {
          if (CO.hand.length > 0) { const di = Math.random() * CO.hand.length | 0; const d = CO.hand.splice(di, 1)[0]; CO.policyDiscard.push(d); ld(`台風：手札「${d.name}」を破棄`, null); }
          else ld('台風：手札なし（効果なし）', null);
        }
      }
      // 連鎖コンボ増幅：同一ターンに trigger 災害を撃った都市へ2次災害の実カードを重ねた時の追い打ち。広域避難（特殊無効）の影響は受けない。
      if (comboBonus > 0) { dmg += comboBonus; ld('連鎖増幅（前の災害への追い打ち）', +comboBonus); }
      if (city.abilityType === 'resist_compound' && atk.id === 'compound') { dmg -= city.abilityValue; ld(`${city.name}：複合災害軽減`, -city.abilityValue); }
      if (city.abilityType === 'resist_quake_fire' && (atk.id === 'earthquake' || atk.id === 'wildfire')) { dmg -= city.abilityValue; ld(`${city.name}：地震・大火災軽減`, -city.abilityValue); }
      if (city.abilityType === 'resist_landslide' && atk.id === 'landslide') { dmg -= city.abilityValue; ld(`${city.name}：土砂崩れ軽減`, -city.abilityValue); }
      if (city.abilityType === 'resist_flood' && (atk.id === 'flood' || atk.id === 'tsunami')) { dmg -= city.abilityValue; ld(`${city.name}：洪水・津波軽減`, -city.abilityValue); }
      if (city.abilityType === 'second_hit_reduce' && e.disastersReceivedThisTurn >= 1) { dmg -= city.abilityValue; ld(`${city.name}：連続被弾軽減`, -city.abilityValue); }
      if (city.abilityType === 'quake_regen' && atk.id === 'earthquake') e.quakeHitThisTurn = true;
      if (city.abilityType === 'flood_budget' && (atk.id === 'flood' || atk.id === 'tsunami')) { CO.nextBudgetBonus = (CO.nextBudgetBonus || 0) + city.abilityValue; ld(`${city.name}：次ターン予算+${city.abilityValue}`, null); }
      if (city.abilityType === 'flood_draw' && (atk.id === 'flood' || atk.id === 'tsunami')) { coopDraw(city.abilityValue); ld(`${city.name}：被災後の学習で${city.abilityValue}枚ドロー`, null); }
      if (city.abilityType === 'quake_draw' && atk.id === 'earthquake') { coopDraw(city.abilityValue); ld(`${city.name}：被災後の学習で${city.abilityValue}枚ドロー`, null); }
      e.disastersReceivedThisTurn++;
      if (e.damageReduceHits > 0) { dmg -= 15; e.damageReduceHits--; ld(`防災庁設置：全ダメージ軽減（残${e.damageReduceHits}）`, -15); }
      if (e.shieldQuakeFire && (atk.id === 'earthquake' || atk.id === 'wildfire')) { dmg -= 30; e.shieldQuakeFire = false; ld('耐震補強（シールド）発動・消費', -30); }
      if (e.shieldFlood && (atk.id === 'flood' || atk.id === 'tsunami')) { dmg -= 25; e.shieldFlood = false; ld('堤防建設（シールド）発動・消費', -25); }
      if (resp && resp.effectType === 'shield_quake_fire' && (atk.id === 'earthquake' || atk.id === 'wildfire')) { dmg -= 30; ld('耐震補強（対応）発動', -30); }
      if (resp && resp.effectType === 'shield_flood' && (atk.id === 'flood' || atk.id === 'tsunami')) { dmg -= 25; ld('堤防建設（対応）発動', -25); }
      if (resp && resp.effectType === 'heal') { const h = Math.floor(resp.value / 2); dmg -= h; ld(`${resp.name}（対応・半減）でHP回復`, -h); }
      if (city.abilityType === 'vulnerability_draw' && CO.hand.length <= 2) { dmg += city.abilityValue; ld(`${city.name}（社会的脆弱性：手札${CO.hand.length}枚）`, +city.abilityValue); coopDraw(1); }
      dmg = Math.max(0, dmg); cs.hp = Math.max(0, cs.hp - dmg);
      return { dmg, lines, fromHp, toHp: cs.hp };
    }
    function coopApplyChain(atk, cs) {
      const chains = COOP_CHAINS[atk.id]; if (!chains) return [];
      const out = [];
      for (const ch of chains) {
        const m = ch.cond === 'coastal' ? cs.city.isCoastal : ch.cond === 'mountain' ? cs.city.isMountain : (!cs.city.isCoastal && !cs.city.isMountain);
        if (!m) continue;
        let d = ch.dmg; const e = cs.effects;
        if (ch.shield === 'shieldFlood' && e.shieldFlood) { d = Math.max(0, d - 25); e.shieldFlood = false; }
        if (ch.shield === 'shieldQuakeFire' && e.shieldQuakeFire) { d = Math.max(0, d - 30); e.shieldQuakeFire = false; }
        if (e.damageReduceHits > 0) { d = Math.max(0, d - 15); e.damageReduceHits--; }
        d = Math.max(0, d); cs.hp = Math.max(0, cs.hp - d);
        out.push({ label: ch.label, icon: ch.icon, dmg: d });
      }
      return out;
    }
    function coopResolveRound(respUid, respIdx) {
      _coCancelTimer();
      CO.phase = 'resolving'; CO.confirm = null;
      const resp = (respUid != null) ? CO.hand.find(c => c.uid === respUid) : null;
      if (resp) { CO.hand.splice(CO.hand.indexOf(resp), 1); CO.policyDiscard.push(resp); }
      const summary = { attacks: [], regens: [], cityStart: CO.cities.map(cs => ({ name: cs.city.name, hp: cs._turnStartHp ?? cs.hp, maxHp: cs.maxHp })) };
      CO.incoming.forEach((atk, ai) => {
        const cs = CO.cities[atk.idx];
        if (cs.hp <= 0) { summary.attacks.push({ cardIcon: atk.card.icon, cardName: atk.card.name, cityName: cs.city.name, dead: true }); _coLog(`　${atk.card.name}：${cs.city.name}は既に壊滅`); return; }
        const r = coopResolveAttack(atk.card, cs, (ai === respIdx) ? resp : null, coopComboBonus(atk.card, atk.idx));
        _coLog(`💥 ${atk.card.name} → ${cs.city.name}：${r.dmg}ダメージ（残${Math.max(0, cs.hp)}）`);
        r.lines.forEach(l => _coLog(`　↳ ${l.t}${l.d != null ? `（${l.d > 0 ? '+' : ''}${l.d}）` : ''}`));
        const chain = coopApplyChain(atk.card, cs);
        chain.forEach(c => _coLog(`　⚡ 連鎖：${c.label} +${c.dmg}（残${Math.max(0, cs.hp)}）`));
        summary.attacks.push({ cardId: atk.card.id, cardIcon: atk.card.icon, cardName: atk.card.name, cityName: cs.city.name, maxHp: cs.maxHp, base: atk.card.baseDamage, hpBefore: r.fromHp, damage: r.dmg, lines: r.lines, chain, hpAfter: cs.hp });
        // 全ゲーム通算の戦績ログ（勝敗画面の戦績用）
        const terrainBonus = (r.lines.filter(l => /地形リスク/.test(l.t)).reduce((s, l) => s + (l.d || 0), 0));
        const blocked = (r.lines.filter(l => l.d != null && l.d < 0).reduce((s, l) => s + (-l.d), 0));
        const chainDmg = chain.reduce((s, c) => s + c.dmg, 0);
        CO.gameLog.push({ turn: CO.turn, cardId: atk.card.id, cardIcon: atk.card.icon, cardName: atk.card.name, cityId: cs.city.id, cityName: cs.city.name, damage: r.dmg + chainDmg, base: atk.card.baseDamage, terrainBonus, blocked, chainDmg, chainLabels: chain.map(c => c.label) });
      });
      CO.incoming = [];
      if (CO.cities.every(cs => cs.hp <= 0)) { CO.outcome = 'destroyed'; CO.result = (CO.humanSide === 'nature') ? 'win' : 'lose'; CO.phase = 'over'; CO.summary = summary; renderCoop(); return; }
      coopApplyRegen(summary);
      summary.cityEnd = CO.cities.map(cs => ({ name: cs.city.name, hp: cs.hp, maxHp: cs.maxHp, dead: cs.hp <= 0 }));
      CO.summary = summary; CO.phase = 'summary'; renderCoop();
    }
    function coopApplyRegen(summary) {
      CO.cities.forEach(cs => {
        const c = cs.city; if (cs.hp <= 0) return; const before = cs.hp;
        if (c.abilityType === 'regen') cs.hp = Math.min(cs.maxHp, cs.hp + c.abilityValue);
        if (c.abilityType === 'quake_regen' && cs.effects.quakeHitThisTurn) cs.hp = Math.min(cs.maxHp, cs.hp + c.abilityValue);
        cs.effects.quakeHitThisTurn = false;
        if (cs.hp !== before) { _coLog(`💚 ${c.name}：回復 +${cs.hp - before}`); if (summary) summary.regens.push({ cityName: c.name, amount: cs.hp - before, hpBefore: before, hpAfter: cs.hp }); }
      });
    }
    function coopDismissSummary() {
      if (CO.mp && !CO._applying) return coopMPCommit('dismissSummary', {});
      if (CO.online && !CO.host) return coopClientCommit('dismissSummary', {});
      // 制限ターンまで都市が生き残れば、都市側プレイヤーの勝ち＝自然側プレイヤーの負け
      if (CO.turn >= CO.diff.maxTurns) { CO.outcome = 'survived'; CO.result = (CO.humanSide === 'nature') ? 'lose' : 'win'; CO.phase = 'over'; renderCoop(); return; }
      CO.turn++;
      coopStartCityTurn(false);
    }

    // ── 対応フェーズ（トリアージ・ポップアップ確認） ──
    function coopSelectResponse(uid) { if (CO.phase !== 'coopResponse') return; CO.confirm = { uid, resp: true }; renderCoop(); }
    function coopConfirmRespApply(ai) { if (!CO.confirm) return; if (CO.mp && !CO._applying) return coopMPCommit('respApply', { uid: CO.confirm.uid }); if (CO.online && !CO.host) return coopClientCommit('respApply', { uid: CO.confirm.uid, ai }); const uid = CO.confirm.uid; CO.confirm = null; coopResolveRound(uid, ai); }
    function coopSkipResponse() { if (CO.mp && !CO._applying) return coopMPCommit('skipResp', {}); if (CO.online && !CO.host) return coopClientCommit('skipResp', {}); CO.confirm = null; coopResolveRound(null, -1); }

    // ═══ 人間=自然側（攻撃）のターン。災害プール（各3枚）から選んで攻撃 ═══
    function coopStartNatureHumanTurn() {
      _coCancelTimer();
      CO.phase = 'natureHuman'; CO.confirm = null; CO.responseBlocked = false; CO.blockReason = '';
      CO.cities.forEach(cs => cs._turnStartHp = cs.hp);
      // 社会的脆弱性イベント（都市＝CPU側に作用するので、自然側プレイヤーには有利）
      if (CO.diff.events.some(ev => ev.t === CO.turn && ev.id === 'pollution')) coopEventPollution();
      if (CO.diff.events.some(ev => ev.t === CO.turn && ev.id === 'terror')) { CO.responseBlocked = true; CO.blockReason = '💣 テロ攻撃イベント：都市側は対応不可'; _coLog('💣 テロ攻撃イベント：今回は都市側の対応を封じた'); }
      CO.incoming = [];
      if (CO.mp) {
        CO.atkUsedTypes = {}; CO.atkCityHits = {}; // 即死防止：同種1回／都市別上限の集計をリセット
        const poolLeft = Object.values(CO.naturePool).reduce((a, b) => a + b, 0);
        CO.attacksLeft = Math.min(coopMPAttackCount(), poolLeft); // 残り災害枚数を超えて攻撃枠を出さない
        if (CO.attacksLeft <= 0) { _coLog('🌪️ 自然の災害が尽きた。今回の攻撃なし'); coopFinishNatureHuman(); return; }
      } else CO.attacksLeft = CO.diff.draw;
      if (!CO.online) coopSplashNatureHuman();
      renderCoop();
    }
    function coopSelectAttackType(id) {
      if (CO.phase !== 'natureHuman' || CO.attacksLeft <= 0) return;
      if ((CO.naturePool[id] || 0) <= 0) return;
      CO.confirm = { attackId: id, attack: true }; renderCoop();
    }
    function coopConfirmAttack(cityIdx) {
      if (!CO.confirm || !CO.confirm.attack) return;
      if (CO.mp && !CO._applying) return coopMPCommit('attack', { id: CO.confirm.attackId, cityIdx });
      if (CO.online && !CO.host) return coopClientCommit('attack', { id: CO.confirm.attackId, cityIdx });
      const c = DISASTER_CARDS.find(x => x.id === CO.confirm.attackId);
      if (!c || (CO.naturePool[c.id] || 0) <= 0) { CO.confirm = null; renderCoop(); return; }
      if (CO.mp) { // 即死防止：同種は1ターン1回／1都市への攻撃は最大 COOP_MAX_HITS 回
        if (CO.atkUsedTypes && CO.atkUsedTypes[c.id]) { CO.confirm = null; _coLog('⚠️ 同じ災害は1ターンに1回までです'); renderCoop(); return; }
        const cap = CO.maxHits || COOP_MAX_HITS;
        if (((CO.atkCityHits && CO.atkCityHits[cityIdx]) || 0) >= cap) { CO.confirm = null; _coLog(`⚠️ 1都市への攻撃は1ターン${cap}回までです`); renderCoop(); return; }
      }
      CO.naturePool[c.id]--;
      CO.incoming.push({ card: c, idx: cityIdx, est: coopEstimate(c, CO.cities[cityIdx]) });
      CO.attacksLeft--; CO.confirm = null;
      if (CO.mp) { CO.atkUsedTypes[c.id] = true; CO.atkCityHits[cityIdx] = ((CO.atkCityHits[cityIdx]) || 0) + 1; }
      _coLog(`🌪️ あなたの攻撃：${c.name} → ${CO.cities[cityIdx].city.name}`);
      if (!coopHumanCanAttack()) coopFinishNatureHuman(); else renderCoop();
    }
    // まだ攻撃できる手があるか（攻撃枠・残りプール・同種制限・都市別上限を考慮）
    function coopHumanCanAttack() {
      if (CO.attacksLeft <= 0) return false;
      if (!CO.mp) return Object.values(CO.naturePool).some(v => v > 0);
      const cap = CO.maxHits || COOP_MAX_HITS;
      const cityOpen = CO.cities.some((cs, i) => cs.hp > 0 && ((CO.atkCityHits[i]) || 0) < cap);
      if (!cityOpen) return false;
      return DISASTER_CARDS.some(c => (CO.naturePool[c.id] || 0) > 0 && !CO.atkUsedTypes[c.id]);
    }
    function coopFinishNatureHuman() {
      if (CO.mp && !CO._applying) return coopMPCommit('finishAttack', {}); // 自然側がゲストでもホストで確定させる
      CO.confirm = null;
      const compoundUnstopped = CO.incoming.some(a => a.card.specialType === 'skip_response' && !CO.cities[a.idx].effects.negateSpecial);
      // MPでは複合の対応スキップを当たった都市だけに限定（coopEnterResponseMP）。非MP（ソロ/旧2人）は従来通り全体スキップ
      if (compoundUnstopped && !CO.mp) { CO.responseBlocked = true; CO.blockReason = '⚡ 複合災害により都市側は対応不可'; _coLog('⚡ 複合災害：都市側の対応を封じた'); }
      // MP：被弾都市ごとに所有者が対応（per-victim）
      if (CO.mp) { coopEnterResponseMP(); return; }
      // オンライン（旧2人）：対応は都市側の人間が行う（CPU応答は使わない）
      if (CO.online) {
        if (CO.incoming.length === 0 || CO.responseBlocked) { CO.phase = 'resolving'; renderCoop(); _coTimer = setTimeout(() => coopResolveRound(null, -1), 500); }
        else { CO.phase = 'coopResponse'; renderCoop(); }
        return;
      }
      CO.phase = 'resolving'; renderCoop();
      if (CO.incoming.length === 0) { _coTimer = setTimeout(() => coopResolveRound(null, -1), 300); }
      else if (CO.responseBlocked) { _coTimer = setTimeout(() => coopResolveRound(null, -1), 1200); }
      else { _coTimer = setTimeout(coopCpuResponse, 900); }
    }

    // ═══ CPU都市側（防衛）AI ═══
    function coopCpuPickPolicy(playable, left) {
      const alive = CO.cities.map((cs, i) => ({ cs, i })).filter(x => x.cs.hp > 0);
      if (!alive.length) return null;
      const lowest = alive.reduce((m, x) => x.cs.hp < m.cs.hp ? x : m, alive[0]);
      const lowRatio = lowest.cs.hp / lowest.cs.maxHp;
      if (lowRatio < 0.4) { const heal = playable.filter(c => c.effectType === 'heal' && lowest.cs.hp < lowest.cs.maxHp).sort((a, b) => b.value - a.value)[0]; if (heal) return { card: heal, cityIdx: lowest.i }; }
      for (const x of alive) { if (x.cs.city.isCoastal && !x.cs.effects.shieldFlood) { const dam = playable.find(c => c.effectType === 'shield_flood'); if (dam) return { card: dam, cityIdx: x.i }; } }
      for (const x of alive) { if (!x.cs.effects.shieldQuakeFire) { const qw = playable.find(c => c.effectType === 'shield_quake_fire'); if (qw) return { card: qw, cityIdx: x.i }; } }
      if (!lowest.cs.effects.negateSpecial) { const ev = playable.find(c => c.effectType === 'negate_special'); if (ev) return { card: ev, cityIdx: lowest.i }; }
      if (lowest.cs.effects.damageReduceHits === 0) { const bc = playable.find(c => c.effectType === 'damage_reduce_2t'); if (bc) return { card: bc, cityIdx: lowest.i }; }
      if (lowest.cs.hp < lowest.cs.maxHp) { const heal = playable.filter(c => c.effectType === 'heal').sort((a, b) => b.value - a.value)[0]; if (heal) return { card: heal, cityIdx: lowest.i }; }
      const dr = playable.find(c => c.effectType === 'draw'); if (dr) return { card: dr, cityIdx: null };
      return null;
    }
    function coopCpuCityTurn() {
      _coTimer = null; if (!CO) return;
      const skipChance = CO.diff.cpuSkip != null ? CO.diff.cpuSkip : 0;
      const played = [];
      let guard = 0;
      while (guard++ < 14) {
        const left = CO.budget - CO.budgetUsed; if (left <= 0) break;
        const playable = CO.hand.filter(c => c.cost <= left); if (!playable.length) break;
        if (Math.random() < skipChance) break;
        const act = coopCpuPickPolicy(playable, left); if (!act) break;
        const c = act.card; CO.budgetUsed += c.cost; CO.hand.splice(CO.hand.indexOf(c), 1); CO.policyDiscard.push(c);
        if (act.cityIdx != null) { coopApplyPolicyToCity(c, CO.cities[act.cityIdx]); played.push({ card: c, target: CO.cities[act.cityIdx].city.name }); CO.cpuPlayedLog.push({ id: c.id, name: c.name }); _coLog(`🛡️ CPU都市：${c.name} → ${CO.cities[act.cityIdx].city.name}`); }
        else if (c.effectType === 'draw') { coopDraw(c.value); played.push({ card: c, target: null }); CO.cpuPlayedLog.push({ id: c.id, name: c.name }); _coLog(`🛡️ CPU都市：${c.name}（ドロー）`); }
      }
      if (played.length) { CO.cpuReview = played; CO.phase = 'cpuReview'; renderCoop(); }
      else { _coLog('🛡️ CPU都市：今回は備えを置かなかった'); coopAfterCityTurn(); }
    }
    function coopDismissCpuReview() { CO.cpuReview = null; coopAfterCityTurn(); }
    function coopCpuResponse() {
      _coTimer = null; if (!CO) return;
      const respCards = CO.hand.filter(c => ['shield_quake_fire', 'shield_flood', 'heal', 'negate_special'].includes(c.effectType));
      let best = null;
      CO.incoming.forEach((a, ai) => {
        const cs = CO.cities[a.idx]; if (cs.hp <= 0) return;
        const before = coopPredictDamage(a.card, cs, null);
        respCards.forEach(rc => {
          const after = coopPredictDamage(a.card, cs, rc);
          let score = before - after;
          if (before >= cs.hp && after < cs.hp) score += 1000; // 壊滅を防ぐ
          if (!best || score > best.score) best = { uid: rc.uid, ai, score };
        });
      });
      if (best && best.score > 0) { const rc = CO.hand.find(c => c.uid === best.uid); _coLog(`🛡️ CPU都市：${rc.name}で対応`); coopResolveRound(best.uid, best.ai); }
      else { _coLog('🛡️ CPU都市：有効な対応なし'); coopResolveRound(null, -1); }
    }

    // ── ターン切替スプラッシュ（対戦モードのポップ表示に合わせる。#app外のbodyに出すので描画で消えない） ──
    function coopSplash(title, sub, glow, iconSrc) {
      if (typeof document === 'undefined' || !document.createElement) return;
      document.querySelectorAll('.turn-splash').forEach(e => e.remove());
      const el = document.createElement('div'); el.className = 'turn-splash';
      const inner = document.createElement('div'); inner.className = 'turn-splash-inner';
      inner.style.cssText = `background:rgba(${glow},.14);border:2px solid rgba(${glow},.55)`;
      inner.innerHTML = `<div style="display:flex;gap:10px;justify-content:center"><img src="${iconSrc}" class="turn-splash-icon" style="filter:drop-shadow(0 0 14px rgba(${glow},.8))" onerror="this.style.display='none'"></div><div style="font-size:1.5rem;font-weight:900;color:#fff;letter-spacing:.04em;margin-top:4px">${title}</div><div style="font-size:.82rem;color:rgba(255,255,255,.65);margin-top:6px">${sub}</div>`;
      el.appendChild(inner); document.body.appendChild(el);
      setTimeout(() => el.remove(), 1700);
    }
    function coopSplashCity() { coopSplash(`ターン ${CO.turn} ／ あなたの番`, '都市の守りを固めよう', '56,139,253', 'images/icons/icon_city.webp'); }

    function coopSplashNatureHuman() { coopSplash(`あなたの攻撃（ターン ${CO.turn}）`, '都市を壊滅させよう', '248,81,73', 'images/icons/icon_disaster.webp'); }

        <button onclick="coopCopyLobbyLink()" style="width:100%;max-width:340px;padding:11px;border-radius:10px;background:rgba(56,139,253,.15);border:1.5px solid #388bfd;color:#388bfd;font-weight:700;cursor:pointer">🔗 招待リンクをコピー</button>` : '';
      const natLabel = natureP ? '1（人間）' : (CO.natureMode === 'cpu' ? 'CPU' : '0（参加待ち）');

    // 政策カードを対戦モードと同じ .card 画像形式で描画。support=後方支援中（自己完結カードは使えない）

      const natureMode = CO.humanSide === 'nature';
      const remainBanner = isFinal
        ? (natureMode
          ? `<div style="text-align:center;background:rgba(248,81,73,.14);border:1px solid #f85149;border-radius:10px;padding:12px;margin-bottom:12px"><div style="font-size:1.1rem;font-weight:900;color:#f85149">⚠️ ラストターン：壊滅させなければ都市の勝ち</div></div>`
          : `<div style="text-align:center;background:rgba(63,185,80,.14);border:1px solid #3fb950;border-radius:10px;padding:12px;margin-bottom:12px"><div style="font-size:1.2rem;font-weight:900;color:#3fb950">🎉 最終ターンを耐え抜いた！</div></div>`)
        : (natureMode
          ? `<div style="text-align:center;background:rgba(248,81,73,.12);border:1px solid #f85149;border-radius:10px;padding:10px;margin-bottom:12px"><span style="font-size:.8rem;color:#fff">全都市壊滅まで </span><span style="font-size:1.4rem;font-weight:900;color:#f85149">残り ${remain} ターン</span><div style="font-size:.72rem;color:rgba(255,255,255,.7);margin-top:2px">ターン ${CO.turn} / ${d.maxTurns} 終了</div></div>`
          : `<div style="text-align:center;background:rgba(56,139,253,.12);border:1px solid #388bfd;border-radius:10px;padding:10px;margin-bottom:12px"><span style="font-size:.8rem;color:#fff">生存まで </span><span style="font-size:1.4rem;font-weight:900;color:#388bfd">あと ${remain} ターン</span><div style="font-size:.72rem;color:rgba(255,255,255,.7);margin-top:2px">ターン ${CO.turn} / ${d.maxTurns} 終了</div></div>`);
      const cityFinal = (s.cityEnd || s.cityStart).map((ce, i) => {
        const start = s.cityStart[i]; const took = Math.max(0, start.hp - ce.hp);
        const col = ce.dead ? '#f85149' : (ce.hp / ce.maxHp > 0.3 ? '#3fb950' : '#d29922');
        const _ownerLbl = CO.mp && CO.cities[i] && CO.cities[i].ownerName ? `<div style="font-size:.62rem;color:rgba(255,255,255,.5);margin-top:1px">${CO.cities[i].ownerName}</div>` : '';
        return `<div style="flex:1;background:var(--bg2,#161b22);border-radius:8px;padding:8px;text-align:center;border:1px solid var(--bg3,#21262d)"><div style="font-weight:700;color:#fff;font-size:.82rem">${ce.name}</div>${_ownerLbl}<div style="font-size:1.1rem;font-weight:900;color:${col}">${ce.dead ? '壊滅' : ce.hp + '/' + ce.maxHp}</div><div style="font-size:.68rem;color:#fff;opacity:.7">このターン -${took}</div></div>`;
      }).join('');
      const _ownerByCity = {}; CO.mp && CO.cities && CO.cities.forEach(cs => { if (cs.ownerName) _ownerByCity[cs.city.name] = cs.ownerName; });
      const atkCards = s.attacks.map(a => {
        const _ownerSfx = _ownerByCity[a.cityName] ? `<span style="font-size:.67rem;opacity:.65;font-weight:600;margin-left:3px">${_ownerByCity[a.cityName]}</span>` : '';
        if (a.dead) return `<div class="ts-ev warn"><div class="ts-ev-title">${a.cardIcon} ${a.cardName} → ${a.cityName}${_ownerByCity[a.cityName] ? `（${_ownerByCity[a.cityName]}）` : ''}</div><div class="ts-ev-detail">すでに壊滅していたため被害なし</div></div>`;
        const totalDrop = Math.max(0, a.hpBefore - a.hpAfter);
        const isBlock = totalDrop === 0;
        const dmgCol = isBlock ? 'var(--green)' : 'var(--red)';
        const baseChip = a.base != null ? `<span style="${cBad}">基礎 ${a.base}</span>` : '';
        // A-3: 連鎖増幅行は専用スタイルで強調、それ以外は従来どおり
        const lineChips = (a.lines || []).filter(l => l.d != null).map(l => {
          if (l.t.startsWith('連鎖増幅')) return `<span style="${cCombo}">${coopZapIco(12,'var(--red)')}<span style="margin-left:2px">${l.t.split(/[：（(]/)[0]} +${l.d}</span></span>`;
          return `<span style="${l.d > 0 ? cBad : cOk}">${l.t.split(/[：（(]/)[0]} ${l.d > 0 ? '+' : ''}${l.d}</span>`;
        }).join('');
        const chainChips = (a.chain || []).map(c => `<span style="${cBad}">${coopZapIco(12, 'var(--red)')}<span style="margin-left:2px">二次災害 ${c.label} +${c.dmg}</span></span>`).join('');
        const noteLines = (a.lines || []).filter(l => l.d == null).map(l => `<div style="font-size:.68rem;color:rgba(255,255,255,.75);margin-top:3px">• ${l.t}</div>`).join('');
        const pAfter = Math.max(0, Math.round(a.hpAfter / a.maxHp * 100));
        const pDrop = Math.max(0, Math.min(100 - pAfter, Math.round(totalDrop / a.maxHp * 100)));
        return `<div class="ts-ev ${isBlock ? 'heal' : 'damage'}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-weight:700;font-size:.86rem;color:var(--t1)">${a.cardIcon} ${a.cardName} <span style="font-size:.72rem;color:#fff;opacity:.7">→ ${a.cityName}${_ownerSfx}</span></div><div style="text-align:right;line-height:1"><span style="font-size:1.5rem;font-weight:900;color:${dmgCol}">${totalDrop}</span><span style="font-size:.66rem;font-weight:600;color:${dmgCol};margin-left:2px">ダメージ</span></div></div><div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:.7rem;color:#fff;margin-bottom:3px"><span>HP</span><span>${a.hpBefore} → ${a.hpAfter}</span></div><div style="background:var(--bg3);border-radius:4px;height:7px;overflow:hidden;position:relative"><div style="position:absolute;left:0;top:0;height:100%;width:${pAfter}%;background:var(--green);border-radius:4px 0 0 4px"></div><div style="position:absolute;left:${pAfter}%;top:0;height:100%;width:${pDrop}%;background:rgba(248,81,73,.75)"></div></div></div><div style="display:flex;flex-wrap:wrap;gap:4px">${baseChip}${lineChips}${chainChips}</div>${noteLines}</div>`;
      }).join('');
      const regenCards = (s.regens || []).map(r => `<div class="ts-ev heal"><div class="ts-ev-title">💚 ${r.cityName}：HP +${r.amount} 回復</div><div class="ts-ev-detail">HP ${r.hpBefore} → ${r.hpAfter}（ターン終了時の都市能力）</div></div>`).join('');
      const empty = (!atkCards && !regenCards) ? '<div style="color:var(--t3);font-size:.85rem;text-align:center;padding:8px">このターンの被害はなし</div>' : '';
      const sumBtn = (!CO.online || coopMyPhase())
        ? `<button class="btn-ho" onclick="coopDismissSummary()">${isFinal ? '結果を見る' : '✅ 確認して次のターンへ'}</button>`
        : `<div style="color:rgba(255,255,255,.7);font-size:.85rem">⏳ 都市側（${CO.oppName || '相手'}）の確認を待っています…</div>`;
      const quitBtn = `<button onclick="coopRequestQuit()" style="width:100%;margin-top:6px;padding:8px;border-radius:8px;background:transparent;border:1px solid #30363d;color:rgba(255,255,255,.45);font-size:.74rem;cursor:pointer">ロビーに戻る（中断）</button>`;
      const sumOverlay = CO.confirm ? coopRenderConfirm() : '';
      return `<div class="screen active"><div class="turn-summary-box"><div class="ts-title"><img src="images/icons/icon_disaster.webp" style="width:18px;height:18px;object-fit:contain;vertical-align:middle;display:inline-block"> ${natureMode ? 'あなたの攻撃の結果' : '自然の攻撃まとめ'}（ターン ${CO.turn}）</div>${remainBanner}<div style="display:flex;gap:8px;margin-bottom:10px">${cityFinal}</div><div class="ts-events">${atkCards}${regenCards}${empty}</div><div style="text-align:center;margin-top:12px">${sumBtn}</div>${quitBtn}</div></div>${sumOverlay}`;
    }
    // 勝敗画面の戦績セクション（立場で見せ方を変える。coop_mode_summary §9 に基づく）
    function coopRenderStats(natureMode) {
      const log = CO.gameLog || [];
      const sec = (header, body) => `<div class="go-inview go-stats-table"><div class="go-stats-section-header go-karte-header"><img src="${header.icon}" style="width:20px;height:20px;object-fit:contain"> ${header.text}</div>${body}</div>`;
      const galleryHint = '<div class="go-terrain-note" style="margin-top:8px">カード名をタップするとカード図鑑で詳しく学べます</div>';
      let out = '';

      if (natureMode) {
        // 🌪️ 自然側＝「脆弱性を探す目」：与ダメージ・地形・連鎖・阻まれた量
        const byCity = {};
        log.forEach(e => { (byCity[e.cityName] = byCity[e.cityName] || { dmg: 0, terrain: 0 }); byCity[e.cityName].dmg += e.damage; byCity[e.cityName].terrain += e.terrainBonus; });
        const cityRows = Object.entries(byCity).map(([name, v]) => `<div class="go-stats-row"><span class="go-stats-row-name">${name}</span><span class="go-hp-dead">−${v.dmg}</span></div>`).join('');
        const totalDmg = log.reduce((s, e) => s + e.damage, 0);
        if (cityRows) out += sec({ icon: 'images/icons/neon_disaster.webp', text: '与えたダメージ — 都市別' }, `${cityRows}<div class="go-stats-row" style="border-top:1px solid var(--bg3);margin-top:2px"><span class="go-stats-row-name" style="font-size:.78rem">合計</span><span class="go-hp-dead">−${totalDmg}</span></div>`);

        const totalTerrain = log.reduce((s, e) => s + e.terrainBonus, 0);
        const chainEvents = log.filter(e => e.chainDmg > 0);
        const totalChain = chainEvents.reduce((s, e) => s + e.chainDmg, 0);
        const analysisRows =
          `<div class="go-stats-row"><span class="go-stats-row-name">地形ボーナスで稼いだ追加ダメージ</span><span style="color:var(--red);font-weight:700;font-family:'Roboto Condensed',sans-serif">+${totalTerrain}</span></div>` +
          `<div class="go-stats-row"><span class="go-stats-row-name">連鎖を誘発した回数</span><span style="color:var(--red);font-weight:700;font-family:'Roboto Condensed',sans-serif">${chainEvents.length}回 / +${totalChain}</span></div>`;
        out += sec({ icon: 'images/icons/neon_city.webp', text: '脆弱性を突いた分析' }, `${analysisRows}<div class="go-terrain-note" style="margin-top:8px">地形が合う災害ほど被害が大きい。弱点（曝露）を突く視点が「リスクを読む力」になる</div>`);

        const blocked = log.reduce((s, e) => s + e.blocked, 0);
        if (blocked > 0) out += sec({ icon: 'images/icons/neon_policy_shield.webp', text: 'CPUの守りに阻まれた量' }, `<div class="go-stats-row"><span class="go-stats-row-name">シールド・対応・都市能力で軽減された合計</span><span class="go-hp-alive">−${blocked}</span></div><div class="go-terrain-note" style="margin-top:8px">備えがあるほど被害は減る。攻め手から見ると「どこに隙があるか」が勝負どころ</div>`);

        // 最も削れた災害×都市の組み合わせ → 攻略ヒント
        const best = log.reduce((m, e) => e.damage > (m?.damage ?? 0) ? e : m, null);
        if (best) out += sec({ icon: 'images/icons/neon_disaster.webp', text: '今回の最大打撃' }, `<div class="go-stats-row"><span style="font-size:1rem">${best.cardIcon}</span><span class="go-stats-row-name">${best.cardName} → ${best.cityName}</span><span class="go-hp-dead">−${best.damage}</span></div>${best.cityId ? `<button class="go-gallery-btn" style="margin-top:8px" onclick="coopGalleryFromOver('city','${best.cityId}','${best.cityName}','city')">${best.cityName}の弱点を図鑑で見る →</button>` : ''}${best.cardId ? `<button class="go-gallery-btn" style="margin-top:6px" onclick="coopGalleryFromOver('card','${best.cardId}','${best.cardName}','disaster')">${best.cardName}を図鑑で見る →</button>` : ''}`);
        return out;
      }

      // 🛡️ 都市側＝「脆弱性を体感」：被害カルテ・連鎖・効いた備え・次の対策
      const byCity = {};
      log.forEach(e => { (byCity[e.cityId] = byCity[e.cityId] || { name: e.cityName, dmg: 0, chain: 0 }); byCity[e.cityId].dmg += e.damage; byCity[e.cityId].chain += e.chainDmg; });
      const karteRows = log.map(e => {
        const chainBadge = e.chainDmg > 0 ? `<span class="go-karte-badge" style="background:rgba(248,81,73,.25);color:#ff9b9b">連鎖+${e.chainDmg}</span>` : (e.terrainBonus > 0 ? `<span class="go-karte-badge">地形+${e.terrainBonus}</span>` : '');
        return `<div class="go-stats-row"><span style="font-size:1rem">${e.cardIcon}</span><span class="go-stats-row-name">${e.cardName} <span style="font-size:.7rem;color:var(--t2)">→ ${e.cityName}</span>${chainBadge}</span><span class="go-hp-dead" style="font-size:.85rem">−${e.damage}</span></div>`;
      }).join('');
      if (karteRows) { const total = log.reduce((s, e) => s + e.damage, 0); out += sec({ icon: 'images/icons/neon_disaster.webp', text: '被害カルテ — 受けたダメージ' }, `${karteRows}<div class="go-stats-row" style="border-top:1px solid var(--bg3);margin-top:2px"><span class="go-stats-row-name" style="font-size:.78rem">合計</span><span class="go-hp-dead">−${total}</span></div>`); }

      const chainTotal = log.reduce((s, e) => s + e.chainDmg, 0);
      if (chainTotal > 0) { const cnt = log.filter(e => e.chainDmg > 0).length; out += sec({ icon: 'images/icons/neon_disaster.webp', text: `災害連鎖の被害 — ${cnt}回` }, `<div class="go-stats-row"><span class="go-stats-row-name">二次災害（津波・土砂崩れ・延焼など）の追加被害</span><span class="go-hp-dead">−${chainTotal}</span></div><div class="go-terrain-note" style="margin-top:8px">連鎖には対応フェーズがないが、事前のシールドは有効。地形に合った備えが鍵</div>`); }

      const blocked = log.reduce((s, e) => s + e.blocked, 0);
      if (blocked > 0) out += sec({ icon: 'images/icons/neon_policy_shield.webp', text: '効いた備え' }, `<div class="go-stats-row"><span class="go-stats-row-name">シールド・対応・都市能力で軽減できた合計</span><span class="go-hp-alive">−${blocked}</span></div><div class="go-terrain-note" style="margin-top:8px">事前投資（耐震・堤防）と即時対応の合計効果。備えるほど生存ターンが伸びる</div>`);

      // 次はこう守ろう：最大被害の災害への対抗カード
      const worst = log.reduce((m, e) => e.damage > (m?.damage ?? 0) ? e : m, null);
      if (worst) {
        const counterIds = COUNTER_MAP[worst.cardId] || [];
        const cc = counterIds.length ? POLICY_CARDS.find(c => c.id === counterIds[0]) : null;
        if (cc) {
          const ctColor = cc.color === 'green' ? 'var(--green)' : 'var(--yellow)';
          out += `<div class="go-inview go-counter-wrap"><div class="go-mvp-label"><img src="images/icons/neon_policy_shield.webp" style="width:20px;height:20px;object-fit:contain"> 次はこのカードで備えよう</div><div class="go-counter-trigger"><span style="font-size:1.1rem">${worst.cardIcon}</span><span class="go-counter-arrow">→</span><span style="font-size:.82rem;color:var(--t1)">${worst.cardName} ${worst.damage}ダメージへの対策</span></div><div class="go-mvp-card-row" style="margin-top:10px"><img class="go-mvp-img" src="images/cards/${cc.id}.webp" alt="" onerror="this.style.display='none'"><div class="go-mvp-info"><div class="go-mvp-name" style="color:${ctColor}">${cc.icon} ${cc.name}</div><div class="go-mvp-type">${cc.desc}</div><div class="go-mvp-desc">${cc.realConcept}</div></div></div><button class="go-gallery-btn" onclick="coopGalleryFromOver('card','${cc.id}','${cc.name}','policy')">カード図鑑で詳しく見る</button></div>`;
        }
      }
      return out;
    }
    // 勝敗画面からカード図鑑へ（協力モードを抜けてロビーのギャラリーを開く）
    function coopGalleryFromOver(type, id, name, tab) {
      _coCancelTimer(); CO = null;
      G.screen = 'lobby'; lobbyState.mode = 'gallery'; lobbyState.galleryTab = tab; lobbyState.galleryZoom = { type, id, name }; lobbyState.fromResult = false;
      render();
    }
    function coopRenderOver() {
      const win = CO.result === 'win', d = CO.diff;
      const natureMode = CO.humanSide === 'nature';
      const alive = CO.cities.filter(cs => cs.hp > 0).length;
      const remHp = CO.cities.reduce((s, cs) => s + Math.max(0, cs.hp), 0);

      // 大タイトルとテーマ（対戦モードと統一：勝利=VICTORY/黄、敗北=GAME OVER/青）
      const themeCls = win ? 'go-victory' : 'go-defeat';
      const bigTitle = win ? 'VICTORY' : 'GAME OVER';
      const bgRepeat = `${bigTitle} `.repeat(6); const bgText = bgRepeat + bgRepeat;

      // サブタイトル・フレーバー（立場×勝敗で出し分け）

        if (win) { subtitle = '全都市を壊滅させた！'; flavor1 = `${CO.turn}ターンで街を呑み込んだ。`; flavor2 = '自然の猛威が勝った。'; }
        else { subtitle = '都市に守りきられた…'; flavor1 = `${d.maxTurns}ターン耐えられ、${alive}都市が生存。`; flavor2 = '備えを崩しきれなかった。'; }
      } else {
        if (win) {
          subtitle = '都市を守りきった！';
          if (remHp >= d.hp) { flavor1 = 'ほぼ無傷の防災都市。'; flavor2 = '完璧な備えだった。'; }
          else if (alive === CO.cities.length) { flavor1 = `${d.maxTurns}ターンを耐え抜いた。`; flavor2 = '確かな政策が街を守った。'; }
          else { flavor1 = 'ギリギリの生存。'; flavor2 = `${alive}都市が生き残った。`; }
        } else { subtitle = '都市壊滅…'; flavor1 = `${CO.turn}ターン目で全都市が陥落。`; flavor2 = '事前のシールドと対応を見直そう。'; }
      }
      const flavorText = `${flavor1}<br>${flavor2}`;

      // 都市の最終状況
      const cityRows = CO.cities.map(cs => {
        const hp = Math.max(0, cs.hp);
        return `<div class="go-stats-row"><span>${terrainImg(cs.city, 15)}</span><span class="go-stats-row-name">${cs.city.name}</span><span class="${hp > 0 ? 'go-hp-alive' : 'go-hp-dead'}">${hp > 0 ? 'HP ' + hp + '/' + cs.maxHp : '壊滅'}</span></div>`;
      }).join('');

      const _icoD16 = `<img src="images/icons/icon_disaster.webp" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;display:inline-block">`;
      const _icoC16 = `<img src="images/icons/icon_city.webp" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;display:inline-block">`;
      const roleLabel = natureMode ? `${_icoD16} 自然側` : `${_icoC16} 都市側`;
      const turnsLabel = win === !natureMode ? `耐え抜いたターン` : (natureMode && win ? '決着ターン' : '生存ターン');
      const statsHtml = coopRenderStats(natureMode);
      // 「逆の立場でも」誘導（coop_mode_summary §9：両方やりたくなる構造）
      const otherSide = natureMode ? 'city' : 'nature';
      const otherLabel = natureMode ? `${_icoC16} 今度は都市を守ってみる` : `${_icoD16} 今度は自然を操ってみる`;
      // オンラインはネット版リマッチ未対応のため、ソロ用の再戦・逆サイドは出さない
      const switchBtn = CO.online ? '' : `<button class="go-inview go-rematch-btn" onclick="coopPlayOtherSide('${otherSide}')" style="background:var(--bg2);color:#fff;border:1px solid var(--bg3)">${otherLabel}</button>`;
      const rematchBtn = CO.online ? '' : `<button class="go-inview go-rematch-btn" onclick="coopRestart()">🔁 もう一度（${d.label}）</button>`;

      // 戦略ティップ（都市側・リザルト画面専用。自分視点の勝敗で出し分け）
      const isCityDefeat = !natureMode && !win;
      const tipBtnLabel = isCityDefeat ? '次は勝つためのヒントを見る' : '今回の戦い方を振り返る';
      const tipBtnStyle = isCityDefeat ? 'font-weight:700' : '';
      const tipBtnHtml = `<button class="go-inview go-replay-btn" onclick="toggleCoopTip()" style="${tipBtnStyle}">${_coopTipOpen ? '▲ 閉じる' : `${_icoC16} ${tipBtnLabel}`}</button>`;
      const tipPanelHtml = _coopTipOpen ? `<div class="go-inview hint-box" style="margin-bottom:4px">
  <div class="hint-box-header"><span class="hint-title">都市を守る戦い方のヒント</span><button class="hint-close" onclick="toggleCoopTip()">✕</button></div>
  <hr class="hint-divider">
  <div class="coop-tip-row"><span class="coop-tip-num">1</span><span>シールドは1都市に集中させず、2都市へ分けて備えよう</span></div>
  <hr class="hint-divider">
  <div class="coop-tip-row"><span class="coop-tip-num">2</span><span>1都市を盾にして時間を稼ぐのも有効。全滅さえ防げば勝てる</span></div>
  <hr class="hint-divider">
  <div class="coop-tip-row"><span class="coop-tip-num">3</span><span>大ダメージは、出てから動くより事前にシールドで防ぐ</span></div>
  <hr class="hint-divider">
  <div class="coop-tip-row"><span class="coop-tip-num">4</span><span>HPは満タンにしなくていい。「全滅させない」配分を意識しよう</span></div>
</div>` : '';

      return `<div class="screen active go-screen ${themeCls}">

  <div class="go-hero">
    <div class="go-hero-bg" aria-hidden="true">
      <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-a">${bgText}</div></div>
      <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-b">${bgText}</div></div>
      <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-a">${bgText}</div></div>

    <div class="go-hero-content">
      <div class="go-big-title">${bigTitle}</div>

    }

    // ダブルタップズーム防止（iOS Safari は CSS touch-action を html/body で無視するため JS で対応）
    let _lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if (now - _lastTouchEnd <= 300) e.preventDefault();
      _lastTouchEnd = now;
    }, { passive: false });
  </script>
</body>
