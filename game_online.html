<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ready or Not</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg0: #0d1117;
      --bg1: #161b22;
      --bg2: #21262d;
      --bg3: #30363d;
      --t1: #e6edf3;
      --t2: #8b949e;
      --t3: #484f58;
      --blue: #388bfd;
      --red: #f85149;
      --green: #3fb950;
      --yellow: #d29922;
      --purple: #a371f7;
      --card-h: 140px;
      --card-w: 100px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: radial-gradient(ellipse at 30% 0%, #111827 0%, #0d1117 45%, #080d14 100%);
      color: var(--t1);
      min-height: 100vh;
      overflow-x: hidden
    }

    #app {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column
    }

    .screen {
      display: none;
      flex-direction: column;
      gap: 12px;
      flex: 1
    }

    .screen.active {
      display: flex
    }

    /* LOBBY */
    .lobby-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .lobby-bg-title {
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
      display: flex;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      overflow: hidden;
    }
    .lobby-bg-col {
      flex: 1;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }
    .lobby-bg-col-inner {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif;
      font-weight: 900;
      font-size: 13vh;
      color: #1c2438;
      letter-spacing: 0;
      white-space: nowrap;
      will-change: transform;
    }
    @keyframes lobby-scroll-up {
      from { transform: translateY(0) }
      to   { transform: translateY(-50%) }
    }
    @keyframes lobby-scroll-down {
      from { transform: translateY(-50%) }
      to   { transform: translateY(0) }
    }

    .lobby-box {
      background: var(--bg1);
      border: 1px solid var(--bg3);
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 440px;
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .5)
    }

    .lobby-hero {
      text-align: center
    }

    .lobby-title {
      font-size: 4rem;
      font-weight: 900;
      font-style: normal;
      font-family: 'Roboto Condensed', 'Arial Narrow', 'Hiragino Sans', sans-serif;
      color: #fa2a4e;
      margin: 0;
      letter-spacing: .15em;
      line-height: 1.1
    }
    .lobby-hero .ron-wrap {
      padding: 12px 0;
      margin-bottom: 4px;
    }

    .lobby-label {
      display: block;
      font-size: .8rem;
      color: var(--t2);
      margin-bottom: 5px;
      font-weight: 600;
      letter-spacing: .04em
    }

    .lobby-input {
      width: 100%;
      background: var(--bg2);
      border: 1.5px solid var(--bg3);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--t1);
      font-size: 1rem;
      outline: none;
      transition: .2s
    }

    .lobby-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(56, 139, 253, .2)
    }

    .lobby-input.code-input {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: .15em;
      text-align: center;
      text-transform: uppercase
    }

    .lobby-mode-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .lobby-btn {
      background: var(--bg2);
      border: 1.5px solid var(--bg3);
      border-radius: 12px;
      padding: 16px 12px;
      color: var(--t1);
      cursor: pointer;
      transition: .2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-size: .9rem
    }

    .lobby-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .4)
    }

    .lobby-btn.host {
      border-color: rgba(56, 139, 253, .5);
      background: rgba(56, 139, 253, .08)
    }

    .lobby-btn.host:hover {
      background: rgba(56, 139, 253, .18);
      border-color: var(--blue)
    }

    .lobby-btn.join {
      border-color: rgba(63, 185, 80, .5);
      background: rgba(63, 185, 80, .08)
    }

    .lobby-btn.join:hover {
      background: rgba(63, 185, 80, .18);
      border-color: var(--green)
    }

    .lobby-btn-single {
      width: 100%;
      background: linear-gradient(135deg, #1f6feb, #388bfd);
      border: none;
      border-radius: 12px;
      padding: 13px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: .2s
    }

    .lobby-btn-single:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(56, 139, 253, .4)
    }

    .lobby-btn-back {
      width: 100%;
      background: var(--bg3);
      border: none;
      border-radius: 10px;
      padding: 10px;
      color: var(--t2);
      font-size: .9rem;
      cursor: pointer;
      transition: .2s;
      margin-top: 4px
    }

    .lobby-btn-back:hover {
      background: var(--bg2);
      color: var(--t1)
    }

    .lobby-error {
      background: rgba(248, 81, 73, .1);
      border: 1px solid rgba(248, 81, 73, .4);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: .82rem;
      color: var(--red)
    }

    /* WAITING / CONNECTION */
    .wait-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 30px 20px
    }

    .wait-icon {
      font-size: 3.5rem
    }

    .wait-title {
      font-size: 1.3rem;
      font-weight: 700
    }

    .wait-sub {
      color: var(--t2);
      font-size: .88rem
    }

    .room-code-display {
      background: var(--bg2);
      border: 2px solid var(--yellow);
      border-radius: 14px;
      padding: 16px 24px;
      text-align: center
    }

    .room-code-label {
      font-size: .72rem;
      color: var(--t2);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 6px
    }

    .room-code-value {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: .25em;
      color: var(--yellow)
    }

    .pulse-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      animation: pulse-anim 1.2s ease-in-out infinite
    }

    .waiting-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 139, 253, .08);
      border: 1px solid rgba(56, 139, 253, .3);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: .83rem;
      color: var(--blue)
    }

    .waiting-banner.red {
      background: rgba(248, 81, 73, .08);
      border-color: rgba(248, 81, 73, .3);
      color: var(--red)
    }

    @keyframes pulse-anim {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      50% {
        opacity: .5;
        transform: scale(.85)
      }
    }

    /* SETUP REQUIRED */
    .setup-box {
      max-width: 520px;
      margin: auto;
      padding: 24px;
      background: var(--bg1);
      border-radius: 16px;
      border: 1px solid var(--bg3)
    }

    .setup-step {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 14px;
      font-size: .85rem;
      color: var(--t2);
      line-height: 1.6
    }

    .setup-num {
      min-width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--yellow);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
      font-weight: 700;
      flex-shrink: 0
    }

    .setup-box code {
      background: var(--bg3);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: .82rem;
      color: var(--t1)
    }

    /* TITLE / GACHA / DRAFT (from game.html) */
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--t2);
      padding: 4px 0
    }

    .gacha-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px 0
    }

    .gacha-mystery {
      background: var(--bg2);
      border: 3px dashed var(--bg3);
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      width: 240px;
      cursor: pointer;
      transition: .2s
    }

    .gacha-mystery:hover {
      border-color: var(--yellow);
      transform: scale(1.03)
    }

    .gacha-card-box {
      background: linear-gradient(145deg, #1a2540, #0d1a2d);
      border: 3px solid var(--yellow);
      border-radius: 20px;
      padding: 28px 32px;
      text-align: center;
      width: 260px;
      box-shadow: 0 0 32px rgba(210, 153, 34, .35)
    }

    .gacha-first-pick {
      background: var(--bg2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: .85rem;
      color: var(--t2);
      border-left: 3px solid var(--green)
    }

    @keyframes gacha-reveal {
      0% {
        transform: scale(0.2) rotateY(90deg);
        opacity: 0
      }

      55% {
        transform: scale(1.08) rotateY(-6deg);
        opacity: 1
      }

      100% {
        transform: scale(1) rotateY(0deg);
        opacity: 1
      }
    }

    .gacha-reveal {
      animation: gacha-reveal .5s cubic-bezier(.22, .68, 0, 1.2) forwards
    }

    .btn-gacha {
      padding: 16px 52px;
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, #b45309, #d29922);
      border: none;
      border-radius: 14px;
      color: #fff;
      cursor: pointer;
      transition: .2s;
      letter-spacing: .04em
    }

    .btn-gacha:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(210, 153, 34, .5)
    }

    .btn-accept {
      padding: 13px 44px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--bg2);
      border: 2px solid var(--green);
      border-radius: 10px;
      color: var(--green);
      cursor: pointer;
      transition: .2s
    }

    .btn-accept:hover {
      background: var(--green);
      color: #000
    }

    .draft-progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg2);
      border-radius: 8px;
      padding: 8px 12px;
      border: 1px solid var(--bg3)
    }

    .draft-pips {
      display: flex;
      gap: 5px
    }

    .draft-pip {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg3)
    }

    .draft-pip.done {
      background: var(--green)
    }

    .draft-pip.current {
      background: var(--yellow);
      box-shadow: 0 0 6px rgba(210, 153, 34, .6)
    }

    .draft-hand-preview {
      background: var(--bg1);
      border-radius: 8px;
      padding: 8px 12px;
      border: 1px solid var(--bg3)
    }

    .draft-hand-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg2);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: .75rem;
      border: 1px solid var(--bg3)
    }

    /* MAIN GAME */
    .battle-layout {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1
    }

    .opponent-zone,
    .player-zone {
      background: rgba(22, 27, 34, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 12px;
      padding: 12px
    }

    .opponent-zone {
      border: 1px solid rgba(139, 148, 158, 0.2)
    }

    .player-zone {
      border: 2px solid rgba(56, 139, 253, 0.5);
      box-shadow: 0 0 20px rgba(56, 139, 253, 0.08)
    }

    .zone-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap
    }

    .zone-label {
      font-size: .75rem;
      font-weight: 600;
      color: var(--t2);
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .city-name-display {
      font-size: 1rem;
      font-weight: 700
    }

    .city-icon-sm {
      font-size: 1.4rem
    }

    .hp-section {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px
    }

    .hp-bar-wrap {
      flex: 1;
      height: 14px;
      background: var(--bg3);
      border-radius: 7px;
      overflow: hidden;
      position: relative
    }

    .hp-bar-ghost {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      border-radius: 7px;
      background: rgba(210, 153, 34, 0.55);
      z-index: 1;
      transition: width 1.2s ease
    }

    .hp-bar-fill {
      position: relative;
      height: 100%;
      border-radius: 7px;
      transition: width .6s cubic-bezier(.25,.8,.25,1), background .6s ease;
      z-index: 2
    }

    .hp-text {
      font-size: .85rem;
      font-weight: 700;
      min-width: 56px;
      text-align: right
    }

    .backup-city-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      padding: 3px 0;
      border-top: 1px solid var(--bg3);
      opacity: .75
    }

    .backup-label {
      font-size: .7rem;
      color: var(--t2);
      white-space: nowrap
    }

    .hp-bar-mini {
      flex: 1;
      max-width: 80px;
      height: 6px;
      background: var(--bg3);
      border-radius: 3px;
      overflow: hidden
    }

    .hp-bar-mini-fill {
      height: 100%;
      border-radius: 3px
    }

    .backup-hp-text {
      font-size: .7rem;
      min-width: 36px;
      text-align: right
    }

    .effects-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 22px;
      margin-bottom: 4px
    }

    .eff-badge {
      font-size: .68rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600
    }

    .eff-blue {
      background: rgba(56, 139, 253, .2);
      color: var(--blue);
      border: 1px solid rgba(56, 139, 253, .3)
    }

    .eff-red {
      background: rgba(248, 81, 73, .2);
      color: var(--red);
      border: 1px solid rgba(248, 81, 73, .3)
    }

    .eff-yellow {
      background: rgba(210, 153, 34, .2);
      color: var(--yellow);
      border: 1px solid rgba(210, 153, 34, .3)
    }

    .eff-gray {
      background: rgba(139, 148, 158, .15);
      color: var(--t2);
      border: 1px solid var(--bg3)
    }

    .hand-cards-area {
      margin-top: 6px
    }

    .hand-back-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .card-back {
      width: var(--card-w);
      height: var(--card-h);
      background: repeating-linear-gradient(45deg, var(--bg2) 0, var(--bg2) 8px, var(--bg3) 8px, var(--bg3) 16px);
      border-radius: 8px;
      border: 1px solid var(--bg3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--t3)
    }

    .hand-count {
      font-size: .8rem;
      color: var(--t2);
      margin-top: 4px
    }

    .hand-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .hand-groups {
      display: flex;
      gap: 16px;
      flex-wrap: wrap
    }

    .hand-group {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .hand-group-label {
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase
    }

    .hand-group-label.policy-label {
      color: var(--blue)
    }

    .hand-group-label.disaster-label {
      color: var(--red)
    }

    .hand-group-cards {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    /* CARD */
    .card {
      width: var(--card-w);
      height: var(--card-h);
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: .2s;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative
    }

    .card {
      perspective: 600px
    }

    .card:hover:not(.card-disabled) {
      transform: translateY(-12px) rotateX(5deg) scale(1.04);
      box-shadow: 0 16px 32px rgba(0, 0, 0, .7)
    }

    .card.policy:hover:not(.card-disabled) {
      box-shadow: 0 12px 28px rgba(56, 139, 253, .45), 0 0 0 1px rgba(56, 139, 253, .4)
    }

    .card.disaster:hover:not(.card-disabled) {
      box-shadow: 0 12px 28px rgba(248, 81, 73, .45), 0 0 0 1px rgba(248, 81, 73, .4)
    }

    .card-disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .card.disaster {
      background: linear-gradient(160deg, #2d0d0d, #1a0a0a);
      border-color: #f85149
    }

    .card.policy {
      background: linear-gradient(160deg, #0d1a2d, #0a1020);
      border-color: #388bfd
    }

    .card-header {
      padding: 5px 6px;
      display: flex;
      align-items: center;
      gap: 4px
    }

    .card.disaster .card-header {
      background: rgba(248, 81, 73, .2)
    }

    .card.policy .card-header {
      background: rgba(56, 139, 253, .2)
    }

    .card-icon {
      font-size: 1rem
    }

    .card-cost {
      margin-left: auto;
      font-size: .75rem;
      font-weight: 700;
      background: var(--bg0);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .card.disaster .card-cost {
      color: var(--red)
    }

    .card.policy .card-cost {
      color: var(--blue)
    }

    .card-name {
      padding: 4px 6px;
      font-size: .75rem;
      font-weight: 700;
      line-height: 1.2
    }

    .card-desc {
      padding: 0 6px 6px;
      font-size: .62rem;
      color: var(--t2);
      line-height: 1.35;
      flex: 1
    }

    .card-type-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      font-size: .55rem;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 600
    }

    .card.disaster .card-type-badge {
      background: rgba(248, 81, 73, .2);
      color: var(--red)
    }

    .card.policy .card-type-badge {
      background: rgba(56, 139, 253, .2);
      color: var(--blue)
    }

    .card-disabled-reason {
      font-size: .65rem;
      color: var(--t3);
      text-align: center;
      margin-top: 4px
    }

    /* STATUS BAR */
    .status-bar {
      background: var(--bg2);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--bg3)
    }

    .turn-badge {
      font-size: .8rem;
      font-weight: 700;
      color: var(--t2)
    }

    .budget-display {
      display: flex;
      align-items: center;
      gap: 4px
    }

    .budget-label {
      font-size: .75rem;
      color: var(--t2)
    }

    .budget-pips {
      display: flex;
      gap: 3px
    }

    .pip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg3)
    }

    .pip.used {
      background: var(--bg0)
    }

    .pip.avail {
      background: var(--green)
    }

    .status-bar .spacer {
      flex: 1
    }

    .btn-end {
      padding: 7px 20px;
      font-size: .85rem;
      font-weight: 700;
      background: var(--bg3);
      border: none;
      border-radius: 8px;
      color: var(--t1);
      cursor: pointer;
      transition: .2s
    }

    .btn-end:hover {
      background: var(--blue);
      color: #fff
    }

    /* LOG - 折りたたみ式＋色分け強化 */
    .log-area {
      background: var(--bg1);
      border-radius: 10px;
      padding: 8px 10px;
      border: 1px solid var(--bg3);
    }

    .log-entry {
      font-size: .75rem;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 3px;
    }

    .log-entry.dmg {
      color: var(--red);
      background: rgba(248, 81, 73, .08);
    }

    .log-entry.heal {
      color: var(--green);
      background: rgba(63, 185, 80, .08);
    }

    .log-entry.policy {
      color: var(--blue);
      background: rgba(56, 139, 253, .08);
    }

    .log-entry.sys {
      color: var(--yellow);
      font-weight: 600;
      background: rgba(227, 179, 65, .06);
    }

    .log-entry:not(.dmg):not(.heal):not(.policy):not(.sys) {
      color: var(--t2);
    }

    .log-collapsed .log-entry:nth-child(n+3) {
      display: none;
    }

    .log-toggle {
      display: block;
      width: 100%;
      background: none;
      border: 1px dashed var(--bg3);
      border-radius: 6px;
      padding: 4px 0;
      color: var(--t3);
      font-size: .72rem;
      cursor: pointer;
      margin-top: 4px;
      text-align: center;
    }

    .log-toggle:hover {
      background: var(--bg2);
      color: var(--t2);
    }

    /* TERRAIN BADGE */
    .terrain-badge {
      font-size: 1rem;
      color: var(--t1);
      font-weight: 700;
      margin-left: 2px;
    }

    /* ACTION BAR (ターン終了ボタン) */
    .action-bar {
      display: flex;
      justify-content: center;
      padding: 6px 0;
    }

    .action-bar .btn-end {
      font-size: .85rem;
      padding: 8px 24px;
    }

    /* AUTO END BAR */
    .auto-end-bar {
      background: rgba(227, 179, 65, .12);
      border: 1px solid var(--yellow);
      border-radius: 10px;
      padding: 10px 14px;
      text-align: center;
      animation: pulse-glow 1.5s ease-in-out infinite;
    }

    .auto-end-text {
      font-size: .85rem;
      color: var(--yellow);
      font-weight: 600;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: .6; }
    }

    /* RESPONSE */
    .response-pending-bar {
      background: rgba(248, 81, 73, .1);
      border: 1px solid var(--red);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .rpb-icon {
      font-size: 1.4rem
    }

    .rpb-text {
      flex: 1;
      font-size: .85rem;
      color: var(--t1);
      line-height: 1.4;
      min-width: 160px
    }

    .btn-respond {
      padding: 6px 16px;
      background: var(--red);
      border: none;
      border-radius: 7px;
      color: #fff;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer
    }

    .btn-skip-resp {
      padding: 6px 16px;
      background: var(--bg3);
      border: none;
      border-radius: 7px;
      color: var(--t1);
      font-size: .82rem;
      cursor: pointer
    }

    /* CONFIRM MODAL */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999
    }

    .confirm-box {
      background: var(--bg2);
      border: 1px solid var(--bg3);
      border-radius: 14px;
      padding: 28px 32px;
      max-width: 320px;
      width: 90%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .6)
    }

    .confirm-box .confirm-card-preview {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700
    }

    .confirm-box .confirm-card-preview .ci {
      font-size: 2rem
    }

    .confirm-box p {
      color: var(--t2);
      font-size: .9rem;
      margin: 0
    }

    .confirm-btns {
      display: flex;
      gap: 12px;
      justify-content: center
    }

    .confirm-btns .btn-ok {
      flex: 1;
      padding: 10px;
      background: var(--blue);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: .15s
    }

    .confirm-btns .btn-ok:hover {
      background: #4da3ff
    }

    .confirm-btns .btn-ok.danger {
      background: var(--red)
    }

    .confirm-btns .btn-ok.danger:hover {
      background: #ff6b6b
    }

    .confirm-btns .btn-cancel {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--bg3);
      border-radius: 8px;
      color: var(--t2);
      font-size: .95rem;
      cursor: pointer;
      transition: .15s
    }

    .confirm-btns .btn-cancel:hover {
      background: var(--bg3)
    }

    /* PEEK */
    .peek-card-display {
      text-align: center;
      padding: 20px
    }

    .peek-card-big {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: var(--bg2);
      border: 2px solid var(--blue);
      border-radius: 12px;
      padding: 20px 28px
    }

    .peek-card-big .pk-icon {
      font-size: 2.4rem
    }

    .peek-card-big .pk-name {
      font-size: 1.1rem;
      font-weight: 700
    }

    .peek-card-big .pk-cost {
      font-size: .85rem;
      color: var(--blue)
    }

    .peek-card-big .pk-desc {
      font-size: .78rem;
      color: var(--t2);
      max-width: 180px;
      text-align: center;
      line-height: 1.4
    }

    /* DISCARD */
    .discard-info {
      background: rgba(248, 81, 73, .08);
      border: 1px solid rgba(248, 81, 73, .4);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .88rem
    }

    .discard-cards {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 8px 0
    }

    .discard-cards .card {
      width: 110px;
      height: 155px
    }

    .discard-cards .card:hover:not(.card-disabled) {
      border-color: var(--red) !important;
      box-shadow: 0 8px 20px rgba(248, 81, 73, .45);
      transform: translateY(-8px)
    }

    /* GAME OVER */
    .gameover-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      padding: 40px
    }

    .gameover-box .go-icon {
      font-size: 5rem
    }

    .gameover-box h2 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--yellow)
    }

    .gameover-box p {
      color: var(--t2);
      font-size: 1rem
    }

    .btn-replay {
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--bg2);
      border: 2px solid var(--blue);
      border-radius: 10px;
      color: var(--blue);
      cursor: pointer;
      transition: .2s
    }

    .btn-replay:hover {
      background: var(--blue);
      color: #fff
    }

    .btn-ho {
      padding: 14px 40px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--bg2);
      border: 2px solid var(--green);
      border-radius: 10px;
      color: var(--green);
      cursor: pointer;
      transition: .2s
    }

    .btn-ho:hover {
      background: var(--green);
      color: #000
    }

    /* TURN SUMMARY */
    .turn-summary-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px
    }

    .ts-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--t1);
      padding: 4px 0
    }

    .ts-events {
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .ts-ev {
      background: var(--bg2);
      border-radius: 8px;
      padding: 9px 13px;
      font-size: .83rem;
      border-left: 3px solid var(--bg3)
    }

    .ts-ev.damage {
      border-color: var(--red)
    }

    .ts-ev.heal {
      border-color: var(--green)
    }

    .ts-ev.budget {
      border-color: var(--blue)
    }

    .ts-ev.typhoon {
      border-color: var(--yellow)
    }

    .ts-ev.warn {
      border-color: var(--yellow)
    }

    .ts-ev-title {
      font-weight: 700;
      margin-bottom: 2px
    }

    .ts-ev-detail {
      color: var(--t2);
      font-size: .77rem
    }

    .ts-ev-subline {
      color: var(--t2);
      font-size: .77rem;
      padding-left: 8px;
      border-left: 2px solid var(--bg3);
      margin: 2px 0
    }

    /* DAMAGE BREAKDOWN */
    .ts-ev-breakdown { display: flex; align-items: center; gap: 5px; padding: 3px 4px; font-size: .76rem; border-radius: 4px; margin: 2px 0 }
    .ts-cat { font-size: .64rem; font-weight: 700; padding: 1px 6px; border-radius: 10px; white-space: nowrap; min-width: 56px; text-align: center }
    .ts-cat-exposure { background: rgba(248,81,73,.18); color: var(--red) }
    .ts-cat-policy { background: rgba(63,185,80,.18); color: var(--green) }
    .ts-cat-shield { background: rgba(56,139,253,.18); color: var(--blue) }
    .ts-cat-agency { background: rgba(210,153,34,.18); color: var(--yellow) }
    .ts-cat-vuln { background: rgba(248,81,73,.18); color: var(--red) }
    .ts-cat-negate { background: rgba(163,113,247,.18); color: var(--purple) }
    .ts-bd-text { flex: 1; color: var(--t2) }
    .ts-bd-delta { font-weight: 700; min-width: 28px; text-align: right }
    .ts-bd-delta.pos { color: var(--red) }
    .ts-bd-delta.neg { color: var(--green) }
    .ts-bd-run { color: var(--t3); font-size: .7rem; min-width: 26px }

    /* BUDGET TOAST */
    @keyframes toast-in-out {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(20px) scale(.9)
      }

      15% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1)
      }

      75% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1)
      }

      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-10px) scale(.95)
      }
    }

    .budget-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg2);
      border: 1px solid var(--bg3);
      border-radius: 10px;
      padding: 8px 20px;
      font-size: .9rem;
      font-weight: 600;
      white-space: nowrap;
      animation: toast-in-out 1.8s ease forwards;
      z-index: 1000;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .5)
    }

    /* MOBILE */
    @media(max-width:600px) {
      #app {
        padding: 8px
      }

      :root {
        --card-h: 120px;
        --card-w: 86px
      }

      .card-name {
        font-size: .68rem
      }

      .card-desc {
        font-size: .58rem
      }

      .lobby-box {
        padding: 20px 16px
      }

      .lobby-title {
        font-size: 2.1rem
      }

      .room-code-value {
        font-size: 1.6rem;
        letter-spacing: .18em
      }

      .hand-groups {
        gap: 10px
      }
    }

    /* ── カードギャラリー ── */
    .lobby-btn-gallery { width:100%; background:var(--bg2); border:1.5px solid var(--bg3); border-radius:10px; padding:11px; color:var(--t2); font-size:.88rem; cursor:pointer; transition:.2s; margin-top:2px; display:flex; align-items:center; justify-content:center; gap:6px }
    .lobby-btn-gallery:hover { background:var(--bg3); color:var(--t1) }
    .gallery-wrap { flex:1; display:flex; align-items:flex-start; justify-content:center; padding:16px }
    .gallery-box { background:var(--bg1); border:1px solid var(--bg3); border-radius:20px; padding:22px 20px; max-width:640px; width:100%; display:flex; flex-direction:column; gap:14px; box-shadow:0 12px 40px rgba(0,0,0,.5) }
    .gallery-header { display:flex; align-items:center; justify-content:space-between }
    .gallery-title { font-size:1.3rem; font-weight:700; text-align:center; flex:1 }
    .gallery-btn-back { width:40px; height:40px; background:transparent; border:2px solid #fff; border-radius:6px; color:#fff; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0 }
    .gallery-tabs { display:flex; flex-direction:column; gap:8px }
    .gallery-tab-btn { padding:12px 16px; background:var(--bg2); border:1.5px solid var(--bg3); border-radius:10px; color:var(--t1); cursor:pointer; font-size:.85rem; font-weight:600; transition:.2s; text-align:left; display:flex; align-items:center; gap:10px }
    .gallery-tab-btn:hover { border-color:#fa2a4e; background:rgba(250,42,78,.1); color:#fa2a4e }
    .gallery-tab-btn.active { border-color:#fa2a4e; background:rgba(250,42,78,.15); color:#fa2a4e }
    .tab-icon { width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0 }
    .gallery-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px }
    .gallery-card { border-radius:8px; overflow:hidden; cursor:pointer; border:2px solid var(--bg3); transition:.15s; aspect-ratio:288/450 }
    .gallery-card img { width:100%; height:100%; object-fit:cover; display:block }
    .gallery-card:hover { transform:translateY(-3px); border-color:var(--yellow); box-shadow:0 6px 16px rgba(0,0,0,.5) }
    .city-tap-btn { background:rgba(56,139,253,.13); border:1px solid rgba(56,139,253,.4); border-radius:14px; padding:3px 10px; color:var(--blue); cursor:pointer; font-size:.82rem; font-weight:600; white-space:nowrap; transition:.15s }
    .city-tap-btn:hover,.city-tap-btn:active { background:rgba(56,139,253,.25) }

    /* ── カード画像モード ── */
    .card .card-header { display:none }
    .hand-group-label { display:none }
    .card-img-wrap { flex:1; position:relative; overflow:hidden; min-height:0 }
    .card-img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block }
    .card-name-bar { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,.88) 55%); padding:20px 4px 3px; font-size:.6rem; font-weight:700; color:#fff; text-align:center; line-height:1.15; pointer-events:none }
    .card-text-fallback { display:none }
    .card.img-fail .card-text-fallback { display:block }
    .card.img-fail .card-img-wrap { display:none }
    .card-disabled-reason { position:absolute; left:0; right:0; bottom:4px; font-size:.6rem; color:#fff; background:rgba(0,0,0,.72); text-align:center; padding:2px 4px; z-index:4 }
    .card-back img { width:100%; height:100%; object-fit:cover; border-radius:6px; display:block }
    .confirm-card-img { width:108px; border-radius:8px; display:block; margin:0 auto }
    /* ガチャ・ドロー画面のカード型エリア */
    .gacha-card-reveal-area { width:200px; aspect-ratio:288/450; border-radius:14px; overflow:hidden; cursor:pointer; border:3px solid var(--bg3); transition:transform .2s, border-color .2s }
    .gacha-card-reveal-area img { width:100%; height:100%; object-fit:cover; display:block }
    .gacha-card-reveal-area:hover:not(.revealed) { transform:scale(1.03); border-color:var(--yellow) }
    .gacha-card-reveal-area.revealed { border-color:var(--yellow); box-shadow:0 0 32px rgba(210,153,34,.35); cursor:default }
    .cityorder-city-img { width:120px; border-radius:8px; display:block; margin:0 auto 8px }

    /* ── 1. Usable card glow ── */
    .card.card-usable.policy { box-shadow: 0 0 10px rgba(56,139,253,.32), 0 0 0 1px rgba(56,139,253,.2) }
    .card.card-usable.disaster { box-shadow: 0 0 10px rgba(248,81,73,.32), 0 0 0 1px rgba(248,81,73,.2) }

    /* ── 3. HP danger zone ── */
    @keyframes hp-danger-pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
    @keyframes hp-critical-blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .hp-bar-fill.hp-warn { animation: hp-danger-pulse 1.3s ease-in-out infinite }
    .hp-danger-badge { font-size:.65rem; color:var(--yellow); font-weight:700; padding:1px 6px; border-radius:4px; background:rgba(210,153,34,.18); animation:hp-danger-pulse 1.3s ease-in-out infinite; white-space:nowrap }
    .hp-critical-badge { font-size:.65rem; color:var(--red); font-weight:700; padding:1px 6px; border-radius:4px; background:rgba(248,81,73,.22); border:1px solid rgba(248,81,73,.5); animation:hp-critical-blink .8s ease-in-out infinite; white-space:nowrap }

    /* ── 4. State banner ── */
    .state-banner { text-align:center; padding:8px 14px; border-radius:10px; font-size:.88rem; font-weight:700 }
    .state-banner-waiting { background:rgba(56,139,253,.1); border:1px solid rgba(56,139,253,.25); color:var(--blue) }
    .state-banner-response { background:rgba(248,81,73,.1); border:1px solid rgba(248,81,73,.25); color:var(--red) }

    /* ── 5. City info modal ── */
    .city-info-overlay { position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; justify-content:center; z-index:1001; padding:20px; cursor:pointer }
    .city-info-box { background:var(--bg2); border:1.5px solid var(--bg3); border-radius:16px; padding:20px 18px; max-width:300px; width:100%; cursor:default; display:flex; flex-direction:column; gap:8px; box-shadow:0 12px 40px rgba(0,0,0,.6) }

    /* ── 6. Response damage preview ── */
    .response-dmg-preview { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px }
    .rdp-item { font-size:.76rem; padding:3px 8px; border-radius:5px; font-weight:600 }
    .rdp-skip { background:rgba(248,81,73,.15); color:var(--red) }

    /* ── 8. Log critical/divider ── */
    .log-entry.critical { background:rgba(248,81,73,.18) !important; border-left:3px solid var(--red); color:var(--red) !important; font-weight:700; padding-left:8px }
    .log-entry.divider { text-align:center; color:var(--t3); font-size:.6rem; padding:2px 0; background:none !important; letter-spacing:.06em; opacity:.7 }

    /* ── 9. Mobile hand horizontal scroll ── */
    @media (max-width:600px) {
      .hand-groups { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; gap:12px; scroll-snap-type:x mandatory }
      .hand-group-cards { flex-wrap:nowrap }
      .hand-group { scroll-snap-align:start }
    }

    /* ── 10. Hint overlay ── */
    .hint-btn { position:fixed; bottom:16px; right:16px; width:40px; height:40px; border-radius:50%; background:var(--bg2); border:1.5px solid var(--bg3); color:var(--t2); font-size:1rem; font-weight:700; cursor:pointer; z-index:900; transition:.2s; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.4) }
    .hint-btn:hover { border-color:var(--blue); color:var(--blue); background:rgba(56,139,253,.1) }
    .hint-overlay { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:1000; display:flex; align-items:flex-end; justify-content:center; padding:12px }
    .hint-box { background:var(--bg1); border:1px solid var(--bg3); border-radius:20px; padding:20px 18px; max-width:520px; width:100%; max-height:72vh; overflow-y:auto; display:flex; flex-direction:column; gap:10px }
    .hint-box-header { display:flex; align-items:center; justify-content:space-between }
    .hint-title { font-size:.95rem; font-weight:700; color:var(--blue) }
    .hint-close { background:none; border:none; color:var(--t3); font-size:1.2rem; cursor:pointer; padding:0 4px; line-height:1 }
    .hint-section { font-size:.83rem; color:var(--t2); line-height:1.8 }
    .hint-section strong { color:var(--t1) }
    .hint-divider { border:none; border-top:1px solid var(--bg3); margin:2px 0 }
    .hint-tag { display:inline-block; padding:1px 7px; border-radius:5px; font-size:.72rem; font-weight:700; margin-right:3px }
    .hint-tag.green { background:rgba(63,185,80,.18); color:var(--green); border:1px solid rgba(63,185,80,.25) }
    .hint-tag.yellow { background:rgba(210,153,34,.18); color:var(--yellow); border:1px solid rgba(210,153,34,.25) }
    .hint-tag.red { background:rgba(248,81,73,.18); color:var(--red); border:1px solid rgba(248,81,73,.25) }
    .hint-tag.blue { background:rgba(56,139,253,.18); color:var(--blue); border:1px solid rgba(56,139,253,.25) }

    /* ── 11. Tutorial ── */
    .city-tap-btn.tut-pulse { animation:tutCityPulse 1.2s ease-in-out infinite; border-color:var(--blue) !important; color:var(--blue) !important }
    @keyframes tutCityPulse { 0%,100% { background:rgba(56,139,253,.15); box-shadow:0 0 0 2px var(--blue) } 50% { background:rgba(56,139,253,.3); box-shadow:0 0 0 3px var(--blue),0 0 12px rgba(56,139,253,.5) } }
    .terrain-badge.tut-flash { animation:tutTerrainFlash 1.4s ease-in-out infinite; border-radius:6px }
    @keyframes tutTerrainFlash { 0%,100% { color:#ffffff } 50% { color:#000000 } }
    .card.tut-glow { animation:tutGlow 1.1s ease-in-out infinite alternate; cursor:pointer !important; opacity:1 !important }
    @keyframes tutGlow { from { box-shadow:0 0 0 2px var(--blue),0 0 10px rgba(56,139,253,.4); transform:translateY(-2px) } to { box-shadow:0 0 0 3px var(--blue),0 0 22px rgba(56,139,253,.7); transform:translateY(-7px) } }

      { title: '🏙️ ゲーム開始：都市カードを選ぼう', body: `<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:10px"><div style="background:var(--bg3);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px"><div style="font-size:1.1rem;font-weight:700;color:#fff;flex-shrink:0;min-width:2.6rem;text-align:center;letter-spacing:.02em">01.</div><div><div style="font-weight:700;color:var(--blue);font-size:1.05rem">都市ガチャ</div><div style="font-size:.78rem;color:var(--t1);margin-top:2px">引いた2枚の都市で戦うことになります</div></div></div><div style="text-align:center;font-size:.9rem;color:var(--t3);line-height:1.2">↓</div><div style="background:var(--bg3);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px"><div style="font-size:1.1rem;font-weight:700;color:#fff;flex-shrink:0;min-width:2.6rem;text-align:center;letter-spacing:.02em">02.</div><div><div style="font-weight:700;color:var(--yellow);font-size:1.05rem">初期手札のドロー</div><div style="font-size:.78rem;color:var(--t1);margin-top:2px">政策2枚＋災害2枚を引く</div></div></div><div style="text-align:center;font-size:.9rem;color:var(--t3);line-height:1.2">↓</div><div style="background:var(--bg3);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px"><div style="font-size:1.1rem;font-weight:700;color:#fff;flex-shrink:0;min-width:2.6rem;text-align:center;letter-spacing:.02em">03.</div><div><div style="font-weight:700;color:var(--green);font-size:1.05rem">バトル開始！</div><div style="font-size:.78rem;color:var(--t1);margin-top:2px">相手の都市HPを0にしたら勝利</div></div></div></div><div style="font-size:.88rem;color:var(--t1);line-height:1.8">都市ごとに<strong>地形</strong>と<strong>固有能力</strong>が異なります。<br>🌊 <strong style="color:var(--blue)">海岸</strong> — 洪水・津波 +10追加ダメージ<br>🏔️ <strong>山間部</strong> — 土砂崩れ +10追加ダメージ<br>🏙️ <strong style="color:var(--yellow)">内陸</strong> — 地震 +10追加ダメージ</div><div style="font-size:.82rem;color:var(--t3);margin-top:6px">このチュートリアルは <strong>仙台（海岸）</strong> vs <strong>東京（内陸）</strong> で進みます。</div>`, highlight: null, btnLabel: '次へ →', action: 'next' },
      { title: '🃏 初期手札のドロー', body: `都市選択後、山札から<strong>4枚の手札</strong>を引きます（政策2枚＋災害2枚）。<br><br><div style="display:flex;flex-direction:column;gap:10px"><div style="background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.28);border-radius:10px;padding:12px;display:flex;align-items:flex-start;gap:12px"><img src="images/icons/icon_policy_green.webp" style="width:40px;height:40px;border-radius:50%;flex-shrink:0;object-fit:cover"><div><div style="color:var(--green);font-weight:700;font-size:.88rem;margin-bottom:4px">政策カード（緑）</div><div style="font-size:.78rem;color:var(--t1);line-height:1.6">事前に<strong>設置</strong>するシールド型の守備カード。相手の特定攻撃を受けたとき自動で軽減・防御する。</div></div></div><div style="background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.28);border-radius:10px;padding:12px;display:flex;align-items:flex-start;gap:12px"><img src="images/icons/icon_policy_yellow.webp" style="width:40px;height:40px;border-radius:50%;flex-shrink:0;object-fit:cover"><div><div style="color:var(--yellow);font-weight:700;font-size:.88rem;margin-bottom:4px">政策カード（黄）</div><div style="font-size:.78rem;color:var(--t1);line-height:1.6">タップした瞬間に<strong>即発動</strong>する守備・回復カード。HP回復・ドロー・特殊効果を即時適用する。</div></div></div><div style="background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.28);border-radius:10px;padding:12px;display:flex;align-items:flex-start;gap:12px"><img src="images/icons/icon_disaster.webp" style="width:40px;height:40px;border-radius:50%;flex-shrink:0;object-fit:cover"><div><div style="color:var(--red);font-weight:700;font-size:.88rem;margin-bottom:4px">災害カード（赤）</div><div style="font-size:.78rem;color:var(--t1);line-height:1.6">相手の都市にダメージを与える攻撃カード。地形が一致すると<strong>+10追加ダメージ</strong>！</div></div></div></div><div style="font-size:.72rem;color:var(--t3);margin-top:8px">毎ターン最大2枚ドロー。手札上限5枚。</div>`, highlight: null, btnLabel: 'バトルへ →', action: 'next' },
      { title: '⚔️ バトル開始！', body: '<strong>上が相手ゾーン、下があなたのゾーン</strong>です。HPバーで残り体力が分かります。<br>・<strong>都市名（ⓘ）</strong>をタップ → 地形・都市能力を確認できます<br>・地形（海岸 / 内陸 / 山間部）によって特定の災害で追加ダメージを受けます<br>・下の手札の<strong>カードをタップ</strong>すると効果の詳細を確認できます<br>予算 <strong>3pt</strong> でカードを使えます。', highlight: null, btnLabel: '次へ →', action: 'next' },
      { title: '🛡️ 緑カードを設置しよう', body: '<strong>堤防建設（コスト2）</strong> をタップして設置。相手が洪水・津波を使ったとき、自動で <strong>-25軽減</strong> します。', highlight: 'dam', btnLabel: null, action: 'play_dam' },
      { title: '💛 黄カードで即時回復', body: '<strong>避難訓練（コスト1）</strong> をタップ。タップした瞬間に <strong>HP +20</strong> 回復します。', highlight: 'drill', btnLabel: null, action: 'play_drill' },
      { title: '✅ ターン終了', body: '予算を使い切りました。光っている「<strong>ターン終了</strong>」を押して相手にターンを渡しましょう。', highlight: 'end_turn', btnLabel: null, action: 'end_turn' },
      { title: '⚡ 相手のターン：洪水攻撃！', body: '東京が <strong>洪水（コスト2）</strong> を使用！<br>仙台は海岸都市なので 基礎30 + 海岸+10 = <strong>40ダメージ</strong>。<br>でも 堤防建設 が <strong>-25軽減</strong> → 実際のダメージは <strong>15</strong>。', highlight: null, btnLabel: '対応フェーズへ →', action: 'next' },
      { title: '🔄 メインフェーズ → 対応フェーズ', body: `相手がカードを使い終えると<strong>対応フェーズ</strong>が始まります。<br><br><div style="display:flex;flex-direction:column;gap:5px;font-size:.78rem"><div style="background:rgba(63,185,80,.1);border-radius:6px;padding:5px 8px">✅ <strong>政策カードで対応</strong>：コスト<strong>無料</strong>。ただし回復効果は<strong>半減</strong>になる</div><div style="background:rgba(139,148,158,.1);border-radius:6px;padding:5px 8px">⏩ <strong>対応しない</strong>：そのままダメージを受ける</div></div><br>次のステップで <strong>相互支援協定</strong> を使って洪水15ダメージを相殺してみましょう！`, highlight: null, btnLabel: '対応してみよう →', action: 'next' },
      { title: '🛡️ 対応フェーズ', body: '<strong>相互支援協定（黄）</strong> で対応できます。対応時はHP回復が <strong>半減（+15）</strong> になりますが、15ダメージをちょうど相殺！タップして対応しましょう。', highlight: 'agreement', btnLabel: null, action: 'respond' },
      { title: '🎉 チュートリアル完了！', body: '1ターンで体験したこと：<br>・<strong>緑カード</strong>（シールド型）は事前設置で次の攻撃を自動軽減<br>・<strong>黄カード</strong>（即時型）はタップで即発動、対応時は半減<br>・<strong>対応フェーズ</strong>で政策カードを使って被害を減らせる<br><br><strong>自分の都市を守りつつ、相手の都市のHPを0にしよう！</strong><br>実際に対戦してみましょう！', highlight: null, btnLabel: '対戦ロビーへ →', action: 'finish' },
    ];

    function startTutorial() {
      const dam       = { ...POLICY_CARDS.find(c => c.id === 'dam'),       uid: 'tu_dam' };
      const drill     = { ...POLICY_CARDS.find(c => c.id === 'drill'),     uid: 'tu_drill' };
      const agreement = { ...POLICY_CARDS.find(c => c.id === 'agreement'), uid: 'tu_agr' };
      tutorialState = { step: 0, playerHp: 45, opponentHp: 60, budgetUsed: 0, shieldActive: false, hand: [dam, drill, agreement], usedUids: [], feedback: null, skipWarning: false, cityPopup: null, confirmCard: null };
      _mainTutorialShown = false;
      _tutStepSpotlights = new Set();
      _hintOpen = false;
      G.screen = 'tutorial';
      render();
    }

    function tutorialAction(action) {
      const ts = tutorialState; if (!ts) return;
      ts.skipWarning = false; ts.confirmCard = null;
      if (action === 'next')          { ts.feedback = null; ts.step++; }
      else if (action === 'play_dam')  { ts.usedUids.push('tu_dam'); ts.budgetUsed += 2; ts.shieldActive = true; ts.feedback = '✅ 堤防建設を設置！シールドバッジが表示されています。'; ts.step++; }
      else if (action === 'play_drill'){ ts.usedUids.push('tu_drill'); ts.budgetUsed += 1; const prev = ts.playerHp; ts.playerHp = Math.min(60, prev + 20); ts.feedback = `✅ HP +20 回復！（${prev} → ${ts.playerHp}）`; ts.step++; }
      else if (action === 'end_turn')  { ts.feedback = null; ts.step++; }
      else if (action === 'skip_attempt') { ts.skipWarning = true; }
      else if (action === 'respond')   { ts.usedUids.push('tu_agr'); ts.feedback = '✅ 洪水ダメージ 15 − 相互支援協定 +15 = 実ダメージ 0！'; ts.step++; }
      else if (action === 'finish')    { _lobbyEnter = true; tutorialState = null; G.screen = 'lobby'; }
      else if (action === 'back') {
        const prev = ts.step - 1;
        if (prev >= 0 && TUT_STEP_STATES[prev]) {
          const s = TUT_STEP_STATES[prev];
          ts.step = prev; ts.playerHp = s.playerHp; ts.budgetUsed = s.budgetUsed;
          ts.shieldActive = s.shieldActive; ts.usedUids = [...s.usedUids];
          ts.feedback = null; ts.skipWarning = false; ts.cityPopup = null; ts.confirmCard = null;
        }
      }
      render();
    }

    function tutorialShowCity(id) { if (tutorialState) { tutorialState.cityPopup = CITIES.find(c => c.id === id) || null; render(); } }
    function tutorialCloseCityPopup() { if (tutorialState) { tutorialState.cityPopup = null; render(); } }
    function tutorialShowConfirm(uid) { if (!tutorialState) return; const card = tutorialState.hand.find(c => c.uid === uid); if (card) { tutorialState.confirmCard = card; render(); } }
    function tutorialCancelConfirm() { if (tutorialState) { tutorialState.confirmCard = null; render(); } }
    function exitTutorial() { _lobbyEnter = true; tutorialState = null; G.screen = 'lobby'; render(); }

    function renderTutorial() {
      const ts = tutorialState; const step = TUT_STEPS[ts.step];
      const isPreBattle = ts.step <= 1;
      const isResp = (ts.step === 8); const isFinish = (ts.step === 9);
      const budgetLeft = 3 - ts.budgetUsed;

      // ── 共通：進捗ドット・戻るボタン ──
      const dots = TUT_STEPS.map((_, i) => `<div class="tut-dot" style="background:${i === ts.step ? 'var(--blue)' : i < ts.step ? 'var(--green)' : 'var(--bg3)'}"></div>`).join('');
      const stepCounter = `<span style="font-size:.72rem;color:var(--t1);font-weight:600">${ts.step + 1} / ${TUT_STEPS.length}</span>`;
      const backBtn = ts.step > 0 ? `<button style="padding:3px 8px;font-size:.7rem;background:var(--bg3);border:none;border-radius:6px;color:var(--t2);cursor:pointer" onclick="tutorialAction('back')">← 戻る</button>` : '';
      const progressRow = `<div style="display:flex;align-items:center;gap:6px">${backBtn}<div class="tut-progress">${dots}</div>${stepCounter}</div>`;
      const lobbyBackBtn = `<button class="lobby-btn-back" style="width:auto;padding:8px 16px;margin-top:4px;align-self:flex-start" onclick="exitTutorial()">← ロビーに戻る</button>`;

      // ── 前半：説明カード（ステップ 0-1）──
      if (isPreBattle) {
        return `<div class="screen active"><div style="display:flex;flex-direction:column;flex:1;padding:10px;overflow-y:auto;gap:10px">
          <div class="tut-guide" style="width:100%;gap:14px">
            <div class="tut-guide-title" style="font-size:1rem">${step.title}</div>
            <div class="tut-guide-body">${step.body}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
              ${progressRow}
              <button class="btn-respond" onclick="tutorialAction('${step.action}')">${step.btnLabel}</button>
            </div>
          </div>
          ${lobbyBackBtn}
        </div></div>`;
      }

      // ── 完了画面（ステップ 9）──
      if (isFinish) {
        const feedbackHtml = ts.feedback ? `<div style="background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.28);border-radius:8px;padding:10px 12px;font-size:.82rem;color:var(--green)">${ts.feedback}</div>` : '';
        return `<div class="screen active"><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:20px">
          <div class="tut-guide" style="max-width:480px;width:100%;gap:14px">
            <div style="font-size:2.2rem;text-align:center">🎉</div>
            <div class="tut-guide-title" style="font-size:1rem;text-align:center">${step.title}</div>
            ${feedbackHtml}
            <div class="tut-guide-body">${step.body}</div>
            <button class="btn-respond" style="width:100%;padding:12px;font-size:.9rem" onclick="tutorialAction('finish')">${step.btnLabel}</button>
          </div>
        </div></div>`;
      }

      // ── ガイドボックス（バトル用）──
      const guideBtn = step.btnLabel ? `<button class="btn-respond" onclick="tutorialAction('${step.action}')">${step.btnLabel}</button>` : `<span style="font-size:.72rem;color:var(--t3)">↓ 光っているものをタップ</span>`;
      const feedbackLine = ts.feedback ? `<div style="background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.28);border-radius:8px;padding:8px 10px;font-size:.8rem;color:var(--green)">${ts.feedback}</div>` : '';
      const guideBox = `<div class="tut-guide">
        <div class="tut-guide-title">${step.title}</div>
        ${feedbackLine}
        <div class="tut-guide-body">${step.body}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          ${progressRow}
          ${guideBtn}
        </div>
      </div>`;

      // ── 相手ゾーン ──
      const isAttackActive = ts.step >= 6;
      const oppZone = `<div class="opponent-zone" style="border-left:3px solid var(--red)">
        <div class="zone-header"><span class="zone-label">相手</span><span class="city-icon-sm">🗼</span><button class="city-tap-btn${ts.step === 2 ? ' tut-pulse' : ''}" onclick="tutorialShowCity('tokyo')">東京 ⓘ</button><span class="terrain-badge">(内陸)</span></div>
        <div class="hp-section"><div class="hp-bar-wrap"><div class="hp-bar-fill" style="width:100%;background:var(--green)"></div></div><div class="hp-text" style="color:var(--green)">60/60</div></div>
        <div style="margin-top:4px">${isAttackActive ? `<div style="background:rgba(248,81,73,.15);border:1px solid rgba(248,81,73,.3);border-radius:6px;padding:4px 10px;font-size:.75rem;color:var(--red);display:inline-block">🌧️ 洪水 発動中</div>` : `<div class="hand-back-row">${Array(3).fill('<div class="card-back"><img src="images/cards/back.webp" alt=""></div>').join('')}</div>`}</div>
      </div>`;

      // ── 手札カード ──
      function mkTutCard(card) {
        const used = ts.usedUids.includes(card.uid); if (used) return '';
        const isGlow = step.highlight === card.id;
        const isDim = step.highlight !== null && !isGlow;
        const isDimSoft = ts.step === 2;
        const oc = `onclick="tutorialShowConfirm('${card.uid}')"`;
        return `<div class="card policy${isGlow ? ' tut-glow' : ''}${isDim ? ' tut-dim' : isDimSoft ? ' tut-dim-soft' : ''}" style="cursor:pointer" ${oc}>
          <div class="card-header"><span class="card-icon">${card.icon}</span><span class="card-cost">${isResp ? '無料' : card.cost}</span></div>
          <div class="card-img-wrap"><img class="card-img" src="images/cards/${card.id}.webp" alt="" onerror="this.closest('.card').classList.add('img-fail')"><div class="card-name-bar">${card.name}</div></div>
          <div class="card-name card-text-fallback">${card.name}</div><div class="card-desc card-text-fallback">${card.desc}</div>
          <span class="card-type-badge">${isResp ? '対応可' : card.color === 'green' ? 'シールド' : '即時'}</span>
        </div>`;
      }
      const visibleHand = ts.hand.filter(c => !ts.usedUids.includes(c.uid));
      const handHtml = visibleHand.length > 0
        ? `<div class="hand-groups"><div class="hand-group"><div class="hand-group-label policy-label">${isResp ? '政策（対応可）' : '政策'}</div><div class="hand-group-cards">${visibleHand.map(mkTutCard).join('')}</div></div></div>`
        : `<div style="color:var(--t3);font-size:.82rem;padding:8px">手札なし</div>`;

      // ── ステータスバー・バッジ・アクションバー ──
      const statusBar = (ts.step >= 2 && ts.step <= 5) ? `<div class="status-bar"><span class="turn-badge" style="color:#e6edf3">チュートリアル | あなたのターン</span><div class="budget-display"><span class="budget-label" style="color:#e6edf3">予算</span><div class="budget-pips">${Array(3).fill(0).map((_,i)=>`<div class="pip ${i<ts.budgetUsed?'used':'avail'}"></div>`).join('')}</div><span style="font-size:.8rem;font-weight:700;color:var(--green)">${budgetLeft}<span style="color:var(--t3);font-weight:400">/3</span></span></div></div>` : '';
      const shieldBadge = ts.shieldActive ? `<div style="background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.25);border-radius:6px;padding:3px 8px;font-size:.72rem;color:var(--green);display:inline-block">🌊 堤防設置中 -25</div>` : '';
      const skipWarn = ts.skipWarning ? `<div style="background:rgba(210,153,34,.15);border:1px solid rgba(210,153,34,.3);border-radius:6px;padding:5px 10px;font-size:.75rem;color:var(--yellow);margin-top:6px">⚠️ まず上のカードをタップして対応を試してみましょう！</div>` : '';
      const respBar = isResp ? `<div class="response-pending-bar"><div class="rpb-icon">⚠️</div><div class="rpb-text"><strong>東京が「🌧️ 洪水」を使用！</strong><br>想定ダメージ: 40 → 堤防 -25 → 実ダメージ <strong>15</strong><br>政策カードを選んで対応するか「対応しない」を押してください。${skipWarn}</div><button class="btn-skip-resp" onclick="tutorialAction('skip_attempt')">対応しない</button></div>` : '';
      const actionBar = step.action === 'end_turn' ? `<div class="action-bar"><button class="btn-end tut-glow" onclick="tutorialAction('end_turn')">ターン終了 →</button></div>` : (ts.step >= 2 && ts.step <= 4) ? `<div class="action-bar"><button class="btn-end" style="opacity:.3;pointer-events:none">ターン終了 →</button></div>` : '';

      // ── プレイヤーゾーン ──
      const hpColor = ts.playerHp > 30 ? 'var(--green)' : ts.playerHp > 10 ? 'var(--yellow)' : 'var(--red)';
      const playerZone = `<div class="player-zone" style="border-left:3px solid var(--green)">
        <div class="zone-header"><span class="zone-label">${isResp ? 'あなた（対応中）' : 'あなた'}</span><span class="city-icon-sm">🌸</span><button class="city-tap-btn${ts.step === 2 ? ' tut-pulse' : ''}" onclick="tutorialShowCity('sendai')">仙台 ⓘ</button><span class="terrain-badge">(海岸)</span></div>
        <div class="hp-section"><div class="hp-bar-wrap"><div class="hp-bar-fill" style="width:${ts.playerHp/60*100}%;background:${hpColor}"></div></div><div class="hp-text" style="color:${hpColor}">${ts.playerHp}/60</div></div>
        <div style="margin-top:4px;min-height:24px">${shieldBadge}</div>
        <div class="hand-cards-area">${handHtml}</div>
        ${isResp ? respBar : actionBar}
      </div>`;

      // ── 都市情報ポップアップ ──
      let cityOverlay = '';
      if (ts.cityPopup) {
        const cy = ts.cityPopup;
        const terrain = cy.isCoastal ? '海岸都市' : cy.isMountain ? '山間部都市' : '内陸都市';
        const terrainNote = cy.isCoastal ? '洪水・津波で +10ダメージ' : cy.isMountain ? '土砂崩れで +10ダメージ' : '地震で +10ダメージ';
        cityOverlay = `<div class="confirm-overlay" onclick="tutorialCloseCityPopup()"><div class="confirm-box" onclick="event.stopPropagation()" style="max-width:300px;max-height:85vh;overflow-y:auto;padding:16px 20px;gap:10px">
          <img src="images/cities/${cy.id}.webp" alt="" style="width:100%;object-fit:contain;border-radius:10px;display:block" onerror="this.style.display='none'">
          <div class="confirm-card-preview"><span>${cy.icon} ${cy.name}</span></div>
          <div style="background:rgba(56,139,253,.1);border-radius:6px;padding:6px 10px;font-size:.78rem;color:var(--t2);margin:4px 0">
            <div style="color:var(--blue);font-weight:700;margin-bottom:2px">地形：${terrain}</div>
            <div>${terrainNote}</div>
          </div>
          <div style="background:rgba(63,185,80,.1);border-radius:6px;padding:6px 10px;font-size:.78rem;color:var(--t2);margin:4px 0">
            <div style="color:var(--green);font-weight:700;margin-bottom:2px">都市能力</div>

    function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    function createDeck() { const d = []; for (const c of ALL_CARDS) for (let i = 0; i < 3; i++)d.push({ ...c, uid: c.id + '_' + i }); return shuffle(d); }
    function getActiveCity(pi) { const p = G.players[pi]; return p.cities[p.activeCityIdx]; }

    function getBudget(pi) { const p = G.players[pi]; const c = getActiveCity(pi); let b = 3; if (c && c.abilityType === 'extra_budget') b += c.abilityValue; if (c && c.abilityType === 'flood_budget' && p.effects.floodBonusTurns > 0) b += 1; return b; }

      let finalCls = cls;
      if (msg.includes('壊滅')) finalCls = (cls ? cls + ' critical' : 'critical');
      if (cls === 'sys' && msg.startsWith('───')) {
        G.log.unshift({ msg: '─ ─ ─', cls: 'divider' });

      G.log.unshift({ msg, cls: finalCls });
      if (G.log.length > 40) G.log.length = 40;

      const p = G.players[pi];
      for (let i = 0; i < n; i++) {
        if (G.deck.length === 0) { if (G.discard.length === 0) break; G.deck = shuffle([...G.discard]); G.discard = []; addLog('山札をシャッフルしました', 'sys'); }
        p.hand.push(G.deck.shift());

    function handleDiscardIfNeeded(pi, returnTo) {

      const p = G.players[pi]; const left = getBudgetLeft(pi); const ft = (pi === 0 && G.turnsEach[0] === 0);

            addLog(`💥 ${p.name}の「${old.name}」壊滅！→「${p.cities[nxt].name}」に切り替え！`, 'sys');

            return false;

        }

    // ═══════════════════════════════════════
    function resolveDamage(attackCard, defIdx, responseCard) {
      const def = G.players[defIdx]; const defCity = getActiveCity(defIdx);
      const fromHp = def.cityHps[def.activeCityIdx]; let dmg = attackCard.baseDamage; const log = [];
      // 構造化ログヘルパー：cat=カテゴリ, text=説明文, delta=ダメージ変化量（nullなら非ダメージ効果）
      const ld = (cat, text, delta) => log.push({ cat, text, delta: delta ?? null, running: delta != null ? dmg : null });
      // 特殊効果キャンセル
      let specialNegated = false;
      if (def.effects.negateSpecial) { specialNegated = true; def.effects.negateSpecial = false; dmg -= 10; ld('negate', '広域避難指示（事前設置）：特殊効果を無効化 −10', -10); }
      if (!specialNegated && responseCard && responseCard.effectType === 'negate_special') { specialNegated = true; dmg -= 10; ld('negate', '広域避難指示（対応フェーズ）：特殊効果を無効化 −10', -10); }
      // 特殊効果適用
      if (!specialNegated && attackCard.specialType) {
        if (attackCard.specialType === 'coastal_bonus' && defCity && defCity.isCoastal) { dmg += 10; ld('exposure', '海岸都市（地形リスク：洪水・津波への曝露）', +10); }
        if (attackCard.specialType === 'mountain_bonus' && defCity && defCity.isMountain) { dmg += 10; ld('exposure', '山間部都市（地形リスク：土砂崩れへの曝露）', +10); }
        if (attackCard.specialType === 'inland_bonus' && defCity && !defCity.isCoastal && !defCity.isMountain) { dmg += 10; ld('exposure', '内陸都市（地形リスク：地震への曝露）', +10); }
        if (attackCard.specialType === 'discard_policy') {
          const pols = def.hand.filter(c => c.type === 'policy' || c.type === 'disaster');
          if (pols.length > 0) { const d = pols[Math.random() * pols.length | 0]; def.hand.splice(def.hand.indexOf(d), 1); G.discard.push(d); ld('special', `台風：${def.name}の手札から1枚を破棄`, null); G._nextTurnEvents[defIdx].push({ type: 'typhoon_discard', cardIcon: d.icon, cardName: d.name }); }
          else ld('special', '台風：手札なし（効果なし）', null);
        }
      }
      // 都市能力
      if (defCity) {
        if (defCity.abilityType === 'resist_compound' && attackCard.id === 'compound') { dmg -= defCity.abilityValue; ld('city_policy', `${defCity.name}の都市対策：複合災害軽減（防災投資）`, -defCity.abilityValue); }
        if (defCity.abilityType === 'resist_quake_fire' && (attackCard.id === 'earthquake' || attackCard.id === 'wildfire')) { dmg -= defCity.abilityValue; ld('city_policy', `${defCity.name}の都市対策：地震・大火災軽減（防災投資）`, -defCity.abilityValue); }
        if (defCity.abilityType === 'resist_landslide' && attackCard.id === 'landslide') { dmg -= defCity.abilityValue; ld('city_policy', `${defCity.name}の都市対策：土砂崩れ軽減（防災投資）`, -defCity.abilityValue); }
        if (defCity.abilityType === 'resist_flood' && (attackCard.id === 'flood' || attackCard.id === 'tsunami')) { dmg -= defCity.abilityValue; ld('city_policy', `${defCity.name}の都市対策：洪水・津波軽減（防災投資）`, -defCity.abilityValue); }
        if (defCity.abilityType === 'second_hit_reduce' && def.effects.disastersReceivedThisTurn >= 1) { dmg -= defCity.abilityValue; ld('city_policy', `${defCity.name}の都市対策：連続被弾軽減（適応力）`, -defCity.abilityValue); }
        if (defCity.abilityType === 'quake_regen' && attackCard.id === 'earthquake') def.effects.quakeHitThisTurn = true;
        if (defCity.abilityType === 'flood_budget' && (attackCard.id === 'flood' || attackCard.id === 'tsunami')) { def.effects.floodBonusTurns = 1; ld('city_effect', `${defCity.name}の都市能力：次ターン予算+1（洪水後の復旧）`, null); }
        if (defCity.abilityType === 'flood_draw' && (attackCard.id === 'flood' || attackCard.id === 'tsunami')) { drawCards(defIdx, defCity.abilityValue); autoDiscard(defIdx); ld('city_effect', `${defCity.name}の都市能力：${defCity.abilityValue}枚ドロー（被災後の学習）`, null); }
        if (defCity.abilityType === 'quake_draw' && attackCard.id === 'earthquake') { drawCards(defIdx, defCity.abilityValue); autoDiscard(defIdx); ld('city_effect', `${defCity.name}の都市能力：${defCity.abilityValue}枚ドロー（被災後の学習）`, null); }
      }
      def.effects.disastersReceivedThisTurn++;
      // 防災庁
      if (def.effects.damageReduceHits > 0) { dmg -= 15; def.effects.damageReduceHits--; ld('agency', `防災庁設置：全ダメージ軽減（残${def.effects.damageReduceHits}回）`, -15); G._nextTurnEvents[defIdx].push({ type: 'disaster_agency_remaining', remaining: def.effects.damageReduceHits }); }
      // シールド（事前）
      if (def.effects.shieldQuakeFire && (attackCard.id === 'earthquake' || attackCard.id === 'wildfire')) { dmg -= 30; def.effects.shieldQuakeFire = false; ld('shield_pre', '耐震補強（事前設置）：発動・消費', -30); }
      if (def.effects.shieldFlood && (attackCard.id === 'flood' || attackCard.id === 'tsunami')) { dmg -= 25; def.effects.shieldFlood = false; ld('shield_pre', '堤防建設（事前設置）：発動・消費', -25); }
      // 対応カード
      if (responseCard && responseCard.effectType !== 'negate_special' && responseCard.effectType !== 'heal') {
        applyPolicyEffect(responseCard, defIdx, true);
        if (responseCard.effectType === 'shield_quake_fire' && (attackCard.id === 'earthquake' || attackCard.id === 'wildfire')) { dmg -= 30; def.effects.shieldQuakeFire = false; ld('shield_resp', '耐震補強（対応フェーズ）：発動・消費', -30); }
        if (responseCard.effectType === 'shield_flood' && (attackCard.id === 'flood' || attackCard.id === 'tsunami')) { dmg -= 25; def.effects.shieldFlood = false; ld('shield_resp', '堤防建設（対応フェーズ）：発動・消費', -25); }
      }
      // ニューオーリンズ
      if (defCity && defCity.abilityType === 'vulnerability_draw' && def.hand.length <= 2) {
        dmg += defCity.abilityValue; ld('vuln', `ニューオーリンズ（社会的脆弱性：手札${def.hand.length}枚）`, +defCity.abilityValue);
        drawCards(defIdx, 1); autoDiscard(defIdx); ld('city_effect', 'ニューオーリンズの底力：コミュニティ1枚ドロー', null);
      }
      // ダメージ確定
      dmg = Math.max(0, dmg); def.cityHps[def.activeCityIdx] -= dmg;
      let finalHp = def.cityHps[def.activeCityIdx]; const hpAD = finalHp;
      // 回復（対応カード）
      let healLog = null; let healAmt = 0; let healName = null;
      if (responseCard && responseCard.effectType === 'heal') {
        const healVal = Math.floor(responseCard.value / 2); // 対応フェーズでは回復半減
        if (finalHp > 0) { const mxHp = getActiveMaxHp(defIdx); const bh = finalHp; finalHp = Math.min(finalHp + healVal, mxHp); def.cityHps[def.activeCityIdx] = finalHp; healAmt = finalHp - bh; healName = responseCard.name; healLog = { type: 'heal', msg: `💚 ${def.name}「${responseCard.name}」→ HP +${healAmt}（${bh} → ${finalHp}）【対応時半減】` }; }
        else healLog = { type: 'sys', msg: `💔 ${def.name}：都市壊滅のため「${responseCard.name}」の回復は無効` };
      }
      if (fromHp !== finalHp) queueHpAnim(defIdx, fromHp, finalHp);
      const aN = G.players[G.pendingAttack.attackerIdx].name;
      addLog(`💥 ${aN}が「${attackCard.name}」→ ${dmg}ダメージ（${def.name}残HP:${Math.max(0, finalHp)}）`, 'dmg');
      for (const l of log) addLog(l.delta != null ? `→ ${l.text}（${l.delta > 0 ? '+' : ''}${l.delta}）` : `→ ${l.text}`);
      if (healLog) addLog(healLog.msg, healLog.type);
      G._nextTurnEvents[defIdx].push({ type: 'damage', cardIcon: attackCard.icon, cardName: attackCard.name, baseDamage: attackCard.baseDamage, details: [...log], damage: dmg, hpBefore: fromHp, hpAfterDamage: Math.max(0, hpAD), hpAfter: Math.max(0, finalHp), healAmount: healAmt, healCardName: healName });
    }

    // ═══════════════════════════════════════
    // POLICY EFFECTS
    // ═══════════════════════════════════════
    function applyPolicyEffect(card, pi, asResponse) {
      const p = G.players[pi];
      switch (card.effectType) {
        case 'shield_quake_fire': p.effects.shieldQuakeFire = true; if (!asResponse) addLog(`🔵 ${p.name}「${card.name}」→ 地震・大火災シールド`, 'policy'); break;
        case 'shield_flood': p.effects.shieldFlood = true; if (!asResponse) addLog(`🔵 ${p.name}「${card.name}」→ 洪水・津波シールド`, 'policy'); break;
        case 'heal': { const mxHp = getActiveMaxHp(pi); const fh = p.cityHps[p.activeCityIdx]; p.cityHps[p.activeCityIdx] = Math.min(p.cityHps[p.activeCityIdx] + card.value, mxHp); queueHpAnim(pi, fh, p.cityHps[p.activeCityIdx]); addLog(`💚 ${p.name}「${card.name}」→ HP +${card.value}（現在:${p.cityHps[p.activeCityIdx]}）`, 'heal'); break; }
        case 'draw': G.turnDrawState = { pi, drawn: 0, target: card.value, revealed: null, isHazardMap: true }; G.screen = 'turnDraw'; addLog(`🗺️ ${p.name}「${card.name}」→ ${card.value}枚ドロー中…`, 'policy'); break;
        case 'negate_special': p.effects.negateSpecial = true; addLog(`🔵 ${p.name}「${card.name}」→ 次の特殊効果を無効化＋ダメージ−10`, 'policy'); break;
        case 'damage_reduce_2t': p.effects.damageReduceHits = 2; addLog(`🔵 ${p.name}「${card.name}」→ 全ダメージ −15（次2回）`, 'policy'); break;
        case 'peek_all': { const opp = G.players[pi === 0 ? 1 : 0]; if (opp.hand.length > 0) { G.peekCards = opp.hand.slice(); G.peekByPlayerIdx = pi; addLog(`🔵 ${p.name}「${card.name}」→ 相手の手札を全公開`, 'policy'); G.screen = 'peek'; } else addLog(`🔵 ${p.name}「${card.name}」→ 相手の手札なし`, 'policy'); break; }
      }
    }

    // ═══════════════════════════════════════
    // TURN MANAGEMENT (online: handoverなし)
    // ═══════════════════════════════════════
    function setupTurnDraw(pi) {
      const p = G.players[pi]; p.budgetUsed = 0; p.effects.disastersReceivedThisTurn = 0;
      if (p.effects.floodBonusTurns > 0) p.effects.floodBonusTurns--;
      const target = Math.min(2, Math.max(0, 5 - p.hand.length));
      const isMyTurn = (pi === myPlayerIdx);
      setTimeout(() => showTurnSplash(isMyTurn), 50);
      if (target === 0) { addLog(`─── ${p.name}のターン開始（予算${getBudget(pi)}・手札満杯のためドローなし）`, 'sys'); G.screen = 'main'; }
      else { G.turnDrawState = { pi, drawn: 0, target, revealed: null }; G.screen = 'turnDraw'; }
    }

    function endTurn() {
      const p = G.players[G.activePlayer]; const city = getActiveCity(G.activePlayer);
      if (city && city.abilityType === 'regen') { const mxHp = city.hp; const fh = p.cityHps[p.activeCityIdx]; p.cityHps[p.activeCityIdx] = Math.min(p.cityHps[p.activeCityIdx] + city.abilityValue, mxHp); if (p.cityHps[p.activeCityIdx] !== fh) queueHpAnim(G.activePlayer, fh, p.cityHps[p.activeCityIdx]); addLog(`💚 ${city.name}の回復能力 +${city.abilityValue}（HP:${p.cityHps[p.activeCityIdx]}）`, 'heal'); const opp = G.activePlayer === 0 ? 1 : 0; G._nextTurnEvents[opp].push({ type: 'opp_regen', cityIcon: city.icon, cityName: city.name, amount: city.abilityValue, hpBefore: fh, hpAfter: p.cityHps[p.activeCityIdx] }); }
      if (city && city.abilityType === 'quake_regen' && p.effects.quakeHitThisTurn) { const fh = p.cityHps[p.activeCityIdx]; p.cityHps[p.activeCityIdx] = Math.min(p.cityHps[p.activeCityIdx] + city.abilityValue, city.hp); if (p.cityHps[p.activeCityIdx] !== fh) queueHpAnim(G.activePlayer, fh, p.cityHps[p.activeCityIdx]); addLog(`💚 ${city.name}の能力（地震後回復）+${city.abilityValue}`, 'heal'); const opp = G.activePlayer === 0 ? 1 : 0; G._nextTurnEvents[opp].push({ type: 'opp_regen', cityIcon: city.icon, cityName: city.name, amount: city.abilityValue, hpBefore: fh, hpAfter: p.cityHps[p.activeCityIdx] }); }
      p.effects.quakeHitThisTurn = false;
      G.turnsEach[G.activePlayer]++; const next = G.activePlayer === 0 ? 1 : 0; G.activePlayer = next;
      const evts = G._nextTurnEvents[next];
      if (evts.length > 0) { G._turnSummary = [...evts]; G._nextTurnEvents[next] = []; G.screen = 'turnSummary'; }
      else setupTurnDraw(next);
      pushState(); render();
    }

    // ═══════════════════════════════════════
    // GACHA / DRAFT
    // ═══════════════════════════════════════
    function pullGacha() { const rem = CITIES.filter(c => !G.gachaPickedIds.includes(c.id)); G.gachaCurrent.revealed = rem[Math.random() * rem.length | 0]; pushState(); render(); }

    function acceptGachaCity() {
      const gc = G.gachaCurrent; const city = gc.revealed; const p = G.players[gc.playerIdx];
      p.cities.push(city); p.cityHps.push(city.hp); G.gachaPickedIds.push(city.id);
      if (gc.pickNum === 0) { gc.pickNum = 1; gc.revealed = null; pushState(); render(); }
      else { G.screen = 'cityOrder'; G.cityOrderState = { playerIdx: gc.playerIdx }; pushState(); render(); }
    }

    function selectCityOrder(playerIdx, firstIdx) {
      const p = G.players[playerIdx];
      if (firstIdx === 1) { [p.cities[0], p.cities[1]] = [p.cities[1], p.cities[0]]; [p.cityHps[0], p.cityHps[1]] = [p.cityHps[1], p.cityHps[0]]; }
      if (playerIdx === 0) { G.gachaCurrent = { playerIdx: 1, pickNum: 0, revealed: null }; G.screen = 'gacha'; }
      else { G.deck = createDeck(); G.discard = []; G.log = []; G.turnsEach = [0, 0]; G.activePlayer = 0; G.players.forEach(p => { p.hand = []; p.budgetUsed = 0; p.effects = mkEffects(); }); startDraft(0); }
      pushState(); render();
    }

    function renderCityOrderSelect() {
      const pi = G.cityOrderState?.playerIdx ?? 0; const p = G.players[pi];
      const c0 = p.cities[0], c1 = p.cities[1];
      function cityCard(c, idx) {
        return `<div class="gacha-card-box" onclick="selectCityOrder(${pi},${idx})" style="cursor:pointer;width:200px;transition:.2s;flex-shrink:0" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform=''">

        <div style="font-size:.75rem;color:var(--t2);margin-top:4px;line-height:1.4">${c.abilityDesc}</div>
        <div style="margin-top:10px;padding:6px;background:rgba(56,139,253,.15);border-radius:6px;color:var(--blue);font-size:.8rem;font-weight:600">先攻に選ぶ</div>

      }

    function startDraft(pi) { G.draftState = { playerIdx: pi, picksDone: 0, picksTarget: 4, revealed: null, needPolicy: 2, needDisaster: 2 }; G.screen = 'draft'; }

    function pullDraftCard() {
      const ds = G.draftState; const needP = ds.needPolicy, needD = ds.needDisaster; let pool;
      if (needP > 0 && needD > 0) pool = G.deck.filter(c => c.type === 'policy' || c.type === 'disaster');
      else if (needP > 0) pool = G.deck.filter(c => c.type === 'policy');
      else if (needD > 0) pool = G.deck.filter(c => c.type === 'disaster');
      else pool = [...G.deck];
      if (pool.length === 0) { if (G.discard.length === 0) return; G.deck = shuffle([...G.discard, ...G.deck]); G.discard = []; pullDraftCard(); return; }
      const card = pool[Math.random() * pool.length | 0]; G.deck.splice(G.deck.indexOf(card), 1); ds.revealed = card; pushState(); render();
    }

    function acceptDraftCard() {
      const ds = G.draftState; if (!ds.revealed) return;
      if (ds.revealed.type === 'policy' && ds.needPolicy > 0) ds.needPolicy--;
      else if (ds.revealed.type === 'disaster' && ds.needDisaster > 0) ds.needDisaster--;
      G.players[ds.playerIdx].hand.push(ds.revealed); ds.revealed = null; ds.picksDone++;
      if (ds.picksDone >= ds.picksTarget) {
        if (ds.playerIdx === 0) { startDraft(1); pushState(); render(); }
        else { G.activePlayer = 0; G.players[0].budgetUsed = 0; addLog(`─── ${G.players[0].name}のターン開始（予算${getBudget(0)}）`, 'sys'); G.screen = 'main'; pushState(); render(); }
      } else { G.screen = 'draft'; pushState(); render(); }
    }

    function pullTurnCard() {
      const ts = G.turnDrawState; if (ts.revealed) return;
      if (G.deck.length === 0) { if (G.discard.length === 0) return; G.deck = shuffle([...G.discard]); G.discard = []; addLog('山札をシャッフルしました', 'sys'); }
      ts.revealed = G.deck.shift(); pushState(); render();
    }

    function acceptTurnCard() {
      const ts = G.turnDrawState; if (!ts.revealed) return;
      const pi = ts.pi ?? ts.playerIdx;
      G.players[pi].hand.push(ts.revealed); ts.drawn++; ts.revealed = null;
      if (ts.drawn >= ts.target) {
        G.turnDrawState = null;
        if (ts.isHazardMap) addLog(`🗺️ ${G.players[pi].name}：ハザードマップ整備で${ts.target}枚ドロー完了`, 'policy');
        else addLog(`─── ${G.players[pi].name}のターン開始（予算${getBudget(pi)}・${ts.target}枚ドロー）`, 'sys');
        if (!handleDiscardIfNeeded(pi, 'main')) goMain();
      } else { pushState(); render(); }
    }

    // ═══════════════════════════════════════
    // HP ANIMATION & BUDGET TOAST
    // ═══════════════════════════════════════
    let _hpQ = [];
    let _pendingMainHpAnims = [];
    let _pendingCityEnterAnim = false;
    let _lobbyEnter = true;
    let _lobbyTitleAnimDone = false;
    function queueHpAnim(pi, fh, th) { _hpQ.push({ pi, fh, th }); }
    function processHpAnims() {
      if (G.screen !== 'main' && G.screen !== 'response') return; if (G._turnSummary) return;
      const q = _hpQ.splice(0); for (const a of q) _animateHp(a.pi, a.fh, a.th);
    }
    function _animateHp(pi, fh, th) {
      const mxHp = getActiveMaxHp(pi); const fill = document.getElementById('hp-fill-' + pi); const text = document.getElementById('hp-text-' + pi); const ghost = document.getElementById('hp-ghost-' + pi);
      if (!fill || !text) return;
      const isDamage = th < fh;
      fill.style.transition = 'none'; fill.style.width = Math.max(0, fh / mxHp * 100) + '%'; fill.style.background = hpColor(fh, mxHp); fill.offsetWidth;
      if (ghost) { ghost.style.transition = 'none'; ghost.style.width = Math.max(0, fh / mxHp * 100) + '%'; ghost.offsetWidth; }
      fill.style.transition = 'width .6s cubic-bezier(.25,.8,.25,1), background .6s ease'; fill.style.width = Math.max(0, th / mxHp * 100) + '%'; fill.style.background = hpColor(th, mxHp);
      text.style.color = hpColor(th, mxHp); text.textContent = Math.max(0, th) + '/' + mxHp;
      if (isDamage) {
        fill.classList.remove('hp-flash'); fill.offsetWidth; fill.classList.add('hp-flash');
        fill.addEventListener('animationend', () => fill.classList.remove('hp-flash'), { once: true });
        showDamageFloat(pi, fh - th, false);
        if (ghost) setTimeout(() => { ghost.style.transition = 'width 1.2s ease'; ghost.style.width = Math.max(0, th / mxHp * 100) + '%'; }, 500);
      } else {
        if (ghost) { ghost.style.transition = 'none'; ghost.style.width = Math.max(0, th / mxHp * 100) + '%'; }
        if (th > fh) showDamageFloat(pi, th - fh, true);
      }
    }
    function showDamageFloat(pi, amount, isHeal) {
      const sec = document.getElementById('hp-section-' + pi); if (!sec) return;
      const r = sec.getBoundingClientRect();
      const el = document.createElement('div'); el.className = 'float-dmg';
      el.textContent = (isHeal ? '+' : '-') + amount;
      el.style.color = isHeal ? 'var(--green)' : 'var(--red)';
      el.style.left = (r.left + r.width * 0.4 + Math.random() * 30 - 15) + 'px';
      el.style.top = (r.top - 4) + 'px';
      document.body.appendChild(el); setTimeout(() => el.remove(), 1000);
    }
    function showTurnSplash(isMyTurn, isResponsePhase) {
