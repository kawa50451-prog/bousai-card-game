    function renderAttackerSummary() {
      const events = G._turnSummary || [];
      const cpuName = G.players[1 - myPlayerIdx]?.name || 'CPU';
      const _catLabel = { exposure: '地形リスク', city_policy: '都市対策', city_effect: '都市能力', shield_pre: 'シールド', shield_resp: '対応シールド', agency: '防災庁', negate: '特殊無効', vuln: '脆弱性', special: '特殊効果' };
      const _catClass = { exposure: 'exposure', city_policy: 'policy', city_effect: 'policy', shield_pre: 'shield', shield_resp: 'shield', agency: 'agency', negate: 'negate', vuln: 'vuln', special: 'negate' };
      const chipLbl = (d) => { const t = d.text || ''; if (d.cat === 'city_policy' || d.cat === 'city_effect') { const cm = t.match(/^(.+?)の都市/); const am = t.match(/：(.+?)（/); return cm && am ? `${cm[1]} ${am[1]}` : cm ? cm[1] : t.split(/[（：]/)[0].trim(); } return t.split(/[（：]/)[0].trim(); };
      const cBad = 'display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:4px 11px;border-radius:12px;background:rgba(248,81,73,.12);color:var(--red);border:1px solid rgba(248,81,73,.28);white-space:nowrap';
      const cOk  = 'display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:4px 11px;border-radius:12px;background:rgba(63,185,80,.15);color:var(--green);border:1px solid rgba(63,185,80,.3);white-space:nowrap';
      const cYel = 'display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:4px 11px;border-radius:12px;background:rgba(227,179,65,.15);color:var(--yellow);border:1px solid rgba(227,179,65,.35);white-space:nowrap';
      const items = events.map(ev => {
        if (ev.type === 'damage') {
          const details = ev.details || [];
          const baseChip = ev.baseDamage != null ? `<span style="${cBad}">基礎 ${ev.baseDamage}</span>` : '';
          const atkChips = details.filter(d => typeof d === 'object' && d.cat && d.delta > 0).map(d => `<span style="${cBad}">${chipLbl(d)} +${d.delta}</span>`).join('');
          const defChips = details.filter(d => typeof d === 'object' && d.cat && d.delta < 0).map(d => `<span style="${cOk}">${chipLbl(d)} ${d.delta}</span>`).join('');
          const healChip = ev.healAmount > 0 ? `<span style="${cYel}">${ev.healCardName} +${ev.healAmount}</span>` : '';
          const chipsHtml = baseChip + atkChips + defChips + healChip;
          const isBlock = ev.damage === 0; const dmgCol = isBlock ? 'var(--green)' : 'var(--yellow)';
          const hpBefore = ev.hpBefore ?? 60; const hpAfterDmg = ev.hpAfterDamage ?? hpBefore; const hpFinal = ev.hpAfter ?? hpAfterDmg;
          const pR = Math.max(0, Math.min(100, Math.round(hpAfterDmg / 60 * 100)));
          const pD = isBlock ? 0 : Math.max(0, Math.min(100 - pR, Math.round(ev.damage / 60 * 100)));
          const hpLabel = isBlock ? `${hpBefore}（ブロック）` : `${hpBefore} → ${hpAfterDmg}`;
          return `<div class="ts-ev ${isBlock ? 'heal' : 'damage'}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-weight:700;font-size:.88rem;color:var(--t1)">${ev.cardIcon} ${ev.cardName}</div><div style="text-align:right;line-height:1"><span style="font-size:1.55rem;font-weight:900;color:${dmgCol}">${ev.damage}</span><span style="font-size:.68rem;font-weight:600;color:${dmgCol};margin-left:2px">ダメージ</span></div></div><div style="margin-bottom:${chipsHtml ? '6px' : '2px'}"><div style="display:flex;justify-content:space-between;font-size:.7rem;color:#fff;margin-bottom:3px"><span>${cpuName} HP</span><span>${hpLabel}</span></div><div style="background:var(--bg3);border-radius:4px;height:7px;overflow:hidden;position:relative"><div style="position:absolute;left:0;top:0;height:100%;width:${pR}%;background:var(--green);border-radius:4px 0 0 4px"></div><div style="position:absolute;left:${pR}%;top:0;height:100%;width:${pD}%;background:rgba(248,81,73,0.75)"></div></div></div>${chipsHtml ? `<div style="display:flex;flex-wrap:wrap;gap:4px">${chipsHtml}</div>` : ''}</div>`;
        }
        if (ev.type === 'disaster_agency_remaining') { return ev.remaining === 0 ? `<div class="ts-ev warn"><div class="ts-ev-title">🏛️ ${cpuName}の防災庁効果が終了</div><div class="ts-ev-detail">次の攻撃から軽減なし</div></div>` : `<div class="ts-ev warn"><div class="ts-ev-title">🏛️ ${cpuName}の防災庁：残り ${ev.remaining} 回</div><div class="ts-ev-detail">あと ${ev.remaining} 回は全ダメージ −15</div></div>`; }
        if (ev.type === 'city_switch') return `<div class="ts-ev warn" style="border-color:var(--yellow);border-width:2px;background:rgba(227,179,65,.1)"><div class="ts-ev-title" style="font-size:1.15rem">💥 ${ev.oldCityName}が壊滅！</div><div class="ts-ev-detail">${ev.newCityIcon} <strong>${ev.newCityName}</strong> が登場</div></div>`;
        return '';
      }).filter(Boolean).join('');
      return `<div class="screen active"><div class="turn-summary-box">
    <div class="ts-title">⚔️ 攻撃結果 — ${cpuName}に与えたダメージ</div>
    <div class="ts-events">${items || '<div style="color:var(--t3);font-size:.85rem">ダメージなし（または対応により無効）</div>'}</div>
    <div style="text-align:center;margin-top:12px"><button class="btn-ho" onclick="dismissAttackerSummary()">✅ 確認</button></div>
  </div></div>`;
    }

    // ─── 観戦者ビュー ───
    function renderSpectator() {
      const _svgEyeHd = `<svg style="width:16px;height:16px;color:var(--blue)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      const screen = G.screen;
      const p0 = G.players[0]; const p1 = G.players[1];
      const ap = G.activePlayer;
      const _phaseKey = screen === 'response' ? 'response' : screen === 'turnSummary' ? 'turnSummary' : 'main';
      const _phaseTabs = [
        {id:'main', label:'通常フェーズ'},
        {id:'response', label:'対応フェーズ'},
        {id:'turnSummary', label:'サマリー'},
      ].map(p=>`<span class="spec-phase-tab${_phaseKey===p.id?' spec-phase-tab-active':''}">${p.label}</span>`).join('');
      const header = `<div class="spec-header">${_svgEyeHd}<span class="spec-badge">観戦中</span>${_phaseTabs}<button class="spec-exit-btn-red" onclick="restartGame()">退出</button></div>`;

      // ─ カード引き中・準備中 ─
      const drawingScreens = ['gacha','cityOrder','draft','turnDraw'];
      if (drawingScreens.includes(screen) || !p0.cities || p0.cities.length === 0) {
        let drawMsg = `${p0.name} vs ${p1.name} — 対戦準備中...`;
        if (screen === 'turnDraw') { const pi = G.turnDrawState?.pi ?? G.turnDrawState?.playerIdx ?? ap; drawMsg = `${G.players[pi].name} がカードを引いています`; }
        else if (screen === 'draft') { drawMsg = `${G.players[G.draftState?.playerIdx ?? ap].name} が初期手札を引いています`; }
        else if (screen === 'gacha') { drawMsg = `${G.players[G.gachaCurrent?.playerIdx ?? ap].name} が都市を選んでいます`; }
        else if (screen === 'cityOrder') { drawMsg = `${G.players[G.cityOrderState?.playerIdx ?? ap].name} が戦闘順を選んでいます`; }
        const _SICONS = [{src:'images/icons/neon_disaster.webp'},{src:'images/icons/neon_policy_instant.webp'},{src:'images/icons/neon_policy_shield.webp'},{src:'images/icons/neon_city.webp'}];
        const _sNeonHtml = `<div class="lobby-neon-icons">${_SICONS.map((ic,i) => `<img class="lobby-neon-icon" id="sni-${i}" src="${ic.src}" alt="" style="filter:brightness(0.04)">`).join('')}</div>`;
        return `<div class="screen active spec-screen">${header}<div class="spec-waiting">${_sNeonHtml}<div class="spec-waiting-text">${drawMsg}</div></div><button class="spec-exit-btn" onclick="restartGame()">ロビーに戻る</button></div>`;
      }

      // ─ ゲームオーバー ─
      if (screen === 'gameover' && G.winner !== null && G.winner !== undefined) {
        return renderSpectatorGameOver();
      }

      // ─ 試合中（神視点：ゾーン＋手札セット） ─
      function specZone(idx) {
        const p = G.players[idx];
        if (!p.cities || p.cities.length === 0) return `<div class="spec-zone"><div style="color:var(--t3);text-align:center;padding:12px">準備中...</div></div>`;
        const c = getActiveCity(idx); const hp = getActiveCityHp(idx); const mxHp = getActiveMaxHp(idx);
        const isActive = ap === idx;
        const isDefending = screen === 'response' && ap !== idx;
        return `<div class="spec-zone${isActive ? ' spec-zone-active' : ''}">
          <div class="spec-zone-header">
            ${isActive ? '<span class="spec-turn-dot"></span>' : ''}
            ${isDefending ? '<span class="spec-response-badge">⚡ 対応中</span>' : ''}
            <span class="spec-player-name">${p.name}</span>
            ${c ? terrainImg(c, 26) : ''}
            <span class="spec-city-name">${c ? c.name : '?'}</span>
            ${c ? `<span class="terrain-badge">(${c.isCoastal ? '海岸' : c.isMountain ? '山間部' : '内陸'})</span>` : ''}
            ${isActive ? `<span class="spec-budget-info">${getBudgetLeft(idx)}/${getBudget(idx)} ポイント</span>` : ''}
          </div>
          <div class="hp-section" id="hp-section-${idx}">
            <div class="hp-bar-wrap"><div class="hp-bar-ghost" id="hp-ghost-${idx}" style="width:${Math.max(0,hp/mxHp*100)}%"></div><div class="hp-bar-fill${hp<=10?' hp-warn':''}" id="hp-fill-${idx}" style="width:${Math.max(0,hp/mxHp*100)}%;background:${hpColor(hp,mxHp)}"></div></div>
            <div class="hp-text" id="hp-text-${idx}" style="color:${hpColor(hp,mxHp)}">${Math.max(0,hp)}/${mxHp}</div>
            ${hp<=10?'<span class="hp-critical-badge">⚠️ 壊滅寸前</span>':hp<=30?'<span class="hp-danger-badge">危険</span>':''}
          </div>
          ${renderBackupCity(idx)}
          <div class="effects-row">${renderEffectBadges(p.effects, idx)}</div>
        </div>`;
      }
      function specHand(idx) {
        const p = G.players[idx];
        if (!p.hand || p.hand.length === 0) return `<div style="color:var(--t3);font-size:.82rem;text-align:center;padding:4px">手札なし</div>`;
        return renderPlayerHandSpectator(p);
      }
      const _turnNum = G.turnsEach[ap] + 1;
      const _turnSub = `<span class="spec-vs-sub">ターン${_turnNum}</span>`;
      const midSection = screen === 'turnSummary' && G._turnSummary
        ? `<div class="spec-summary-panel"><div class="spec-summary-title">📋 ターンサマリー — ${G.players[ap]?.name} のターン</div><div class="ts-events">${_buildTurnSummaryItems(G._turnSummary)}</div><div class="spec-summary-waiting">⏳ プレイヤーが確認中...</div></div>`
        : screen === 'response' && G.pendingAttack
          ? `<div class="spec-vs-divider"><span class="spec-vs-response-main">⚔️ ${G.pendingAttack.card.icon} ${G.pendingAttack.card.name} → 対応フェーズ</span>${_turnSub}</div>`
          : `<div class="spec-vs-divider"><span>VS</span>${_turnSub}</div>`;
      const logHtml = G.log.slice(0, 8).map(e => `<div class="log-entry ${e.cls}">${e.msg}</div>`).join('') || '<div class="log-entry sys">ゲーム開始</div>';
      return `<div class="screen active spec-screen">
        ${header}
        <div class="spec-player-block">
          ${specZone(0)}
          <div class="spec-hand-section"><div class="spec-hand-label">${p0.name} の手札</div>${specHand(0)}</div>
        </div>
        ${midSection}
        <div class="spec-player-block">
          ${specZone(1)}
          <div class="spec-hand-section"><div class="spec-hand-label">${p1.name} の手札</div>${specHand(1)}</div>
        </div>
        <div class="spec-log"><div class="spec-log-title">ログ</div>${logHtml}</div>
        <button class="spec-exit-btn" onclick="restartGame()">ロビーに戻る</button>
      </div>`;
    }

    function renderSpectatorGameOver() {
      const wi = G.winner; const li = wi === 0 ? 1 : 0;
      const w = G.players[wi]; const l = G.players[li];
      const totalTurns = G.turnsEach[0] + G.turnsEach[1];
      const themeCls = _specTab === wi ? 'go-victory' : 'go-defeat';
      const bigTitle = _specTab === wi ? 'VICTORY' : 'GAME OVER';
      const bgText = (`${bigTitle} `.repeat(6)) + (`${bigTitle} `.repeat(6));

      // タブバー
      const tabBar = `<div class="spec-tab-bar go-inview">
        <button class="spec-tab-btn${_specTab===0?' active':''}" onclick="setSpecTab(0)">${G.players[0].name}</button>
        <button class="spec-tab-btn${_specTab===1?' active':''}" onclick="setSpecTab(1)">${G.players[1].name}</button>
      </div>`;

      // 勝敗行
      const wRows = w.cities.map((c, i) => { const hp = Math.max(0, w.cityHps[i]); return `<div class="go-stats-row"><span>${terrainImg(c,15)}</span><span class="go-stats-row-name">${c.name}</span><span class="${hp>0?'go-hp-alive':'go-hp-dead'}">${hp>0?'HP '+hp:'壊滅'}</span></div>`; }).join('');
      const lRows = l.cities.map(c => `<div class="go-stats-row"><span>${terrainImg(c,15)}</span><span class="go-stats-row-name">${c.name}</span><span class="go-hp-dead">壊滅</span></div>`).join('');

      // 被害カルテ（タブ対象プレイヤー）
      const hist = G._gameHistory || [];
      const viewerDmg = hist.filter(ev => ev.type === 'damage' && ev.playerIdx === _specTab);
      let karte = '';
      if (viewerDmg.length > 0) {
        const rows = viewerDmg.map(ev => { const tb = (ev.details||[]).some(d=>d.cat==='exposure')?`<span class="go-karte-badge">地形+</span>`:''; return `<div class="go-stats-row"><span style="font-size:1rem">${ev.cardIcon}</span><span class="go-stats-row-name">${ev.cardName}${tb}</span><span class="go-hp-dead" style="font-size:.85rem">−${ev.damage}</span></div>`; }).join('');
        const totalDmg = viewerDmg.reduce((s,ev)=>s+ev.damage,0);
        karte = `<div class="go-inview go-stats-table"><div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_disaster.webp" style="width:20px;height:20px;object-fit:contain"> 被害カルテ — ${G.players[_specTab].name} が受けたダメージ</div>${rows}<div class="go-stats-row" style="border-top:1px solid var(--bg3);margin-top:2px"><span class="go-stats-row-name" style="font-size:.78rem">合計</span><span class="go-hp-dead">−${totalDmg}</span></div></div>`;
      }

      // 地形リスク
      const terrainHits = viewerDmg.filter(ev=>(ev.details||[]).some(d=>d.cat==='exposure'));
      let terrainStat = '';
      if (terrainHits.length > 0) {
        const tRows = terrainHits.map(ev=>{ const d=ev.details.find(d=>d.cat==='exposure'); return `<div class="go-stats-row"><span style="font-size:.9rem">${ev.cardIcon}</span><span class="go-stats-row-name" style="font-size:.82rem">${d.text}</span><span style="color:var(--red);font-weight:700;font-family:'Roboto Condensed',sans-serif;font-size:.82rem">+${d.delta}</span></div>`; }).join('');
        terrainStat = `<div class="go-inview go-stats-table"><div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_city.webp" style="width:20px;height:20px;object-fit:contain"> 地形リスク発動 — ${terrainHits.length}回</div>${tRows}<div class="go-terrain-note">都市の地形によってダメージが増減します → カード図鑑で確認</div></div>`;
      }

      // カウンター提案
      let counterHtml = '';
      if (viewerDmg.length > 0) {
        const worst = viewerDmg.reduce((m,ev)=>ev.damage>(m?.damage??0)?ev:m,null);
        const counterCard = worst ? POLICY_CARDS.find(c=>c.id===(COUNTER_MAP[worst.cardId]||[])[0]) : null;
        if (counterCard && worst) {
          const ctColor = counterCard.color==='green'?'var(--green)':'var(--yellow)';
          counterHtml = `<div class="go-inview go-counter-wrap"><div class="go-mvp-label"><img src="images/icons/neon_policy_shield.webp" style="width:20px;height:20px;object-fit:contain"> 次はこのカードで備えよう</div><div class="go-counter-trigger"><span style="font-size:1.1rem">${worst.cardIcon}</span><span class="go-counter-arrow">→</span><span style="font-size:.82rem;color:var(--t1)">${worst.cardName} ${worst.damage}ダメージへの対策</span></div><div class="go-mvp-card-row" style="margin-top:10px"><img class="go-mvp-img" src="images/cards/${counterCard.id}.webp" alt="" onerror="this.style.display='none'"><div class="go-mvp-info"><div class="go-mvp-name" style="color:${ctColor}">${counterCard.icon} ${counterCard.name}</div><div class="go-mvp-type">${counterCard.desc}</div><div class="go-mvp-desc">${counterCard.realConcept}</div></div></div></div>`;
        }
      }

      // 観戦者限定: 防災ポイント（両プレイヤーの都市 learn テキスト）
      const learnBoxes = [0,1].map(pi => {
        const p = G.players[pi];
        if (!p.cities || p.cities.length === 0) return '';
        return p.cities.filter(c=>c.learn).map(c => `<div class="spec-learn-box"><div class="spec-learn-city-header">${terrainImg(c,18)}<strong>${c.name}</strong><span class="terrain-badge">(${c.isCoastal?'海岸':c.isMountain?'山間部':'内陸'})</span></div><div class="spec-learn-text">${c.learn}</div></div>`).join('');
      }).join('');
      const disasterLearn = `<div class="go-inview go-stats-table"><div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_city.webp" style="width:20px;height:20px;object-fit:contain"> 今試合の防災ポイント</div>${learnBoxes}</div>`;

      // 観戦者限定: 試合ハイライト
      const allDmg = hist.filter(ev=>ev.type==='damage');
      let highlightHtml = '';
      if (allDmg.length > 0) {
        const maxAtk = allDmg.reduce((m,ev)=>ev.damage>(m?.damage??0)?ev:m,null);
        const p0dealt = allDmg.filter(ev=>ev.playerIdx===1).reduce((s,ev)=>s+ev.damage,0);
        const p1dealt = allDmg.filter(ev=>ev.playerIdx===0).reduce((s,ev)=>s+ev.damage,0);
        highlightHtml = `<div class="go-inview go-stats-table"><div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_disaster.webp" style="width:20px;height:20px;object-fit:contain"> 試合ハイライト</div>${maxAtk?`<div class="go-stats-row"><span style="font-size:1rem">${maxAtk.cardIcon}</span><span class="go-stats-row-name">最大ダメージ：${maxAtk.cardName}</span><span class="go-hp-dead">−${maxAtk.damage}</span></div>`:''}<div class="go-stats-row"><span style="font-size:1rem">⚔️</span><span class="go-stats-row-name">${G.players[0].name} 総与ダメージ</span><span style="color:var(--t1);font-weight:700;font-family:'Roboto Condensed',sans-serif">${p0dealt}</span></div><div class="go-stats-row"><span style="font-size:1rem">⚔️</span><span class="go-stats-row-name">${G.players[1].name} 総与ダメージ</span><span style="color:var(--t1);font-weight:700;font-family:'Roboto Condensed',sans-serif">${p1dealt}</span></div><div class="go-stats-row"><span style="font-size:1rem">🕐</span><span class="go-stats-row-name">総ターン数</span><span style="color:var(--t1);font-weight:700;font-family:'Roboto Condensed',sans-serif">${totalTurns}</span></div></div>`;
      }

      // 観戦者限定: 観戦レポートコピー
      const reportHtml = `<div class="go-inview go-counter-wrap"><div class="go-mvp-label"><img src="images/icons/neon_policy_instant.webp" style="width:20px;height:20px;object-fit:contain"> 観戦レポートをシェア</div><button class="go-gallery-btn" onclick="copySpecReport()">📋 観戦レポートをコピー</button></div>`;

      return `<div class="screen active go-screen ${themeCls}">
        <div class="go-hero">
          <div class="go-hero-bg" aria-hidden="true">
            <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-a">${bgText}</div></div>
            <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-b">${bgText}</div></div>
            <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-a">${bgText}</div></div>
          </div>
          <div class="go-hero-content">
            <div style="font-size:.78rem;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.1em;margin-bottom:6px">👁 SPECTATOR</div>
            <div class="go-big-title">${bigTitle}</div>
            <div class="go-player-name">${w.name} の勝利！</div>
          </div>
          <div class="go-scroll-hint"><p class="go-scroll-txt">SCROLL DOWN</p><div class="go-scroll-line"><span></span></div></div>
        </div>
        <div class="go-details">
          ${tabBar}
          <div class="go-inview go-section-label">RESULT — ${G.players[_specTab].name}</div>
          <div class="go-inview go-stats-table">
            <div class="go-stats-section-header">WINNER ${w.name}</div>${wRows}
            <div class="go-stats-section-header">LOSER ${l.name}</div>${lRows}
          </div>
          <div class="go-inview go-turns-badge">総ターン数 <strong>${totalTurns}</strong></div>
          ${karte}${terrainStat}${counterHtml}
          ${disasterLearn}
          ${highlightHtml}
          ${reportHtml}
          <button class="go-inview go-replay-btn" onclick="restartGame()">ロビーに戻る</button>
        </div>
      </div>`;
    }

    // ─── ゲームオーバー ───
    function renderGameOver() {
      localStorage.removeItem('ron_lastRoom');
      setupRematchListener();
      const wi = G.winner; const li = wi === 0 ? 1 : 0;
      const w = G.players[wi]; const l = G.players[li];
      const isMyWin = wi === myPlayerIdx;
      const totalTurns = G.turnsEach[0] + G.turnsEach[1];

      // ── Flavor text (2行・文の途中改行なし) ──
      const wRemHp = w.cityHps.reduce((s, h) => s + Math.max(0, h), 0);

      }).join('');

      // ── A: 被害カルテ（自分が受けたダメージ一覧） ──
      const hist = G._gameHistory || [];

      const myCity2 = G.players[mi].cities[1] || null;
      const oppCity2 = G.players[oi].cities[1] || null;
      const _svgChevron = `<svg width="9" height="9" viewBox="0 0 9 9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5,1 6.5,4.5 2.5,8"/></svg>`;
      const _mkCityBadge = (city, label) => city
        ? `<div class="go-city-badge" onclick="goGalleryFromResult('city','${city.id}','${city.name}','city')"><img src="images/cities/${city.id}.webp" alt="" onerror="this.style.opacity='.3'"><div class="go-city-badge-playerlabel">${label}</div><div class="go-city-badge-name">${city.name}</div></div>`
        : `<div class="go-city-badge" style="opacity:.3;cursor:default;pointer-events:none"><div class="go-city-badge-playerlabel">${label}</div><div class="go-city-badge-name" style="font-size:.7rem">未使用</div></div>`;
      const hasCity2 = !!(myCity2 || oppCity2);
      const _page1 = `<div class="go-city-badges-page">${_mkCityBadge(myCity,'あなた')}<div class="go-city-badge-vs">VS</div>${_mkCityBadge(oppCity,'相手')}</div>`;
      const _page2 = hasCity2 ? `<div class="go-city-badges-page">${_mkCityBadge(myCity2,'あなた2')}<div class="go-city-badge-vs">VS</div>${_mkCityBadge(oppCity2,'相手2')}</div>` : '';
      const _nextBtn = hasCity2 ? `<button class="go-city-badges-next" id="city-badge-next-btn" onclick="toggleCityBadgePage()">${_svgChevron}</button>` : '';
      const cityBadgesHtml = (myCity && oppCity) ? `<div class="go-inview go-stats-table"><div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_city.webp" style="width:20px;height:20px;object-fit:contain"> 対戦都市 — タップしてカード図鑑へ</div><div class="go-city-badges-outer"><div class="go-city-badges-clip"><div class="go-city-badges-track" id="city-badges-track">${_page1}${_page2}</div></div>${_nextBtn}</div></div>` : '';
      const myDmgEvts = hist.filter(ev => ev.type === 'damage' && ev.playerIdx === myPlayerIdx);
      let karte = '';
      if (myDmgEvts.length > 0) {
        const rows = myDmgEvts.map(ev => {
          const hasTerrainBonus = (ev.details || []).some(d => d.cat === 'exposure');

          return `<div class="go-stats-row">
            <span style="font-size:1rem">${ev.cardIcon}</span>
            <span class="go-stats-row-name">${ev.cardName}${bonusBadge}</span>
            <span class="go-hp-dead" style="font-size:.85rem">−${ev.damage}</span>
          </div>`;
        }).join('');
        const totalDmg = myDmgEvts.reduce((s, ev) => s + ev.damage, 0);
        karte = `<div class="go-inview go-stats-table">
          <div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_disaster.webp" style="width:20px;height:20px;object-fit:contain"> 被害カルテ — あなたが受けたダメージ</div>
          ${rows}
          <div class="go-stats-row" style="border-top:1px solid var(--bg3);margin-top:2px">
            <span class="go-stats-row-name" style="font-size:.78rem">合計</span>
            <span class="go-hp-dead">−${totalDmg}</span>
          </div>
        </div>`;
      }

      // ── C: 地形リスク発動スタッツ ──
      const terrainHits = myDmgEvts.filter(ev => (ev.details || []).some(d => d.cat === 'exposure'));
      let terrainStat = '';
      if (terrainHits.length > 0) {
        const tRows = terrainHits.map(ev => {
          const d = ev.details.find(d => d.cat === 'exposure');
          return `<div class="go-stats-row">
            <span style="font-size:.9rem">${ev.cardIcon}</span>
            <span class="go-stats-row-name" style="font-size:.82rem">${d.text}</span>
            <span style="color:var(--red);font-weight:700;font-family:'Roboto Condensed',sans-serif;font-size:.82rem">+${d.delta}</span>
          </div>`;
        }).join('');
        terrainStat = `<div class="go-inview go-stats-table">
          <div class="go-stats-section-header go-karte-header"><img src="images/icons/neon_city.webp" style="width:20px;height:20px;object-fit:contain"> 地形リスク発動 — ${terrainHits.length}回</div>
          ${tRows}
          ${myCity ? `<button class="go-gallery-btn" style="margin-top:8px" onclick="goGalleryFromResult('city','${myCity.id}','${myCity.name}','city')">${myCity.name}のカードを見る →</button>` : `<div class="go-terrain-note">都市の地形によってダメージが増減します</div>`}
        </div>`;
      }

      // ── B: カウンター提案（最大ダメージ災害への対抗カード） ──
      let counterHtml = '';
      if (myDmgEvts.length > 0) {
        const worst = myDmgEvts.reduce((m, ev) => ev.damage > (m?.damage ?? 0) ? ev : m, null);
        const counterIds = worst ? (COUNTER_MAP[worst.cardId] || []) : [];
        const counterCard = counterIds.length > 0 ? POLICY_CARDS.find(c => c.id === counterIds[0]) : null;
        if (counterCard && worst) {
          const ctColor = counterCard.color === 'green' ? 'var(--green)' : 'var(--yellow)';
          counterHtml = `<div class="go-inview go-counter-wrap">
            <div class="go-mvp-label"><img src="images/icons/neon_policy_shield.webp" style="width:20px;height:20px;object-fit:contain"> 次はこのカードで備えよう</div>
            <div class="go-counter-trigger">
              <span style="font-size:1.1rem">${worst.cardIcon}</span>
              <span class="go-counter-arrow">→</span>
              <span style="font-size:.82rem;color:var(--t1)">${worst.cardName} ${worst.damage}ダメージへの対策</span>
            </div>
            <div class="go-mvp-card-row" style="margin-top:10px">
              <img class="go-mvp-img" src="images/cards/${counterCard.id}.webp" alt="" onerror="this.style.display='none'">
              <div class="go-mvp-info">
                <div class="go-mvp-name" style="color:${ctColor}">${counterCard.icon} ${counterCard.name}</div>
                <div class="go-mvp-type">${counterCard.desc}</div>
                <div class="go-mvp-desc">${counterCard.realConcept}</div>
              </div>
            </div>
            <button class="go-gallery-btn" onclick="goGalleryFromResult('card','${counterCard.id}','${counterCard.name}','policy')">カード図鑑で詳しく見る</button>
          </div>`;
        }
      }

      return `<div class="screen active go-screen ${themeCls}">

  <div class="go-hero">
    <div class="go-hero-bg" aria-hidden="true">
      <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-a">${bgText}</div></div>
      <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-b">${bgText}</div></div>
      <div class="go-hero-bg-col"><div class="go-hero-bg-col-inner go-scroll-a">${bgText}</div></div>
    </div>
    <div class="go-hero-content">
      <div class="go-big-title">${bigTitle}</div>
      <div class="go-player-name">${subtitle}</div>
      <div class="go-flavor-txt">${flavorText}</div>
    </div>
    <div class="go-scroll-hint">
      <p class="go-scroll-txt">SCROLL DOWN</p>
      <div class="go-scroll-line"><span></span></div>
    </div>
  </div>

  <div class="go-details">
    <div class="go-inview go-section-label">RESULT</div>
    <div class="go-inview go-stats-table">
      <div class="go-stats-section-header">WINNER ${w.name}</div>${wRows}
      <div class="go-stats-section-header">LOSER ${l.name}</div>${lRows}
    </div>
    <div class="go-inview go-turns-badge">総ターン数 <strong>${totalTurns}</strong></div>
    ${cityBadgesHtml}
    ${karte}
    ${terrainStat}
    ${counterHtml}
    ${isCpuMode ? `<button class="go-inview go-rematch-btn" onclick="replayCpuGame()">⚔️ もう一度戦う</button>` : roomId ? `<button class="go-inview go-rematch-btn" onclick="requestRematch()" ${_rematchRequested ? 'disabled' : ''}>${_rematchRequested ? '⏳ 相手の返答待ち...' : '⚔️ もう1戦'}</button>` : ''}
    <button class="go-inview go-replay-btn" onclick="restartGame()">ロビーに戻る</button>
  </div>

</div>`;
    }

    function initGoObserver() {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('inview'); obs.unobserve(e.target); } });
      }, { threshold: 0.12 });
      document.querySelectorAll('.go-inview').forEach(el => obs.observe(el));
    }


    // ─── 都市情報モーダル ───
    function showCityInfo(idx) { _cityInfoModal = idx; render(); }
    function hideCityInfo() { _cityInfoModal = null; render(); }

    function renderCityInfoModal() {
      const idx = _cityInfoModal;
      if (idx === null || !G.players[idx]) { _cityInfoModal = null; return ''; }
      const p = G.players[idx]; const c = getActiveCity(idx);
      if (!c) { _cityInfoModal = null; return ''; }
      const hp = getActiveCityHp(idx); const mxHp = getActiveMaxHp(idx);
      const terrain = c.isCoastal ? '海岸都市' : c.isMountain ? '山間部都市' : '内陸都市';
      return `<div class="city-info-overlay" onclick="hideCityInfo()">
        <div class="city-info-box" onclick="event.stopPropagation()">
          <img src="images/cities/${c.id}.webp" style="width:120px;border-radius:10px;display:block;margin:0 auto 6px" alt="" onerror="this.style.display='none'">
          <div style="text-align:center;margin-bottom:2px">${terrainImg(c, 28)}</div>
          <div style="font-size:1.1rem;font-weight:700;text-align:center;margin:3px 0">${c.name}</div>
          <div style="font-size:.73rem;color:var(--t2);text-align:center">${terrain} ／ HP <strong style="color:${hpColor(hp, mxHp)}">${hp}</strong>/${mxHp}</div>
          <div style="background:rgba(56,139,253,.1);border:1px solid rgba(56,139,253,.3);border-radius:8px;padding:9px 12px;font-size:.82rem;margin-top:4px">
            <div style="font-weight:700;color:var(--blue);margin-bottom:3px">都市能力</div>
            <div>${c.abilityDesc}</div>
          </div>
          <div style="font-size:.72rem;color:var(--t2);line-height:1.55">${c.concept}</div>
          <div style="text-align:center;margin-top:8px"><button style="padding:7px 24px;background:var(--bg3);border:none;border-radius:8px;color:var(--t2);cursor:pointer;font-size:.85rem" onclick="hideCityInfo()">閉じる</button></div>
        </div>
      </div>`;
    }

    // ─── ターン終了確認 ───
    function requestEndTurn() {
      const left = getBudgetLeft(G.activePlayer);
      if (left > 0) {
        G.confirm = { fn: 'endTurn', uid: '', name: '', icon: '', cardType: 'sys', actionLabel: 'ターン終了', danger: false };
        render();
      } else {
        endTurn();
      }
    }

    // ═══════════════════════════════════════
    // EVENT HANDLERS
    // ═══════════════════════════════════════
    function handleHostClick() { const name = lobbyState.nameInput.trim(); if (!name) { lobbyState.error = '名前を入力してください'; render(); return; } lobbyState.error = ''; createRoom(); }
    function handleJoinClick() { const name = lobbyState.nameInput.trim(); const code = lobbyState.joinCodeInput.trim(); if (!name) { lobbyState.error = '名前を入力してください'; render(); return; } if (code.length !== 6) { lobbyState.error = 'ルームコードは6文字で入力してください'; render(); return; } lobbyState.error = ''; joinRoom(); }
    function dismissTurnSummary() {
      G._atkSummaryConfirmed = false;
      const _evts = G._turnSummary || []; const _ap = G.activePlayer;
      if (!G._gameHistory) G._gameHistory = [];
      G._gameHistory.push(..._evts.map(ev => ({ ...ev, playerIdx: _ap })));
      const _hasSwitch = _evts.some(ev => ev.type === 'city_switch');
      if (!_hasSwitch) {
        if (!_responseAnimatedPis.has(_ap)) {
          for (const ev of _evts) { if (ev.type === 'damage' && ev.hpBefore != null && ev.hpAfter != null && ev.hpBefore !== ev.hpAfter) _pendingMainHpAnims.push({ pi: _ap, fh: ev.hpBefore, th: ev.hpAfter, delay: 80 }); }
        }
        _responseAnimatedPis.clear();
      } else {
        _pendingCityEnterAnim = true;
        const _np = G.players[_ap]; const _nh = _np.cityHps[_np.activeCityIdx];
        if (_nh > 0) { _cityEnterAnimPi = _ap; _pendingMainHpAnims.push({ pi: _ap, fh: 0, th: _nh, delay: 480 }); }
      }
      G._turnSummary = null; setupTurnDraw(G.activePlayer); pushState(); render();
    }
    function requestConfirm(fn, uid, name, icon, cardType, actionLabel, danger = false) { G.confirm = { fn, uid, name, icon, cardType, actionLabel, danger }; render(); }
    function doConfirm() {
      const c = G.confirm; G.confirm = null;
      if (c.fn === 'playCard' || c.fn === 'playResponseCard') {
        _playingCardUid = c.uid; render();
        setTimeout(() => { _playingCardUid = null; if (c.fn === 'playCard') playCard(c.uid); else playResponseCard(c.uid); }, 230);
      } else if (c.fn === 'discardCard') { discardCard(c.uid); }
      else if (c.fn === 'endTurn') { endTurn(); }
    }
    function cancelConfirm() { G.confirm = null; render(); }
    function confirmWithAnim() {
      const box = document.querySelector('.confirm-box');
      if (box) { box.style.animation = 'yb-clip-out .22s cubic-bezier(.86,0,.07,1) forwards'; setTimeout(doConfirm, 210); }
      else doConfirm();
    }

    function playCard(uid) {
      const p = G.players[G.activePlayer]; const idx = p.hand.findIndex(c => c.uid === uid); if (idx === -1) return; const card = p.hand[idx];
      if (G.activePlayer === 0 && G.turnsEach[0] === 0 && card.type === 'disaster') { alert('先攻1ターン目は災害カードを使えません。'); return; }
      if (getBudgetLeft(G.activePlayer) < card.cost) return;
      p.hand.splice(idx, 1); G.discard.push(card); p.budgetUsed += card.cost;
      showBudgetToast(card.cost, getBudgetLeft(G.activePlayer), getBudget(G.activePlayer));
      if (card.type === 'policy') {
        applyPolicyEffect(card, G.activePlayer, false);
        if (G.screen === 'peek') { pushState(); render(); return; }
        if (G.screen === 'turnDraw') { pushState(); render(); return; }
        if (!handleDiscardIfNeeded(G.activePlayer, 'main')) goMain();
      } else {
        const defIdx = G.activePlayer === 0 ? 1 : 0; G.pendingAttack = { card, attackerIdx: G.activePlayer, defenderIdx: defIdx };
        addLog(`⚔️ ${p.name}が「${card.icon} ${card.name}」を宣言！`, 'sys'); pushState(); render();
      }
    }

    function goResponseHandover() {
      const atk = G.pendingAttack;
      const def = G.players[atk.defenderIdx];
      if (atk.card.specialType === 'skip_response' && !def.effects.negateSpecial) {
        addLog(`⚡ 複合災害：${def.name}の対応フェーズを強制スキップ！`, 'sys');
        G._nextTurnEvents[atk.defenderIdx].push({ type: 'response_skipped', cityName: getActiveCity(atk.defenderIdx)?.name || '' });
        resolveDamage(atk.card, atk.defenderIdx, null);
        _responseAnimatedPis.add(atk.defenderIdx);
        G.pendingAttack = null;
        if (checkWin()) return;
        G.screen = 'main'; pushState(); render();
        return;
      }
      G.screen = 'response'; showTurnSplash(false, true); pushState(); render();
    }

    function skipResponse() {
      resolveDamage(G.pendingAttack.card, G.pendingAttack.defenderIdx, null); G.pendingAttack = null;
      if (checkWin()) return; G.screen = 'main'; pushState(); render();
    }

    function playResponseCard(uid) {
      const defIdx = G.pendingAttack.defenderIdx; const def = G.players[defIdx];
      const idx = def.hand.findIndex(c => c.uid === uid); if (idx === -1) return; const card = def.hand[idx]; if (card.type !== 'policy') return;
      def.hand.splice(idx, 1); G.discard.push(card); addLog(`🛡️ ${def.name}が「${card.icon} ${card.name}」で対応！`, 'policy');
      resolveDamage(G.pendingAttack.card, defIdx, card); G.pendingAttack = null;
      if (checkWin()) return; if (G.screen !== 'peek' && G.screen !== 'turnDraw') G.screen = 'main'; pushState(); render();
    }

    function discardCard(uid) {
      const dn = G.discardNeeded; const pi = dn.pi ?? dn.playerIdx; const p = G.players[pi];
      const idx = p.hand.findIndex(c => c.uid === uid); if (idx === -1) return;
      const card = p.hand.splice(idx, 1)[0]; G.discard.push(card); addLog(`📤 ${p.name}がカードを1枚捨てた`, 'sys');
      if (p.hand.length <= 5) { G.discardNeeded = null; G.screen = dn.returnTo; }
      pushState(); render();
    }

    function closePeek() { _peekDiscardMode = false; G.peekCard = null; G.peekCards = null; G.peekByPlayerIdx = null; G.screen = 'main'; pushState(); render(); }

    // ─── リマッチ ───
    function doRematch() {
      if (myRole !== 'p1') return;
      if (db && roomId) {
        db.ref(`rooms/${roomId}/rematch`).off();
        db.ref(`rooms/${roomId}/rematch`).remove();
        db.ref(`rooms/${roomId}/rematchRequest`).off();
        db.ref(`rooms/${roomId}/rematchRequest`).remove();
      }
      hideRematchRequestPopup();
      _rematchListenerSet = false; _rematchRequested = false;
      const p0name = G.players[0].name; const p1name = G.players[1].name;
      G = {
        screen: 'gacha', activePlayer: 0, turnsEach: [0, 0],
        players: [
          { name: p0name, cities: [], cityHps: [], activeCityIdx: 0, hand: [], budgetUsed: 0, effects: mkEffects() },
          { name: p1name, cities: [], cityHps: [], activeCityIdx: 0, hand: [], budgetUsed: 0, effects: mkEffects() },
        ],
        deck: [], discard: [], log: [],
        pendingAttack: null, peekCard: null, peekByPlayerIdx: null, winner: null,
        gachaPickedIds: [], gachaCurrent: { playerIdx: 0, pickNum: 0, revealed: null }, draftState: null,
        discardNeeded: null, confirm: null, turnDrawState: null, cityOrderState: null,
        _nextTurnEvents: { 0: [], 1: [] }, _turnSummary: null, _gameHistory: [],
      };
      pushState(); render();
    }

    function requestRematch() {
      if (!db || !roomId || _rematchRequested) return;
      _rematchRequested = true;
      db.ref(`rooms/${roomId}/rematchRequest`).set(myRole);
      render();
    }

    function acceptRematch() {
      hideRematchRequestPopup();
      if (db && roomId) db.ref(`rooms/${roomId}/rematch`).set(true);
    }

    function declineRematch() {
      hideRematchRequestPopup();
      if (db && roomId) db.ref(`rooms/${roomId}/rematchRequest`).remove();
    }

    function showRematchRequestPopup() {
      if (document.getElementById('rematch-request-popup')) return;
      const ov = document.createElement('div');
      ov.id = 'rematch-request-popup'; ov.className = 'rematch-request-overlay';
      const _svgSword = `<svg style="width:48px;height:48px;color:var(--yellow)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/></svg>`;
      ov.innerHTML = `<div class="rematch-request-box">
        ${_svgSword}
        <div class="rematch-request-title">もう1戦リクエスト</div>
        <div class="rematch-request-sub">相手がもう1戦を希望しています。<br>受けますか？</div>
        <button class="rematch-accept-btn" onclick="acceptRematch()">⚔️ はい、やります！</button>
        <button class="rematch-decline-btn" onclick="declineRematch()">いいえ</button>
      </div>`;
      document.body.appendChild(ov);
    }

    function hideRematchRequestPopup() {
      const el = document.getElementById('rematch-request-popup'); if (el) el.remove();
    }

    function setupRematchListener() {
      if (_rematchListenerSet || !db || !roomId) return;
      _rematchListenerSet = true;
      db.ref(`rooms/${roomId}/rematchRequest`).on('value', snap => {
        const requester = snap.val();
        if (requester && requester !== myRole) {
          showRematchRequestPopup();
        } else if (!requester) {
          hideRematchRequestPopup();
          if (_rematchRequested) { _rematchRequested = false; render(); }
        }
      });
      if (myRole === 'p1') {
        db.ref(`rooms/${roomId}/rematch`).on('value', snap => {
          if (snap.val() === true && G.screen === 'gameover') doRematch();
        });
      }
    }

    // ─── リザルト共有 ───
    function shareResult() {
      const wi = G.winner; const li = wi === 0 ? 1 : 0;
      const w = G.players[wi]; const l = G.players[li];
      const isMyWin = wi === myPlayerIdx;
      const totalTurns = G.turnsEach[0] + G.turnsEach[1];
      const tLabel = c => c.isCoastal ? '🌊' : c.isMountain ? '🏔️' : '🏙️';
      const wCities = w.cities.map((c, i) => {
        const hp = Math.max(0, w.cityHps[i]);
        return `  ${tLabel(c)}${c.name}${hp > 0 ? ' HP' + hp : ' 壊滅'}`;
      }).join('\n');
      const lCities = l.cities.map(c => `  ${tLabel(c)}${c.name} 壊滅`).join('\n');
      const hist = G._gameHistory || [];
      const myDmgEvts = hist.filter(ev => ev.type === 'damage' && ev.playerIdx === myPlayerIdx);
      const worst = myDmgEvts.reduce((m, ev) => ev.damage > (m?.damage ?? 0) ? ev : m, null);
      let text = `【Ready or Not 対戦結果】\n${isMyWin ? '🏆 勝利！' : '💀 敗北...'}\n\n`;
      text += `勝者: ${w.name}\n${w.name}の都市:\n${wCities}\n\n`;
      text += `敗者: ${l.name}\n${l.name}の都市:\n${lCities}\n\n`;
      text += `総ターン数: ${totalTurns}`;
      if (worst) text += `\n最大被弾: ${worst.cardName} −${worst.damage}`;
      text += '\n\n#ReadyOrNot #防災カードゲーム';
      navigator.clipboard.writeText(text).then(() => {
        showShareToast('リザルトをコピーしました');
      }).catch(() => {
        try {
          const el = document.createElement('textarea'); el.value = text;
          document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
        } catch (e) {}
        showShareToast('リザルトをコピーしました');
      });
    }

    function showShareToast(msg) {
      const old = document.getElementById('go-share-toast'); if (old) old.remove();
      const t = document.createElement('div'); t.id = 'go-share-toast'; t.className = 'go-share-toast';
      t.textContent = '✅ ' + msg; document.body.appendChild(t);
      setTimeout(() => { if (t.parentNode) t.remove(); }, 2500);
    }

    function restartGame() {
      _lobbyEnter = true;
      isCpuMode = false; _cpuCancelTimer();
      cleanupPresence();
      const _rApp = document.getElementById('app');
      _rApp.style.transition = 'opacity .28s ease'; _rApp.style.opacity = '0';
      setTimeout(() => {
        if (db && roomId && myRole === 'p1') db.ref(`rooms/${roomId}`).remove();
        myRole = null; myPlayerIdx = 0; roomId = null; myLastPush = null;
        _rematchListenerSet = false; _rematchRequested = false;
        hideRematchRequestPopup();
        localStorage.removeItem('ron_lastRoom'); localStorage.removeItem('ron_lastRole');
        history.replaceState(null, '', window.location.pathname);
        lobbyState = { mode: 'select', nameInput: '', joinCodeInput: '', error: '', galleryTab: null, galleryZoom: null, fromResult: false };
        _hintOpen = false; tutorialState = null;
        _cityEnterAnimPi = -1; _pendingCityEnterAnim = false; _pendingMainHpAnims.length = 0; _hpQ.length = 0; _draftAnimBusy = false; _gachaAnimState = null; _gachaRevealingCity = null; _gachaAllCities = null; _gachaBulkMode = false;
        G = { screen: 'lobby', activePlayer: 0, turnsEach: [0, 0], players: [{ name: 'プレイヤー1', cities: [], cityHps: [], activeCityIdx: 0, hand: [], budgetUsed: 0, effects: mkEffects() }, { name: 'プレイヤー2', cities: [], cityHps: [], activeCityIdx: 0, hand: [], budgetUsed: 0, effects: mkEffects() }], deck: [], discard: [], log: [], pendingAttack: null, peekCard: null, winner: null, gachaPickedIds: [], gachaCurrent: null, draftState: null, discardNeeded: null, confirm: null, turnDrawState: null, cityOrderState: null, _nextTurnEvents: { 0: [], 1: [] }, _turnSummary: null };
        _rApp.style.transition = 'none'; _rApp.style.opacity = '1';
        render();
        requestAnimationFrame(() => { _rApp.style.transition = ''; });
      }, 280);
    }

    function replayCpuGame() {
      _lobbyEnter = true;
      _cpuCancelTimer();
      const _rApp = document.getElementById('app');
      _rApp.style.transition = 'opacity .28s ease'; _rApp.style.opacity = '0';
      setTimeout(() => {
        myRole = null; myPlayerIdx = 0; roomId = null; myLastPush = null;
        _rematchListenerSet = false; _rematchRequested = false;
        hideRematchRequestPopup();
        localStorage.removeItem('ron_lastRoom'); localStorage.removeItem('ron_lastRole');
        history.replaceState(null, '', window.location.pathname);
        lobbyState = { mode: 'cpu', nameInput: '', joinCodeInput: '', error: '', galleryTab: null, galleryZoom: null, fromResult: false };
        _hintOpen = false; tutorialState = null;
        _cityEnterAnimPi = -1; _pendingCityEnterAnim = false; _pendingMainHpAnims.length = 0; _hpQ.length = 0; _draftAnimBusy = false; _gachaAnimState = null; _gachaRevealingCity = null; _gachaAllCities = null; _gachaBulkMode = false;
        isCpuMode = false;
        G = { screen: 'lobby', activePlayer: 0, turnsEach: [0, 0], players: [{ name: 'プレイヤー1', cities: [], cityHps: [], activeCityIdx: 0, hand: [], budgetUsed: 0, effects: mkEffects() }, { name: 'プレイヤー2', cities: [], cityHps: [], activeCityIdx: 0, hand: [], budgetUsed: 0, effects: mkEffects() }], deck: [], discard: [], log: [], pendingAttack: null, peekCard: null, winner: null, gachaPickedIds: [], gachaCurrent: null, draftState: null, discardNeeded: null, confirm: null, turnDrawState: null, cityOrderState: null, _nextTurnEvents: { 0: [], 1: [] }, _turnSummary: null };
        _rApp.style.transition = 'none'; _rApp.style.opacity = '1';
        render();
        requestAnimationFrame(() => { _rApp.style.transition = ''; });
      }, 280);
    }

    // ═══════════════════════════════════════
    // CPU SOLO PLAY
    // ═══════════════════════════════════════
    function _cpuCancelTimer() { if (_cpuTimer) { clearTimeout(_cpuTimer); _cpuTimer = null; } }

    const _CPU_CITY_TIERS = {
      kobe: 'S', tokyo: 'S',
      kumamoto: 'A', osaka: 'A',
      kagoshima: 'B', sendai: 'B',
      hiroshima: 'C', niigata: 'C', istanbul: 'C', nagoya: 'C',
      new_orleans: 'D', rotterdam: 'D'
    };
    const _CPU_GACHA_W = {
      easy:   { S: 0.3, A: 0.6, B: 0.8, C: 1.0, D: 1.5 },
      normal: { S: 0.6, A: 0.8, B: 0.9, C: 1.0, D: 1.2 },
      hard:   { S: 1.0, A: 1.0, B: 1.0, C: 1.0, D: 1.0 }
    };

    function _cpuPullGacha() {
      const gc = G.gachaCurrent;
      const rem = CITIES.filter(c => !G.gachaPickedIds.includes(c.id));
      const wt = _CPU_GACHA_W[cpuDifficulty];
      const pool = rem.map(c => ({ c, w: wt[_CPU_CITY_TIERS[c.id] || 'C'] }));
      const total = pool.reduce((s, x) => s + x.w, 0);
      let r = Math.random() * total, chosen = rem[0];
      for (const { c, w } of pool) { r -= w; if (r <= 0) { chosen = c; break; } }
      gc.revealed = chosen; gc.candidates = null;
      pushState(); render();
    }

    function startCpuGame(difficulty) {
      const name = lobbyState.nameInput.trim() || 'プレイヤー';
      isCpuMode = true; cpuDifficulty = difficulty;
      myRole = 'p1'; myPlayerIdx = 0;
      const cpuNames = { easy: 'CPU（EASY）', normal: 'CPU（NORMAL）', hard: 'CPU（HARD）' };
      G = {
        screen: 'gacha', activePlayer: 0, turnsEach: [0, 0],
        players: [
          { name, cities: [], cityHps: [], activeCityIdx: 0, hand: [], budgetUsed: 0, effects: mkEffects() },
          { name: cpuNames[difficulty], cities: [], cityHps: [], activeCityIdx: 0, hand: [], budgetUsed: 0, effects: mkEffects() }
        ],
        deck: [], discard: [], log: [], pendingAttack: null, peekCard: null, peekByPlayerIdx: null,
        winner: null, gachaPickedIds: [], gachaCurrent: { playerIdx: 0, pickNum: 0, revealed: null, candidates: null },
        draftState: null, discardNeeded: null, confirm: null, turnDrawState: null, cityOrderState: null,
        _nextTurnEvents: { 0: [], 1: [] }, _turnSummary: null, _gameHistory: []
      };
      localStorage.setItem('ron_lastName', name);
      _cityEnterAnimPi = -1; _pendingCityEnterAnim = false; _pendingMainHpAnims.length = 0; _hpQ.length = 0; _draftAnimBusy = false; _gachaAnimState = null; _gachaRevealingCity = null; _gachaAllCities = null; _gachaBulkMode = false;
      render();
    }

    function _triggerCpuIfNeeded() {
      if (!isCpuMode) return;
      _cpuCancelTimer();
      const s = G.screen, ap = G.activePlayer;
      const gc = G.gachaCurrent, ts = G.turnDrawState, ds = G.draftState, dn = G.discardNeeded;
      const needAct =
        (s === 'gacha' && gc?.playerIdx === 1) ||
        (s === 'cityOrder' && G.cityOrderState?.playerIdx === 1) ||
        (s === 'draft' && ds?.playerIdx === 1) ||
        (s === 'turnDraw' && (ts?.pi ?? ts?.playerIdx) === 1) ||
        (s === 'turnSummary' && ap === 1 && G._atkSummaryConfirmed) ||
        (s === 'main' && ap === 1 && !G.pendingAttack) ||
        (s === 'main' && G.pendingAttack?.attackerIdx === 1 && !G._pendingAutoHandover) ||
        (s === 'response' && G.pendingAttack?.defenderIdx === 1) ||
        (s === 'discard' && (dn?.pi ?? dn?.playerIdx) === 1) ||
        (s === 'peek' && G.peekByPlayerIdx === 1);
      if (!needAct) return;
      _cpuTimer = setTimeout(_cpuAct, 700 + (Math.random() * 700 | 0));
    }

    function _cpuAct() {
      _cpuTimer = null;
      if (!isCpuMode) return;
      const s = G.screen, ap = G.activePlayer;
      const gc = G.gachaCurrent, ts = G.turnDrawState, ds = G.draftState, dn = G.discardNeeded;
      if (s === 'gacha' && gc?.playerIdx === 1) {
        if (!gc.revealed && !gc.candidates) _cpuPullGacha(); else acceptGachaCity();
      } else if (s === 'cityOrder' && G.cityOrderState?.playerIdx === 1) {
        _cpuSelectCityOrder();
      } else if (s === 'draft' && ds?.playerIdx === 1) {
        finalizeAllDraftCards();
      } else if (s === 'turnDraw' && (ts?.pi ?? ts?.playerIdx) === 1) {
        if (!ts.revealed) pullTurnCard(); else acceptTurnCard();
      } else if (s === 'turnSummary' && ap === 1 && G._atkSummaryConfirmed) {
        dismissTurnSummary();
      } else if (s === 'main' && ap === 1 && !G.pendingAttack) {
        _cpuDoMainTurn();
      } else if (s === 'main' && G.pendingAttack?.attackerIdx === 1 && !G._pendingAutoHandover) {
        G._pendingAutoHandover = true;
        setTimeout(() => { G._pendingAutoHandover = false; goResponseHandover(); }, 500);
      } else if (s === 'response' && G.pendingAttack?.defenderIdx === 1) {
        _cpuDoResponse();
      } else if (s === 'discard' && (dn?.pi ?? dn?.playerIdx) === 1) {
        _cpuDoDiscard();
      } else if (s === 'peek' && G.peekByPlayerIdx === 1) {
        closePeek();
      }
    }

    function _cpuSelectCityOrder() {
      const p = G.players[1]; const c0 = p.cities[0], c1 = p.cities[1];
      if (cpuDifficulty === 'easy') { selectCityOrder(1, Math.random() < 0.5 ? 0 : 1); return; }
      const prefer2nd = cpuDifficulty === 'hard'
        ? ['kobe', 'osaka', 'sendai', 'kagoshima', 'new_orleans']
        : ['kobe'];
      if (prefer2nd.includes(c0.id)) selectCityOrder(1, 1);
      else if (prefer2nd.includes(c1.id)) selectCityOrder(1, 0);
      else if (cpuDifficulty === 'hard') selectCityOrder(1, c0.hp <= c1.hp ? 0 : 1);
      else selectCityOrder(1, 0);
    }

    function _cpuEstimateDmg(card, defIdx) {
      if (card.type !== 'disaster') return 0;
      const def = G.players[defIdx]; const city = def.cities[def.activeCityIdx];
      if (!city) return 0;
      let dmg = card.baseDamage;
      if (card.specialType === 'inland_bonus' && !city.isCoastal && !city.isMountain) dmg += 10;
      if (card.specialType === 'coastal_bonus' && city.isCoastal) dmg += 10;
      if (card.specialType === 'mountain_bonus' && city.isMountain) dmg += 10;
      if (city.abilityType === 'resist_quake_fire' && (card.id === 'earthquake' || card.id === 'wildfire')) dmg -= city.abilityValue;
      if (city.abilityType === 'resist_flood' && (card.id === 'flood' || card.id === 'tsunami')) dmg -= city.abilityValue;
      if (city.abilityType === 'resist_landslide' && card.id === 'landslide') dmg -= city.abilityValue;
      if (city.abilityType === 'resist_compound' && card.id === 'compound') dmg -= city.abilityValue;
      if (city.abilityType === 'second_hit_reduce' && def.effects.disastersReceivedThisTurn >= 1) dmg -= city.abilityValue;
      if (city.abilityType === 'vulnerability_draw' && def.hand.length <= 2) dmg += city.abilityValue;
      if (cpuDifficulty !== 'easy') {
        if (def.effects.shieldQuakeFire && (card.id === 'earthquake' || card.id === 'wildfire')) dmg -= 30;
        if (def.effects.shieldFlood && (card.id === 'flood' || card.id === 'tsunami')) dmg -= 25;
        if (def.effects.negateSpecial && card.specialType === 'skip_response') dmg -= 10;
        if (def.effects.damageReduceHits > 0) dmg -= 15;
      }
      return Math.max(0, dmg);
    }

    function _cpuDoMainTurn() {
      if (cpuDifficulty === 'easy') _cpuDoMainEasy();
      else if (cpuDifficulty === 'normal') _cpuDoMainNormal();
      else _cpuDoMainHard();
    }

    function _cpuDoMainEasy() {
      const budget = getBudgetLeft(1);
      if (budget === 0 || Math.random() < 0.18) { endTurn(); return; }
      const affordable = G.players[1].hand.filter(c => c.cost <= budget);
      if (!affordable.length) { endTurn(); return; }
      playCard(affordable[Math.random() * affordable.length | 0].uid);
    }

    function _cpuDoMainNormal() {
      const budget = getBudgetLeft(1);
      const cpu = G.players[1], opp = G.players[0];
      const oppHp = opp.cityHps[opp.activeCityIdx];
      const cpuHp = cpu.cityHps[cpu.activeCityIdx];
      if (budget === 0) { endTurn(); return; }
      const affordable = cpu.hand.filter(c => c.cost <= budget);
      if (!affordable.length) { endTurn(); return; }
      const ranked = affordable.filter(c => c.type === 'disaster')
        .map(c => ({ c, dmg: _cpuEstimateDmg(c, 0) })).sort((a, b) => b.dmg - a.dmg);
      if (ranked.length && ranked[0].dmg >= oppHp) { playCard(ranked[0].c.uid); return; }
      if (cpuHp < 25) { const h = affordable.find(c => c.effectType === 'heal'); if (h) { playCard(h.uid); return; } }
      if (ranked.length && ranked[0].dmg > 0) { playCard(ranked[0].c.uid); return; }
      const sh = affordable.find(c => c.effectType === 'shield_quake_fire' || c.effectType === 'shield_flood' || c.effectType === 'damage_reduce_2t');
      if (sh) { playCard(sh.uid); return; }
      const dr = affordable.find(c => c.effectType === 'draw');
      if (dr) { playCard(dr.uid); return; }
      endTurn();
    }

    function _cpuDoMainHard() {
      const budget = getBudgetLeft(1);
      const cpu = G.players[1], opp = G.players[0];
      const oppHp = opp.cityHps[opp.activeCityIdx];
      const cpuHp = cpu.cityHps[cpu.activeCityIdx];
      const oppCity = opp.cities[opp.activeCityIdx];
      if (budget === 0) { endTurn(); return; }
      const affordable = cpu.hand.filter(c => c.cost <= budget);
      if (!affordable.length) { endTurn(); return; }
      const ranked = affordable.filter(c => c.type === 'disaster')
        .map(c => ({ c, dmg: _cpuEstimateDmg(c, 0) })).sort((a, b) => b.dmg - a.dmg);
      // ① Killing blow / overkill avoidance (掟⑪)
      if (oppHp <= 20) {
        const fin = affordable.filter(c => c.type === 'disaster' && _cpuEstimateDmg(c, 0) >= oppHp)
          .sort((a, b) => a.cost - b.cost)[0];
        if (fin) { playCard(fin.uid); return; }
      }
      if (ranked.length && ranked[0].dmg >= oppHp) { playCard(ranked[0].c.uid); return; }
      // ② Evacuation proactive (掟⑥, early game only)
      if (!cpu.effects.negateSpecial && G.turnsEach[1] < 4 && cpu.budgetUsed === 0) {
        const ev = affordable.find(c => c.id === 'evacuation'); if (ev) { playCard(ev.uid); return; }
      }
      // ③ bousai_cho early defense
      if (!cpu.effects.damageReduceHits && G.turnsEach[1] < 5 && cpu.budgetUsed === 0) {
        const bc = affordable.find(c => c.id === 'bousai_cho'); if (bc) { playCard(bc.uid); return; }
      }
      // ④ Heal if HP critical
      if (cpuHp < 30) {
        const h = affordable.filter(c => c.effectType === 'heal').sort((a, b) => b.value - a.value)[0];
        if (h) { playCard(h.uid); return; }
      }
      // ⑤ Attack with best disaster (terrain-smart, 掟⑤⑥)
      if (ranked.length && ranked[0].dmg > 0) { playCard(ranked[0].c.uid); return; }
      // ⑥ Preemptive shield matching opponent terrain (掟⑧)
      if (oppCity) {
        if (!cpu.effects.shieldQuakeFire && !oppCity.isCoastal && !oppCity.isMountain) {
          const qw = affordable.find(c => c.id === 'quake_wall'); if (qw) { playCard(qw.uid); return; }
        }
        if (!cpu.effects.shieldFlood && oppCity.isCoastal) {
          const dm = affordable.find(c => c.id === 'dam'); if (dm) { playCard(dm.uid); return; }
        }
      }
      // ⑦ Hazard map (use leftover budget)
      const hm = affordable.find(c => c.id === 'hazard_map'); if (hm) { playCard(hm.uid); return; }
      // ⑧ Heal moderately
      if (cpuHp < 50) {
        const h = affordable.filter(c => c.effectType === 'heal').sort((a, b) => b.value - a.value)[0];
        if (h) { playCard(h.uid); return; }
      }
      endTurn();
    }

    function _cpuDoResponse() {
      const atk = G.pendingAttack.card;
      const policies = G.players[1].hand.filter(c => c.type === 'policy');
      if (!policies.length) { skipResponse(); return; }
      if (cpuDifficulty === 'easy') {
        if (Math.random() < 0.55) { skipResponse(); return; }
        playResponseCard(policies[Math.random() * policies.length | 0].uid); return;
      }
      let use = null;
      if (atk.id === 'earthquake' || atk.id === 'wildfire') use = policies.find(c => c.id === 'quake_wall');
      else if (atk.id === 'flood' || atk.id === 'tsunami') use = policies.find(c => c.id === 'dam');
      if (!use) use = policies.find(c => c.id === 'agreement');
      if (!use && cpuDifficulty === 'hard' && atk.baseDamage >= 30) use = policies.find(c => c.id === 'evacuation');
      if (use) playResponseCard(use.uid); else skipResponse();
    }

    function _cpuDoDiscard() {
      const cpu = G.players[1]; const hand = cpu.hand;
      const oppCity = G.players[0].cities[G.players[0].activeCityIdx];
      if (cpuDifficulty === 'easy') { discardCard(hand[Math.random() * hand.length | 0].uid); return; }
      if (cpu.effects.shieldQuakeFire) { const c = hand.find(c => c.id === 'quake_wall'); if (c) { discardCard(c.uid); return; } }
      if (cpu.effects.shieldFlood) { const c = hand.find(c => c.id === 'dam'); if (c) { discardCard(c.uid); return; } }
      if (cpuDifficulty === 'hard' && oppCity && !oppCity.isMountain) {
        const ls = hand.find(c => c.id === 'landslide'); if (ls) { discardCard(ls.uid); return; }
      }
      const order = ['drill', 'hazard_map', 'pact', 'typhoon', 'landslide', 'earthquake', 'flood', 'quake_wall', 'dam', 'evacuation', 'agreement', 'bousai_cho', 'compound', 'tsunami', 'wildfire'];
      for (const id of order) { const c = hand.find(c => c.id === id); if (c) { discardCard(c.uid); return; } }
      discardCard(hand[0].uid);
    }

    // ═══════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════
    window.addEventListener('load', () => {
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      const savedRoom = localStorage.getItem('ron_lastRoom');
      const savedName = localStorage.getItem('ron_lastName');
      if (savedName) lobbyState.nameInput = savedName;
      if (roomParam) {
        lobbyState.joinCodeInput = roomParam.toUpperCase().slice(0, 6); lobbyState.mode = 'join';
      } else if (savedRoom) {
        lobbyState.joinCodeInput = savedRoom; lobbyState.mode = 'join';
      }
      if (isFirebaseConfigured()) initFirebase();
      if (params.get('spv')) { specPreview(params.get('spv') === '1' ? 'main' : params.get('spv')); return; }
      render();
      // URLパラメータあり or localStorage両方あり → 自動参加（再接続含む）
      // roomParam 経由はエラー表示あり、savedRoom のみの場合は silent でlobbyにフォールバック
      if (isFirebaseConfigured() && savedName) {
        if (roomParam) joinRoom();
        else if (savedRoom) joinRoom({ silent: true });
      }
      // 名前未保存でも ?room= があれば満員チェック → 観戦オファーを先行表示（名前不要）
      if (isFirebaseConfigured() && roomParam && !savedName) {
        const _rc = roomParam.toUpperCase().slice(0, 6);
        db.ref(`rooms/${_rc}/p2Joined`).get().then(snap => {
          if (snap.val() === true && !lobbyState.spectateCode) { lobbyState.spectateCode = _rc; render(); }
        }).catch(() => {});
      }
    });

    // ダブルタップズーム防止（iOS Safari は CSS touch-action を html/body で無視するため JS で対応）
    let _lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if (now - _lastTouchEnd <= 300) e.preventDefault();
      _lastTouchEnd = now;
    }, { passive: false });
  </script>
