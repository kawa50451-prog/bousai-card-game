    /* [DEV] プレビューボタン */

    /* ═══════════════════════════════════════════════════
       MOBILE BATTLE LAYOUT — comprehensive fix v2
    ═══════════════════════════════════════════════════ */

    /* ── 防災協定（Peek）画面：縦方向センタリング ── */
    .peek-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    @media (max-width: 600px) {

      /* ── 1. バトル画面アクティブ時：ビューポートをロック（JS が body.battle-active を付与） ── */
      body.battle-active {
        overflow: hidden;
        height: 100dvh;
      }
      body.battle-active #app {
        height: 100dvh;
        overflow: hidden;
        /* 上: safe-area + 6px、下: safe-area + 12px（枠線を確実に表示） */
        padding: calc(env(safe-area-inset-top, 0px) + 6px) 6px
                 calc(env(safe-area-inset-bottom, 0px) + 12px);
      }
      body.battle-active .screen.active {
        height: 100%;
        overflow: hidden;
      }

      /* ── 2. battle-layout：上部に少し余白を追加（相手ゾーンを下げる） ── */
      .battle-layout {
        height: 100%;
        overflow: hidden;
        gap: 4px;
        padding-top: 4px;
      }

      /* ── 3. ログ：モバイルバトル画面では非表示（ターンサマリーで代替） ── */
      .battle-layout .log-area,
      .screen.active > .log-area {
        display: none;
      }

      /* ── 4. 相手ゾーン：固定サイズ・コンパクト化 ── */
      .opponent-zone {
        flex-shrink: 0;
        padding: 8px 10px;
      }

      /* ── 5. ステータスバー・バナー類：縮まない ── */
      .state-banner,
      .status-bar,
      .auto-end-bar {
        flex-shrink: 0;
      }

      /* ── 6. プレイヤーゾーン：自ターン時はコンテンツ分だけ（コンパクト）、対応フェーズ時に拡張 ── */
      .player-zone {
        flex: 0 1 auto;   /* 自ターン：コンテンツ高さだけ使用、余白は枠外に */
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 8px 10px 4px;
      }
      /* 対応フェーズ：response-pending-bar のスペースを確保するために拡張 */
      .battle-layout.response-phase .player-zone {
        flex: 1;
      }

      /* ── 7. 手札エリア：自然高さ+縮小可能（flex:1 だと空白ができるため削除） ── */
      .player-zone .hand-cards-area {
        flex-shrink: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* ── 8a. ターン終了・自動終了：カードとの間にスペースを作り下部へ押し出す ── */
      .player-zone .action-bar,
      .player-zone .auto-end-bar {
        flex-shrink: 0;
        margin-top: auto;
        margin-bottom: 4px;
      }

      /* ── 8b. 対応フェーズバー：カードの直下に自然配置（下部に押し出すと見切れるため） ── */
      .player-zone .response-pending-bar {
        flex-shrink: 0;
        margin-top: 10px;
        margin-bottom: 4px;
        padding: 8px 10px;
        gap: 6px;
      }
      .player-zone .response-pending-bar .rpb-icon { font-size: 1.1rem; }
      .player-zone .response-pending-bar .rpb-text { font-size: .78rem; }

      /* ── 9. ハテナ(?)ボタン：プレイヤーゾーンのフレーム右下コーナーに重ねる ── */
      .hint-btn {
        right: calc(env(safe-area-inset-right, 0px) + 12px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      }
      .spec-invite-btn {
        right: calc(env(safe-area-inset-right, 0px) + 12px + 40px + 8px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      }

      /* ── 10. カードサイズ微調整 ── */
      :root {
        --card-h: 108px;
        --card-w: 76px;
      }

      /* ── 11. 相手手札バックカード：横スクロール化 ── */
      .hand-back-row {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;

ject-fit:contain"> <strong class="tneon-white">山間部</strong> — 土砂崩れ +10追加ダメージ<br><img src="images/icons/terrain_inland.webp" style="width:18px;height:18px;vertical-align:middle;object-fit:contain"> <strong class="tneon-yellow" style="color:var(--yellow)">内陸</strong> — 地震 +10追加ダメージ</div><div style="font-size:.82rem;color:#e6edf3;margin-top:6px">このチュートリアルは <strong>仙台（海岸）</strong> vs <strong>東京（内陸）</strong> で進みます。</div>`, highlight: null, btnLabel: '次へ →', action: 'next' },

icon_jinzai.webp" style="width:40px;height:40px;border-radius:50%;flex-shrink:0;object-fit:cover"><div><div style="color:#c084fc;font-weight:700;font-size:.88rem;margin-bottom:4px">人為災害カード（紫）</div><div style="font-size:.78rem;color:var(--t1);line-height:1.6">直接ダメージは与えず、相手の<strong>シールド破壊・対応封じ・予算減少</strong>で妨害する妨害カード。初期手札に入ることもあり、ターン中のドローでも入手する。</div></div></div></div><div style="font-size:.72rem;color:#e6edf3;margin-top:8px">毎ターン最大2枚ドロー。手札上限5枚。</div>`, highlight: null, btnLabel: 'バトルへ →', action: 'next' },
      { title: 'バトル開始！', body: '<strong>上が相手ゾーン、下があなたのゾーン</strong>です。HPバーで残り体力が分かります。<br>・<strong>都市名（ⓘ）</strong>をタップ → 地形・都市能力を確認できます<br>・地形（海岸 / 内陸 / 山間部）によって特定の災害で追加ダメージを受けます<br>・下の手札の<strong>カードをタップ</strong>すると効果の詳細を確認できます<br>予算 <strong>3pt</strong> でカードを使えます。', highlight: null, btnLabel: '次へ →', action: 'next' },
      { title: '緑カードを設置しよう', body: '<strong>堤防建設（コスト2）</strong> をタップして設置。相手が洪水・津波を使ったとき、自動で <strong>-25軽減</strong> します。', highlight: 'dam', btnLabel: null, action: 'play_dam' },
      { title: '黄カードで即時回復', body: '<strong>避難訓練（コスト1）</strong> をタップ。タップした瞬間に <strong>HP +20</strong> 回復します。', highlight: 'drill', btnLabel: null, action: 'play_drill' },

      { title: 'メインフェーズ → 対応フェーズ', body: `相手がカードを使い終えると<strong>対応フェーズ</strong>が始まります。<br><br><div style="display:flex;flex-direction:column;gap:5px;font-size:.78rem"><div style="background:rgba(63,185,80,.1);border-radius:6px;padding:5px 8px">✅ <strong>政策カードで対応</strong>：コスト<strong>無料</strong>。ただし回復効果は<strong>半減</strong>になる</div><div style="background:rgba(139,148,158,.1);border-radius:6px;padding:5px 8px">⏩ <strong>対応しない</strong>：そのままダメージを受ける</div></div><br>次のステップで <strong>相互支援協定</strong> を使って洪水15ダメージを相殺してみましょう！`, highlight: null, btnLabel: '対応してみよう →', action: 'next' },

    function startTutorial() {
      const dam       = { ...POLICY_CARDS.find(c => c.id === 'dam'),       uid: 'tu_dam' };
      const drill     = { ...POLICY_CARDS.find(c => c.id === 'drill'),     uid: 'tu_drill' };
      const agreement = { ...POLICY_CARDS.find(c => c.id === 'agreement'), uid: 'tu_agr' };
      tutorialState = { step: 0, playerHp: 45, opponentHp: 60, budgetUsed: 0, shieldActive: false, hand: [dam, drill, agreement], usedUids: [], feedback: null, skipWarning: false, cityPopup: null, confirmCard: null };
      _mainTutorialShown = false;
      _tutStepSpotlights = new Set();
      _tutBattleGateShown = false;
      _hintOpen = false;
      G.screen = 'tutorial';
      render();
    }

    function _tl(label) {
      const s = label.replace(/[\s→←]+$/, '').replace(/^[\s→←]+/, '');
      if (s === '次へ') return '＞';
      if (s === '戻る') return '＜';
      return s + ' ＞';
    }
    function tutorialAction(action) {
      const ts = tutorialState; if (!ts) return;
      ts.skipWarning = false; ts.confirmCard = null;
      let _vfx = null;
      if (action === 'next')          { ts.feedback = null; ts.step++; }
      else if (action === 'play_dam')  { ts.usedUids.push('tu_dam'); ts.budgetUsed += 2; ts.shieldActive = true; ts.feedback = '✅ 堤防建設を設置！シールドバッジが表示されています。'; ts.step++; _vfx = 'dam'; }
      else if (action === 'play_drill'){ ts.usedUids.push('tu_drill'); ts.budgetUsed += 1; const prev = ts.playerHp; ts.playerHp = Math.min(60, prev + 20); ts.feedback = `✅ HP +20 回復！（${prev} → ${ts.playerHp}）`; ts.step++; _vfx = 'drill'; }
      else if (action === 'end_turn')  { ts.feedback = null; ts.step++; }
      else if (action === 'skip_attempt') { ts.skipWarning = true; }
      else if (action === 'respond')   { ts.usedUids.push('tu_agr'); ts.feedback = '✅ 洪水ダメージ 15 − 相互支援協定 +15 = 実ダメージ 0！'; ts.step++; _vfx = 'respond'; }
      else if (action === 'finish')    { _lobbyEnter = true; tutorialState = null; G.screen = 'lobby'; }
      else if (action === 'back') {
        const prev = ts.step - 1;
        if (prev >= 0 && TUT_STEP_STATES[prev]) {
          const s = TUT_STEP_STATES[prev];
          ts.step = prev; ts.playerHp = s.playerHp; ts.budgetUsed = s.budgetUsed;
          ts.shieldActive = s.shieldActive; ts.usedUids = [...s.usedUids];
          ts.feedback = null; ts.skipWarning = false; ts.cityPopup = null; ts.confirmCard = null;
        }
      }
      render();
      if (ts.step === 5) setTimeout(() => { const el = document.querySelector('.btn-end.tut-glow'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 150);
      if (_vfx === 'dam')    requestAnimationFrame(() => showTutNeonFlash('rgba(63,185,80,.32)'));
      else if (_vfx === 'drill')   requestAnimationFrame(() => { showTutNeonFlash('rgba(210,153,34,.32)'); showTutHPFloat('+20', 'var(--green)'); });
      else if (_vfx === 'respond') requestAnimationFrame(() => { showTutNeonFlash('rgba(56,139,253,.32)'); });
    }

    function showTutGate() {
      const g = document.createElement('div'); g.className = 'tut-gate';
      g.innerHTML = '<div class="tut-gate-l"></div><div class="tut-gate-r"></div>';
      document.body.appendChild(g); setTimeout(() => g.remove(), 720);
    }
    function showTutNeonFlash(color) {
      const el = document.createElement('div');
      el.style.cssText = `position:fixed;inset:0;background:radial-gradient(ellipse at center,${color} 0%,transparent 68%);pointer-events:none;z-index:8800;animation:neon-use-fade .45s ease-out forwards`;
      document.body.appendChild(el); setTimeout(() => el.remove(), 500);
    }
    function showTutHPFloat(text, color) {
      const sec = document.querySelector('.player-zone .hp-section');
      const el = document.createElement('div'); el.className = 'float-dmg';
      el.textContent = text; el.style.color = color;
      if (sec) { const r = sec.getBoundingClientRect(); el.style.left = (r.left + r.width * 0.45) + 'px'; el.style.top = (r.top - 4) + 'px'; }
      else { el.style.left = '50%'; el.style.top = '55%'; }
      document.body.appendChild(el); setTimeout(() => el.remove(), 1050);
    }
    function showTutZeroFlash() {
      const el = document.createElement('div');
      el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9100;pointer-events:none;animation:tut-zero-anim 1.8s cubic-bezier(.23,1,.32,1) forwards;width:min(300px,88vw)';
      el.innerHTML = '<div style="background:var(--bg2);border-radius:8px;padding:9px 13px;border-left:3px solid var(--green)"><div style="font-weight:700;font-size:.88rem;color:var(--green);margin-bottom:4px">堤防建設 — 完全軽減！</div><div style="font-size:.78rem;color:var(--t2)">洪水 15ダメージ → 堤防 −25 → 最終ダメージ <strong style="color:var(--green)">0</strong></div></div>';
      document.body.appendChild(el); setTimeout(() => el.remove(), 2000);
    }
    function tutorialShowCity(id) { if (tutorialState) { tutorialState.cityPopup = CITIES.find(c => c.id === id) || null; render(); } }
    function tutorialCloseCityPopup() { if (tutorialState) { tutorialState.cityPopup = null; render(); } }
    function tutorialShowConfirm(uid) { if (!tutorialState) return; const card = tutorialState.hand.find(c => c.uid === uid); if (card) { tutorialState.confirmCard = card; render(); } }
    function tutorialCancelConfirm() { if (tutorialState) { tutorialState.confirmCard = null; render(); } }
    function exitTutorial() { _lobbyEnter = true; tutorialState = null; G.screen = 'lobby'; render(); }

    function renderTutorial() {
      const ts = tutorialState; const step = TUT_STEPS[ts.step];
      const isPreBattle = ts.step <= 1;
      const isResp = (ts.step === 8); const isFinish = (ts.step === 10);
      const budgetLeft = 3 - ts.budgetUsed;

      // ── 共通：進捗ドット・戻るボタン ──
      const dots = TUT_STEPS.map((_, i) => `<div class="tut-dot" style="background:${i === ts.step ? 'var(--blue)' : i < ts.step ? 'var(--green)' : 'var(--bg3)'}"></div>`).join('');
      const stepCounter = `<span style="font-size:.72rem;color:var(--t1);font-weight:600">${ts.step + 1} / ${TUT_STEPS.length}</span>`;
      const backBtn = ts.step > 0 ? `<button class="sq-btn" style="font-size:.75rem;min-height:28px;padding:3px 10px" onclick="tutorialAction('back')">＜</button>` : '';
      const progressRow = `<div style="display:flex;align-items:center;gap:6px">${backBtn}<div class="tut-progress">${dots}</div>${stepCounter}</div>`;
      const lobbyBackBtn = `<button class="sq-btn" style="margin-top:4px;align-self:flex-start" onclick="exitTutorial()">＜ ロビーに戻る</button>`;

      // ── 前半：説明カード（ステップ 0-1）──
      if (isPreBattle) {
        return `<div class="screen active"><div style="display:flex;flex-direction:column;flex:1;padding:10px;overflow-y:auto;gap:10px">
          <div class="tut-guide" style="width:100%;gap:14px">
            <div class="tut-guide-title tut-anim-title" style="font-size:1rem">${step.title}</div>
            <div class="tut-guide-body tut-anim-body">${step.body}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
              ${progressRow}
              <button class="sq-btn" onclick="tutorialAction('${step.action}')">${_tl(step.btnLabel)}</button>
            </div>
          </div>
          ${lobbyBackBtn}
        </div></div>`;
      }

      // ── 結果確認画面（ステップ 9）──
      if (step.isResultSummary) {
        const cBad = 'display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:4px 11px;border-radius:12px;background:rgba(248,81,73,.12);color:var(--red);border:1px solid rgba(248,81,73,.28);white-space:nowrap';
        const cOk  = 'display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:4px 11px;border-radius:12px;background:rgba(63,185,80,.15);color:var(--green);border:1px solid rgba(63,185,80,.3);white-space:nowrap';
        const cYel = 'display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:4px 11px;border-radius:12px;background:rgba(227,179,65,.15);color:var(--yellow);border:1px solid rgba(227,179,65,.35);white-space:nowrap';
        const chips = `<span style="${cBad}">基礎 30</span><span style="${cBad}">海岸都市 +10</span><span style="${cOk}">堤防建設 −25</span><span style="${cYel}">相互支援協定 +15</span>`;
        return `<div class="screen active"><div class="turn-summary-box">
          <div class="ts-title">📋 仙台のターン — 対応結果</div>
          <div class="ts-events"><div class="ts-ev heal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-weight:700;font-size:.88rem;color:var(--t1)">🌧️ 洪水</div><div style="text-align:right;line-height:1"><span style="font-size:1.55rem;font-weight:900;color:var(--green)">0</span><span style="font-size:.68rem;font-weight:600;color:var(--green);margin-left:2px">ダメージ</span></div></div><div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:.7rem;color:var(--t3);margin-bottom:3px"><span>HP</span><span>60（変化なし）</span></div><div style="background:var(--bg3);border-radius:4px;height:7px;overflow:hidden;position:relative"><div style="position:absolute;left:0;top:0;height:100%;width:100%;background:var(--green);border-radius:4px"></div></div></div><div style="display:flex;flex-wrap:wrap;gap:4px">${chips}</div></div></div>
          <div style="text-align:center;margin-top:12px"><button class="btn-ho" onclick="tutorialAction('next')">確認 →</button></div>
        </div></div>`;
      }

      // ── 完了画面（ステップ 10）──
      if (isFinish) {
        const feedbackHtml = ts.feedback ? `<div style="background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.28);border-radius:8px;padding:10px 12px;font-size:.82rem;color:var(--green)">${ts.feedback}</div>` : '';
        return `<div class="screen active"><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:20px">
          <div class="tut-guide" style="max-width:480px;width:100%;gap:14px">
            <div style="font-size:2.2rem;text-align:center">🎉</div>
            <div class="tut-guide-title" style="font-size:1rem;text-align:center">${step.title}</div>
            ${feedbackHtml}
            <div class="tut-guide-body">${step.body}</div>
            <button class="sq-btn" style="width:100%;padding:12px;font-size:.9rem" onclick="tutorialAction('finish')">${_tl(step.btnLabel)}</button>
          </div>
        </div></div>`;
      }

      // ── ガイドボックス（バトル用）──
      const guideBtn = step.btnLabel ? `<button class="sq-btn tut-action-btn" onclick="tutorialAction('${step.action}')">${_tl(step.btnLabel)}</button>` : `<span style="font-size:.72rem;color:var(--t3)">↓ 光っているものをタップ</span>`;
      const feedbackLine = ts.feedback ? `<div style="background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.28);border-radius:8px;padding:8px 10px;font-size:.8rem;color:var(--green)">${ts.feedback}</div>` : '';
      const guideBox = `<div class="tut-guide">
        <div class="tut-guide-title">${step.title}</div>
        ${feedbackLine}
        <div class="tut-guide-body">${step.body}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          ${progressRow}
          ${guideBtn}
        </div>
      </div>`;

      // ── 相手ゾーン ──
      const isAttackActive = ts.step >= 6;

      if (defCity) {
        if (defCity.abilityType === 'resist_compound' && attackCard.id === 'compound') { dmg -= defCity.abilityValue; ld('city_policy', `${defCity.name}の都市対策：複合災害軽減（防災投資）`, -defCity.abilityValue); }
        if (defCity.abilityType === 'resist_quake_fire' && (attackCard.id === 'earthquake' || attackCard.id === 'wildfire')) { dmg -= defCity.abilityValue; ld('city_policy', `${defCity.name}の都市対策：地震・大火災軽減（防災投資）`, -defCity.abilityValue); }
        if (defCity.abilityType === 'resist_landslide' && attackCard.id === 'landslide') { dmg -= defCity.abilityValue; ld('city_policy', `${defCity.name}の都市対策：土砂崩れ軽減（防災投資）`, -defCity.abilityValue); }
        if (defCity.abilityType === 'resist_flood' && (attackCard.id === 'flood' || attackCard.id === 'tsunami')) { dmg -= defCity.abilityValue; ld('city_policy', `${defCity.name}の都市対策：洪水・津波軽減（防災投資）`, -defCity.abilityValue); }
        if (defCity.abilityType === 'second_hit_reduce' && def.effects.disastersReceivedThisTurn >= 1) { dmg -= defCity.abilityValue; ld('city_policy', `${defCity.name}の都市対策：連続被弾軽減（適応力）`, -defCity.abilityValue); }
        if (defCity.abilityType === 'quake_regen' && attackCard.id === 'earthquake') def.effects.quakeHitThisTurn = true;
        if (defCity.abilityType === 'flood_budget' && (attackCard.id === 'flood' || attackCard.id === 'tsunami')) { def.effects.floodBonusTurns = 1; ld('city_effect', `${defCity.name}の都市能力：次ターン予算+${defCity.abilityValue}（洪水後の復旧力）`, null); G._nextTurnEvents[defIdx].push({ type: 'flood_budget', cityIcon: terrainImg(defCity, 18), cityName: defCity.name, bonusAmt: defCity.abilityValue }); }
        if (defCity.abilityType === 'flood_draw' && (attackCard.id === 'flood' || attackCard.id === 'tsunami')) { drawCards(defIdx, defCity.abilityValue); autoDiscard(defIdx); ld('city_effect', `${defCity.name}の都市能力：${defCity.abilityValue}枚ドロー（被災後の学習）`, null); }
        if (defCity.abilityType === 'quake_draw' && attackCard.id === 'earthquake') { drawCards(defIdx, defCity.abilityValue); autoDiscard(defIdx); ld('city_effect', `${defCity.name}の都市能力：${defCity.abilityValue}枚ドロー（被災後の学習）`, null); }
      }
      def.effects.disastersReceivedThisTurn++;
      // 防災庁
      if (def.effects.damageReduceHits > 0) { dmg -= 15; def.effects.damageReduceHits--; ld('agency', `防災庁設置：全ダメージ軽減（残${def.effects.damageReduceHits}回）`, -15); G._nextTurnEvents[defIdx].push({ type: 'disaster_agency_remaining', remaining: def.effects.damageReduceHits }); }
      // シールド（事前）
      if (def.effects.shieldQuakeFire && (attackCard.id === 'earthquake' || attackCard.id === 'wildfire')) { dmg -= 30; def.effects.shieldQuakeFire = false; ld('shield_pre', '耐震補強（事前設置）：発動・消費', -30); }
      if (def.effects.shieldFlood && (attackCard.id === 'flood' || attackCard.id === 'tsunami')) { dmg -= 25; def.effects.shieldFlood = false; ld('shield_pre', '堤防建設（事前設置）：発動・消費', -25); }
      // 対応カード（シールド系）
      if (responseCard && responseCard.effectType !== 'negate_special' && responseCard.effectType !== 'heal') {
        applyPolicyEffect(responseCard, defIdx, true);
        if (responseCard.effectType === 'shield_quake_fire') { def.effects.shieldQuakeFire = false; if (attackCard.id === 'earthquake' || attackCard.id === 'wildfire') { dmg -= 30; ld('shield_resp', '耐震補強（対応フェーズ）：発動・消費', -30); } }
        if (responseCard.effectType === 'shield_flood') { def.effects.shieldFlood = false; if (attackCard.id === 'flood' || attackCard.id === 'tsunami') { dmg -= 25; ld('shield_resp', '堤防建設（対応フェーズ）：発動・消費', -25); } }
      }
      // 対応カード（即時回復：ダメージ軽減として計算）
      let healAmt = 0; let healName = null;
      if (responseCard && responseCard.effectType === 'heal') {
        const healVal = Math.floor(responseCard.value / 2); // 対応フェーズでは半減
        healAmt = healVal; healName = responseCard.name;
        dmg -= healVal;
      }
      // ニューオーリンズ（対応カードを使った場合は使用前の手札数で判定）
      const _noHandLen = def.hand.length + (responseCard ? 1 : 0);
      if (defCity && defCity.abilityType === 'vulnerability_draw' && _noHandLen <= 2) {
        dmg += defCity.abilityValue; ld('vuln', `ニューオーリンズ（社会的脆弱性：手札${_noHandLen}枚）`, +defCity.abilityValue);
        drawCards(defIdx, 1); autoDiscard(defIdx); ld('city_effect', 'ニューオーリンズの底力：コミュニティ1枚ドロー', null);
      }
      // ダメージ確定
      dmg = Math.max(0, dmg); def.cityHps[def.activeCityIdx] -= dmg;
      let finalHp = def.cityHps[def.activeCityIdx]; const hpAD = finalHp;
      if (fromHp !== finalHp) queueHpAnim(defIdx, fromHp, finalHp);
      const aN = G.players[G.pendingAttack.attackerIdx].name;
      addLog(`💥 ${aN}が「${attackCard.name}」→ ${dmg}ダメージ（${def.name}残HP:${Math.max(0, finalHp)}）`, 'dmg');
      for (const l of log) addLog(l.delta != null ? `→ ${l.text}（${l.delta > 0 ? '+' : ''}${l.delta}）` : `→ ${l.text}`);
      if (healAmt > 0) addLog(`💚 ${def.name}「${healName}」→ 回復軽減 ${healAmt}（対応時半減）`);
      G._nextTurnEvents[defIdx].push({ type: 'damage', cardId: attackCard.id, cardIcon: attackCard.icon, cardName: attackCard.name, baseDamage: attackCard.baseDamage, details: [...log], damage: dmg, hpBefore: fromHp, hpAfterDamage: Math.max(0, hpAD), hpAfter: Math.max(0, finalHp), healAmount: healAmt, healCardName: healName });
    }

    // ═══════════════════════════════════════
    // POLICY EFFECTS
    // ═══════════════════════════════════════
    function applyPolicyEffect(card, pi, asResponse) {
      const p = G.players[pi];
      switch (card.effectType) {
        case 'shield_quake_fire': p.effects.shieldQuakeFire = true; if (!asResponse) addLog(`🔵 ${p.name}「${card.name}」→ 地震・大火災シールド`, 'policy'); break;
        case 'shield_flood': p.effects.shieldFlood = true; if (!asResponse) addLog(`🔵 ${p.name}「${card.name}」→ 洪水・津波シールド`, 'policy'); break;
        case 'heal': { const mxHp = getActiveMaxHp(pi); const fh = p.cityHps[p.activeCityIdx]; p.cityHps[p.activeCityIdx] = Math.min(p.cityHps[p.activeCityIdx] + card.value, mxHp); queueHpAnim(pi, fh, p.cityHps[p.activeCityIdx]); addLog(`💚 ${p.name}「${card.name}」→ HP +${card.value}（現在:${p.cityHps[p.activeCityIdx]}）`, 'heal'); break; }
        case 'draw': G.turnDrawState = { pi, drawn: 0, target: card.value, revealed: null, isHazardMap: true }; G.screen = 'turnDraw'; addLog(`🗺️ ${p.name}「${card.name}」→ ${card.value}枚ドロー中…`, 'policy'); break;
        case 'negate_special': p.effects.negateSpecial = true; addLog(`🔵 ${p.name}「${card.name}」→ 特殊効果・テロ攻撃を無効化＋ダメージ−10`, 'policy'); break;
        case 'damage_reduce_2t': p.effects.damageReduceHits = 2; addLog(`🔵 ${p.name}「${card.name}」→ 全ダメージ −15（次2回）`, 'policy'); break;
        case 'peek_all': { const opp = G.players[pi === 0 ? 1 : 0]; if (opp.hand.length > 0) { G.peekCards = opp.hand.slice(); G.peekByPlayerIdx = pi; addLog(`🔵 ${p.name}「${card.name}」→ 相手の手札を全公開`, 'policy'); G.screen = 'peek'; } else addLog(`🔵 ${p.name}「${card.name}」→ 相手の手札なし`, 'policy'); break; }
      }
    }

    // ═══════════════════════════════════════
    // JINZAI (人為災害) EFFECTS
    // ═══════════════════════════════════════
    // プレイヤーが設置中の「シールド型」効果（緑政策由来）を列挙する。公害カードの破壊対象。
    function getActiveShields(p) {
      const e = p.effects; const list = [];
      if (e.shieldQuakeFire) list.push({ key: 'shieldQuakeFire', cardId: 'quake_wall', icon: '🏗️', label: '耐震シールド', desc: '地震・大火災 −30' });
      if (e.shieldFlood) list.push({ key: 'shieldFlood', cardId: 'dam', icon: '🌊', label: '堤防シールド', desc: '洪水・津波 −25' });
      if (e.negateSpecial) list.push({ key: 'negateSpecial', cardId: 'evacuation', icon: '📢', label: '特殊効果無効', desc: '特殊効果・テロを無効＋ダメージ−10' });
      if (e.damageReduceHits > 0) list.push({ key: 'damageReduceHits', cardId: 'bousai_cho', icon: '🏛️', label: `防災庁設置（残${e.damageReduceHits}回）`, desc: '全ダメージ −15' });
      return list;
    }

    function applyJinzaiEffect(card, pi) {
      const p = G.players[pi];
      const defIdx = pi === 0 ? 1 : 0; const def = G.players[defIdx];
      if (card.id === 'pollution') {
        const shields = getActiveShields(def);
        if (shields.length === 0) { addLog(`☣️ ${p.name}「公害」→ 相手にシールドがなく効果なし`, 'sys'); return; }
        G.pendingPollution = { attackerIdx: pi }; G.screen = 'pollution';
        addLog(`☣️ ${p.name}「公害」→ 破壊するシールドを選択中…`, 'sys');
      } else if (card.id === 'terror') {
        p.effects.terrorNextDisaster = true;
        addLog(`💣 ${p.name}「テロ攻撃」→ 次に使う災害への対応フェーズを封じる`, 'sys');
      } else if (card.id === 'rumor') {
        def.effects.debtBudget = 1; // 重複使用時は上書き（加算しない）
        addLog(`📱 ${p.name}「デマ拡散」→ ${def.name}の次ターン予算−1`, 'sys');
        G._nextTurnEvents[defIdx].push({ type: 'rumor_debt' });
      }
    }

    function destroyPollutionShield(key) {
      const pp = G.pendingPollution; if (!pp) return;
      const atkIdx = pp.attackerIdx; const defIdx = atkIdx === 0 ? 1 : 0; const def = G.players[defIdx];
      const shieldNames = { shieldQuakeFire: '耐震シールド', shieldFlood: '堤防シールド', negateSpecial: '特殊効果無効', damageReduceHits: '防災庁設置' };
      let broken = false;
      if (key === 'damageReduceHits') {
        if (def.effects.damageReduceHits > 0) { def.effects.damageReduceHits = 0; broken = true; }
        addLog(`☣️ 公害：${def.name}の防災庁設置を完全に破壊（残り全回分を無効化）`, 'sys');
      } else if (def.effects[key]) {
        def.effects[key] = false; broken = true;
        addLog(`☣️ 公害：${def.name}のシールドを1つ破壊`, 'sys');
      }
      if (broken && shieldNames[key]) G._nextTurnEvents[defIdx].push({ type: 'pollution_broken', shieldName: shieldNames[key] });
      G.pendingPollution = null; G.screen = 'main';
      if (!handleDiscardIfNeeded(atkIdx, 'main')) goMain();
    }

    // ═══════════════════════════════════════
    // TURN MANAGEMENT (online: handoverなし)
    // ═══════════════════════════════════════
    function setupTurnDraw(pi) {
      const p = G.players[pi]; p.budgetUsed = 0; p.effects.disastersReceivedThisTurn = 0;
      const target = Math.min(2, Math.max(0, 5 - p.hand.length));
      const isMyTurn = (pi === myPlayerIdx);
      setTimeout(() => showTurnSplash(isMyTurn), 50);
      if (target === 0) { addLog(`─── ${p.name}のターン開始（予算${getBudget(pi)}・手札満杯のためドローなし）`, 'sys'); G.screen = 'main'; }
      else { G.turnDrawState = { pi, drawn: 0, target, revealed: null }; G.screen = 'turnDraw'; }
    }

    function endTurn() {
      const p = G.players[G.activePlayer]; const city = getActiveCity(G.activePlayer);
      if (city && city.abilityType === 'regen') { const mxHp = city.hp; const fh = p.cityHps[p.activeCityIdx]; p.cityHps[p.activeCityIdx] = Math.min(p.cityHps[p.activeCityIdx] + city.abilityValue, mxHp); if (p.cityHps[p.activeCityIdx] !== fh) queueHpAnim(G.activePlayer, fh, p.cityHps[p.activeCityIdx]); addLog(`💚 ${city.name}の回復能力 +${city.abilityValue}（HP:${p.cityHps[p.activeCityIdx]}）`, 'heal'); const opp = G.activePlayer === 0 ? 1 : 0; G._nextTurnEvents[opp].push({ type: 'opp_regen', cityIcon: terrainImg(city, 18), cityName: city.name, amount: city.abilityValue, hpBefore: fh, hpAfter: p.cityHps[p.activeCityIdx] }); }
      if (city && city.abilityType === 'quake_regen' && p.effects.quakeHitThisTurn) { const fh = p.cityHps[p.activeCityIdx]; p.cityHps[p.activeCityIdx] = Math.min(p.cityHps[p.activeCityIdx] + city.abilityValue, city.hp); if (p.cityHps[p.activeCityIdx] !== fh) queueHpAnim(G.activePlayer, fh, p.cityHps[p.activeCityIdx]); addLog(`💚 ${city.name}の能力（地震後回復）+${city.abilityValue}`, 'heal'); const opp = G.activePlayer === 0 ? 1 : 0; G._nextTurnEvents[opp].push({ type: 'opp_regen', cityIcon: terrainImg(city, 18), cityName: city.name, amount: city.abilityValue, hpBefore: fh, hpAfter: p.cityHps[p.activeCityIdx] }); }
      p.effects.quakeHitThisTurn = false;
      if (p.effects.floodBonusTurns > 0) p.effects.floodBonusTurns--;
      p.effects.terrorNextDisaster = false;
      if (p.effects.debtBudget > 0) p.effects.debtBudget--;
      G.turnsEach[G.activePlayer]++; const next = G.activePlayer === 0 ? 1 : 0; G.activePlayer = next;
      const evts = G._nextTurnEvents[next];
      if (evts.length > 0) { G._atkSummaryConfirmed = false; G._turnSummary = [...evts]; G._nextTurnEvents[next] = []; G.screen = 'turnSummary'; }
      else setupTurnDraw(next);
      pushState(); render();
    }

    // ═══════════════════════════════════════
    // GACHA / DRAFT
    // ═══════════════════════════════════════
    function pullGacha() {
      const gc = G.gachaCurrent;
      if (_gachaAnimState) return;
      const rem = CITIES.filter(c => !G.gachaPickedIds.includes(c.id));
      if (isCpuMode && gc.playerIdx === 0 && cpuDifficulty !== 'hard') {
        const n = cpuDifficulty === 'easy' ? 3 : 2;
        gc.candidates = shuffle([...rem]).slice(0, Math.min(n, rem.length));
        gc.revealed = null;
        pushState(); render();
      } else {
        // Random mode (online or CPU HARD): animated reveal
        const city = rem[Math.random() * rem.length | 0];
        _startCityReveal(city);
      }
    }

    function acceptGachaCandidate(cityId) {
      const gc = G.gachaCurrent;
      const chosen = gc.candidates.find(c => c.id === cityId);
      if (!chosen) return;
      gc.revealed = chosen; gc.candidates = null;
      acceptGachaCity();
    }

    function acceptGachaCity() {
      const gc = G.gachaCurrent; const city = gc.revealed; const p = G.players[gc.playerIdx];
      p.cities.push(city); p.cityHps.push(city.hp); G.gachaPickedIds.push(city.id);
      if (gc.pickNum === 0) { gc.pickNum = 1; gc.revealed = null; pushState(); render(); }
      else { G.screen = 'cityOrder'; G.cityOrderState = { playerIdx: gc.playerIdx }; pushState(); render(); }
    }

    function selectCityOrder(playerIdx, firstIdx) {
      const p = G.players[playerIdx];
      if (firstIdx === 1) { [p.cities[0], p.cities[1]] = [p.cities[1], p.cities[0]]; [p.cityHps[0], p.cityHps[1]] = [p.cityHps[1], p.cityHps[0]]; }
      if (playerIdx === 0) { G.gachaCurrent = { playerIdx: 1, pickNum: 0, revealed: null }; G.screen = 'gacha'; }
      else { G.deck = createDeck(); G.discard = []; G.log = []; G.turnsEach = [0, 0]; G.activePlayer = 0; G.players.forEach(p => { p.hand = []; p.budgetUsed = 0; p.effects = mkEffects(); }); startDraft(0); }
      pushState(); render();
    }

    function renderCityOrderSelect() {
      const pi = G.cityOrderState?.playerIdx ?? 0; const p = G.players[pi];
      const c0 = p.cities[0], c1 = p.cities[1];
      function cityCard(c, idx) {
        return `<div class="gacha-card-box" onclick="selectCityOrder(${pi},${idx})" style="cursor:pointer;width:200px;transition:.2s;flex-shrink:0;border:2px solid var(--blue);box-shadow:0 0 20px rgba(56,139,253,.25);scroll-snap-align:center" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform=''">
        <img class="cityorder-city-img" src="images/cities/${c.id}.webp" alt="" onerror="this.style.display='none'">
        <div style="height:40px;display:flex;align-items:center;justify-content:center">${terrainImg(c, 40)}</div>
        <div style="font-weight:700;font-size:1rem;margin:6px 0">${c.name}</div>
        <div class="terrain-badge">(${c.isCoastal ? '海岸' : c.isMountain ? '山間部' : '内陸'})</div>
        <div style="font-size:.8rem;color:var(--t2);margin-top:6px">HP ${c.hp}</div>
        <div style="font-size:.75rem;color:var(--t2);margin-top:4px;line-height:1.4">${c.abilityDesc}</div>
        <div style="margin-top:10px;padding:6px;background:rgba(56,139,253,.15);border-radius:6px;color:var(--blue);font-size:.8rem;font-weight:600">先攻に選ぶ</div>
      </div>`;
      }
      return `<div class="screen active"><div class="gacha-stage">
      <div style="text-align:center;margin-bottom:12px"><div class="section-title">🏙️ 戦闘順の選択</div><div style="color:var(--t2);font-size:.85rem;margin-top:4px">${p.name} — どちらの都市を先に戦わせますか？</div></div>
      <div style="display:flex;gap:16px;justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 16px 8px;width:100%;box-sizing:border-box;scroll-snap-type:x mandatory">${cityCard(c0, 0)}${cityCard(c1, 1)}</div>
      <div style="color:var(--t3);font-size:.75rem;margin-top:12px;text-align:center">先に選んだ都市が最初に戦います。壊滅後に残りの都市が登場します。</div>
    </div></div>`;
    }

    function startDraft(pi) {
      const ds = { playerIdx: pi, picksDone: 0, picksTarget: 4, revealed: null, dealtCards: [], flippedUids: [], lastFlippedUid: null, animState: 'idle', revealingCard: null };
      // 初期手札（4枚）：自然災害1（確定）＋ フレックス1（自然 or 人為）＋ 政策2（色・即時/シールド不問）
      //   フレックス枠は JINZAI_DRAFT_RATE の確率で人為災害、それ以外は自然災害になる。
      //   事前判定でフレックスの種別を確定させるため、人為災害の出現率はデッキ枚数比に依存せず常に一定。
      const JINZAI_DRAFT_RATE = 0.50; // フレックス枠で人為災害になる確率（自然50%・人為50%。調整はこの値のみ）
      let needP = 2, needD, needJinzai;
      if (Math.random() < JINZAI_DRAFT_RATE) { needD = 1; needJinzai = 1; } // フレックス＝人為
      else { needD = 2; needJinzai = 0; }                                   // フレックス＝自然
      for (let i = 0; i < 4; i++) {
        const hasPactDealt = ds.dealtCards.some(c => c.id === 'pact');
        const allow = (c) => {
          if (hasPactDealt && c.id === 'pact') return false;
          if (c.type === 'policy') return needP > 0;
          if (c.type === 'disaster') return needD > 0;
          if (c.type === 'jinzai') return needJinzai > 0;
          return false;
        };
        let pool = G.deck.filter(allow);
        if (!pool.length) {
          if (!G.discard.length) break;
          G.deck = shuffle([...G.discard, ...G.deck]); G.discard = [];
          i--; continue;
        }
        const card = pool[Math.random() * pool.length | 0];
        G.deck.splice(G.deck.indexOf(card), 1);
        ds.dealtCards.push(card);
        if (card.type === 'policy') needP--;
        else if (card.type === 'disaster') needD--;
        else if (card.type === 'jinzai') needJinzai--;
      }
      G.draftState = ds; G.screen = 'draft';
    }

    function flipDraftCard(uid) {
      const ds = G.draftState;
      if (!ds || !ds.dealtCards || ds.flippedUids.includes(uid) || _draftAnimBusy) return;
      const card = ds.dealtCards.find(c => c.uid === uid);
      if (!card) return;
      _draftAnimBusy = true;

      // Phase 1: Spin-out
      const cardEl = document.querySelector(`[data-draft-uid="${uid}"]`);
      if (cardEl) {
        cardEl.style.pointerEvents = 'none';
        cardEl.classList.add('spinning-out');
        const hintEl = cardEl.querySelector('.draft-tap-hint-overlay');
        if (hintEl) hintEl.style.display = 'none';
      }

      // Phase 2a: neon icon
      setTimeout(() => {
        ds.flippedUids.push(uid);
        ds.animState = 'revealing_neon';
        ds.revealingCard = card;
        render();
      }, 360);

      // Phase 2b: card slides in from left
      setTimeout(() => {
        ds.animState = 'revealing_card';
        render();
      }, 360 + 600);

      // Phase 2c: card settled at center
      setTimeout(() => {
        if (ds.animState !== 'revealing_card') return;
        if (ds.bulkMode) {
          setTimeout(() => _exitDraftCard(), 680); // longer pause so card is visible at center
        } else {
          ds.animState = 'card_paused';
          render();
        }
      }, 360 + 600 + 300); // 300ms ≈ entry animation (.28s) + buffer
    }

    // 右矢印ボタン押下（1枚ずつモード）
    function advanceDraftCard() {
      const ds = G.draftState;
      if (!ds || ds.animState !== 'card_paused') return;
      _exitDraftCard();
    }

    // カードを右へ流して消す（手動・一括共通）
    function _exitDraftCard() {
      const ds = G.draftState;
      if (!ds || !ds.revealingCard) return;
      const exitedUid = ds.revealingCard.uid;
      ds.animState = 'card_exiting';
      render();

      setTimeout(() => {

        const deletes = [];
        for (const [id, room] of Object.entries(rooms)) {
          const lastActive = room.lastActiveAt || room.createdAt || 0;

        }
        await Promise.all(deletes);

    }

      const _svgQR = `<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M5 5h3v3H5zm11 0h3v3h-3zM5 16h3v3H5z" fill="currentColor" stroke="none"/><path d="M14 14h2v2h-2zm4 0h2v2h-2zm-4 4h2v2h-2zm4 0h2v2h-2z" fill="currentColor" stroke="none"/></svg>`;
      ov.innerHTML = `<div class="disconnect-box">

        <div class="disconnect-title">接続が切れました</div>

        <div class="room-code-display" onclick="copyRoomCode()" style="width:100%;cursor:pointer">
          <div class="room-code-label">ルームコード（タップでコピー）</div>
          <div class="room-code-value">${roomId}</div>
        </div>
        <button class="copy-url-btn" onclick="copyRoomUrl()">${_svgLinkD}招待URLをコピー</button>
        <button class="copy-url-btn" id="disconnect-qr-btn" onclick="toggleDisconnectQR()">${_svgQR}QRコードを表示</button>
        <div id="disconnect-qr-wrap" style="display:none;flex-direction:column;align-items:center;gap:6px;width:100%">
          <div id="disconnect-qr-container" style="background:#0d1117;padding:8px;border-radius:10px;display:inline-block"></div>
          <span style="font-size:.72rem;color:var(--t2)">相手にスキャンしてもらう</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="pulse-dot" style="background:var(--yellow);min-width:12px"></span>
          <span style="font-size:.82rem;color:var(--yellow)">待機中</span>
        </div>
        <button style="width:100%;padding:12px;border-radius:40px;border:2px solid var(--bg3);background:transparent;color:var(--t2);font-size:.88rem;font-weight:700;cursor:pointer;font-family:'Roboto Condensed',sans-serif;letter-spacing:.06em;transition:.2s" onclick="restartGame()">ロビーに戻る</button>
      </div>`;
      document.body.appendChild(ov);
    }
    function hideDisconnectOverlay() {
      const ov = document.getElementById('disconnect-overlay'); if (ov) ov.remove();
    }

    function toggleDisconnectQR() {
      const wrap = document.getElementById('disconnect-qr-wrap');
      const btn = document.getElementById('disconnect-qr-btn');
      if (!wrap) return;
      const show = wrap.style.display === 'none';
      wrap.style.display = show ? 'flex' : 'none';
      const _svgQR = `<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M5 5h3v3H5zm11 0h3v3h-3zM5 16h3v3H5z" fill="currentColor" stroke="none"/><path d="M14 14h2v2h-2zm4 0h2v2h-2zm-4 4h2v2h-2zm4 0h2v2h-2z" fill="currentColor" stroke="none"/></svg>`;
      const _svgX = `<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
      btn.innerHTML = show ? `${_svgX}QRを閉じる` : `${_svgQR}QRコードを表示`;
      if (show) {
        const el = document.getElementById('disconnect-qr-container');
        if (!el || el.dataset.generated) return;
        el.dataset.generated = 'true';
        const url = window.location.href.split('?')[0] + '?room=' + roomId;
        try { new QRCode(el, { text: url, width: 150, height: 150, colorDark: '#e6edf3', colorLight: '#0d1117' }); }
        catch (e) { el.innerHTML = `<div style="color:var(--t3);font-size:.75rem;padding:8px">QR生成失敗</div>`; }
      }
    }

    function showReconnectPopup() {
      const old = document.getElementById('reconnect-popup'); if (old) old.remove();
      const pop = document.createElement('div'); pop.id = 'reconnect-popup'; pop.className = 'reconnect-popup';
      const _checkSvg = `<svg style="width:52px;height:52px;color:var(--green)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
      pop.innerHTML = `<div class="reconnect-box">${_checkSvg}<div class="reconnect-title">再接続しました</div></div>`;
      document.body.appendChild(pop);
      setTimeout(() => { if (pop.parentNode) pop.remove(); }, 3200);
    }

    // ─── Firebase Presence（切断検知・自動ルーム削除） ───
    function setupPresence() {
      if (!db || !roomId || myRole === 'spectator') return;
      const myKey = myRole;
      const oppKey = myRole === 'p1' ? 'p2' : 'p1';
      const myPresRef = db.ref(`rooms/${roomId}/presence/${myKey}`);

      _presenceConnRef = db.ref('.info/connected');
      _presenceConnRef.on('value', snap => {
        if (!snap.val()) return;
        myPresRef.set(true);
        myPresRef.onDisconnect().set(false);
      });

      // ネットワーク復帰・iOSバックグラウンド復帰のどちらでもプレゼンスを再登録
      _onlineHandler = () => {
        if (db && roomId) { myPresRef.set(true); myPresRef.onDisconnect().set(false); }
      };
      window.addEventListener('online', _onlineHandler);

      _visibilityHandler = () => {
        if (document.visibilityState === 'visible' && db && roomId) {
          myPresRef.set(true);
          myPresRef.onDisconnect().set(false);
        }
      };
      document.addEventListener('visibilitychange', _visibilityHandler);

      _presenceOppRef = db.ref(`rooms/${roomId}/presence/${oppKey}`);
      _presenceOppRef.on('value', snap => {
        const connected = snap.val();
        const inGame = ['gacha','cityOrder','draft','turnDraw','turnSummary','main','response','discard','peek'].includes(G.screen);
        if (connected === false && inGame) {
          showDisconnectOverlay();
        } else if (connected === true) {
          const wasDisconnected = !!document.getElementById('disconnect-overlay');
          hideDisconnectOverlay();
          if (wasDisconnected) showReconnectPopup();
        }
      });
      listenSpectatorCount();
    }

    function listenSpectatorCount() {
      if (!db || !roomId || myRole === 'spectator') return;
      _spectatorCountRef = db.ref(`rooms/${roomId}/spectators`);
      _spectatorCountRef.on('value', snap => {
        const v = snap.val();
        _spectatorCount = v ? Object.keys(v).length : 0;
        render();
      });
    }

    function cleanupPresence() {
      if (_presenceConnRef) { _presenceConnRef.off(); _presenceConnRef = null; }
      if (_presenceOppRef) { _presenceOppRef.off(); _presenceOppRef = null; }
      if (_onlineHandler) { window.removeEventListener('online', _onlineHandler); _onlineHandler = null; }
      if (_visibilityHandler) { document.removeEventListener('visibilitychange', _visibilityHandler); _visibilityHandler = null; }
      if (_spectatorCountRef) { _spectatorCountRef.off(); _spectatorCountRef = null; _spectatorCount = 0; }
      if (_specPresRef) { try { _specPresRef.remove(); } catch(e) {} _specPresRef = null; }
      hideDisconnectOverlay();
    }

    function pushState() {
      if (isCpuMode) return;
      if (!db || !roomId || myRole === 'spectator') return;
      const s = JSON.stringify({ ...G, confirm: null }); myLastPush = s;
      db.ref(`rooms/${roomId}/state`).set(s);
      db.ref(`rooms/${roomId}/lastActiveAt`).set(Date.now());
    }

    function listenToState() {
      let _prevActivePlayer = null; let _prevGScreen = null;
      db.ref(`rooms/${roomId}/state`).on('value', snap => {
        const data = snap.val(); if (!data || data === myLastPush) return;
        const prevScreen = G.screen;
        // 観戦者: 手札フリップ検出 & ターンサマリー解除時HPアニメキュー
        if (myRole === 'spectator') {
          const prevUids = [0, 1].map(pi => new Set((G.players[pi].hand || []).map(c => c.uid)));
          const next = JSON.parse(data);
          for (let pi = 0; pi < 2; pi++) {
            const newCard = (next.players[pi].hand || []).find(c => !prevUids[pi].has(c.uid));
            if (newCard) { _lastDrawnCardUid = newCard.uid; break; }
          }
          // ターンサマリーが解除されたタイミングでHPアニメをキュー（Gが上書きされる前に取得）
          if (prevScreen === 'turnSummary' && (next.screen === 'main' || next.screen === 'turnDraw') && G._turnSummary) {
            const _ap = G.activePlayer;
            const _evts = G._turnSummary;
            const _hasSwitch = _evts.some(ev => ev.type === 'city_switch');
            if (!_hasSwitch) {
              for (const ev of _evts) {
                if (ev.type === 'damage' && ev.hpBefore != null && ev.hpAfter != null && ev.hpBefore !== ev.hpAfter) {
                  _pendingMainHpAnims.push({ pi: _ap, fh: ev.hpBefore, th: ev.hpAfter, delay: 80 });
                }
              }
            } else {
              _pendingCityEnterAnim = true;
              const _np = next.players[_ap]; const _nh = _np.cityHps[_np.activeCityIdx];
              if (_nh > 0) { _cityEnterAnimPi = _ap; _pendingMainHpAnims.push({ pi: _ap, fh: 0, th: _nh, delay: 480 }); }
            }
          }
        }
        G = { ...JSON.parse(data), confirm: null };
        const newAp = G.activePlayer; const newScreen = G.screen;
        // メインフェーズ ターン切り替え
        if (myRole !== 'spectator' && _prevActivePlayer !== null && _prevActivePlayer !== newAp && (newScreen === 'main' || newScreen === 'turnDraw') && prevScreen !== 'turnSummary') {
          setTimeout(() => showTurnSplash(newAp === myPlayerIdx, false), 80);
        }
        // 対応フェーズ開始（ディフェンダー側デバイスでの検知）
        if (myRole !== 'spectator' && _prevGScreen !== 'response' && newScreen === 'response' && G.pendingAttack?.defenderIdx === myPlayerIdx) {
          setTimeout(() => showTurnSplash(true, true), 120);
        }
        _prevActivePlayer = newAp; _prevGScreen = newScreen;
        render(); processHpAnims();
      });
    }

    async function createRoom() {
      const name = lobbyState.nameInput.trim();
      if (!name) { lobbyState.error = '名前を入力してください'; render(); return; }
      myRole = 'p1'; myPlayerIdx = 0; roomId = generateRoomCode(); G.players[0].name = name;
      history.replaceState(null, '', '?room=' + roomId);
      localStorage.setItem('ron_lastRoom', roomId); localStorage.setItem('ron_lastName', name); localStorage.setItem('ron_lastRole', 'p1');
      try {
        await db.ref(`rooms/${roomId}`).set({ p1Name: name, p2Name: '', p2Joined: false, state: null, createdAt: Date.now() });
        db.ref(`rooms/${roomId}/p2Joined`).on('value', snap => {
          if (snap.val() === true) {
            db.ref(`rooms/${roomId}/p2Joined`).off();
            db.ref(`rooms/${roomId}/p2Name`).get().then(s2 => {
              G.players[1].name = s2.val() || 'プレイヤー2';
              listenToState();
              setupPresence();
              G.gachaPickedIds = []; G.gachaCurrent = { playerIdx: 0, pickNum: 0, revealed: null }; G.screen = 'gacha';
              pushState(); render();
            });
          }
        });
        G.screen = 'waiting_connection'; render();
      } catch (e) { lobbyState.error = 'ルーム作成に失敗: ' + e.message; render(); }
    }

    async function joinRoom({ silent = false } = {}) {
      const name = lobbyState.nameInput.trim(); const code = lobbyState.joinCodeInput.trim().toUpperCase();
      if (!name) { lobbyState.error = '名前を入力してください'; render(); return; }
      if (code.length !== 6) { lobbyState.error = 'ルームコードは6文字です'; render(); return; }
      try {
        const snap = await db.ref(`rooms/${code}`).get();
        if (!snap.val()) {
          if (silent) { lobbyState.mode = 'select'; lobbyState.joinCodeInput = ''; render(); return; }
          lobbyState.error = 'ルームが見つかりません'; render(); return;
        }
        const roomData = snap.val();

        const savedRole = localStorage.getItem('ron_lastRole');
        const savedRoom = localStorage.getItem('ron_lastRoom');

        // ── p1 再接続: ローカルのロール記録 + Firebase の p1Name が一致 ──
        const isP1Rejoin = savedRole === 'p1' && savedRoom === code && roomData.p1Name === name;
        if (isP1Rejoin) {
          myRole = 'p1'; myPlayerIdx = 0; roomId = code; G.players[0].name = name;
          history.replaceState(null, '', '?room=' + code);
          localStorage.setItem('ron_lastRoom', code); localStorage.setItem('ron_lastName', name); localStorage.setItem('ron_lastRole', 'p1');
          if (roomData.p2Joined) {
            // ゲーム進行中 → Firebase の現在状態をそのまま読み込んで復帰
            G.players[1].name = roomData.p2Name || 'プレイヤー2';
            listenToState(); setupPresence();
          } else {
            // p2未参加 → 待機画面に戻り p2Joined を監視
            db.ref(`rooms/${code}/p2Joined`).on('value', snap => {
              if (snap.val() === true) {
                db.ref(`rooms/${code}/p2Joined`).off();
                db.ref(`rooms/${code}/p2Name`).get().then(s2 => {
                  G.players[1].name = s2.val() || 'プレイヤー2';
                  listenToState(); setupPresence();
                  G.gachaPickedIds = []; G.gachaCurrent = { playerIdx: 0, pickNum: 0, revealed: null }; G.screen = 'gacha';
                  pushState(); render();
                });
              }
            });
            G.screen = 'waiting_connection'; render();
          }
          return;
        }

        // ── p2 再接続: Firebase の p2Name と名前が一致 ──
        const isP2Rejoin = roomData.p2Joined && roomData.p2Name === name;
        if (isP2Rejoin) {
          myRole = 'p2'; myPlayerIdx = 1; roomId = code; G.players[1].name = name;
          G.players[0].name = roomData.p1Name || 'プレイヤー1';
          history.replaceState(null, '', '?room=' + code);
          localStorage.setItem('ron_lastRoom', code); localStorage.setItem('ron_lastName', name); localStorage.setItem('ron_lastRole', 'p2');
          listenToState(); setupPresence();
          return;
        }

        // ── 満員 → 観戦オファー ──
        if (roomData.p2Joined) { lobbyState.spectateCode = code; lobbyState.error = ''; render(); return; }

        // ── 新規 p2 参加 ──
        myRole = 'p2'; myPlayerIdx = 1; roomId = code; G.players[1].name = name;
        G.players[0].name = roomData.p1Name || 'プレイヤー1';
        history.replaceState(null, '', '?room=' + code);
        localStorage.setItem('ron_lastRoom', code); localStorage.setItem('ron_lastName', name); localStorage.setItem('ron_lastRole', 'p2');
        await db.ref(`rooms/${roomId}/p2Name`).set(name);
        await db.ref(`rooms/${roomId}/p2Joined`).set(true);
        listenToState(); setupPresence();
        G.screen = 'waiting_connection'; render();
      } catch (e) { lobbyState.error = '参加に失敗: ' + e.message; render(); }
    }

    function generateQR() {
      const el = document.getElementById('qr-container'); if (!el || el.dataset.generated) return; el.dataset.generated = 'true';
      const base = window.location.href.split('?')[0];
      const url = `${base}?room=${roomId}`;
      try { new QRCode(el, { text: url, width: 150, height: 150, colorDark: '#e6edf3', colorLight: '#0d1117' }); }
      catch (e) { el.innerHTML = `<div style="color:var(--t3);font-size:.75rem;padding:8px">QR生成失敗</div>`; }
    }

    async function enterSpectator(code) {
      roomId = code; myRole = 'spectator'; myPlayerIdx = 0;
      history.replaceState(null, '', '?room=' + code);
      try {
        const snap = await db.ref(`rooms/${code}/state`).get();
        if (snap.val()) { const parsed = JSON.parse(snap.val()); G = { ...G, ...parsed }; }
      } catch (e) {}
      // 観戦者 presence 登録（onDisconnect で自動削除）
      if (db) {
        const _sUid = '_s' + Math.random().toString(36).slice(2, 8);
        _specPresRef = db.ref(`rooms/${code}/spectators/${_sUid}`);
        _specPresRef.set(true).catch(() => {});
        _specPresRef.onDisconnect().remove();
      }
      listenToState();
      render();
    }

    // ═══════════════════════════════════════
    // VIEW DISPATCH
    // ═══════════════════════════════════════
    function myView() {
      if (_specPv) return 'spectator';
      if (!isFirebaseConfigured()) return 'setup_required';
      if (myRole === 'spectator') return 'spectator';
      if (G.screen === 'lobby' || G.screen === 'waiting_connection' || G.screen === 'tutorial') return G.screen;
      const mi = myPlayerIdx;
      switch (G.screen) {
        case 'cityOrder': return G.cityOrderState?.playerIdx === mi ? 'cityOrder' : 'waiting';
        case 'gacha': return G.gachaCurrent?.playerIdx === mi ? 'gacha' : 'waiting';
        case 'draft': return G.draftState?.playerIdx === mi ? 'draft' : 'waiting';
        case 'turnDraw': { const pi = G.turnDrawState?.pi ?? G.turnDrawState?.playerIdx; return pi === mi ? 'turnDraw' : 'waiting'; }
        case 'turnSummary':
          if (G.activePlayer === mi) return 'turnSummary';
          return G._atkSummaryConfirmed ? 'waiting' : 'attackerSummary';
        case 'main':
          if (G.pendingAttack) { if (G.pendingAttack.attackerIdx === mi) return 'main'; if (G.pendingAttack.defenderIdx === mi) return 'waiting_response'; }
          return G.activePlayer === mi ? 'main' : 'waiting';
        case 'response': return G.pendingAttack?.defenderIdx === mi ? 'response' : 'waiting';
        case 'discard': { const pi = G.discardNeeded?.pi ?? G.discardNeeded?.playerIdx; return pi === mi ? 'discard' : 'waiting'; }
        case 'peek': return (G.peekByPlayerIdx ?? G.activePlayer) === mi ? 'peek' : 'waiting';
        case 'pollution': return (G.pendingPollution?.attackerIdx ?? G.activePlayer) === mi ? 'pollution' : 'waiting';
        case 'gameover': return 'gameover';
        default: return 'waiting';
      }
    }

    // ═══════════════════════════════════════
    // MAIN TUTORIAL SPOTLIGHT
    // ═══════════════════════════════════════
    function showMainTutorial() {
      if (_mainTutorialShown) return;
      _mainTutorialShown = true;
      const btn = document.querySelector('.player-zone .city-tap-btn');
      const badge = document.querySelector('.player-zone .terrain-badge');
      const budget = document.querySelector('.budget-display');
      if (!btn) return;
      const vw = window.innerWidth, vh = window.innerHeight;
      const PAD = 8;
      function elR(el) {
        const r = el.getBoundingClientRect();
        return { x: r.left-PAD, y: r.top-PAD, w: r.width+PAD*2, h: r.height+PAD*2, cx: r.left+r.width/2, cy: r.top+r.height/2 };
      }
      const b1 = elR(btn);
      const b2 = badge ? elR(badge) : null;
      const b3 = budget ? elR(budget) : null;
      const ITEMS = [
        { b: b1, num: '①', color: '#388bfd', rx: '8', sw: '2.5', title: '都市名をタップ', desc: '地形・都市の特殊能力を確認できます' },
        b2 ? { b: b2, num: '②', color: '#d29922', rx: '6', sw: '2', title: '地形属性', desc: '特定の災害で追加ダメージが発生' } : null,
        b3 ? { b: b3, num: '③', color: '#3fb950', rx: '8', sw: '2', title: '予算', desc: '1ターンの使用上限。カードのコスト分を消費' } : null
      ].filter(Boolean);
      const bw = Math.min(152, Math.floor(vw * 0.38));
      const lx = vw - bw - 8;
      const maskHoles = ITEMS.map(c => `<rect x="${c.b.x}" y="${c.b.y}" width="${c.b.w}" height="${c.b.h}" rx="${c.rx}" fill="black"/>`).join('');
      const hilights  = ITEMS.map(c => `<rect x="${c.b.x}" y="${c.b.y}" width="${c.b.w}" height="${c.b.h}" rx="${c.rx}" fill="none" stroke="${c.color}" stroke-width="${c.sw}"><animate attributeName="stroke-opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/></rect>`).join('');
      const boxes = ITEMS.map((c, i) =>
        `<div class="mto-box-outer" id="mto-box${i}" style="position:absolute;left:${lx}px;top:-999px;width:${bw}px;overflow:hidden;border-radius:6px;z-index:1">` +
        `<div class="mto-mask-inner" style="position:absolute;inset:0;background:#0d1117;z-index:2"></div>` +
        `<div class="mto-box-content" style="background:rgba(22,27,34,0.96);border:1.5px solid ${c.color};border-radius:6px;padding:8px 10px;font-size:.76rem;color:#e6edf3;line-height:1.5;pointer-events:auto;opacity:0;transform:scale(1.06)" onclick="event.stopPropagation()">` +
        `<div style="font-weight:700;color:${c.color};margin-bottom:3px">${c.num} ${c.title}</div>` +
        `<div>${c.desc}</div>` +
        `</div></div>`
      ).join('');
      const overlay = document.createElement('div');
      overlay.id = 'main-tutorial-overlay';
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9500;cursor:pointer';
      overlay.innerHTML =
        `<svg id="mto-svg" style="position:absolute;top:0;left:0;pointer-events:none" width="${vw}" height="${vh}" xmlns="http://www.w3.org/2000/svg"><defs><mask id="mto-mask"><rect width="${vw}" height="${vh}" fill="white"/>${maskHoles}</mask></defs><rect width="${vw}" height="${vh}" fill="rgba(0,0,0,0.78)" mask="url(#mto-mask)"/>${hilights}</svg>` +
        boxes +

    function showStepSpotlight(step) {
      if (_tutStepSpotlights.has(step)) return;
      _tutStepSpotlights.add(step);
      const CFG = {
        3: { sel: '.player-zone .card.tut-glow',  title: '緑カードをタップ',        body: '光っているカードをタップして設置しましょう',           color: '#3fb950' },
        4: { sel: '.player-zone .card.tut-glow',  title: '黄カードをタップ',        body: '光っているカードをタップして即時回復！',             color: '#d29922' },
        5: { sel: '.btn-end.tut-glow',            title: 'ターン終了をタップ',      body: '光っているボタンを押して相手にターンを渡しましょう', color: '#388bfd' },
        6: { sel: '.tut-action-btn',              title: '対応フェーズへ',          body: '右のボタンをタップして対応フェーズへ進みましょう',   color: '#f85149' },

        8: { sel: '.player-zone .card.tut-glow',  title: '黄カードをタップ',        body: '光っているカードで洪水ダメージを相殺！',             color: '#d29922' }
      };
      const cfg = CFG[step]; if (!cfg) return;
      const el = document.querySelector(cfg.sel); if (!el) return;
      const PAD = 10;
      const r = el.getBoundingClientRect();
      const b = { x: r.left-PAD, y: r.top-PAD, w: r.width+PAD*2, h: r.height+PAD*2, cx: r.left+r.width/2, cy: r.top+r.height/2 };
      const vw = window.innerWidth, vh = window.innerHeight;
      const cw = Math.min(220, vw-40);
      const cx = Math.round((vw-cw)/2);
      const above = b.cy > vh*0.5;
      const cy = above ? Math.max(16, Math.round(b.y - 110)) : Math.round(b.y + b.h + 20);
      const overlay = document.createElement('div');
      overlay.id = 'step-spotlight-overlay';
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9500;cursor:pointer';
      overlay.innerHTML =
        `<svg style="position:absolute;top:0;left:0;pointer-events:none" width="${vw}" height="${vh}" xmlns="http://www.w3.org/2000/svg"><defs><mask id="ss-mask"><rect width="${vw}" height="${vh}" fill="white"/><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="8" fill="black"/></mask></defs><rect width="${vw}" height="${vh}" fill="rgba(0,0,0,0.72)" mask="url(#ss-mask)"/><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="8" fill="none" stroke="${cfg.color}" stroke-width="2.5"><animate attributeName="stroke-opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="2.5;4.5;2.5" dur="1.2s" repeatCount="indefinite"/></rect><line id="ss-line" x1="${cx+cw/2}" y1="${above?cy+80:cy}" x2="${b.cx}" y2="${above?b.y:b.y+b.h}" stroke="${cfg.color}" stroke-width="1"/></svg>` +
        `<div id="ss-callout" style="position:absolute;left:${cx}px;top:${cy}px;width:${cw}px;background:rgba(22,27,34,0.96);border:2px solid ${cfg.color};border-radius:12px;padding:10px 14px;font-size:.8rem;color:#e6edf3;line-height:1.55;pointer-events:auto" onclick="event.stopPropagation()"><button onclick="event.stopPropagation();document.getElementById('step-spotlight-overlay').remove();document.body.style.overflow=''" style="position:absolute;top:6px;right:8px;background:none;border:none;color:#ffffff;font-size:1rem;cursor:pointer;padding:2px 4px;line-height:1">×</button><div style="font-weight:700;color:${cfg.color};margin-bottom:5px;padding-right:20px">${cfg.title}</div><div>${cfg.body}</div></div>`;
      overlay.onclick = () => { overlay.remove(); document.body.style.overflow = ''; };
      document.body.style.overflow = 'hidden';
      document.body.appendChild(overlay);
      requestAnimationFrame(() => {
        const callout = document.getElementById('ss-callout');
        const line = document.getElementById('ss-line');
        if (callout && line) {
          const cr = callout.getBoundingClientRect();
          line.setAttribute('x1', cr.left + cr.width/2);
          line.setAttribute('y1', above ? cr.bottom : cr.top);
          line.setAttribute('x2', b.cx);
          line.setAttribute('y2', above ? b.y : b.y+b.h);
        }
      });
    }

        case 'lobby': html = renderLobby(); break;
        case 'waiting_connection': html = renderWaitingConnection(); break;

        case 'gacha': html = renderGacha(); break;
        case 'draft': html = renderDraft(); break;
        case 'turnDraw': html = renderTurnDraw(); break;
        case 'turnSummary': html = renderTurnSummary(); break;
        case 'attackerSummary': html = renderAttackerSummary(); break;
        case 'main': html = renderMain(false); break;
        case 'response': html = renderMain(true); break;
        case 'waiting_response': html = renderWaitingResponse(); break;
        case 'discard': html = renderDiscard(); break;
        case 'peek': html = renderPeek(); break;
        case 'pollution': html = renderPollution(); break;

        case 'waiting': html = renderWaiting(); break;

      if (_cityInfoModal !== null && _cityModalViews.includes(view)) html += renderCityInfoModal();
      else if (!_cityModalViews.includes(view)) _cityInfoModal = null;
      if (view !== 'setup_required') html += `<button class="hint-btn" onclick="toggleHint()" title="ヒント">？</button>`;
      if (_hintOpen) html += renderHintOverlay();
      const _invBattleViews = ['main','response','turnSummary','discard','peek','waiting_response','waiting'];
      if (!isCpuMode && roomId && _invBattleViews.includes(view)) {
        const _svgInvBtn = `<svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;

    // ズーム表示中に前後のカードへ移動（表示順・末尾は先頭へ循環）

    // ─── 対応待ち（守備側が攻撃宣言後に相手の選択を待つ） ───
    function renderWaitingResponse() {
      const atk = G.pendingAttack; if (!atk) return renderWaiting();
      const mi = myPlayerIdx, oi = mi === 0 ? 1 : 0;
      const defHasNegate = G.players[atk.defenderIdx].effects.negateSpecial;

      const banner = isCompoundSkip
        ? `<div class="waiting-banner red">⚡ ${G.players[atk.attackerIdx].name}が「${atk.card.icon} ${atk.card.name}」を宣言！複合災害：対応フェーズが強制スキップされます...</div>`
        : `<div class="waiting-banner red">⚔️ ${G.players[atk.attackerIdx].name}が「${atk.card.icon} ${atk.card.name}」を宣言！対応フェーズへ自動移行中...</div>`;
      const notice = isCompoundSkip
        ? `<div class="response-pending-bar"><div class="rpb-icon">⚡</div><div class="rpb-text"><strong>複合災害：対応フェーズ強制スキップ</strong><br>政策カードは使用できません。攻撃の解決をお待ちください。</div></div>`
        : `<div class="response-pending-bar"><div class="rpb-icon">⚔️</div><div class="rpb-text"><strong>${G.players[atk.attackerIdx].name}が「${atk.card.icon} ${atk.card.name}」を使用！</strong><br>対応フェーズへ自動移行中...</div></div>`;
      return `<div class="screen active">
    ${banner}
    ${renderZoneReadOnly(oi, 'opponent')}
    ${notice}
    <div class="log-area">${G.log.slice(0, 4).map(l => `<div class="log-entry ${l.cls}">${l.msg}</div>`).join('')}</div>
    ${renderZoneReadOnly(mi, 'player')}
  </div>`;
    }

    // ─── 読み取り専用ゾーン ───
    function renderZoneReadOnly(idx, position) {
      const p = G.players[idx]; if (!p || !p.cities || p.cities.length === 0) return '';
      const c = getActiveCity(idx); const hp = getActiveCityHp(idx); const mxHp = getActiveMaxHp(idx);
      const isMe = (idx === myPlayerIdx);
      return `<div class="${position}-zone">
    <div class="zone-header"><span class="zone-label">${isMe ? 'あなた' : '相手'}</span><span class="city-icon-sm">${c ? terrainImg(c) : ''}</span><button class="city-tap-btn" onclick="showCityInfo(${idx})">${c ? c.name : '?'} ⓘ</button>${c ? `<span class="terrain-badge">(${c.isCoastal ? '海岸' : c.isMountain ? '山間部' : '内陸'})</span>` : ''}</div>
    <div class="hp-section" id="hp-section-${idx}"><div class="hp-bar-wrap"><div class="hp-bar-ghost" id="hp-ghost-${idx}" style="width:${_cityEnterAnimPi === idx ? 0 : Math.max(0, hp / mxHp * 100)}%"></div><div class="hp-bar-fill${hp <= 10 ? ' hp-warn' : ''}" id="hp-fill-${idx}" style="width:${_cityEnterAnimPi === idx ? 0 : Math.max(0, hp / mxHp * 100)}%;background:${hpColor(hp, mxHp)}"></div></div><div class="hp-text" id="hp-text-${idx}" style="color:${hpColor(hp, mxHp)}">${Math.max(0, hp)}/${mxHp}</div>${hp <= 10 ? '<span class="hp-critical-badge">⚠️ 壊滅寸前</span>' : hp <= 30 ? '<span class="hp-danger-badge">危険</span>' : ''}</div>
    ${renderBackupCity(idx)}
    <div class="effects-row">${renderEffectBadges(p.effects, idx)}</div>
    <div class="hand-cards-area">
      ${isMe ? renderPlayerHandReadOnly(p) : `<div class="hand-back-row">${Array(p.hand.length).fill('<div class="card-back"><img src="images/cards/back.webp" alt="" onerror="this.style.display=\'none\'"></div>').join('')}</div>`}
      <div class="hand-count">手札 ${p.hand.length} 枚</div>
    </div>
  </div>`;
    }

    // ─── ガチャ ───
    function renderGacha() {
      const gc = G.gachaCurrent; const p = G.players[gc.playerIdx];

      // All revealed: show 2 picked cities side by side
      if (_gachaAnimState === 'all_revealed') {
        return `<div class="screen active" style="gap:8px;height:calc(100dvh - 24px);max-height:calc(100dvh - 24px);overflow:hidden">
          <div class="section-title" style="margin-bottom:0">${p.name}｜引いた都市 <span style="font-size:.7rem;font-weight:400;color:var(--t2)">2枚</span></div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center">
            <div class="gacha-city-duo">
              ${(_gachaAllCities||[]).map((c,i) => `<div class="gacha-city-duo-item" style="animation-delay:${i*120}ms"><div class="gacha-city-duo-card"><img src="images/cities/${c.id}.webp" alt="" onerror="this.style.opacity='.3'"></div><div class="gacha-city-duo-label">${c.name}</div></div>`).join('')}
            </div>
          </div>
          <div style="display:flex;justify-content:center;padding:6px 0"><button class="btn-ho draft-confirm-appear" onclick="proceedToCityOrder()" style="padding:13px 44px;font-size:1rem">⚔️ 戦闘順を選ぶ</button></div>
        </div>`;
      }

      // Reveal overlay (neon → slide → pause → exit)
      const overlay = (() => {
        const city = _gachaRevealingCity;
        if (!city) return '';
        if (_gachaAnimState === 'revealing_neon') {
          return `<div class="draft-reveal-overlay"><div class="draft-neon-bg"><img class="draft-neon-icon-pos" id="gcni-0" src="images/icons/neon_city.webp" alt="" style="top:50%;left:50%;transform:translate(-50%,-50%);width:min(55vw,180px);filter:brightness(0.04)"></div></div>`;
        }
        if (_gachaAnimState === 'revealing_card') {
          return `<div class="draft-reveal-overlay"><div class="draft-large-card"><img src="images/cities/${city.id}.webp" alt="" onerror="this.style.opacity='.3'"><div class="draft-large-flash"></div><div class="draft-card-label">${cardTypeIconHtml('city',null,22)}<span>${city.name}</span></div></div></div>`;
        }
        if (_gachaAnimState === 'card_paused') {
          const advBtn = _gachaBulkMode ? '' : `<button class="draft-advance-btn" onclick="advanceGachaCard()">›</button>`;
          return `<div class="draft-reveal-overlay"><div class="draft-large-card" style="animation:none"><img src="images/cities/${city.id}.webp" alt="" onerror="this.style.opacity='.3'"><div class="draft-card-label">${cardTypeIconHtml('city',null,22)}<span>${city.name}</span></div></div>${advBtn}</div>`;
        }
        if (_gachaAnimState === 'card_exiting') {
          return `<div class="draft-reveal-overlay"><div class="draft-large-card exiting"><img src="images/cities/${city.id}.webp" alt="" onerror="this.style.opacity='.3'"><div class="draft-card-label">${cardTypeIconHtml('city',null,22)}<span>${city.name}</span></div></div></div>`;
        }
        return '';
      })();

      let firstPickInfo = '';
      if (gc.pickNum === 1 && p.cities.length > 0) { const fc = p.cities[0]; firstPickInfo = `<div class="gacha-first-pick">✅ 1枚目：${terrainImg(fc, 18)} <strong>${fc.name}</strong>　${fc.abilityDesc}</div>`; }

      const isRandomMode = !isCpuMode || cpuDifficulty === 'hard';
      const pickLabel = gc.pickNum === 0 ? '1枚目' : '2枚目';

      // Random mode (online / CPU HARD) and player's turn: show stacked cards like draft
      if (isRandomMode && gc.playerIdx === myPlayerIdx && !gc.candidates && !gc.revealed) {
        const remaining = 2 - gc.pickNum; // 2 or 1 cards left in stack
        const stackCards = Array.from({ length: remaining }, (_, i) => {
          const isTop = i === 0;
          const offset = i * 6;
          const br = (1 - i * 0.16).toFixed(2);
          return `<div class="draft-stack-card${isTop ? ' top-card' : ''}" style="top:${offset}px;left:${offset}px;z-index:${remaining - i};filter:brightness(${br})"${isTop ? ' onclick="pullGacha()"' : ''}><img src="images/cities/back.webp" alt=""></div>`;
        }).join('');
        const wrapW = 118 + (remaining > 1 ? 6 : 0) + 12;
        const flipAllBtn = _gachaAnimState ? '' : `<button class="btn-flip-all" onclick="flipAllGachaCities()">一括開封</button>`;
        return `<div class="screen active" style="gap:6px;height:calc(100dvh - 24px);max-height:calc(100dvh - 24px);overflow:hidden">
          ${overlay}
          <div class="section-title" style="margin-bottom:0">${p.name}｜都市ガチャ <span style="font-size:.7rem;font-weight:400;color:var(--t2)">${pickLabel}</span></div>
          ${firstPickInfo}
          <div class="draft-stack-area">
            <div class="draft-stack-wrap" style="width:${wrapW}px;height:192px">${stackCards}</div>
            <div class="draft-tap-text">カードをタップしよう</div>
          </div>
          <div class="draft-actions">${flipAllBtn}</div>
        </div>`;
      }

      // Non-random (CPU EASY/NORMAL): candidate selection, already revealed, or awaiting opponent
      let ca = '';
      if (gc.candidates && gc.candidates.length) {
        const cols = gc.candidates.length === 2 ? 'repeat(2,1fr)' : 'repeat(3,1fr)';
        const cards = gc.candidates.map(c => `<div class="gacha-candidate-card" onclick="acceptGachaCandidate('${c.id}')"><img src="images/cities/${c.id}.webp" alt="" onerror="this.style.opacity='.3'"><div class="gacha-cand-info"><div style="font-weight:700;font-size:.85rem;line-height:1.2">${c.name}</div><div style="font-size:.7rem;color:var(--t2);margin-top:2px">${c.isCoastal ? '🌊 海岸' : c.isMountain ? '⛰️ 山間部' : '🏙️ 内陸'} · HP ${c.hp}</div><div style="font-size:.65rem;color:var(--t3);margin-top:3px;line-height:1.3">${c.abilityDesc}</div></div></div>`).join('');
        ca = `<div class="gacha-candidates" style="grid-template-columns:${cols}">${cards}</div><div style="text-align:center;color:var(--t3);font-size:.75rem;margin-top:10px">都市をタップして選択</div>`;
      } else if (!gc.revealed) {
        const btnLabel = cpuDifficulty === 'easy' ? '🎲 3枚から選ぶ' : '🎲 2枚から選ぶ';
        ca = `<div class="gacha-card-reveal-area" onclick="pullGacha()"><img src="images/cities/back.webp" alt=""></div><button class="btn-gacha" onclick="pullGacha()">${btnLabel}</button>`;
      } else {
        const c = gc.revealed; ca = `<div class="gacha-card-reveal-area revealed gacha-reveal"><img src="images/cities/${c.id}.webp" alt="" onerror="this.style.opacity='.3'"></div><button class="btn-accept" onclick="acceptGachaCity()">✅ この都市で進む</button>`;
      }
      return `<div class="screen active">${overlay}<div class="section-title" style="margin-bottom:0">${p.name}｜都市ガチャ <span style="font-size:.7rem;font-weight:400;color:var(--t2)">${pickLabel}</span></div>${firstPickInfo}<div class="gacha-stage">${ca}</div></div>`;
    }

    // ─── 予備都市 ───
    function renderBackupCity(pi) {
      const p = G.players[pi];
      if (p.activeCityIdx !== 0) return `<div style="font-size:.7rem;color:var(--t3);margin-bottom:4px">予備都市なし</div>`;
      if (p.cities.length < 2) return '';
      // 相手の2体目は1体目が壊滅するまで常に隠す。自分の2体目は常に見える
      if (pi !== myPlayerIdx && myRole !== 'spectator') return `<div class="backup-city-row"><span class="backup-label" style="color:var(--t3);font-style:italic">予備都市: 未登場</span></div>`;
      const bc = p.cities[1]; const bHp = p.cityHps[1]; const pct = Math.max(0, bHp / bc.hp * 100);
      return `<div class="backup-city-row"><span class="backup-label">予備: ${terrainImg(bc, 16)} ${bc.name}</span><div class="hp-bar-mini"><div class="hp-bar-mini-fill" style="width:${pct}%;background:${hpColor(bHp, bc.hp)}"></div></div><span class="backup-hp-text" style="color:${hpColor(bHp, bc.hp)}">${bHp}/${bc.hp}</span></div>`;
    }

    // ─── 効果バッジ ───
    function renderEffectBadges(eff, pi) {
      const b = [];
      if (eff.shieldQuakeFire) b.push(`<span class="eff-badge eff-blue">🏗️ 耐震シールド</span>`);
      if (eff.shieldFlood) b.push(`<span class="eff-badge eff-blue">🌊 堤防シールド</span>`);
      if (eff.negateSpecial) b.push(`<span class="eff-badge eff-blue">📢 特殊効果無効</span>`);
      if (eff.damageReduceHits > 0) b.push(`<span class="eff-badge eff-yellow">🏛️ 全ダメ−15（残${eff.damageReduceHits}回）</span>`);
      if (eff.floodBonusTurns > 0) { const _fc = pi != null ? getActiveCity(pi) : null; const _fa = _fc?.abilityValue ?? 1; b.push(`<span class="eff-badge eff-blue">💧 予算+${_fa}</span>`); }
      if (eff.terrorNextDisaster) b.push(`<span class="eff-badge eff-red">💣 テロ準備</span>`);
      if (eff.debtBudget > 0) b.push(`<span class="eff-badge eff-red">📉 予算−${eff.debtBudget}</span>`);
      return b.join('') || `<span class="eff-badge eff-gray">効果なし</span>`;
    }

    // ─── 手札描画（操作可能） ───
    function renderPlayerHand(p, pi) {
      const isFirstTurn = (pi === 0 && G.turnsEach[0] === 0); const left = getBudgetLeft(pi);
      function mkCard(card) {
        const cantAfford = left < card.cost; const ftBlk = isFirstTurn && (card.type === 'disaster' || card.type === 'jinzai'); const dis = cantAfford || ftBlk;
        let reason = ''; if (cantAfford) reason = '予算不足'; else if (ftBlk) reason = '先攻1ターン目は使用不可';
        const oc = dis ? '' : `requestConfirm('playCard','${card.uid}','${card.name.replace(/'/g, "\\'")}','${card.icon}','${card.type}','使用')`;
        const _isNew = card.uid === _lastDrawnCardUid;
        const _isPlaying = card.uid === _playingCardUid;
        return `<div class="card ${card.type} ${dis ? 'card-disabled' : 'card-usable'}${_isNew ? ' card-just-drawn' : ''}${_isPlaying ? ' card-play-out' : ''}" data-ctype="${cardCtype(card)}" onclick="${oc}" style="cursor:${dis ? 'not-allowed' : 'pointer'}"><div class="card-header"><span class="card-icon">${card.icon}</span><span class="card-cost">${card.cost}</span></div><div class="card-img-wrap"><img class="card-img" src="images/cards/${card.id}.webp" alt="" onerror="this.closest('.card').classList.add('img-fail')"><div class="card-name-bar">${card.name}</div></div><div class="card-name card-text-fallback">${card.name}</div><div class="card-desc card-text-fallback">${card.desc}</div><span class="card-type-badge">${card.type === 'policy' ? '政策' : card.type === 'jinzai' ? '人為' : '自然'}</span>${reason ? `<div class="card-disabled-reason">${reason}</div>` : ''}</div>`;
      }
      const pols = p.hand.filter(c => c.type === 'policy').sort((a, b) => a.cost - b.cost);
      const dis = p.hand.filter(c => c.type === 'disaster').sort((a, b) => a.cost - b.cost);
      const jin = p.hand.filter(c => c.type === 'jinzai').sort((a, b) => a.cost - b.cost);
      const s = [];
      if (pols.length > 0) s.push(`<div class="hand-group"><div class="hand-group-label policy-label">政策</div><div class="hand-group-cards">${pols.map(mkCard).join('')}</div></div>`);
      if (dis.length > 0) s.push(`<div class="hand-group"><div class="hand-group-label disaster-label">自然災害</div><div class="hand-group-cards">${dis.map(mkCard).join('')}</div></div>`);
      if (jin.length > 0) s.push(`<div class="hand-group"><div class="hand-group-label jinzai-label">人為災害</div><div class="hand-group-cards">${jin.map(mkCard).join('')}</div></div>`);
      return `<div class="hand-groups">${s.join('')}</div>`;
    }

    // ─── 手札描画（読み取り専用：自分のターン外） ───
    function renderPlayerHandReadOnly(p) {
      function mkCard(card) { return `<div class="card ${card.type} card-disabled" data-ctype="${cardCtype(card)}" style="cursor:default"><div class="card-header"><span class="card-icon">${card.icon}</span><span class="card-cost">${card.cost}</span></div><div class="card-img-wrap"><img class="card-img" src="images/cards/${card.id}.webp" alt="" onerror="this.closest('.card').classList.add('img-fail')"><div class="card-name-bar">${card.name}</div></div><div class="card-name card-text-fallback">${card.name}</div><div class="card-desc card-text-fallback">${card.desc}</div><span class="card-type-badge">${card.type === 'policy' ? '政策' : card.type === 'jinzai' ? '人為' : '自然'}</span></div>`; }

    // ─── 手札描画（観戦者神視点：黒レイヤーなし・フリップ対応） ───
    function renderPlayerHandSpectator(p) {
      function mkCard(card) {
