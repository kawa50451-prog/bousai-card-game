<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CO-OP メニュー比較</title>
<link rel="icon" href="../assets/icons/app_icon.webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/v6/nav-art.css">
<style>
:root{--ease:cubic-bezier(.215,.61,.355,1)}
body{margin:0;background:#091324;color:#fff;font-family:'Zen Kaku Gothic New',sans-serif}
main{width:min(640px,100%);padding:36px 20px;box-sizing:border-box;margin:auto}
h1{font:400 44px/1 'Anton','Impact','Arial Narrow',sans-serif;margin:0 0 32px}
h2{font-size:20px;font-weight:500;margin:0 0 20px}
.samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:44px}
figure{margin:0;min-width:0}
figcaption{font-size:16px;font-weight:700;margin-bottom:12px}
.coop-art{display:block;position:relative;isolation:isolate;overflow:hidden;aspect-ratio:4/3;background:#002A6C;container-type:inline-size}
.desktop .coop-art{width:126.8px}.mobile .coop-art{width:83.2px}
.coop-art img{display:block;position:absolute;height:auto;filter:drop-shadow(0 2px 2px #0007)}
.coop-art .disaster{width:29%;z-index:2}
.coop-art .city{width:23%;z-index:2}
.coop-art .vs{position:absolute;z-index:3;color:white;font:400 12cqw/1 'Anton','Impact','Arial Narrow',sans-serif}
.coop-art svg{position:absolute;inset:0;width:100%;height:100%}
/* One opposing card meets three cities standing on one continuous rampart. */
.rampart{background:linear-gradient(112deg,#E60B00 0 36%,#002A6C 36.5%)}
.rampart .disaster{left:3%;top:18%;transform:rotate(-8deg)}
.rampart .vs{left:34%;top:33%}
.rampart .city{width:17%;top:25%}
.rampart .c1{left:49%}.rampart .c2{left:65%;top:20%}.rampart .c3{left:81%}
/* Three cities share a single solid shield facing the natural side. */
.shield{background:#E60B00}
.shield .disaster{left:3%;top:15%;transform:rotate(-10deg)}
.shield .vs{left:30%;top:34%}
.shield .city{width:19%;top:28%}
.shield .c1{left:45%;transform:rotate(-6deg)}.shield .c2{left:63%;top:24%}.shield .c3{left:80%;transform:rotate(6deg)}
/* The disaster above meets a joined, upward-facing fan of city cards. */
.fan{background:linear-gradient(#E60B00 0 43%,#002A6C 43%)}
.fan .disaster{width:20%;left:40%;top:1%;transform:rotate(-5deg)}
.fan .city{width:23%;top:54%;transform-origin:50% 100%}
.fan .c1{left:16%;transform:rotate(-18deg)}.fan .c2{left:38.5%;top:51%}.fan .c3{left:61%;transform:rotate(18deg)}
@media(max-width:600px){main{padding:28px 2px}h1{font-size:36px}.samples{gap:2px}figcaption{font-size:13px;min-height:40px}.mobile .coop-art{width:83.2px;max-width:100%}}
</style>
</head>
<body>
<main>
<h1>CO-OP</h1>
<section class="desktop" aria-label="PCのメニュー寸法">
<h2>PC</h2>
<div class="samples"></div>
</section>
<section class="mobile" aria-label="スマホのメニュー寸法">
<h2>スマホ</h2>
<div class="samples"></div>
</section>
<template id="samples">
<figure><figcaption>共同戦線</figcaption><div class="coop-art rampart" role="img" aria-label="自然側の津波1枚に、都市側の3枚が防壁をつないで対抗する">
<svg viewBox="0 0 480 360" aria-hidden="true"><path d="M228 286H480V328H228Z M242 265H267V305H242Z M319 265H344V305H319Z M396 265H421V305H396Z" fill="white"/></svg>
<img class="disaster" src="../assets/cards/tsunami.webp" alt=""><span class="vs">VS</span>
<img class="city c1" src="../assets/cities/tokyo.webp" alt=""><img class="city c2" src="../assets/cities/osaka.webp" alt=""><img class="city c3" src="../assets/cities/niigata.webp" alt="">
</div></figure>
<figure><figcaption>ひとつの盾</figcaption><div class="coop-art shield" role="img" aria-label="自然側の津波1枚に、都市側の3枚がひとつの盾の中で協力して守る">
<svg viewBox="0 0 480 360" aria-hidden="true"><path d="M181 24H456V206Q456 300 319 345Q181 300 181 206Z" fill="white"/><path d="M197 40H440V204Q440 283 319 327Q197 283 197 204Z" fill="#002A6C"/></svg>
<img class="disaster" src="../assets/cards/tsunami.webp" alt=""><span class="vs">VS</span>
<img class="city c1" src="../assets/cities/tokyo.webp" alt=""><img class="city c2" src="../assets/cities/osaka.webp" alt=""><img class="city c3" src="../assets/cities/niigata.webp" alt="">
</div></figure>
<figure><figcaption>みんなで受け止める</figcaption><div class="coop-art fan" role="img" aria-label="上から迫る自然側の津波1枚を、都市側の3枚が肩を並べて受け止める">
<svg viewBox="0 0 480 360" aria-hidden="true"><path d="M34 173Q240 241 446 173L434 193Q240 260 46 193Z" fill="white"/></svg>
<img class="disaster" src="../assets/cards/tsunami.webp" alt="">
<img class="city c1" src="../assets/cities/tokyo.webp" alt=""><img class="city c2" src="../assets/cities/osaka.webp" alt=""><img class="city c3" src="../assets/cities/niigata.webp" alt="">
</div></figure>
</template>
</main>
<script>
document.querySelectorAll('.samples').forEach(function(row){row.append(document.getElementById('samples').content.cloneNode(true));});
</script>
</body>
</html>
