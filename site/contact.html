<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>お問い合わせ（CONTACT）｜ Ready or Not</title>
<meta name="theme-color" content="#00244f">
<!-- 起動演出の事前クラス付与。modes/co-op.html と同じ同期スクリプトを複製している
     （最初の描画より前に同期実行する必要があるため、外部化するとFOUCの原因になる）。 -->
<script>/* ?motion=on は JS だけでなく CSS の縮退も解除する。
   これがないと OS でアニメーションを切っている環境では、罫の描画・文字の
   立ち上がり・ゲージなど CSS 駆動の演出が検証パラメータを付けても動かない。 */
if(/[?&]motion=on(&|$)/.test(location.search))document.documentElement.setAttribute('data-motion','on');</script>
<script>
(function(){
  var h = document.documentElement;
  try{
    if (sessionStorage.getItem('ronIntroSeen') === '1') { h.classList.add('intro-skip'); }
    else { h.classList.add('intro-lock'); sessionStorage.setItem('ronIntroSeen', '1'); }
  } catch(e){ h.classList.add('intro-lock'); }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Archivo:wght@400;600;800&family=Shippori+Mincho+B1:wght@800&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
/* 地の色は全ページ共通の固定値（§18.1。design/official_site_spec.md §18）。
   旧・地の軌跡（節ごとに異なる停止点）は廃止し、全ページ oklch(.265 .090 255) に
   揃えた。site.css の :root 既定値と同じだが、このページ単体で開いた場合の
   フォールバックとして明示している。 */
:root{ --gL:.265; --gC:.090; --gH:255; }

/* このページだけで使う枠コンポーネント。手段が未定のため、中身は空のまま
   枠だけを用意する（コメントは実装委譲メモの指示どおり残す）。 */
.contactFrame{margin-top:var(--s4);padding:var(--s5) var(--s4);
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);border-radius:4px;
  text-align:center}
.contactFrameNote{font-size:var(--fs-s);letter-spacing:var(--tr-label);color:var(--t3)}

/* 本文中のテキストリンク。a{color:inherit} が既定のため、本文内リンクだけ
   視覚的な手がかり（金色・下線）を明示的に与える。 */
.textLink{color:var(--gold);text-decoration:underline;text-underline-offset:.2em}
.textLink:hover,.textLink:focus-visible{color:var(--t1);outline:2px solid var(--gold);outline-offset:3px}
/* 押下の段階（§20.5）。ホバーの白から一段はっきりしたgoldへ、下線も太くする。 */
.textLink:active{color:var(--gold);text-decoration-thickness:2px}
</style>
</head>
<body>

<!-- 起動演出オーバーレイ（LP・CO-OPと同一マークアップ・§20.1で4幕へ作り直し）。 -->
<div class="loadOverlay" id="loadOverlay" aria-hidden="true">
  <div class="loadCredit">
    <span class="loadCreditLine enBase">produced</span>
    <span class="loadCreditLine enBase">by Ready or Lab</span>
    <span class="loadCreditRule" aria-hidden="true"></span>
  </div>
  <span class="loadCount" aria-hidden="true"></span>
  <div class="loadInk" aria-hidden="true">
      <!-- 幕2は実写のインク動画1本。白地に黒インクの素材を multiply で
           重ね、白を透過させて黒だけを残す（§20.1改）。
           ⚠️ 緩急は素材そのものに ffmpeg で焼き込んである。JSで毎フレーム
              currentTime を動かすと1フレームごとにシークが走り、iPhoneで
              確実に引っかかる。再生は等速1回きりにすること。 -->
      <video class="loadInkVid" src="assets/ink/ink_load_timed.mp4"
             muted playsinline preload="auto" aria-hidden="true"></video>
    </div>
  <div class="loadBlackout" aria-hidden="true"></div>
</div>

<!-- 背景の粒子と幾何学的な線（今回追加）。本文より後ろに敷く静的な奥行き演出。
     18個の粒子（遠景6・中景6・近景6の3層）＋静止した線4本。§厳守事項どおり
     transform/opacityだけで動かし、JSのrAFループは増やしていない。 -->

  <span class="bgLine" style="top:84%;left:36%;width:70vw;transform:rotate(-3deg);opacity:.08"></span>
  <span class="bgDot bgDot--a" style="--x:4%;--y:6%;animation-delay:-5s"></span>
  <span class="bgDot bgDot--a" style="--x:17%;--y:22%;animation-delay:-16s"></span>
  <span class="bgDot bgDot--a" style="--x:30%;--y:38%;animation-delay:-27s"></span>
  <span class="bgDot bgDot--a" style="--x:43%;--y:54%;animation-delay:-38s"></span>
  <span class="bgDot bgDot--a" style="--x:56%;--y:70%;animation-delay:-49s"></span>
  <span class="bgDot bgDot--a" style="--x:69%;--y:86%;animation-delay:-60s"></span>
  <span class="bgDot bgDot--b" style="--x:82%;--y:12%;animation-delay:-4s"></span>
  <span class="bgDot bgDot--b" style="--x:95%;--y:28%;animation-delay:-11s"></span>
  <span class="bgDot bgDot--b" style="--x:16%;--y:44%;animation-delay:-18s"></span>
  <span class="bgDot bgDot--b" style="--x:29%;--y:60%;animation-delay:-25s"></span>
  <span class="bgDot bgDot--b" style="--x:42%;--y:76%;animation-delay:-32s"></span>
  <span class="bgDot bgDot--b" style="--x:55%;--y:92%;animation-delay:-39s"></span>
  <span class="bgDot bgDot--c" style="--x:68%;--y:18%;animation-delay:-3s"></span>
  <span class="bgDot bgDot--c" style="--x:81%;--y:34%;animation-delay:-8s"></span>
  <span class="bgDot bgDot--c" style="--x:94%;--y:50%;animation-delay:-13s"></span>
  <span class="bgDot bgDot--c" style="--x:15%;--y:66%;animation-delay:-18s"></span>
  <span class="bgDot bgDot--c" style="--x:28%;--y:82%;animation-delay:-23s"></span>
  <span class="bgDot bgDot--c" style="--x:41%;--y:98%;animation-delay:-28s"></span>
</div>
